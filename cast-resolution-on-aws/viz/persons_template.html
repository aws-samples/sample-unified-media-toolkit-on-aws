<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Media2Cloud · person binding</title>
<style>
/* House metadata-viz design system (see .claude/skills/metadata-viz-page).
   The three categorical slots carry the MODALITY — speech (spans, blue),
   on-screen face (spans, orange), name evidence (dots, green). Person
   identity comes from lane position + label, never color. */
.viz-root {
  color-scheme: dark;
  --surface-1: #1a1a19; --page: #0d0d0d;
  --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #898781;
  --grid: #2c2c2a; --baseline: #383835; --border: rgba(255,255,255,0.10);
  --series-1: #3987e5;   /* speech turns        */
  --series-2: #d95926;   /* face on screen      */
  --series-3: #199e70;   /* name evidence       */
  --good: #0ca30c; --warning: #fab219;
}
:root[data-theme="light"] .viz-root {
  color-scheme: light;
  --surface-1: #fcfcfb; --page: #f9f9f7;
  --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #898781;
  --grid: #e1e0d9; --baseline: #c3c2b7; --border: rgba(11,11,11,0.10);
  --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a;
  --good: #006300; --warning: #fab219;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  background: var(--page); color: var(--text-primary); font-size: 13px; }
.viz-root { display: flex; flex-direction: column; height: 100vh;
  background: var(--page); }
header.bar { display: flex; align-items: center; gap: 10px;
  padding: 10px 16px; border-bottom: 1px solid var(--border);
  background: var(--surface-1); }
header.bar h1 { font-size: 14px; margin: 0; font-weight: 650; }
header.bar .sub { color: var(--text-muted); font-size: 11px; margin-top: 2px; }
.spacer { flex: 1; }
.pill { border: 1px solid var(--border); border-radius: 999px;
  padding: 3px 10px; font-size: 11px; color: var(--text-secondary);
  white-space: nowrap; font-variant-numeric: tabular-nums; }
button { background: var(--surface-1); color: var(--text-secondary);
  border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px;
  font-size: 11px; cursor: pointer; }
button[aria-pressed="true"] { color: var(--text-primary);
  border-color: var(--text-muted); }

.top { display: grid; grid-template-columns: minmax(340px, 38%) 1fr;
  gap: 1px; background: var(--border); min-height: 0; flex: 1; }
.detail-pane, .list-pane { background: var(--page); min-width: 0;
  display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.video-wrap { background: #000; flex: 0 1 auto; min-height: 0;
  display: flex; align-items: center; justify-content: center; }
video { max-width: 100%; max-height: min(38vh, 100%); display: block; }
.controls { display: flex; align-items: center; gap: 10px;
  padding: 6px 14px 0; }
.detail-head { padding: 10px 14px 6px; }
.detail-head .pname { font-size: 17px; font-weight: 700; }
.detail-head .ptype { font-size: 10px; font-weight: 700;
  letter-spacing: .06em; text-transform: uppercase;
  color: var(--text-secondary); }
.detail-ids { padding: 0 14px 6px; color: var(--text-muted); font-size: 11px;
  font-family: ui-monospace, Menlo, monospace; }
.evi { overflow: auto; flex: 1; min-height: 0; padding: 4px 0 10px; }
.evi .row { display: grid; grid-template-columns: 14px 110px 1fr;
  gap: 8px; padding: 6px 14px; border-bottom: 1px solid var(--grid);
  align-items: baseline; font-size: 12px; }
.evi .mech { color: var(--text-secondary); font-size: 10px; font-weight: 700;
  letter-spacing: .05em; text-transform: uppercase; }
.evi .what { color: var(--text-primary); overflow-wrap: break-word; }
.evi .what .tt { color: var(--text-muted);
  font-family: ui-monospace, Menlo, monospace; font-size: 11px; }
.dot { width: 8px; height: 8px; border-radius: 2px; }
.dot.name { border-radius: 50%; }

.find-head { display: flex; gap: 8px; align-items: center;
  padding: 8px 12px; border-bottom: 1px solid var(--border); }
.find-head strong { font-size: 12px; }
.find-head select, .find-head input { background: var(--surface-1);
  color: var(--text-secondary); border: 1px solid var(--border);
  border-radius: 6px; font-size: 11px; padding: 3px 6px; }
.find-head input { width: 120px; }
.find-list { overflow: auto; flex: 1; min-height: 0; }
.person { display: grid; grid-template-columns: 1fr auto; gap: 8px;
  padding: 7px 12px; border-bottom: 1px solid var(--grid); cursor: pointer;
  align-items: baseline; }
.person:hover { background: var(--surface-1); }
.person.active { background: var(--surface-1);
  box-shadow: inset 2px 0 0 var(--text-muted); }
.person .nm { font-size: 12px; }
.person .nm b { color: var(--text-primary); }
.person .nm .unnamed { color: var(--text-muted); }
.person .meta { color: var(--text-muted); font-size: 10px;
  font-family: ui-monospace, Menlo, monospace; text-align: right; }
.person .sub2 { grid-column: 1 / -1; color: var(--text-muted);
  font-size: 10px; }

.tl-pane { border-top: 1px solid var(--border); background: var(--surface-1);
  flex-shrink: 0; }
.tl-head { display: flex; align-items: center; gap: 14px;
  padding: 8px 16px 4px; }
.legend { display: flex; gap: 14px; font-size: 11px;
  color: var(--text-secondary); }
.legend .chip { display: inline-block; width: 10px; height: 10px;
  border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.legend .chip.round { border-radius: 50%; }
.tc { font-family: ui-monospace, Menlo, monospace; font-size: 11px;
  color: var(--text-muted); font-variant-numeric: tabular-nums; }
.tl-wrap { position: relative; margin: 2px 16px 10px 0; max-height: 38vh;
  overflow-y: auto; }
canvas { display: block; width: 100%; }
#tip { position: fixed; z-index: 50; pointer-events: none; display: none;
  background: var(--page); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: 6px; padding: 6px 9px;
  font-size: 11px; max-width: 320px;
  box-shadow: 0 4px 16px rgba(0,0,0,.4); }
#tip .tt { color: var(--text-muted);
  font-family: ui-monospace, Menlo, monospace; }
.note { color: var(--text-muted); font-size: 11px; padding: 6px 16px 10px; }
#tableview { display: none; padding: 12px 16px; overflow: auto;
  background: var(--surface-1); border-top: 1px solid var(--border);
  max-height: 44vh; }
#tableview.on { display: block; }
table { border-collapse: collapse; font-size: 12px; width: 100%; }
th, td { text-align: left; padding: 4px 10px;
  border-bottom: 1px solid var(--grid);
  font-variant-numeric: tabular-nums; vertical-align: top; }
th { color: var(--text-muted); font-weight: 600; font-size: 10px;
  text-transform: uppercase; letter-spacing: .06em; position: sticky;
  top: 0; background: var(--surface-1); }
</style>
</head>
<body class="viz-root" data-palette="#3987e5,#d95926,#199e70">
<div class="viz-root">

<header class="bar">
  <div>
    <h1 id="hdr-title">Person binding</h1>
    <div class="sub" id="hdr-sub"></div>
  </div>
  <div class="spacer"></div>
  <span class="pill" id="pill-persons"></span>
  <span class="pill" id="pill-named"></span>
  <span class="pill" id="pill-merged"></span>
  <span class="pill" id="pill-sources"></span>
  <button id="btn-table" aria-pressed="false">Table view</button>
  <button id="btn-theme">Light</button>
</header>

<div class="top">
  <div class="detail-pane">
    <div class="video-wrap" id="video-wrap">
      <video id="v" controls preload="metadata" playsinline></video>
    </div>
    <div class="controls" id="controls">
      <span class="tc" id="tc">00:00 / 00:00</span>
      <button id="btn-cc" aria-pressed="true">Names: On</button>
    </div>
    <div class="detail-head">
      <div class="ptype" id="d-type"></div>
      <div class="pname" id="d-name"></div>
    </div>
    <div class="detail-ids" id="d-ids"></div>
    <div class="evi" id="d-evi"></div>
  </div>

  <div class="list-pane">
    <div class="find-head">
      <strong>Persons</strong>
      <select id="type-filter"><option value="">All types</option></select>
      <select id="named-filter">
        <option value="">Named + unnamed</option>
        <option value="named">Named only</option>
        <option value="unnamed">Unnamed only</option>
      </select>
      <input id="q" placeholder="search name / id">
      <div class="spacer"></div>
      <span class="tc" id="list-count"></span>
    </div>
    <div class="find-list" id="find-list"></div>
  </div>
</div>

<div class="tl-pane">
  <div class="tl-head">
    <div class="legend">
      <span><span class="chip" style="background:var(--series-1)"></span>speech turns</span>
      <span><span class="chip" style="background:var(--series-2)"></span>face on screen</span>
      <span><span class="chip round" style="background:var(--series-3)"></span>name evidence</span>
    </div>
    <div class="spacer"></div>
    <span class="tc" id="tl-info"></span>
  </div>
  <div class="tl-wrap"><canvas id="tl"></canvas>
    <canvas id="ov" style="position:absolute;left:0;top:0"></canvas></div>
  <div class="note" id="note"></div>
</div>

<div id="tableview"></div>
<div id="tip"></div>
</div>

<script>
const DATA = /*__DATA__*/;

const $ = s => document.querySelector(s);
const css = n => getComputedStyle($('.viz-root')).getPropertyValue(n).trim();
const DUR = DATA.meta.duration_sec || 1;
const hms = t => `${String(Math.floor(t/60)).padStart(2,'0')}:` +
                 `${String(Math.floor(t%60)).padStart(2,'0')}`;
const esc = v => String(v ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P = DATA.persons;
let selected = null;

/* header */
$('#hdr-title').textContent = 'Person binding · ' + DATA.meta.title;
$('#hdr-sub').textContent = DATA.meta.subtitle;
$('#pill-persons').textContent = P.length + ' persons';
$('#pill-named').textContent = P.filter(p => p.name).length + ' named';
$('#pill-merged').textContent =
  P.filter(p => p.type === 'on_camera_speaker').length + ' cross-modal';
if ((DATA.vetoes || []).length) {
  const s = document.createElement('span');
  s.className = 'pill';
  s.style.borderColor = 'var(--warning)';
  s.textContent = DATA.vetoes.length + ' critic vetoes';
  $('#pill-merged').after(s);
}
$('#pill-sources').textContent = 'sources: ' + DATA.meta.sources.join(' · ');
$('#note').textContent = DATA.meta.note;

/* video (optional — pages built without --video hide the pane) */
const v = $('#v');
const seek = t => { if (DATA.media && DATA.media.video)
  { v.currentTime = Math.max(0, t); v.play(); } };
if (DATA.media && DATA.media.video) {
  v.src = DATA.media.video;
  v.addEventListener('loadedmetadata', () =>
    $('#tc').textContent = `${hms(0)} / ${hms(v.duration)}`);
  v.addEventListener('timeupdate', () => {
    $('#tc').textContent = `${hms(v.currentTime)} / ${hms(v.duration || DUR)}`;
    drawPlayhead();
  });
  if (DATA.vtt) {
    /* subtitles carry the RESOLVED person names — binding quality is
       readable directly off the picture */
    const tr = document.createElement('track');
    tr.kind = 'subtitles'; tr.label = 'Resolved speakers';
    tr.srclang = 'en'; tr.default = true;
    tr.src = URL.createObjectURL(new Blob([DATA.vtt], { type: 'text/vtt' }));
    v.appendChild(tr);
    tr.addEventListener('load', () => v.textTracks[0].mode = 'showing');
    $('#btn-cc').onclick = e => {
      const on = v.textTracks[0].mode !== 'showing';
      v.textTracks[0].mode = on ? 'showing' : 'hidden';
      e.target.setAttribute('aria-pressed', on);
      e.target.textContent = on ? 'Names: On' : 'Names: Off';
    };
  } else { $('#btn-cc').style.display = 'none'; }
} else {
  $('#video-wrap').style.display = 'none';
  $('#controls').style.display = 'none';
}

/* person list */
const typeSel = $('#type-filter');
[...new Set(P.map(p => p.type))].sort().forEach(t => {
  const o = document.createElement('option'); o.value = o.textContent = t;
  typeSel.appendChild(o);
});
function personLabel(p) {
  return p.name || (p.speaker_ids[0] || `face ${p.face_ids[0]}`);
}
function renderList() {
  const ty = typeSel.value, nf = $('#named-filter').value,
        q = $('#q').value.toLowerCase();
  const list = $('#find-list'); list.innerHTML = '';  // nosemgrep: html.security.audit.insecure-document-method
  let shown = 0;
  P.forEach(p => {
    if (ty && p.type !== ty) return;
    if (nf === 'named' && !p.name) return;
    if (nf === 'unnamed' && p.name) return;
    const hay = (personLabel(p) + ' ' + p.speaker_ids.join(' ') + ' ' +
                 p.face_ids.join(' ')).toLowerCase();
    if (q && !hay.includes(q)) return;
    shown++;
    const d = document.createElement('div');
    d.className = 'person' + (selected === p ? ' active' : '');
    d.dataset.pid = p.person_id;
    d.innerHTML =  // nosemgrep: html.security.audit.insecure-document-method
      `<span class="nm">${p.name ? `<b>${esc(p.name)}</b>`
        : `<span class="unnamed">${esc(personLabel(p))}</span>`}` +
      `${p.character_name ? ` <span class="unnamed">as ${esc(p.character_name)}</span>` : ''}` +
      `${p.role ? ` · ${esc(p.role)}` : ''}</span>` +
      `<span class="meta">${p.speech_sec ? hms(p.speech_sec) + ' spk' : ''}` +
      `${p.screen_sec ? ' · ' + hms(p.screen_sec) + ' scr' : ''}</span>` +
      `<span class="sub2">${esc(p.type)} · ${esc(p.speaker_ids.join(',')) || '—'} · ` +
      `faces ${esc(p.face_ids.join(',')) || '—'}` +
      `${p.name_mechanisms.length ? ' · via ' + esc(p.name_mechanisms.join(',')) : ''}` +
      `</span>`;
    d.onclick = () => select(p);
    list.appendChild(d);
  });
  $('#list-count').textContent = `${shown} / ${P.length}`;
}
['change','change','input'].forEach((ev, i) =>
  [typeSel, $('#named-filter'), $('#q')][i].addEventListener(ev, renderList));

/* detail pane */
function select(p) {
  selected = p;
  $('#d-type').textContent = p.type;
  $('#d-name').textContent = p.name ||
    (p.aliases.length ? `conflict: ${p.aliases.join(' / ')}` : personLabel(p));
  $('#d-ids').textContent =
    `speakers: ${p.speaker_ids.join(', ') || '—'}   ·   ` +
    `faces: ${p.face_ids.join(', ') || '—'}   ·   ` +
    `speech ${hms(p.speech_sec)} · on-screen ${hms(p.screen_sec)}`;
  const evi = $('#d-evi'); evi.innerHTML = '';  // nosemgrep: html.security.audit.insecure-document-method
  (p.evidence_rows || []).forEach(r => {
    const d = document.createElement('div');
    d.className = 'row';
    const cls = r.layer === 'name' ? 'name' : '';
    const col = r.layer === 'speech' ? '--series-1'
              : r.layer === 'face' ? '--series-2' : '--series-3';
    d.innerHTML = `<span class="dot ${cls}" style="background:${css(col)}"></span>` +  // nosemgrep: html.security.audit.insecure-document-method
      `<span class="mech">${esc(r.mechanism)}</span>` +
      `<span class="what">${esc(r.text)}` +
      `${r.t != null ? ` <span class="tt">${hms(r.t)}</span>` : ''}</span>`;
    if (r.t != null) { d.style.cursor = 'pointer';
      d.onclick = () => seek(r.t - 0.5); }
    evi.appendChild(d);
  });
  renderList(); drawTL();
}

/* timeline: one lane per person (lanes list), speech + face spans, name dots */
const ROW = 22, PAD_L = 148, PAD_T = 18, PAD_B = 6;
const tl = $('#tl');
let hitboxes = [];
function drawTL() {
  const lanes = DATA.lanes.map(id => P.find(p => p.person_id === id));
  const wrap = tl.parentElement, W = wrap.clientWidth,
        H = PAD_T + lanes.length * ROW + PAD_B, dpr = devicePixelRatio || 1;
  for (const c of [tl, $('#ov')]) {
    c.width = W * dpr; c.height = H * dpr; c.style.height = H + 'px';
    c.style.width = W + 'px';
  }
  const g = tl.getContext('2d'); g.scale(dpr, dpr);
  g.clearRect(0, 0, W, H);
  const x = t => PAD_L + t / DUR * (W - PAD_L - 8);
  g.font = '10px ui-monospace, Menlo, monospace';
  g.fillStyle = css('--text-muted'); g.strokeStyle = css('--grid');
  const step = DUR > 1200 ? 300 : DUR > 300 ? 60 : 30;
  for (let t = 0; t <= DUR; t += step) {
    g.beginPath(); g.moveTo(x(t), PAD_T - 4); g.lineTo(x(t), H - PAD_B);
    g.stroke(); g.fillText(hms(t), x(t) + 3, PAD_T - 7);
  }
  hitboxes = [];
  lanes.forEach((p, li) => {
    const y = PAD_T + li * ROW;
    g.font = (selected === p ? '700 ' : '600 ') + '10px system-ui';
    g.fillStyle = selected === p ? css('--text-primary')
                                 : css('--text-secondary');
    g.fillText(personLabel(p).slice(0, 20), 8, y + ROW / 2 + 3);
    g.strokeStyle = css('--grid');
    g.beginPath(); g.moveTo(PAD_L, y + ROW); g.lineTo(W - 8, y + ROW);
    g.stroke();
    const bar = (t0, t1, col, yy, h) => {
      const x0 = x(t0), x1 = Math.max(x(t1), x0 + 2);
      g.fillStyle = col;
      g.beginPath(); g.roundRect(x0, yy, x1 - x0, h, 2); g.fill();
      hitboxes.push({ x0, x1, y0: yy, y1: yy + h, p, t0, t1 });
    };
    (p.spans.speech || []).forEach(([a, b]) =>
      bar(a, b, css('--series-1'), y + 3, 7));
    (p.spans.face || []).forEach(([a, b]) =>
      bar(a, b, css('--series-2'), y + 12, 7));
    (p.spans.names || []).forEach(ev => {
      const cx = x(ev.t), cy = y + ROW / 2;
      g.fillStyle = css('--series-3');
      g.beginPath(); g.arc(cx, cy, 4, 0, 7); g.fill();
      g.strokeStyle = css('--surface-1'); g.lineWidth = 2; g.stroke();
      hitboxes.push({ x0: cx - 6, x1: cx + 6, y0: cy - 6, y1: cy + 6,
                      p, t0: ev.t, t1: ev.t, name: ev.name });
    });
  });
  $('#tl-info').textContent =
    `${lanes.length} of ${P.length} persons laned · ${hms(DUR)}`;
  drawPlayhead();
}

function drawPlayhead() {
  const ov = $('#ov'), W = ov.clientWidth, H = ov.clientHeight,
        dpr = devicePixelRatio || 1;
  const g = ov.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);
  if (!(DATA.media && DATA.media.video)) return;
  const px = PAD_L + (v.currentTime / DUR) * (W - PAD_L - 8);
  g.strokeStyle = css('--text-primary'); g.lineWidth = 1;
  g.beginPath(); g.moveTo(px, 4); g.lineTo(px, H - 2); g.stroke();
}

/* tooltip + click on the overlay canvas (it sits on top) */
const tip = $('#tip');
const ovc = $('#ov');
function hitAt(e) {
  const r = ovc.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  return [hitboxes.find(h => mx >= h.x0 && mx <= h.x1 &&
                             my >= h.y0 && my <= h.y1), mx, r];
}
ovc.addEventListener('mousemove', e => {
  const [hb] = hitAt(e);
  if (!hb) { tip.style.display = 'none'; ovc.style.cursor = 'default'; return; }
  tip.innerHTML = `<b>${esc(personLabel(hb.p))}</b> · ` +  // nosemgrep: html.security.audit.insecure-document-method
    `<span class="tt">${hms(hb.t0)}${hb.t1 > hb.t0 ? '–' + hms(hb.t1) : ''}` +
    `</span>${hb.name ? '<br>name evidence: ' + esc(hb.name) : ''}`;
  tip.style.display = 'block';
  tip.style.left = Math.min(e.clientX + 12, innerWidth - 330) + 'px';
  tip.style.top = (e.clientY + 12) + 'px';
  ovc.style.cursor = 'pointer';
});
ovc.addEventListener('mouseleave', () => tip.style.display = 'none');
ovc.addEventListener('click', e => {
  const [hb, mx, r] = hitAt(e);
  if (hb) { select(hb.p); seek(hb.t0 - 0.5); }
  else if (mx > PAD_L) seek((mx - PAD_L) / (r.width - PAD_L - 8) * DUR);
});

/* table view — the accessibility relief: EVERY person, not just lanes */
const tv = $('#tableview');
tv.innerHTML = '<table><thead><tr><th>id</th><th>name</th>' +  // nosemgrep: html.security.audit.insecure-document-method
  '<th>character</th><th>role</th><th>type</th>' +
  '<th>speakers</th><th>faces</th><th>speech</th><th>on-screen</th>' +
  '<th>named via</th><th>aliases</th></tr></thead><tbody>' +
  P.map(p =>
    `<tr><td>${esc(p.person_id)}</td><td>${esc(p.name || '')}</td>` +
    `<td>${esc(p.character_name || '')}</td><td>${esc(p.role || '')}</td>` +
    `<td>${esc(p.type)}</td>` +
    `<td>${esc(p.speaker_ids.join(' '))}</td><td>${esc(p.face_ids.join(' '))}</td>` +
    `<td>${hms(p.speech_sec)}</td><td>${hms(p.screen_sec)}</td>` +
    `<td>${esc(p.name_mechanisms.join(', '))}</td>` +
    `<td>${esc((p.aliases || []).join(' / '))}</td></tr>`).join('') +
  '</tbody></table>';
$('#btn-table').onclick = e => {
  tv.classList.toggle('on');
  e.target.setAttribute('aria-pressed', tv.classList.contains('on'));
};

/* theme */
$('#btn-theme').onclick = e => {
  const root = document.documentElement;
  const light = root.getAttribute('data-theme') !== 'light';
  root.setAttribute('data-theme', light ? 'light' : 'dark');
  e.target.textContent = light ? 'Dark' : 'Light';
  drawTL();
};

addEventListener('resize', drawTL);
renderList();
select(P.find(p => p.name) || P[0]);
</script>
</body>
</html>
