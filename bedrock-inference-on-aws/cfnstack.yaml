AWSTemplateFormatVersion: "2010-09-09"

# ==============================================================================
# bedrock-inference-on-aws — N records in, N responses out. Version %%VERSION%%
#
# The micro-workflow that makes Bedrock calls on a caller's behalf: sync (under a
# concurrency lease taken HERE) or batch (queued here). **Self-contained** — it owns
# its own semaphore and depends on no sibling stack. README.md §M records the merge
# that made it so; §1.2's split with service-quotas-on-aws is history (README.md §1.2).
#
# ONE CONTAINER IMAGE ON ECR, built by CodeBuild (ARM_CONTAINER, native arm64),
# and SEVEN MEMORY TIERS off that one image. Adopted 2026-08-12 for CONSISTENCY
# with the rest of the repo, not because this workflow needs it: it decodes no
# media and loads no model, so a flat zip on the managed python3.13 runtime was
# and remains technically sufficient. The siblings that do need a container need
# it for open-source model weights; matching them means one deployment story to
# learn, one build script shape, and one place to look when a build breaks.
# THREE FUNCTIONS STAY FLAT ZIPS, and none of them is a workflow state: the
# AgentCore gateway tool, the build-starter (it builds the image, so it cannot be
# in it), and the Custom::ModelRegistrySeeder — which rides in the GATEWAY TOOL
# package, exactly as media-processing's bucket-check custom resource does. No
# sibling puts a CloudFormation custom resource in its image, and on the image
# this one could not seed the registry until a docker build had finished.
# Consequence worth stating: there is NO ImageConfig.Command anywhere below, so
# all seven tiers run the Dockerfile's one CMD.
#
# THREE STATE MACHINES (README.md §M1). The orchestrator is what callers start;
# it plans, routes to one of two standalone children through `startExecution.sync:2`,
# and collects usage tracking:
#
#   ${ResourcePrefix}-bedrock-inference         plan → route → usage tracking
#   ${ResourcePrefix}-bedrock-inference-sync    acquire → run → release → summarize
#   ${ResourcePrefix}-bedrock-inference-batch   submit → collect → summarize
#
# TWO TABLES: the semaphore (`sync-infer-quotas`) and the batch queue / task tokens
# (`batch-infer-tokens`). They are separate because their access patterns and their
# roles are, not because of where they came from.
#
# SEVEN TIER FUNCTIONS, ONE SHARED ROLE, AND THE SPLIT IS MEMORY — reversing the
# stack's founding design on 2026-08-12, deliberately and at a cost stated here so
# no future reader mistakes it for an oversight.
#
# It WAS six workflow functions with six roles, and the roles were the design: no
# role held both `bedrock:*` and `states:SendTask*`, only DrainRole could `Scan`,
# and BatchStatusRole could write a status but never redeem a token. Compartments,
# and six tests asserting them. The house tier pattern cannot express that — every
# sibling points all of its tiers at ONE role, because the tiers are the same
# image differing only in memory and any state may land on any of them. Adopting
# the pattern therefore means adopting the single role:
# `BedrockInferenceLambdaRole` holds `bedrock:InvokeModel` AND
# `states:SendTaskSuccess` AND `dynamodb:Scan` on both tables, and the compartment
# tests are gone. What remains is narrower and still load-bearing: exactly one CODE
# PATH decrements the semaphore (states/handle_semaphore_release, on the stream,
# deduped per eventID), and every holder-disappearance path reaches it by DELETING
# a holder.
#
# THREE tiers are routed to, four are declared-and-unrouted so a state can be
# re-pointed during sizing work without a template change (the house norm —
# media-processing routes 3 of 7, audiostem 4 of 7). An unrouted tier costs a
# Function + a LogGroup at deploy time and nothing at runtime.
#
# THREE stream/event consumers still cannot be told apart by event shape, and that
# is now the ONLY reason three tier functions must stay distinct — it is no longer
# an IAM boundary, just a routing marker. STREAM_HANDLER names which one each is,
# and THE MARKER IS WHAT PINS EACH TIER: the six old functions could be packed onto
# the three tiers in only one way, because a tier has exactly one marker and
# `notify` is needed by two of them while `semaphore` and `drain` are needed by one
# each.
#
#   Tier      Mem    STREAM_HANDLER  reached by                     was
#   ──────────────────────────────────────────────────────────────────────────────
#   HalfCore   896   notify          token stream; prefix-scoped    notify   (256)
#                                    aws.bedrock                   batch-status (256)
#   OneCore   1792   drain           token stream; 5-min schedule;  drain    (512)
#                                    unscoped aws.bedrock;          run-inference
#                                    RunInferenceLambdaArn                   (1024)
#   TwoCores  3584   semaphore       quota stream; aws.states       workflow (1024)
#                                    terminal; InferenceLambdaArn;  submit-batch
#                                    SubmitBatchLambdaArn                    (2048)
#
# The ASL tokens are unchanged — `InferenceLambdaArn`, `RunInferenceLambdaArn`,
# `SubmitBatchLambdaArn` are the only three Lambda ARNs any definition names, so
# the three definitions*.json bodies did not change at all; only what the
# substitutions point AT did.
#
# A state landing on a marked tier is harmless, and that is why this packing is
# legal at all: the dispatcher routes an SFN task by the `operation` field in its
# payload and never consults STREAM_HANDLER, so run-inference sharing a function
# with the drain consumer costs nothing. The marker is read only for a DynamoDB
# stream record or an aws.bedrock event, neither of which carries an `operation`.
#
# The four unrouted tiers set NO marker at all: nothing delivers them a stream or
# an aws.bedrock event, and an unset marker RAISES rather than defaulting to a
# branch — so a mis-wired event source is loud instead of silently draining.
# Getting a marker wrong is still a one-line deploy-time misconfiguration.
#
# THE CAP IS PER RESOURCE-PREFIX, NOT PER REGION, and that is the merge's one
# semantic change. The standalone quota stack enforced a singleton through its table
# NAME: a second copy in a region failed at CREATE. Here the table is
# ${ResourcePrefix}-sync-infer-quotas, so two deployments with different prefixes get
# two independent caps against one real Bedrock quota. Deploy one prefix per region
# if the cap has to mean what it says.
#
# There are no CloudFormation Exports, deliberately: an export cannot be changed or
# deleted while any importer exists, which welds every consumer's lifecycle to this
# one. Consumers take the outputs as plain String parameters, as every other
# cross-stack reference in the repo does.
# ==============================================================================

Description: Bedrock inference micro-workflow — N already-rendered prompts in, N responses out, sync (leased) or batch (queued). Self-contained — owns its own concurrency semaphore and batch queue. Version %%VERSION%%

Mappings:
    # `Package` until 2026-08-12, renamed to match the siblings: `Package` now names
    # the CodeBuild SOURCE archive (the whole repo, which the Dockerfile builds from)
    # rather than a Lambda deployment zip. GatewayToolPackage is still a real Lambda
    # zip — the gateway tool is the one function that stays flat.
    CodeBuild:
        Source:
            Package: "%%PKG_BEDROCK_INFERENCE%%"
            GatewayToolPackage: "%%PKG_GATEWAY_TOOL%%"
            Bucket: "%%BUCKET_NAME%%"
            KeyPrefix: "%%KEY_PREFIX%%"
        Project:
            Type: ARM_CONTAINER
            ComputeType: BUILD_GENERAL1_LARGE
            Image: aws/codebuild/amazonlinux2-aarch64-standard:3.0
    ECR:
        Repository:
            Name: bedrock-inference-on-aws
            # The tag IS the version, which is what makes an unbumped stack update a
            # no-op: the buildspec's pre_build skips the docker build entirely when
            # {Name}:{ImageTag} already exists in ECR.
            ImageTag: "%%VERSION%%"
    DynamoDB:
        QuotaTable:
            Suffix: sync-infer-quotas
        TokenTable:
            Suffix: batch-infer-tokens
        CallbackTable:
            # bi- prefix matches the sibling convention (mp-/fi-/tts-callback-tokens).
            # Renamed from the bare `callback-tokens` 2026-09-18; TableName is
            # createOnly, so this deploys as a table REPLACEMENT — safe only
            # while no callback run is in flight (rows are transient tokens;
            # a row lost mid-flight sleeps its held state to its timeout)
            Suffix: bi-callback-tokens
    # ── The two deploy-time constants (2026-08-12) ────────────────────────────
    # Both were stack Parameters. They are not request settings and they are not
    # runtime config: each is read by CloudFormation itself while building a
    # resource, so neither can come from input_schema.py or a workflow_config JSON
    # the way DefaultModelChain / MaxConcurrentDefault / BatchMinSavings now do.
    # They live here, next to the memory and timeout figures, because Mappings is
    # already where this template keeps values fixed at deploy time.
    #
    # BOTH CARRY A FILLER MIDDLE KEY (`Object`, `Schedule`) AND MUST. `Fn::FindInMap`
    # takes exactly three arguments — map, top-level key, second-level key — so a
    # single scalar under a map name cannot be read at all. Written flat
    # (`ModelRegistry: {Key: ...}` / `!FindInMap [ModelRegistry, Key]`) the template
    # still PARSES and still builds; it fails at CREATE/UPDATE, after the build is
    # green. That was the shape here until cfn-lint's E1011 named it, and
    # `test_every_findinmap_names_three_levels_that_exist` now catches it offline.
    ModelRegistry:
        # Interpolated into IAM policy resource ARNs below. An S3 grant has to name
        # its object at deploy time — read from a runtime JSON the grant could not
        # be scoped to the registry at all, which is the opposite of the point. The
        # env var handed to the functions is set from THIS entry so the grant and
        # the reader cannot disagree; lib/bedrock.py carries the same string as its
        # own fallback default.
        #
        # _model_configs/, NOT _settings/: the proxy bucket is shared with an M2C
        # v5 deployment whose core stack writes its OWN availablemodels.json (a
        # bare list, no envelope) at _settings/. The original plan was a cutover —
        # seed over v5's file in place — and that is what ran until 2026-08-13;
        # separate paths replaced it so neither stack can clobber the other's
        # registry, each carrying its own shape.
        Object:
            Key: _model_configs/availablemodels.json
    Drain:
        # An AWS::Events::Rule ScheduleExpression — a CloudFormation property,
        # evaluated before any code runs. The scheduled sweep is the BACKSTOP,
        # not the mechanism: normal drainage is event-driven (the table stream
        # and the unscoped aws.bedrock completion rule), and the sweep exists
        # for what events cannot cover — TTL expiry, manual row deletion, a
        # missed event. It is what makes the queue self-healing rather than
        # event-dependent (README.md §6.5 fix 2), so it stays; without it any of
        # those strands a parked token until its 24 h TimeoutSeconds, turning
        # an execution that would have succeeded late into a FAILED one.
        #
        # Every 6 hours, not every 5 minutes: the sweep only matters on the rare
        # missed-event path, where its interval is the worst-case added latency
        # — six hours against a token budget of 24, so even a row stranded the
        # moment after a sweep gets three more chances before the token times
        # out. At rate(5 minutes) it was 8,640 invocations a month, each a Scan
        # of a table that is empty whenever no batch work is queued, all to
        # shave latency off a path that almost never runs.
        Schedule:
            Expression: rate(6 hours)
    # NOT under Lambda: the bundle's tier-vocabulary test pins Mappings.Lambda
    # to {the seven tiers, Function, GatewayTool}, and the seeder is none of
    # those — a CloudFormation custom resource with its own role, not a workflow
    # state. Flat zip out of the gateway-tool package, like every sibling's.
    CustomResource:
        # NOT under Lambda: the bundle pins Mappings.Lambda to the tier
        # vocabulary + {Function, GatewayTool} — same rule that put the
        # seeder here (registration 2026-08-14).
        CallbackWaker:
            Name: callback-waker
            Description: Completes consumer task tokens on the orchestrator's terminal EventBridge event (README.md §11)
            Memory: 256
            Timeout: 60
        SeedModelRegistry:
            Name: seed-model-registry
            # Reads a packaged JSON, filters by geo, one S3 PUT. Runs once per
            # stack create/update.
            Memory: 256
            Timeout: 120
    Lambda:
        Function:
            Name: bedrock-inference
            Description: Bedrock Inference (N records in, N responses out)
        GatewayTool:
            Name: gateway-tool
            Description: AgentCore Gateway dispatcher — run_inference + get_job_status + describe_tool
            # Writes request.jsonl. Staged JSONL bodies STREAM through (one
            # record + an 8 MiB part buffer in memory), so the memory here
            # buys CPU (it scales with memory) rather than headroom, and the
            # timeout bounds one pass over the largest staged file — a real
            # 175 MB records.jsonl timed out the old 1024 MB / 60 s config
            # (2026-08-23). NOT a tier, and flat-zip rather than container —
            # the same split every sibling makes.
            Memory: 3008
            Timeout: 300
        # ── The seven memory tiers ────────────────────────────────────────────
        # The house vocabulary, verbatim: 896 / 1792 / 3584 / 5376 / 7168 / 8960 /
        # 10240 MB against half-core / 1-core / … / 6-cores. No workflow in
        # the repo declares a tier at a different memory or a different name, so
        # these seven pairs are copied rather than chosen. `Memory` and `Name`
        # only — Timeout is a literal on each function, as it is in the siblings,
        # because timeout tracks what a STATE does and not how much RAM it has.
        #
        # THREE are routed to, and WHICH function lands on which is forced by the
        # STREAM_HANDLER marker, not chosen — see the header. The sizes they
        # replaced are recorded so a future sizing pass has a baseline:
        #
        #   HalfCore  896  ← notify (256), batch-status (256)
        #                    one GSI query + one UpdateItem apiece; both are rare
        #                    and sub-second, so 3.5× the price of a millisecond of
        #                    almost nothing is still almost nothing
        #   OneCore  1792  ← drain (512), run-inference (1024)
        #                    the 5-minute sweep and the serial Converse loop. 1792
        #                    is ~1 full vCPU where 1024 was ~0.6, which the
        #                    per-record loop should if anything prefer, and a 900 s
        #                    invocation here is dominated by waiting on Bedrock —
        #                    whose spend for that same 900 s is orders of magnitude
        #                    above the Lambda GB-seconds either way
        #   TwoCores 3584  ← workflow (1024), submit-batch (2048)
        #                    submit-batch renders 10 000 records through
        #                    build_converse_params into one JSONL and set the old
        #                    2048; workflow's collect-batch holds a whole batch
        #                    job's output plus the parsed records at once, so it
        #                    gains headroom it did not have
        #
        # Every routed tier went UP and none went down, which is the direction that
        # matters: a tier BELOW a state's old memory is an OOM waiting for the
        # largest real payload, and 896 would have been one for workflow (1024).
        #
        # ThreeCores through SixCores are declared-and-unrouted, which is the norm
        # and not an oversight — re-point a state at one to measure a different
        # size without touching the template's shape. Do not delete them.
        HalfCore:
            Memory: 896
            Name: half-core
        OneCore:
            Memory: 1792
            Name: 1-core
        TwoCores:
            Memory: 3584
            Name: 2-cores
        ThreeCores:
            Memory: 5376
            Name: 3-cores
        FourCores:
            Memory: 7168
            Name: 4-cores
        FiveCores:
            Memory: 8960
            Name: 5-cores
        SixCores:
            Memory: 10240
            Name: 6-cores

Parameters:
    ResourcePrefix:
        Type: String
        Description: 'Prefix applied to all resource names. The two tables are {ResourcePrefix}-sync-infer-quotas and {ResourcePrefix}-batch-infer-tokens. NOTE the cap is per PREFIX, not per region: two stacks with different prefixes get two independent semaphores against one real Bedrock quota — see the header.'
    ProxyBucket:
        Type: String
        Description: S3 proxy bucket holding the model registry (_model_configs/availablemodels.json), the micro-workflow/ request and response objects, and batch job input/output. May be shared with an M2C v5 deployment, whose own registry at _settings/ is untouched.
    # ── Two parameters, and only two, deliberately (2026-08-12) ───────────────
    # Both name something OUTSIDE this stack that the deployer alone knows, which
    # is the whole test for belonging here. Five others used to sit below:
    #
    #   DefaultModelChain      → lib/input_schema.py DEFAULT_MODEL_CHAIN
    #   MaxConcurrentDefault   → lib/input_schema.py MAX_CONCURRENT_DEFAULT
    #   BatchMinSavings        → lib/input_schema.py BATCH_MIN_SAVINGS
    #   ModelRegistryKey       → Mappings.ModelRegistry.Object.Key
    #   DrainScheduleExpression→ Mappings.Drain.Schedule.Expression
    #
    # The first three were REQUEST defaults, and the code already carried every one
    # of them (`os.environ.get(..., "3")`, `..., "0.25"`) — so the parameter and the
    # constant were two spellings of one number, and only the parameter could drift
    # per-stack with nothing in the tree to show it. DefaultModelChain had drifted:
    # the template shipped haiku-4-5 while eu-west-1 ran sonnet-4-6, which silently
    # re-identified every chain-less request, since the gateway writes model_chain
    # into the hash that IS workflow_id. UNPRICED_BATCH_MIN_TOKENS was already a
    # bare constant with no parameter — that was the pattern to follow.
    # The last two are read by CloudFormation itself; see Mappings.

Resources:

    ############################################################################
    # DynamoDB #1 — the concurrency semaphore. Items (README.md §M2,
    # unchanged by the merge except for the table's name):
    #   pk="semaphore#{svc}#{res}"  sk="counter"            holders/max_holders/ttl
    #   pk="semaphore#{svc}#{res}"  sk="holder#{arn}"       one per in-flight exec
    #   pk="lease#{arn}"            sk="scope#{svc}#{res}"  reverse pointer
    #   pk="pending#{svc}#{res}"    sk=sha256(task_token)   FIFO waiter queue
    #   pk="stream-dedup"           sk={eventID}            exactly-once markers
    #
    # NO GSI. Every access is a direct key read or a single-partition query. The one
    # lookup that would have needed an index — execution ARN to holder, for the
    # EventBridge terminal handler, which receives only an executionArn — is served
    # by the lease# reverse pointer written in the same transaction as the holder.
    #
    # Scoped per RESOURCE, not per service, in both directions: Sonnet 5 saturating
    # does not imply Haiku 4.5 is saturated. Here `resource` is the chain's PRIMARY
    # model id, so a per-service counter would couple unrelated models and read as a
    # slow service.
    #
    # A SEPARATE TABLE from the batch queue below, and not for historical reasons:
    # the two have disjoint access patterns (transactions and a FIFO queue here,
    # a GSI-by-job-arn there). They used to have disjoint ROLES too — the semaphore
    # was written by WorkflowRole and RunInferenceRole, the queue by five others —
    # and after the 2026-08-12 collapse to one role that half of the reason is gone.
    # The access patterns are not, and they are the half that was load-bearing.
    #
    # Every item carries a ttl, so TTL expiry is one of the THREE holder
    # disappearance paths and not merely garbage collection (semaphore invariant 5).
    # NEW_AND_OLD_IMAGES rather than KEYS_ONLY: the stream handler reads only Keys
    # today, but diagnosing a lost decrement after the fact needs the removed
    # holder's acquired_at, and KEYS_ONLY discards it forever.
    ############################################################################
    SyncInferQuotasTable:
        Type: AWS::DynamoDB::Table
        Metadata:
            checkov:
                skip:
                    - id: CKV_AWS_119
                      comment: >-
                        sample posture: table holds rebuildable derived state; default SSE is deliberate (see README.md — DynamoDB posture)
                    - id: CKV_AWS_28
                      comment: >-
                        sample posture: table is rebuildable derived state designed to delete with the stack; PITR protects nothing irreplaceable here
            cfn_nag:
                rules_to_suppress:
                    - id: W74
                      reason: Ephemeral coordination state with a TTL on every item — no customer data, nothing worth a CMK's key-management cost
                    - id: W78
                      reason: Point-in-time recovery is pointless for a semaphore — a restored counter would be a stale count, and invariant 5's counter TTL is the recovery mechanism
                    - id: W28
                      reason: >-
                          The explicit name is how the vendored semaphore client and every function
                          in this stack agree on one table without a CFN import. Blocking a
                          replacement-requiring update is the correct trade — replacing this table
                          would silently reset every live holder count.
        Properties:
            TableName: !Sub
                - ${ResourcePrefix}-${suffix}
                - suffix: !FindInMap [DynamoDB, QuotaTable, Suffix]
            BillingMode: PAY_PER_REQUEST
            AttributeDefinitions:
                - { AttributeName: pk, AttributeType: S }
                - { AttributeName: sk, AttributeType: S }
            KeySchema:
                - { AttributeName: pk, KeyType: HASH }
                - { AttributeName: sk, KeyType: RANGE }
            TimeToLiveSpecification:
                AttributeName: ttl
                Enabled: true
            StreamSpecification:
                StreamViewType: NEW_AND_OLD_IMAGES

    ############################################################################
    # DynamoDB #2 — the batch queue AND the task tokens, one item each (README.md §6.1):
    #
    #   pk = "batch#{model_id}"   sk = "{workflow_id}"
    #        status ∈ PENDING | SUBMITTING | SUBMITTED | COMPLETED | FAILED
    #        task_token, job_arn, request_s3uri, model_params, ttl
    #
    # V5 splits this across a backlog table and a service-token table joined on
    # jobName, because register() runs in one stack and the completion arrives in
    # another. Here both are in this stack, so the token and the queue entry are one
    # item and the join disappears.
    #
    # NEW_AND_OLD_IMAGES is required, not a preference: NotifyFunction fires on a
    # TRANSITION to a terminal status, which means comparing OldImage.status against
    # NewImage.status. With NEW_IMAGE only it would fire on every write to a
    # terminal row and re-send the token on each one.
    #
    # ONE GSI, one purpose: the EventBridge completion handler receives a
    # batchJobArn and nothing else.
    ############################################################################
    BatchInferTokensTable:
        Type: AWS::DynamoDB::Table
        Metadata:
            checkov:
                skip:
                    - id: CKV_AWS_119
                      comment: >-
                        sample posture: table holds rebuildable derived state; default SSE is deliberate (see README.md — DynamoDB posture)
                    - id: CKV_AWS_28
                      comment: >-
                        sample posture: table is rebuildable derived state designed to delete with the stack; PITR protects nothing irreplaceable here
            cfn_nag:
                rules_to_suppress:
                    - id: W74
                      reason: Ephemeral queue and task-token state with a TTL on every item — no customer data, nothing worth a CMK's key-management cost
                    - id: W78
                      reason: Point-in-time recovery is pointless here — a restored row's task token is already expired, so a restore could only resume executions that no longer exist
                    - id: W28
                      reason: The explicit name is how consumers and the vendored token client agree on one table without a CFN import; the TTL, not a backup, is the recovery mechanism
        Properties:
            TableName: !Sub
                - ${ResourcePrefix}-${suffix}
                - suffix: !FindInMap [DynamoDB, TokenTable, Suffix]
            BillingMode: PAY_PER_REQUEST
            AttributeDefinitions:
                - { AttributeName: pk, AttributeType: S }
                - { AttributeName: sk, AttributeType: S }
                - { AttributeName: job_arn, AttributeType: S }
            KeySchema:
                - { AttributeName: pk, KeyType: HASH }
                - { AttributeName: sk, KeyType: RANGE }
            GlobalSecondaryIndexes:
                - IndexName: job_arn-index
                  KeySchema:
                      - { AttributeName: job_arn, KeyType: HASH }
                  # KEYS_ONLY is not enough: BatchStatusFunction needs the row's
                  # model_id to build the pk for its UpdateItem, and a second GetItem
                  # to fetch it would be a read it already paid for.
                  Projection:
                      ProjectionType: INCLUDE
                      NonKeyAttributes: [status, model_id]
            TimeToLiveSpecification:
                AttributeName: ttl
                Enabled: true
            StreamSpecification:
                StreamViewType: NEW_AND_OLD_IMAGES

    ############################################################################
    # DynamoDB #3 — consumer callback tokens (README.md §11, added for
    # the llm-prompt-driven workflows; designed jointly with the
    # conversation-analysis workflow):
    #
    #   pk = execution_arn (orchestrator)   sk = sha256(token)[:32]
    #        token, handle (the submit response JSON), ttl
    #
    # Rows are written by the GATEWAY at submit (before StartExecution, so the
    # waker can never fire first) and completed/deleted by CallbackWakerLambda
    # on the execution's terminal event. sk is a token hash so multiple
    # consumers absorbed into ONE run each get their own row and their own
    # wake. Notification lives HERE, once, rather than as a table+rule+waker
    # in every consumer stack — N consumers are N rows, not N× infrastructure.
    ############################################################################
    CallbackTokensTable:
        Type: AWS::DynamoDB::Table
        Metadata:
            checkov:
                skip:
                    - id: CKV_AWS_119
                      comment: >-
                        sample posture: table holds rebuildable derived state; default SSE is deliberate (see README.md — DynamoDB posture)
                    - id: CKV_AWS_28
                      comment: >-
                        sample posture: table is rebuildable derived state designed to delete with the stack; PITR protects nothing irreplaceable here
            cfn_nag:
                rules_to_suppress:
                    - id: W74
                      reason: Ephemeral task-token rows with a TTL on every item — no customer data, nothing worth a CMK's key-management cost
                    - id: W78
                      reason: Point-in-time recovery is pointless — a restored row's task token belongs to a wait state that has already timed out
                    - id: W28
                      reason: The explicit name is how the gateway and the waker agree on one table without a CFN import; the TTL is the recovery mechanism
        Properties:
            TableName: !Sub
                - ${ResourcePrefix}-${suffix}
                - suffix: !FindInMap [DynamoDB, CallbackTable, Suffix]
            BillingMode: PAY_PER_REQUEST
            AttributeDefinitions:
                - { AttributeName: execution_arn, AttributeType: S }
                - { AttributeName: token_hash, AttributeType: S }
            KeySchema:
                - { AttributeName: execution_arn, KeyType: HASH }
                - { AttributeName: token_hash, KeyType: RANGE }
            TimeToLiveSpecification:
                AttributeName: ttl
                Enabled: true

    ############################################################################
    # Bedrock batch service role.
    #
    # Assumed by BEDROCK, not by Lambda: a batch job runs asynchronously outside any
    # invocation, so Bedrock itself reads the input JSONL, INVOKES THE MODEL, and
    # writes the output — all three under this role. Scoped to this deployment's proxy
    # bucket and, within it, to the micro-workflow/ prefix — the job never has a reason
    # to read anything else.
    #
    # The two condition keys are the confused-deputy guard AWS documents for this
    # role: without them, any account able to name this role ARN in its own
    # CreateModelInvocationJob call could make Bedrock read and write our bucket.
    ############################################################################
    BedrockBatchServiceRole:
        Type: AWS::IAM::Role
        Metadata:
            cfn_nag:
                rules_to_suppress:
                    - id: W11
                      reason: Bedrock model resources cannot be enumerated at deploy time — see BedrockInferenceLambdaRole
        Properties:
            Path: !Sub /${ResourcePrefix}/
            AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                    - Effect: Allow
                      Principal:
                          Service: bedrock.amazonaws.com
                      Action: sts:AssumeRole
                      Condition:
                          StringEquals:
                              aws:SourceAccount: !Ref AWS::AccountId
                          ArnLike:
                              aws:SourceArn: !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:model-invocation-job/*
            Policies:
                - PolicyName: !Sub ${ResourcePrefix}BedrockInferenceBatchIOPolicy
                  PolicyDocument:
                      Version: "2012-10-17"
                      Statement:
                          - Effect: Allow
                            Action:
                                - s3:GetObject
                                - s3:PutObject
                            Resource: !Sub arn:aws:s3:::${ProxyBucket}/micro-workflow/*
                          # ListBucket is scoped by prefix through the condition: the
                          # job lists its own output folder and nothing else.
                          - Effect: Allow
                            Action: s3:ListBucket
                            Resource: !Sub arn:aws:s3:::${ProxyBucket}
                            Condition:
                                StringLike:
                                    s3:prefix: micro-workflow/*
                          # THE JOB ITSELF INVOKES THE MODEL UNDER THIS ROLE, not
                          # under the workflow role. S3 i/o alone is not enough: without
                          # this the job is accepted, validated, scheduled, runs, and
                          # then fails minutes later with "Customer doesn't have
                          # permissions to invokeModel" — a real deploy-time failure
                          # (README.md §12.2). It is expensive to diagnose because
                          # nothing rejects the submit: the token parks, the drain sees
                          # a healthy SUBMITTED row, and the only signal is the job's
                          # own terminal `message`.
                          #
                          # Both resource forms are required and neither is redundant.
                          # A cross-region inference profile resolves to a
                          # foundation-model arn that may carry EITHER an empty region
                          # (`arn:aws:bedrock:::foundation-model/...`) or this region,
                          # and the profile arn itself is account-scoped — verified
                          # against `get-inference-profile` for
                          # global.anthropic.claude-sonnet-4-6, whose `models` list
                          # contains exactly those two shapes. Same grant as
                          # the workflow role, which is why the sync path worked while
                          # batch did not.
                          - Effect: Allow
                            Action:
                                - bedrock:InvokeModel
                                - bedrock:InvokeModelWithResponseStream
                            Resource:
                                - arn:aws:bedrock:*::foundation-model/*
                                - !Sub arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*

    ############################################################################
    # IAM — ONE workflow role, and that is a reversal (2026-08-12).
    #
    # It used to be SIX, and the split was the design: README.md §6.3's asymmetry
    # was enforced by IAM, not by code. The table that stood here recorded it —
    # RunInferenceRole held bedrock:InvokeModel and no CreateModelInvocationJob so
    # the sync loop could not submit a batch job inside a held lease; SubmitBatch
    # held the control plane and no InvokeModel so "batch takes no lease" was
    # unenforceable-by-permission rather than by convention; NotifyRole held
    # states:SendTask* and no Bedrock while DrainRole held Bedrock and no Step
    # Functions, so a drained submit structurally could not notify.
    #
    # ALL OF THAT IS GONE, and the cost is stated plainly rather than buried: the
    # union role can invoke a model, submit a batch job, redeem any task token,
    # and write both tables. Every one of those pairwise impossibilities is now a
    # code convention that IAM will not catch. Six compartmentalization tests were
    # deleted with it.
    #
    # It is deliberate. Every tiered workflow in the repo points all of its tiers at
    # ONE role (media-processing: 7 functions, 1 role; tts, audiostem,
    # speech-diarization the same), because the tier ladder means a STATE can move
    # between memory sizes without a template change — and a per-state role makes
    # that move a permissions change too, which is exactly the coupling the ladder
    # exists to remove. Conforming to the house convention was chosen over the
    # compartmentalization; see README.md.
    #
    # What still holds, and is the one invariant worth reading the code for:
    # exactly ONE code path decrements the semaphore counter —
    # states/handle_semaphore_release, on the quota table's stream, deduped per
    # eventID. Every holder-disappearance path reaches it by DELETING a holder row,
    # never by decrementing. Nothing else calls decrement_once. That was true when
    # IAM enforced it and it is still true; it is now enforced only by the code.
    #
    # THREE roles remain, and the two that are not this one are genuinely separate:
    # SeedModelRegistryRole is a CloudFormation custom resource (one S3 key, no
    # Bedrock, no tables, not on the tier ladder), and GatewayToolRole is the
    # untrusted edge — it holds states:StartExecution and read-only S3 and cannot
    # call Bedrock or touch either table at all. Collapsing THOSE into the union
    # would put Bedrock and both tables behind the internet-facing dispatcher, so
    # they stay split. The siblings keep the same gateway/workflow split.
    #
    # Bedrock model resources are granted as `foundation-model/*` plus
    # `inference-profile/*`, and that is as narrow as it can honestly be: a
    # cross-region inference profile ARN depends on the caller's region at runtime,
    # so the set is not enumerable at deploy time. The MODEL REGISTRY is the actual
    # allowlist — `build_chain` rejects any id absent from it before a call is made,
    # which is also what keeps a run from being uncosted.
    ############################################################################

    BedrockInferenceLambdaRole:
        Type: AWS::IAM::Role
        Metadata:
            cfn_nag:
                rules_to_suppress:
                    - id: W11
                      reason: One unscopeable grant. states:SendTask* is scoped to this account+region's state machines (the token's machine is the caller's, unknowable at deploy time); Bedrock model resources cannot be enumerated at deploy time because a cross-region inference profile ARN depends on the caller's runtime region. The model registry is the real allowlist; build_chain rejects any unregistered id before a call is made.
                    - id: W76
                      reason: Complexity over 25 is the DIRECT and accepted cost of the 2026-08-12 tier collapse — this one role is the union of six, because the house tier pattern points every tier at a single role and any state may land on any tier. Flagged rather than fixed, since the only fix is to re-split the role and abandon the tier convention. See the template header.
        Properties:
            Path: !Sub /${ResourcePrefix}/
            AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                    - Effect: Allow
                      Principal:
                          Service: lambda.amazonaws.com
                      Action: sts:AssumeRole
            Policies:
                - PolicyName: !Sub ${ResourcePrefix}BedrockInferencePolicy
                  PolicyDocument:
                      Version: "2012-10-17"
                      Statement:
                          # All SEVEN tier groups, including the four no state
                          # routes to. Scoped to the declared groups and
                          # deliberately NOT AWSLambdaBasicExecutionRole: that
                          # managed policy grants logs:CreateLogGroup on every
                          # group, which lets a function that cannot reach its
                          # declared group silently create an unmanaged one
                          # instead of failing visibly.
                          - Effect: Allow
                            Action:
                                - logs:CreateLogStream
                                - logs:PutLogEvents
                            Resource:
                                - !GetAtt BedrockInferenceLambdaHalfCoreLogGroup.Arn
                                - !GetAtt BedrockInferenceLambda1CoreLogGroup.Arn
                                - !GetAtt BedrockInferenceLambda2CoresLogGroup.Arn
                                - !GetAtt BedrockInferenceLambda3CoresLogGroup.Arn
                                - !GetAtt BedrockInferenceLambda4CoresLogGroup.Arn
                                - !GetAtt BedrockInferenceLambda5CoresLogGroup.Arn
                                - !GetAtt BedrockInferenceLambda6CoresLogGroup.Arn
                          # ListBucket so object_exists() can tell "absent" from
                          # "denied". Without it a denied HeadObject on the progress
                          # checkpoint would have to be read as "no checkpoint yet",
                          # and the sync loop would re-pay for every completed record.
                          - Effect: Allow
                            Action: s3:ListBucket
                            Resource: !Sub arn:aws:s3:::${ProxyBucket}
                          - Effect: Allow
                            Action:
                                - s3:GetObject
                                - s3:PutObject
                            Resource: !Sub arn:aws:s3:::${ProxyBucket}/*
                          # Data plane AND control plane in one statement, which is
                          # the §6.3 asymmetry's grave marker: run_inference could
                          # not submit a batch job and submit_batch could not
                          # Converse, and now both can do both. Only the code stops
                          # a batch submission from happening inside a held lease.
                          - Effect: Allow
                            Action:
                                - bedrock:InvokeModel
                                - bedrock:InvokeModelWithResponseStream
                                - bedrock:CreateModelInvocationJob
                                - bedrock:GetModelInvocationJob
                            Resource:
                                - arn:aws:bedrock:*::foundation-model/*
                                - !Sub arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*
                                - !Sub arn:aws:bedrock:*:${AWS::AccountId}:model-invocation-job/*
                          # Handing the batch role to Bedrock requires PassRole, and
                          # the condition confines it to the one service that may
                          # receive it. Still scoped, still conditioned — this one
                          # did not widen.
                          - Effect: Allow
                            Action: iam:PassRole
                            Resource: !GetAtt BedrockBatchServiceRole.Arn
                            Condition:
                                StringEquals:
                                    iam:PassedToService: bedrock.amazonaws.com
                          # THE FULL SEMAPHORE. Admission (try_acquire's
                          # transaction: Update the counter, Put the holder and the
                          # lease# pointer), queueing (store_pending), release
                          # (Delete the holder and the pointer), the stream
                          # decrement (decrement_once's Put-marker + Update-counter
                          # transaction), and refresh_holder() on state entry.
                          - Effect: Allow
                            Action:
                                - dynamodb:GetItem
                                - dynamodb:PutItem
                                - dynamodb:UpdateItem
                                - dynamodb:DeleteItem
                                - dynamodb:Query
                            Resource: !GetAtt SyncInferQuotasTable.Arn
                          # Scan is required, not incidental: BOTH drain paths — the
                          # scheduled sweep and the aws.bedrock completion — call
                          # token_table.models_with_pending(), which is a Scan with a
                          # status filter because "which models have a queue" is not a
                          # key or an index. Without it every drain fails with
                          # AccessDeniedException and the batch queue never moves.
                          - Effect: Allow
                            Action:
                                - dynamodb:GetItem
                                - dynamodb:PutItem
                                - dynamodb:UpdateItem
                                - dynamodb:DeleteItem
                                - dynamodb:Query
                                - dynamodb:Scan
                            Resource:
                                - !GetAtt BatchInferTokensTable.Arn
                                - !Sub ${BatchInferTokensTable.Arn}/index/job_arn-index
                          # BOTH streams, because one function is now all three
                          # stream consumers: the quota table's (STREAM_HANDLER=
                          # semaphore) and the token table's (notify, drain). Which
                          # branch runs is decided by the per-tier env marker, and
                          # an unset marker RAISES rather than defaulting.
                          - Effect: Allow
                            Action:
                                - dynamodb:GetRecords
                                - dynamodb:GetShardIterator
                                - dynamodb:DescribeStream
                                - dynamodb:ListStreams
                            Resource:
                                - !GetAtt SyncInferQuotasTable.StreamArn
                                - !GetAtt BatchInferTokensTable.StreamArn
                          # Redeems BOTH token kinds — the sync child's Acquire
                          # lease token and the batch notifier's. Two roles used to
                          # split these; see the Metadata suppression for why
                          # neither could be scoped even then.
                          - Effect: Allow
                            Action:
                                - states:SendTaskSuccess
                                - states:SendTaskFailure
                            # any machine in THIS account+region — the token's machine is the
                            # caller's (ours or a customer's own), never known at deploy time
                            Resource: !Sub arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:*
                          # Usage tracking walks the orchestrator's own history and the
                          # child's. Execution ARNs, not state machine ARNs, and all
                          # three machines because a child's history is read from the
                          # orchestrator.
                          - Effect: Allow
                            Action:
                                - states:DescribeExecution
                                - states:GetExecutionHistory
                            Resource:
                                - !Sub
                                  - arn:aws:states:${AWS::Region}:${AWS::AccountId}:execution:${ResourcePrefix}-${name}:*
                                  - name: !FindInMap [Lambda, Function, Name]
                                - !Sub
                                  - arn:aws:states:${AWS::Region}:${AWS::AccountId}:execution:${ResourcePrefix}-${name}-sync:*
                                  - name: !FindInMap [Lambda, Function, Name]
                                - !Sub
                                  - arn:aws:states:${AWS::Region}:${AWS::AccountId}:execution:${ResourcePrefix}-${name}-batch:*
                                  - name: !FindInMap [Lambda, Function, Name]
                          # Usage tracking prices each invocation at its own function's
                          # memory. Without this the report silently falls back to
                          # _DEFAULT_MEMORY_MB for every state — which now matters MORE
                          # than it did, because the tier ladder spreads the states
                          # across 896 / 1792 / 3584 MB instead of clustering them at
                          # 1024.
                          - Effect: Allow
                            Action: lambda:GetFunctionConfiguration
                            Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${ResourcePrefix}-*

    SeedModelRegistryRole:
        Type: AWS::IAM::Role
        Properties:
            Path: !Sub /${ResourcePrefix}/
            AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                    - Effect: Allow
                      Principal:
                          Service: lambda.amazonaws.com
                      Action: sts:AssumeRole
            Policies:
                - PolicyName: !Sub ${ResourcePrefix}BedrockInferenceSeedModelRegistryPolicy
                  PolicyDocument:
                      Version: "2012-10-17"
                      Statement:
                          - Effect: Allow
                            Action:
                                - logs:CreateLogStream
                                - logs:PutLogEvents
                            Resource: !GetAtt SeedModelRegistryLogGroup.Arn
                          # Read-then-write on the ONE registry key — the read is the
                          # version check that makes an unbumped stack update a no-op
                          # instead of clobbering an operator-edited registry.
                          - Effect: Allow
                            Action:
                                - s3:GetObject
                                - s3:PutObject
                            Resource: !Sub
                                - arn:aws:s3:::${ProxyBucket}/${key}
                                - key: !FindInMap [ModelRegistry, Object, Key]

    GatewayToolRole:
        Type: AWS::IAM::Role
        Metadata:
            cfn_nag:
                rules_to_suppress:
                    - id: W11
                      reason: states:SendTask* is scoped to this account+region's state machines — the token's machine is the caller's and unknowable at deploy time. The token itself is the capability; the callback table it comes from is writable by this role alone.
        Properties:
            Path: !Sub /${ResourcePrefix}/
            AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                    - Effect: Allow
                      Principal:
                          Service: lambda.amazonaws.com
                      Action: sts:AssumeRole
            Policies:
                - PolicyName: !Sub ${ResourcePrefix}BedrockInferenceGatewayToolPolicy
                  PolicyDocument:
                      Version: "2012-10-17"
                      Statement:
                          - Effect: Allow
                            Action:
                                - logs:CreateLogGroup
                                - logs:CreateLogStream
                                - logs:PutLogEvents
                            Resource: !GetAtt GatewayToolLogGroup.Arn
                          - Effect: Allow
                            Action: states:StartExecution
                            Resource: !GetAtt InferenceStateMachine.Arn
                          # DescribeExecution and GetExecutionHistory take execution
                          # ARNs, not the state machine ARN.
                          - Effect: Allow
                            Action:
                                - states:DescribeExecution
                                - states:GetExecutionHistory
                            Resource: !Sub
                                - arn:aws:states:${AWS::Region}:${AWS::AccountId}:execution:${smName}:*
                                - smName: !GetAtt InferenceStateMachine.Name
                          # PutObject, unlike the other gateway tools in the repo:
                          # this dispatcher CREATES input_params.json and request.jsonl at
                          # a prefix derived from the workflow_id it just computed.
                          # There is no caller-supplied uri to pass through.
                          # Abort/Delete serve the streaming staged-records
                          # path alone: its _staging/ object is copied to the
                          # final key and removed, and a refused stream aborts
                          # its own multipart upload (both are separate IAM
                          # actions from PutObject — without them the cleanup
                          # degrades to warn-logs and orphaned parts).
                          - Effect: Allow
                            Action:
                                - s3:GetObject
                                - s3:PutObject
                                - s3:DeleteObject
                                - s3:AbortMultipartUpload
                            Resource: !Sub arn:aws:s3:::${ProxyBucket}/micro-workflow/*
                          # READ-only on the one registry key: list_models /
                          # get_model are thin reads over the seeded artifact, so
                          # the tools and the plan cannot disagree about the
                          # allowlist. No PutObject — the seeder owns the write.
                          - Effect: Allow
                            Action: s3:GetObject
                            Resource: !Sub
                                - arn:aws:s3:::${ProxyBucket}/${key}
                                - key: !FindInMap [ModelRegistry, Object, Key]
                          - Effect: Allow
                            Action: s3:ListBucket
                            Resource: !Sub arn:aws:s3:::${ProxyBucket}
                          # Callback registration (README.md §11): rows the
                          # waker completes at the terminal event. Put at
                          # submit; Delete on synchronous completion of an
                          # absorbed-finished run and on start failure.
                          - Effect: Allow
                            Action:
                                - dynamodb:PutItem
                                - dynamodb:DeleteItem
                            Resource: !GetAtt CallbackTokensTable.Arn
                          # SendTaskSuccess for the absorbed-finished path.
                          # Scoped to this account+region's machines
                          # (corrected 2026-10-09: SendTask* DOES accept
                          # state-machine ARN scoping; the token's machine
                          # is the caller's, unknowable at deploy time, so
                          # account+region is the bound). The REAL
                          # controls are the token itself (unguessable,
                          # useless without possession) and this table,
                          # writable by this role alone.
                          - Effect: Allow
                            Action: states:SendTaskSuccess
                            # any machine in THIS account+region — the token's machine is the
                            # caller's (ours or a customer's own), never known at deploy time
                            Resource: !Sub arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:*

    ############################################################################
    # CodeBuild — builds the container image and pushes it to ECR. Adopted
    # consistency with the rest of the repo, not because this
    # workflow needs a container: there is no third-party dependency and no model
    # weight, so the build is a COPY of ~40 Python files onto the managed
    # python3.13 Lambda base image and nothing else. That is also why the project
    # seeds nothing to S3 and touches no table, unlike tts's or face-recognition's.
    #
    # It is idempotent by IMAGE TAG, which is the whole reason .version must be
    # bumped on every deploy: the tag IS the version, pre_build skips the docker
    # build when {repo}:{tag} already exists, and Lambda resolves ImageUri to a
    # digest at update time — so re-deploying an unbumped version leaves every
    # function pinned to the OLD digest and the code change silently does not ship.
    ############################################################################

    CodeBuildRole:
        Type: AWS::IAM::Role
        Metadata:
            cfn_nag:
                rules_to_suppress:
                    - id: W11
                      reason: ecr:GetAuthorizationToken is an account-level action with no resource to scope to — the AWS API rejects any resource other than "*". Every other ECR grant below is scoped to this stack's one repository.
        Properties:
            Path: !Sub /${ResourcePrefix}/
            AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                    - Effect: Allow
                      Principal:
                          Service: codebuild.amazonaws.com
                      Action: sts:AssumeRole
            Policies:
                - PolicyName: !Sub ${ResourcePrefix}BedrockInferenceCodeBuildPolicy
                  PolicyDocument:
                      Version: "2012-10-17"
                      Statement:
                          - Effect: Allow
                            Action:
                                - logs:CreateLogGroup
                                - logs:CreateLogStream
                                - logs:PutLogEvents
                            Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild*
                          - Effect: Allow
                            Action: ecr:GetAuthorizationToken
                            Resource: "*"
                          - Effect: Allow
                            Action:
                                - ecr:CreateRepository
                                - ecr:DescribeImages
                                - ecr:BatchCheckLayerAvailability
                                - ecr:CompleteLayerUpload
                                - ecr:InitiateLayerUpload
                                - ecr:PutImage
                                - ecr:UploadLayerPart
                            Resource: !Sub
                                - arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${repositoryName}
                                - repositoryName: !FindInMap [ECR, Repository, Name]
                          # The source archive, and nothing else. No grant on
                          # ProxyBucket at all — this project publishes an image and
                          # seeds no artefacts, so it has no business in the data
                          # bucket the workflow reads and writes.
                          - Effect: Allow
                            Action: s3:GetObject
                            Resource: !Sub
                                - arn:aws:s3:::${bucket}/*
                                - bucket: !FindInMap [CodeBuild, Source, Bucket]

    CodeBuildProject:
        Type: AWS::CodeBuild::Project
        Properties:
            Name: !Sub
                - ${ResourcePrefix}-${repositoryName}
                - repositoryName: !FindInMap [ECR, Repository, Name]
            Description: !Sub
                - Build and publish the ${desc} docker image to ECR
                - desc: !FindInMap [Lambda, Function, Description]
            ServiceRole: !GetAtt CodeBuildRole.Arn
            Source:
                Type: S3
                Location: !Sub
                    - ${bucket}/${keyPrefix}/${package}
                    - bucket: !FindInMap [CodeBuild, Source, Bucket]
                      keyPrefix: !FindInMap [CodeBuild, Source, KeyPrefix]
                      package: !FindInMap [CodeBuild, Source, Package]
                BuildSpec: |
                    version: 0.2
                    phases:
                        pre_build:
                            commands:
                                - echo "== Logging in to Amazon ECR =="
                                - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com
                                - |
                                    echo "== Creating ECR repository if it does not exist =="
                                    aws ecr create-repository --region $AWS_REGION --repository-name $IMAGE_REPO_NAME --image-scanning-configuration scanOnPush=true --encryption-configuration encryptionType=AES256; EXITCODE=$?
                                    if [ $EXITCODE -ne 0 ] && [ $EXITCODE -ne 254 ]; then
                                        echo "ECR create-repository failed with exit code $EXITCODE"
                                        exit $EXITCODE
                                    fi
                                - |
                                    echo "== Checking if $IMAGE_REPO_NAME:$IMAGE_TAG already exists =="
                                    if aws ecr describe-images --region $AWS_REGION --repository-name $IMAGE_REPO_NAME --image-ids imageTag=$IMAGE_TAG 2>/dev/null; then
                                        echo "Image $IMAGE_REPO_NAME:$IMAGE_TAG already exists — skipping build"
                                        touch /tmp/skip_build
                                    else
                                        echo "Image not found — proceeding with build"
                                    fi
                        build:
                            commands:
                                - |
                                    if [ -f /tmp/skip_build ]; then
                                        echo "== Skipping docker build — image already exists =="
                                    else
                                        echo "== Building $IMAGE_REPO_NAME:$IMAGE_TAG [$(date)] =="
                                        docker build -t $IMAGE_REPO_NAME:$IMAGE_TAG .
                                        docker tag $IMAGE_REPO_NAME:$IMAGE_TAG $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$IMAGE_REPO_NAME:$IMAGE_TAG
                                        echo "== Pushing $IMAGE_REPO_NAME:$IMAGE_TAG [$(date)] =="
                                        docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$IMAGE_REPO_NAME:$IMAGE_TAG
                                        echo "== Push complete [$(date)] =="
                                    fi
                        post_build:
                            commands:
                                - |
                                    echo "=== post_build CODEBUILD_BUILD_SUCCEEDING=$CODEBUILD_BUILD_SUCCEEDING ==="
                                    if [ -n "$CFN_ResponseURL" ]; then
                                        if [ "$CODEBUILD_BUILD_SUCCEEDING" = "1" ]; then
                                            echo "== Sending SUCCESS to CloudFormation =="
                                            curl -s -X PUT -H "Content-Type:" \
                                                --data-binary "{\"Status\":\"SUCCESS\",\"Reason\":\"Docker image ready\",\"PhysicalResourceId\":\"$CFN_PhysicalResourceId\",\"StackId\":\"$CFN_StackId\",\"RequestId\":\"$CFN_RequestId\",\"LogicalResourceId\":\"$CFN_LogicalResourceId\",\"Data\":{\"ImageUri\":\"$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$IMAGE_REPO_NAME:$IMAGE_TAG\"}}" \
                                                "$CFN_ResponseURL"
                                        else
                                            echo "== Sending FAILED to CloudFormation =="
                                            curl -s -X PUT -H "Content-Type:" \
                                                --data-binary "{\"Status\":\"FAILED\",\"Reason\":\"Docker build failed — see CodeBuild logs\",\"PhysicalResourceId\":\"$CFN_PhysicalResourceId\",\"StackId\":\"$CFN_StackId\",\"RequestId\":\"$CFN_RequestId\",\"LogicalResourceId\":\"$CFN_LogicalResourceId\",\"Data\":{}}" \
                                                "$CFN_ResponseURL"
                                        fi
                                    fi
            Environment:
                # ARM_CONTAINER, not the x86 default with a --platform flag: the
                # tier functions are Architectures: [arm64], and a cross-built image
                # is rejected by Lambda at update time with a bare
                # InvalidParameterValueException naming neither arch.
                Type: !FindInMap [CodeBuild, Project, Type]
                ComputeType: !FindInMap [CodeBuild, Project, ComputeType]
                Image: !FindInMap [CodeBuild, Project, Image]
                PrivilegedMode: true
                EnvironmentVariables:
                    - Name: AWS_REGION
                      Value: !Ref AWS::Region
                    - Name: AWS_ACCOUNT_ID
                      Value: !Ref AWS::AccountId
                    - Name: IMAGE_REPO_NAME
                      Value: !FindInMap [ECR, Repository, Name]
                    - Name: IMAGE_TAG
                      Value: !FindInMap [ECR, Repository, ImageTag]
            Artifacts:
                Type: NO_ARTIFACTS
            EncryptionKey: !Sub arn:aws:kms:${AWS::Region}:${AWS::AccountId}:alias/aws/s3
            # 30, not the siblings' 60/90: they download and re-upload gigabytes of
            # model weights inside pre_build. This build is a COPY and a push of a
            # base image plus a few hundred KB of Python.
            TimeoutInMinutes: 30
            QueuedTimeoutInMinutes: 60
            LogsConfig:
                CloudWatchLogs:
                    GroupName: /aws/codebuild
                    StreamName: !Sub
                        - ${ResourcePrefix}-${repositoryName}
                        - repositoryName: !FindInMap [ECR, Repository, Name]
                    Status: ENABLED

    ############################################################################
    # StartBuild custom resource — kicks CodeBuild at stack create/update and
    # waits for the CFN callback the BUILDSPEC's post_build phase sends. The
    # Lambda deliberately does NOT respond on the success path: if it did, CFN
    # would proceed to create the tier functions while the image is still being
    # pushed, and every one of them would fail on an ImageUri that does not exist
    # yet. That inversion — the build answers CloudFormation, not the starter — is
    # what the sibling type name Custom::StartBuildDelayResponse records.
    ############################################################################

    StartBuildLambdaRole:
        Type: AWS::IAM::Role
        Properties:
            Path: !Sub /${ResourcePrefix}/
            AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                    - Effect: Allow
                      Principal:
                          Service: lambda.amazonaws.com
                      Action: sts:AssumeRole
            Policies:
                - PolicyName: !Sub ${ResourcePrefix}BedrockInferenceStartBuildPolicy
                  PolicyDocument:
                      Version: "2012-10-17"
                      Statement:
                          - Effect: Allow
                            Action:
                                - logs:CreateLogStream
                                - logs:PutLogEvents
                            Resource: !GetAtt StartBuildLambdaLogGroup.Arn
                          - Effect: Allow
                            Action:
                                - codebuild:StartBuild
                                - codebuild:BatchGetBuilds
                            Resource: !GetAtt CodeBuildProject.Arn

    StartBuildLambdaLogGroup:
        Type: AWS::Logs::LogGroup
        Metadata:
            cfn_nag:
                rules_to_suppress:
                    - id: W84
                      reason: CloudWatch Logs encrypts data at rest by default using an AWS-managed key
        Properties:
            LogGroupName: !Sub
                - /aws/lambda/${ResourcePrefix}-${name}-start-build
                - name: !FindInMap [Lambda, Function, Name]
            RetentionInDays: 7

    # UNNAMED, matching the siblings. CFN generates the physical name, so
    # /aws/lambda/{FunctionName} is unknowable at author time and LoggingConfig is
    # the only way an unnamed function reaches a declared, stack-owned group.
    StartBuildLambda:
        Type: AWS::Lambda::Function
        # Explicit even though LoggingConfig's !Ref implies it (cfn-lint W3005,
        # accepted): the bundle's log-group hygiene test pins the DependsOn on
        # every StartBuildLambda, because this function is invoked by a custom
        # resource DURING create and a first invocation without its group logs
        # nowhere readable.
        DependsOn: StartBuildLambdaLogGroup
        Metadata:
            cfn_nag:
                rules_to_suppress:
                    - id: W89
                      reason: Not using VPC
                    - id: W92
                      reason: Invoked once per stack operation by CloudFormation
        Properties:
            Description: !Sub (${ResourcePrefix}) Bedrock Inference — Custom::StartBuildDelayResponse. Starts the CodeBuild project with the CFN callback in its environment and does not respond; the buildspec does.
            Runtime: python3.13
            Handler: index.lambda_handler
            Timeout: 300
            MemorySize: 128
            Role: !GetAtt StartBuildLambdaRole.Arn
            LoggingConfig:
                LogGroup: !Ref StartBuildLambdaLogGroup
            Code:
                ZipFile: |
                    import json
                    import urllib.request
                    import boto3

                    def send_cfn(event, status, reason="", data=None):
                        body = json.dumps({
                            "Status": status, "Reason": reason,
                            "PhysicalResourceId": event.get("PhysicalResourceId",
                                                            event["LogicalResourceId"]),
                            "StackId": event["StackId"],
                            "RequestId": event["RequestId"],
                            "LogicalResourceId": event["LogicalResourceId"],
                            "Data": data or {},
                        }).encode()
                        req = urllib.request.Request(event["ResponseURL"], data=body,
                                                     method="PUT",
                                                     headers={"Content-Type": ""})
                        urllib.request.urlopen(req)

                    def lambda_handler(event, context):
                        print('Event keys:', sorted(event))
                        if event["RequestType"] == "Delete":
                            send_cfn(event, "SUCCESS", "delete no-op")
                            return
                        try:
                            cb = boto3.client("codebuild")
                            cb.start_build(
                                projectName=event["ResourceProperties"]["ProjectName"],
                                environmentVariablesOverride=[
                                    {"name": "CFN_ResponseURL", "value": event["ResponseURL"]},
                                    {"name": "CFN_StackId", "value": event["StackId"]},
                                    {"name": "CFN_RequestId", "value": event["RequestId"]},
                                    {"name": "CFN_LogicalResourceId",
                                     "value": event["LogicalResourceId"]},
                                    {"name": "CFN_PhysicalResourceId",
                                     "value": event.get("PhysicalResourceId",
                                                        event["LogicalResourceId"])},
                                ])
                            # buildspec post_build sends the final CFN response
                        except Exception as exc:
                            send_cfn(event, "FAILED", str(exc))

    StartBuild:
        Type: Custom::StartBuildDelayResponse
        DependsOn: StartBuildLambdaLogGroup
        Properties:
            ServiceToken: !GetAtt StartBuildLambda.Arn
            ProjectName: !Ref CodeBuildProject
            # Changing .version is what re-runs the build on update — CFN
            # re-invokes a custom resource only when its Properties change. It is
            # also the ImageTag, so an unbumped deploy is a double no-op: no
            # re-invoke, and a skip even if it were re-invoked.
            Version: "%%VERSION%%"

    ############################################################################
    # Log groups — declared explicitly rather than left to Lambda's implicit
    # creation, so retention is bounded and the group dies with the stack. Lambda
    # auto-creates /aws/lambda/<fn> on first invocation with never-expire
    # retention and no stack ownership, which orphans the group on stack delete
    # and then makes the NEXT create fail with "already exists".
    #
    # ALL SEVEN tiers, including the four no state routes to: a group for an
    # unrouted tier costs nothing and its absence would be a wildcard in the role.
    # Every AWS::Lambda::Function in this template must have a group here or
    # beside itself; enforced by test_units.py.
    ############################################################################

    BedrockInferenceLambdaHalfCoreLogGroup:
