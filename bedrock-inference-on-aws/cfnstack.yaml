    ############################################################################
    # Workflow Lambdas — ONE container image, SEVEN memory tiers, ONE role.
    #
    # Every tier is byte-identical except MemorySize and the STREAM_HANDLER
    # marker. There is no `Handler` property: a PackageType: Image function takes
    # its entry point from the image's CMD (`lambda_function.lambda_handler`, set
    # in the Dockerfile), and setting Handler on an image function is a template
    # validation error rather than an override.
    #
    # `Timeout: 900` is a LITERAL on every tier, not a mapping lookup, matching
    # the siblings — the Lambda mapping entries carry Memory and Name only. 900 s
    # is the ceiling and it is what the run-inference path needs: the loop
    # checkpoints per record and yields with LambdaResourceTimeoutException when
    # REMAINING_TIME_BUFFER_MS is left, so the full ceiling is usable window
    # rather than exposure. The bedrock-runtime read_timeout is set to the same
    # 900 s so a hung Converse cannot outlive the invocation. The four short
    # states now carry the same ceiling, which costs nothing: Lambda bills
    # duration, not timeout.
    #
    # Every tier gets the FULL environment, including variables only some code
    # paths read. A per-tier subset would make moving a state between tiers a
    # two-line change with a KeyError as the failure mode, which is exactly the
    # coupling the ladder exists to remove.
    ############################################################################

    BedrockInferenceLambdaHalfCore:
        Type: AWS::Lambda::Function
        DependsOn: StartBuild
        Metadata:
            cfn_nag:
                rules_to_suppress:
                    - id: W89
                      reason: Not using VPC
                    - id: W92
                      reason: Concurrency is bounded by the stream's shard count and by the caller's own execution count; reserved concurrency would add a second, unrelated cap
        Properties:
            FunctionName: !Sub
                - ${ResourcePrefix}-${fn}-${tier}
                - fn: !FindInMap [Lambda, Function, Name]
                  tier: !FindInMap [Lambda, HalfCore, Name]
            Description: !FindInMap [Lambda, Function, Description]
            PackageType: Image
            Code:
                ImageUri: !Sub
                    - ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${repo}:${tag}
                    - repo: !FindInMap [ECR, Repository, Name]
                      tag: !FindInMap [ECR, Repository, ImageTag]
            Architectures: [arm64]
            MemorySize: !FindInMap [Lambda, HalfCore, Memory]
            Timeout: 900
            Role: !GetAtt BedrockInferenceLambdaRole.Arn
            Environment:
                Variables:
                    PROXY_BUCKET: !Ref ProxyBucket
                    MODEL_REGISTRY_KEY: !FindInMap [ModelRegistry, Object, Key]
                    SYNC_INFER_QUOTAS_TABLE_NAME: !Ref SyncInferQuotasTable
                    SERVICE_TOKEN_TABLE_NAME: !Ref BatchInferTokensTable
                    BATCH_SERVICE_ROLE_ARN: !GetAtt BedrockBatchServiceRole.Arn
                    REMAINING_TIME_BUFFER_MS: "60000"
                    # Reached by the token table's stream (NotifyStreamMapping) AND
                    # by the PREFIX-SCOPED aws.bedrock rule (BatchTokenRule). NOT
                    # 'drain', even though the unscoped drain rule delivers the same
                    # event shape to the 1-core tier: the router sends an
                    # aws.bedrock event to states.drain when the marker says drain
                    # (§6.5's two rules, opposite scoping), so 'drain' here would
                    # silently turn the token path into a second drain and never
                    # write a status.
                    STREAM_HANDLER: "notify"
                    TARGET_NAME: "bedrock-inference"
                    TOOL_VERSION: "%%VERSION%%"
            TracingConfig:
                Mode: Active

    BedrockInferenceLambda1Core:
        Type: AWS::Lambda::Function
        DependsOn: StartBuild
        Metadata:
            cfn_nag:
                rules_to_suppress:
                    - id: W89
                      reason: Not using VPC
                    - id: W92
                      reason: In-flight Bedrock calls are bounded by this stack's own concurrency semaphore, which is the whole point of the lease; drain submits are bounded per invocation by MAX_SUBMITS_PER_MODEL. Reserved concurrency would cap re-entries instead and stall checkpointed runs
        Properties:
            FunctionName: !Sub
                - ${ResourcePrefix}-${fn}-${tier}
                - fn: !FindInMap [Lambda, Function, Name]
                  tier: !FindInMap [Lambda, OneCore, Name]
            Description: !FindInMap [Lambda, Function, Description]
            PackageType: Image
            Code:
                ImageUri: !Sub
                    - ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${repo}:${tag}
                    - repo: !FindInMap [ECR, Repository, Name]
                      tag: !FindInMap [ECR, Repository, ImageTag]
            Architectures: [arm64]
            MemorySize: !FindInMap [Lambda, OneCore, Memory]
            Timeout: 900
            Role: !GetAtt BedrockInferenceLambdaRole.Arn
            Environment:
                Variables:
                    PROXY_BUCKET: !Ref ProxyBucket
                    MODEL_REGISTRY_KEY: !FindInMap [ModelRegistry, Object, Key]
                    SYNC_INFER_QUOTAS_TABLE_NAME: !Ref SyncInferQuotasTable
                    SERVICE_TOKEN_TABLE_NAME: !Ref BatchInferTokensTable
                    BATCH_SERVICE_ROLE_ARN: !GetAtt BedrockBatchServiceRole.Arn
                    # The checkpoint-and-yield margin for the serial Converse loop,
                    # which runs HERE (RunInferenceLambdaArn). Must stay well under
                    # Timeout: below this much remaining time the loop stops rather
                    # than starting another Converse call, because a Sandbox.Timedout
                    # mid-Converse loses that record's spend with nothing recorded.
                    REMAINING_TIME_BUFFER_MS: "60000"
                    # Reached by the token table's stream (DrainStreamMapping), the
                    # 5-minute schedule, and the UNSCOPED aws.bedrock rule. The
                    # HalfCore tier is subscribed to the SAME table stream, so the
                    # event shape cannot tell them apart — the marker is the only
                    # thing that does.
                    STREAM_HANDLER: "drain"
                    TARGET_NAME: "bedrock-inference"
                    TOOL_VERSION: "%%VERSION%%"
            TracingConfig:
                Mode: Active

    BedrockInferenceLambda2Cores:
        Type: AWS::Lambda::Function
        DependsOn: StartBuild
        Metadata:
            cfn_nag:
                rules_to_suppress:
                    - id: W89
                      reason: Not using VPC
                    - id: W92
                      reason: One invocation per batch execution plus one per holder release; the account's in-progress-job limit is the real bound on submits and is service-enforced
        Properties:
            FunctionName: !Sub
                - ${ResourcePrefix}-${fn}-${tier}
                - fn: !FindInMap [Lambda, Function, Name]
                  tier: !FindInMap [Lambda, TwoCores, Name]
            Description: !FindInMap [Lambda, Function, Description]
            PackageType: Image
            Code:
                ImageUri: !Sub
                    - ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${repo}:${tag}
                    - repo: !FindInMap [ECR, Repository, Name]
                      tag: !FindInMap [ECR, Repository, ImageTag]
            Architectures: [arm64]
            MemorySize: !FindInMap [Lambda, TwoCores, Memory]
            Timeout: 900
            Role: !GetAtt BedrockInferenceLambdaRole.Arn
            Environment:
                Variables:
                    PROXY_BUCKET: !Ref ProxyBucket
                    MODEL_REGISTRY_KEY: !FindInMap [ModelRegistry, Object, Key]
                    SYNC_INFER_QUOTAS_TABLE_NAME: !Ref SyncInferQuotasTable
                    SERVICE_TOKEN_TABLE_NAME: !Ref BatchInferTokensTable
                    BATCH_SERVICE_ROLE_ARN: !GetAtt BedrockBatchServiceRole.Arn
                    REMAINING_TIME_BUFFER_MS: "60000"
                    # This tier consumes the QUOTA table's stream; the other two
                    # consume the TOKEN table's. Wrong value here and every holder
                    # REMOVE lands in states/notify or states/drain, which would look
                    # for a batch row that does not exist — so the counter is never
                    # decremented and the cap silently ratchets to zero.
                    STREAM_HANDLER: "semaphore"
                    TARGET_NAME: "bedrock-inference"
                    TOOL_VERSION: "%%VERSION%%"
            TracingConfig:
                Mode: Active

    # ── Declared and UNROUTED (2026-08-12) ────────────────────────────────────
    # No state machine substitution, no event source, no stream mapping points at
    # the four functions below, and they set NO STREAM_HANDLER — an unset marker
