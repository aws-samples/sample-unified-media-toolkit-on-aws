    # ── The model-registry seeder ─────────────────────────────────────────────
    # Off the tier ladder AND OFF THE IMAGE — a flat python3.13 zip, loaded from the
    # gateway-tool package, which is what every sibling does with its deploy-time
    # custom resources (media-processing's `bucket-check` reads the same
    # GatewayToolPackage; hybrid-search's CopySchema is a flat zip too). Three
    # reasons, in the order they matter:
    #
    #   1. It is the house pattern. No sibling puts a CloudFormation custom resource
    #      in the container image, and this one has no reason to be the exception:
    #      it filters a packaged JSON by geo and does one S3 PUT.
    #   2. It does not have to wait for the build. On the image it needed
    #      `DependsOn: StartBuild`, so the registry could not be seeded until a
    #      docker build finished. As a zip the seed runs in parallel with it.
    #   3. It was BLOCKING THE ZIP→IMAGE MIGRATION, and that is how this was found.
    #      `PackageType` requires replacement, and CloudFormation refuses to replace
    #      a CUSTOM-NAMED resource — "Rename infertext-bedrock-inference-seed-model-
    #      registry and update the stack again". The seven tiers are new logical ids
    #      with new names, so they migrate fine; this one, keeping its name across
    #      the change, rolled the whole stack back in 30 seconds.
    #
    # No ImageConfig.Command anywhere in this template as a result: all seven tiers
    # run the Dockerfile's CMD unchanged, so the image has exactly one entry point.
    SeedModelRegistryLambda:
        Type: AWS::Lambda::Function
        DependsOn: SeedModelRegistryLogGroup
        Metadata:
            cfn_nag:
                rules_to_suppress:
                    - id: W89
                      reason: Not using VPC
                    - id: W92
                      reason: Invoked once per stack operation by CloudFormation
        Properties:
            FunctionName: !Sub
                - ${ResourcePrefix}-${name}-${state}
                - name: !FindInMap [Lambda, Function, Name]
                  state: !FindInMap [CustomResource, SeedModelRegistry, Name]
            Description: !Sub (${ResourcePrefix}) Bedrock Inference — Custom::ModelRegistrySeeder. Installs availablemodels.json from the packaged master list, filtered to this deployment's geo; skips when the installed registry_version already matches.
            Runtime: python3.13
            # The dotted path is why the gateway-tool zip carries `states/` and
            # `models/` with their directory structure intact rather than flattened:
            # the seeder resolves its master list relative to its own __file__.
            Handler: states.seed_model_registry.lambda_function.lambda_handler
            Code:
                S3Bucket: !FindInMap [CodeBuild, Source, Bucket]
                S3Key: !Sub
                    - ${keyPrefix}/${pkg}
                    - keyPrefix: !FindInMap [CodeBuild, Source, KeyPrefix]
                      pkg: !FindInMap [CodeBuild, Source, GatewayToolPackage]
            Architectures: [arm64]
            MemorySize: !FindInMap [CustomResource, SeedModelRegistry, Memory]
            Timeout: !FindInMap [CustomResource, SeedModelRegistry, Timeout]
            Role: !GetAtt SeedModelRegistryRole.Arn
            TracingConfig:
                Mode: Active

    ModelRegistrySeeder:
        Type: Custom::ModelRegistrySeeder
        DependsOn: SeedModelRegistryLogGroup
        Properties:
            ServiceToken: !GetAtt SeedModelRegistryLambda.Arn
            Bucket: !Ref ProxyBucket
            RegistryKey: !FindInMap [ModelRegistry, Object, Key]
            # The deploy region's PREFIX, not the geo: for APAC regions this is
            # "ap" (ap-southeast-1) while the geo vocabulary says "apac", so the
            # seeder aliases ap→apac before validating against {us, eu, apac}.
            # The alias lives in the seeder, not here — Fn::FindInMap accepts
            # only Ref/FindInMap as keys, never Fn::Select, so a template-side
            # translation would mean hand-enumerating every APAC region. Any
            # other prefix (ca-, sa-, me-, af-, il-) fails the stack, which is
            # what a deploy to a region family without a model list should do.
            Geo: !Select [0, !Split ["-", !Ref AWS::Region]]
            # Changing .version is what re-runs the seed on update: CFN re-invokes a
            # custom resource only when its Properties change.
            Version: "%%VERSION%%"

    ############################################################################
    # Stream → the semaphore's decrement + drain (README.md §M2.2).
    #
    # FilterCriteria is what makes this safe to hang off the whole table: only REMOVE
    # on a holder item reaches the function. Without it every counter update, every
    # pending write, and every dedup marker would invoke it — and a dedup marker's own
    # TTL expiry would arrive as a REMOVE, which is the one event that must never be
    # read as a released holder. states/handle_semaphore_release re-checks both key
    # prefixes anyway and logs rather than raising, because a raise here fails the
    # whole batch and the stream redelivers it forever.
    #
    # BisectBatchOnFunctionError keeps one poison record from blocking a shard;
    # MaximumRetryAttempts bounds it. Both are safe because decrement_once is
    # idempotent per eventID (semaphore invariant 2) — a redelivered record
    # deduplicates rather than double-decrementing, and the drain that follows it is a
    # query-then-admit that finds nothing the second time.
    ############################################################################
    SemaphoreStreamMapping:
        Type: AWS::Lambda::EventSourceMapping
        Properties:
            EventSourceArn: !GetAtt SyncInferQuotasTable.StreamArn
            FunctionName: !GetAtt BedrockInferenceLambda2Cores.Arn
            StartingPosition: TRIM_HORIZON
            BatchSize: 10
            BisectBatchOnFunctionError: true
            MaximumRetryAttempts: 3
            FilterCriteria:
                Filters:
                    - Pattern: '{"eventName": ["REMOVE"], "dynamodb": {"Keys": {"pk": {"S": [{"prefix": "semaphore#"}]}, "sk": {"S": [{"prefix": "holder#"}]}}}}'

    ############################################################################
    # Stream → notify, and stream → drain. TWO mappings on ONE stream (the TOKEN
    # table's — distinct from the quota stream above), landing on TWO TIERS that
    # differ only in memory and in their STREAM_HANDLER marker.
    #
    # They used to be separated by IAM as well (§6.3): the notifier held
    # states:SendTask* and no Bedrock, the drain the reverse. After the 2026-08-12
    # collapse to one role, the MARKER is the only thing that separates them —
    # which is why the two FilterCriteria below and the marker on each tier now
    # carry the whole weight. Swapping the two FunctionName values here would
    # deploy cleanly and produce a queue that never notifies.
    #
    # The FilterCriteria differ, and each is a correctness requirement:
    #
    #   notify  INSERT/MODIFY only. A REMOVE is the drain's news, not the
    #           notifier's — by the time a row is deleted its token was already
    #           redeemed, and re-sending on a REMOVE would try to complete an
    #           execution that has moved on.
    #   drain   REMOVE (notified, or TTL-expired) and MODIFY (a status change that
    #           freed a slot). An INSERT is a row that was just SUBMITTING; draining
    #           on it would submit against a limit nothing said had room.
    #
    # BisectBatchOnFunctionError keeps one poison record from blocking a shard;
    # MaximumRetryAttempts bounds it. Both are safe because the notifier is
    # idempotent per transition (it compares OldImage.status) and the drain is a
    # query-then-submit that finds nothing the second time.
    ############################################################################

    NotifyStreamMapping:
        Type: AWS::Lambda::EventSourceMapping
        Properties:
            EventSourceArn: !GetAtt BatchInferTokensTable.StreamArn
            FunctionName: !GetAtt BedrockInferenceLambdaHalfCore.Arn
            StartingPosition: TRIM_HORIZON
            BatchSize: 10
            BisectBatchOnFunctionError: true
            MaximumRetryAttempts: 3
            FilterCriteria:
                Filters:
                    - Pattern: '{"eventName": ["INSERT", "MODIFY"], "dynamodb": {"NewImage": {"pk": {"S": [{"prefix": "batch#"}]}, "status": {"S": ["COMPLETED", "FAILED"]}}}}'

    DrainStreamMapping:
        Type: AWS::Lambda::EventSourceMapping
        Properties:
            EventSourceArn: !GetAtt BatchInferTokensTable.StreamArn
            FunctionName: !GetAtt BedrockInferenceLambda1Core.Arn
            StartingPosition: TRIM_HORIZON
            BatchSize: 10
            BisectBatchOnFunctionError: true
            MaximumRetryAttempts: 3
            FilterCriteria:
                Filters:
                    - Pattern: '{"eventName": ["REMOVE"], "dynamodb": {"Keys": {"pk": {"S": [{"prefix": "batch#"}]}}}}'
                    - Pattern: '{"eventName": ["MODIFY"], "dynamodb": {"NewImage": {"pk": {"S": [{"prefix": "batch#"}]}, "status": {"S": ["COMPLETED", "FAILED"]}}}}'

    ############################################################################
    # EventBridge, aws.bedrock — TWO RULES WITH OPPOSITE SCOPING (README.md §6.5).
    #
    # This is the least obvious thing in the template, so: the token rule is scoped
    # to this deployment's own job-name prefix, and the drain rule is deliberately
    # NOT scoped at all.
    #
    # A foreign completion is legitimate news that ACCOUNT capacity freed — the
    # in-progress-job limit is per account, while this stack is not a singleton. If
    # stack A fills the account's job limit, stack B's PENDING rows would drain only
    # when one of B's OWN jobs completes; B has nothing in flight, so no event ever
    # arrives. Deadlock, bounded only by TTL.
    #
    # But a foreign completion is NEVER news about one of our tokens, so the status
    # writer must not see it. The live v5 rule
    # (deployment/media2cloud-backend-stack.yaml:2401) has no scoping filter at all
    # and fires on every Bedrock batch job in the account — while MediaConvert at
    # :2289 filters userMetadata.solutionUuid and Transcribe at :2325 filters a
    # job-name prefix. This is that gap, fixed, by splitting one rule into two.
    ############################################################################

    BatchTokenRule:
        Type: AWS::Events::Rule
        Properties:
            Name: !Sub ${ResourcePrefix}-bedrock-inference-batch-token
            Description: This deployment's OWN Bedrock batch completions — prefix-scoped, because a foreign job's completion is never news about one of our task tokens
            EventPattern:
                source: [aws.bedrock]
                region: [!Ref "AWS::Region"]
                detail-type: ["Batch Inference Job State Change"]
                detail:
                    status: [Completed, PartiallyCompleted, Failed, Stopped, Expired]
                    # The job name is the workflow_id, and the arn's last segment is
                    # the job id — so the prefix filter is on the arn's ACCOUNT
                    # segment, which is what confines this to our own account's jobs.
                    # Cross-account is the only foreignness EventBridge can filter
                    # here; a same-account second deployment is handled by the
                    # handler itself, which logs and ignores an arn with no row.
                    batchJobArn:
                        # Quoted: a plain YAML scalar may not END with a colon —
                        # unquoted, this line makes the whole template unparseable.
                        - prefix: !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:"
            State: ENABLED
            Targets:
                - Id: BedrockInferenceBatchStatus
                  Arn: !GetAtt BedrockInferenceLambdaHalfCore.Arn

    BatchTokenRulePermission:
        Type: AWS::Lambda::Permission
        Properties:
            FunctionName: !GetAtt BedrockInferenceLambdaHalfCore.Arn
            Action: lambda:InvokeFunction
            Principal: events.amazonaws.com
            SourceArn: !GetAtt BatchTokenRule.Arn

    BatchCapacityRule:
        Type: AWS::Events::Rule
        Properties:
            Name: !Sub ${ResourcePrefix}-bedrock-inference-batch-capacity
            Description: ANY Bedrock batch completion in the account, INCLUDING another stack's — deliberately unscoped. The job limit is per account while this stack is not a singleton, so a foreign completion is the only signal that capacity freed (README.md §6.5 fix 1). Do not add a prefix filter here.
            EventPattern:
                source: [aws.bedrock]
                detail-type: ["Batch Inference Job State Change"]
                detail:
                    status: [Completed, PartiallyCompleted, Failed, Stopped, Expired]
            State: ENABLED
            Targets:
                - Id: BedrockInferenceDrain
                  Arn: !GetAtt BedrockInferenceLambda1Core.Arn

    BatchCapacityRulePermission:
        Type: AWS::Lambda::Permission
        Properties:
            FunctionName: !GetAtt BedrockInferenceLambda1Core.Arn
            Action: lambda:InvokeFunction
            Principal: events.amazonaws.com
            SourceArn: !GetAtt BatchCapacityRule.Arn

    ############################################################################
    # Scheduled sweep — §6.5 fix 2, and the thing that makes the queue
    # self-healing rather than event-dependent. Backstop for TTL expiry, manual row
    # deletion, and any missed event. The payload carries no image, so the drain
    # falls back to models_with_pending().
    ############################################################################

    DrainScheduleRule:
        Type: AWS::Events::Rule
        Properties:
            Name: !Sub ${ResourcePrefix}-bedrock-inference-drain-sweep
            Description: Periodic batch-queue sweep. Without it the queue only drains on events, and the one case no event covers is the last job in flight completing while the account is still full elsewhere.
            ScheduleExpression: !FindInMap [Drain, Schedule, Expression]
            State: ENABLED
            Targets:
                - Id: BedrockInferenceDrainSweep
                  Arn: !GetAtt BedrockInferenceLambda1Core.Arn
                  Input: '{"operation": "Drain"}'

    DrainScheduleRulePermission:
        Type: AWS::Lambda::Permission
        Properties:
            FunctionName: !GetAtt BedrockInferenceLambda1Core.Arn
            Action: lambda:InvokeFunction
            Principal: events.amazonaws.com
            SourceArn: !GetAtt DrainScheduleRule.Arn

    ############################################################################
    # Step Functions — THREE machines (README.md §M1).
    #
    #   InferenceStateMachine        ${ResourcePrefix}-bedrock-inference
    #       plan → route → usage tracking. What callers start; the name and ARN are
    #       unchanged by the merge, so a consumer's own startExecution.sync:2 and its
    #       $.Output.data.records_succeeded keep working.
    #   SyncInferenceStateMachine    ${ResourcePrefix}-bedrock-inference-sync
    #       acquire lease → run inference → release lease → summarize.
    #   BatchInferenceStateMachine   ${ResourcePrefix}-bedrock-inference-batch
    #       submit batch → collect output → summarize.
    #
    # WHY THREE AND NOT ONE. Each child is independently startable given a plan,
    # which makes a stuck sync run re-runnable without re-planning and makes each
    # branch's history readable on its own instead of interleaved into one machine's.
    # The cost is one extra execution per run and the `.sync:2` grants below.
    #
    # Each child ends with its OWN Summarize rather than returning to a shared one:
    # the two call sites of lib/response.build_summary are the price of a child that
    # returns a complete summary.json + response.jsonl by itself.
    #
    # THE SYNC CHILD HAS NO `Release lease on failure` STATE. In-band release was
    # deleted with the merge; a holder left behind by a failure is reclaimed by
    # QuotaTerminalRule below (the child's own terminal event) or, failing that, by the
    # holder's TTL. In-band release only ever SHORTENED that window — it was a latency
    # optimisation, not the correctness mechanism, and removing it costs a named window
    # documented in lib/semaphore_client.py's invariant 1.
    ############################################################################

    StateMachineLogGroup:
        Type: AWS::Logs::LogGroup
        Metadata:
            cfn_nag:
                rules_to_suppress:
                    - id: W84
                      reason: CloudWatch Logs encrypts data at rest by default using an AWS-managed key
        Properties:
            LogGroupName: !Sub
                - /aws/states/${ResourcePrefix}-${name}
                - name: !FindInMap [Lambda, Function, Name]
            RetentionInDays: 7

    SyncStateMachineLogGroup:
        Type: AWS::Logs::LogGroup
        Metadata:
            cfn_nag:
                rules_to_suppress:
                    - id: W84
                      reason: CloudWatch Logs encrypts data at rest by default using an AWS-managed key
        Properties:
            LogGroupName: !Sub
                - /aws/states/${ResourcePrefix}-${name}-sync
                - name: !FindInMap [Lambda, Function, Name]
            RetentionInDays: 7

    BatchStateMachineLogGroup:
        Type: AWS::Logs::LogGroup
        Metadata:
            cfn_nag:
                rules_to_suppress:
                    - id: W84
                      reason: CloudWatch Logs encrypts data at rest by default using an AWS-managed key
        Properties:
            LogGroupName: !Sub
                - /aws/states/${ResourcePrefix}-${name}-batch
                - name: !FindInMap [Lambda, Function, Name]
            RetentionInDays: 7

    ############################################################################
    # The orchestrator's role, and the one block in this template most likely to be
    # got wrong: `states:startExecution.sync:2` needs FIVE grants, not one.
    #
    #   states:StartExecution        on each child STATE MACHINE arn
    #   states:DescribeExecution     on each child EXECUTION arn pattern
    #   states:StopExecution         on each child EXECUTION arn pattern
    #   events:PutRule / PutTargets / DescribeRule
    #                                on the MANAGED rule Step Functions creates for
    #                                itself, named
    #                                StepFunctionsGetEventsForStepFunctionsExecutionRule
    #
    # Omitting the events:* three is the classic `.sync:2` failure: the state machine
    # deploys, the child starts and succeeds, and the parent hangs until its own
    # TimeoutSeconds because the completion event has no route back. The symptom looks
    # like a slow child, not like an IAM error.
    ############################################################################
    StateMachineRole:
        Type: AWS::IAM::Role
        Metadata:
            cfn_nag:
                rules_to_suppress:
                    - id: W11
                      reason: X-Ray tracing and CloudWatch Logs delivery require wildcard resources
        Properties:
            Path: !Sub /${ResourcePrefix}/
            AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                    - Effect: Allow
                      Action: sts:AssumeRole
                      Principal:
                          Service: !Sub states.${AWS::Region}.amazonaws.com
            Policies:
                - PolicyName: !Sub ${ResourcePrefix}BedrockInferenceSFNPolicy
                  PolicyDocument:
                      Version: "2012-10-17"
                      Statement:
                          # Only the shared workflow function: the orchestrator plans
                          # and reports and does nothing else. It cannot invoke
                          # RunInference or SubmitBatch at all — those belong to the
                          # children, and the separation means an orchestrator ASL edit
                          # cannot accidentally run inference outside a lease.
                          - Effect: Allow
                            Action: lambda:InvokeFunction
                            Resource: !GetAtt BedrockInferenceLambda2Cores.Arn
                          - Effect: Allow
                            Action: states:StartExecution
                            Resource:
                                - !GetAtt SyncInferenceStateMachine.Arn
                                - !GetAtt BatchInferenceStateMachine.Arn
                          - Effect: Allow
                            Action:
                                - states:DescribeExecution
                                - states:StopExecution
                            Resource:
                                - !Sub
                                  - arn:aws:states:${AWS::Region}:${AWS::AccountId}:execution:${ResourcePrefix}-${name}-sync:*
                                  - name: !FindInMap [Lambda, Function, Name]
                                - !Sub
                                  - arn:aws:states:${AWS::Region}:${AWS::AccountId}:execution:${ResourcePrefix}-${name}-batch:*
                                  - name: !FindInMap [Lambda, Function, Name]
                          # The managed rule. Its name is fixed by Step Functions and
                          # is the same for every `.sync` integration in the account,
                          # which is why the resource is a literal rather than
                          # something derived from this stack.
                          - Effect: Allow
                            Action:
                                - events:PutRule
                                - events:PutTargets
                                - events:DescribeRule
                            Resource: !Sub arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/StepFunctionsGetEventsForStepFunctionsExecutionRule
                          - Effect: Allow
                            Action:
                                - logs:CreateLogDelivery
                                - logs:GetLogDelivery
                                - logs:UpdateLogDelivery
                                - logs:DeleteLogDelivery
                                - logs:ListLogDeliveries
                                - logs:PutLogEvents
                                - logs:PutResourcePolicy
                                - logs:DescribeResourcePolicies
                                - logs:DescribeLogGroups
                            Resource: "*"
                          - Effect: Allow
                            Action:
                                - xray:PutTraceSegments
                                - xray:PutTelemetryRecords
                                - xray:GetSamplingRules
                                - xray:GetSamplingTargets
                            Resource: "*"

    SyncStateMachineRole:
        Type: AWS::IAM::Role
        Metadata:
            cfn_nag:
                rules_to_suppress:
                    - id: W11
                      reason: X-Ray tracing and CloudWatch Logs delivery require wildcard resources
        Properties:
            Path: !Sub /${ResourcePrefix}/
            AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                    - Effect: Allow
                      Action: sts:AssumeRole
                      Principal:
                          Service: !Sub states.${AWS::Region}.amazonaws.com
            Policies:
                - PolicyName: !Sub ${ResourcePrefix}BedrockInferenceSyncSFNPolicy
                  PolicyDocument:
                      Version: "2012-10-17"
                      Statement:
                          # Two TIERS, and no states:* at all: this child starts
                          # nothing and describes nothing. 2-cores is the Acquire
                          # lease / Release lease / Summarize target
                          # (InferenceLambdaArn) and, because Acquire is a
                          # waitForTaskToken state, it is that function that redeems
                          # the token — not this role. 1-core is
                          # RunInferenceLambdaArn.
                          - Effect: Allow
                            Action: lambda:InvokeFunction
                            Resource:
                                - !GetAtt BedrockInferenceLambda2Cores.Arn
                                - !GetAtt BedrockInferenceLambda1Core.Arn
                          - Effect: Allow
                            Action:
                                - logs:CreateLogDelivery
                                - logs:GetLogDelivery
                                - logs:UpdateLogDelivery
                                - logs:DeleteLogDelivery
                                - logs:ListLogDeliveries
                                - logs:PutLogEvents
                                - logs:PutResourcePolicy
                                - logs:DescribeResourcePolicies
                                - logs:DescribeLogGroups
                            Resource: "*"
                          - Effect: Allow
                            Action:
                                - xray:PutTraceSegments
                                - xray:PutTelemetryRecords
                                - xray:GetSamplingRules
                                - xray:GetSamplingTargets
                            Resource: "*"

    BatchStateMachineRole:
        Type: AWS::IAM::Role
        Metadata:
            cfn_nag:
                rules_to_suppress:
                    - id: W11
                      reason: X-Ray tracing and CloudWatch Logs delivery require wildcard resources
        Properties:
            Path: !Sub /${ResourcePrefix}/
            AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                    - Effect: Allow
                      Action: sts:AssumeRole
                      Principal:
                          Service: !Sub states.${AWS::Region}.amazonaws.com
            Policies:
                - PolicyName: !Sub ${ResourcePrefix}BedrockInferenceBatchSFNPolicy
                  PolicyDocument:
                      Version: "2012-10-17"
                      Statement:
                          # ONE tier, because both of this machine's Lambda targets
                          # (InferenceLambdaArn and SubmitBatchLambdaArn) land on
                          # 2-cores after the collapse — listing it twice would be
                          # legal and meaningless.
                          #
                          # NOT the 1-core tier, and that is still the point of the
                          # 2026-08-12 shape: the repair tail starts the SYNC CHILD
                          # MACHINE rather than calling the inference function
                          # directly. Read that as a WORKFLOW invariant now, not an
                          # IAM one — 2-cores runs under the union role and can
                          # therefore call bedrock:InvokeModel, so what stops a
                          # Converse call outside a lease is the ASL and the
                          # dispatcher's `operation` routing, not a missing grant.
                          # Before the collapse this line was load-bearing on its
                          # own; now it is defence in depth over a code convention.
                          - Effect: Allow
                            Action: lambda:InvokeFunction
                            Resource: !GetAtt BedrockInferenceLambda2Cores.Arn
                          # The repair tail's five `.sync:2` grants — see the long
                          # comment on StateMachineRole for why events:* is three of
                          # them and what omitting it looks like (a child that
                          # succeeds while the parent hangs to its own timeout).
                          #
                          # This is the SECOND role that may StartExecution, and it
                          # narrows the old invariant rather than breaking it: "only
                          # the orchestrator may start a child" becomes "the START
                          # GRAPH IS ACYCLIC" — orchestrator → {sync, batch},
                          # batch → sync, sync → nothing. Scoped to the sync child
                          # alone: this role must never be able to start THIS machine
                          # or the orchestrator, either of which is a recursion with a
                          # real Bedrock bill.
                          - Effect: Allow
                            Action: states:StartExecution
                            Resource: !GetAtt SyncInferenceStateMachine.Arn
                          - Effect: Allow
                            Action:
                                - states:DescribeExecution
                                - states:StopExecution
                            Resource: !Sub
                                - arn:aws:states:${AWS::Region}:${AWS::AccountId}:execution:${ResourcePrefix}-${name}-sync:*
                                - name: !FindInMap [Lambda, Function, Name]
                          - Effect: Allow
                            Action:
                                - events:PutRule
                                - events:PutTargets
                                - events:DescribeRule
                            Resource: !Sub arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/StepFunctionsGetEventsForStepFunctionsExecutionRule
                          - Effect: Allow
                            Action:
                                - logs:CreateLogDelivery
                                - logs:GetLogDelivery
                                - logs:UpdateLogDelivery
                                - logs:DeleteLogDelivery
                                - logs:ListLogDeliveries
                                - logs:PutLogEvents
                                - logs:PutResourcePolicy
                                - logs:DescribeResourcePolicies
                                - logs:DescribeLogGroups
                            Resource: "*"
                          - Effect: Allow
                            Action:
                                - xray:PutTraceSegments
                                - xray:PutTelemetryRecords
                                - xray:GetSamplingRules
                                - xray:GetSamplingTargets
                            Resource: "*"

    # The children are declared BEFORE the orchestrator because the orchestrator's
    # DefinitionSubstitutions name their ARNs.
    #
    # Each machine's ASL is INLINE below — this template is the single source of truth
    # for what deploys, and there is no build-time injection step. definitions.json,
    # definitions_sync.json and definitions_batch.json are READABILITY COPIES of these
    # three blocks: lintable, diffable, and openable in a state machine editor on their
    # own. EDIT BOTH SIDES. The build refuses to proceed on a drift and
    # test_units.py's test_each_inline_definition_still_matches_its_readability_copy
    # compares them exactly, because a copy that silently diverges is worse than no
    # copy — the reviewed diff would not be what shipped.
    SyncInferenceStateMachine:
        Type: AWS::StepFunctions::StateMachine
        Properties:
            StateMachineName: !Sub
                - ${ResourcePrefix}-${name}-sync
                - name: !FindInMap [Lambda, Function, Name]
            RoleArn: !GetAtt SyncStateMachineRole.Arn
            LoggingConfiguration:
                Destinations:
                    - CloudWatchLogsLogGroup:
                          LogGroupArn: !GetAtt SyncStateMachineLogGroup.Arn
                IncludeExecutionData: true
                Level: ALL
            TracingConfiguration:
                Enabled: true
            DefinitionSubstitutions:
                InferenceLambdaArn: !GetAtt BedrockInferenceLambda2Cores.Arn
                RunInferenceLambdaArn: !GetAtt BedrockInferenceLambda1Core.Arn
            DefinitionString: |-
                {
                    "Comment": "SYNC inference child (README.md §M1). Takes a concurrency lease from this stack's own sync-infer-quotas semaphore, runs the serial Converse loop under it, releases, and summarizes. Standalone and independently startable: given a plan (the orchestrator's Validate & plan output, i.e. $.data with workflow_id / config / quota / output / keys populated) this machine needs nothing else, and it ends with its own Summarize so it returns a complete summary.json + response.jsonl. NO Catch anywhere, deliberately — see 'Acquire lease'. Input: {\"uuid\":\"<correlation>\",\"input\":{...},\"data\":{<plan>}}",
                    "StartAt": "Acquire lease",
                    "States": {
                        "Acquire lease": {
                            "Comment": "In-stack now: targets this image's own 2-cores tier, not a foreign quota stack's function (README.md §M2.4 — the workflow role therefore holds states:SendTask*, and the cost of that is recorded there). Acquired LATE by construction: all S3 reads, record parsing and planning happened in the orchestrator's Validate & plan, so queued work still makes progress while this waits. TimeoutSeconds must exceed the guarded span of everything else contending for this scope; a token that times out while queued is a dead waiter the drain has to reap.\n\nNO Catch, and that is a deliberate change from the pre-merge ASL. Every post-acquire state used to Catch to a 'Release lease on failure' state; the four holder-disappearance triggers are now (1) normal release below, (3) the terminal-state EventBridge rule, and (4) the holder's own TTL — trigger 2 is gone, matching face-recognition, whose ASL has no Catch on its semaphore states either. The window this costs is named: try_acquire can succeed and the SendTaskSuccess that follows it can fail, leaving a live holder on a token nobody will redeem. That execution now sits here for the full TimeoutSeconds before the terminal rule reclaims the slot. The in-band release only ever SHORTENED that window — the slot was unusable to the drain either way — so this is a latency regression on the rarest failure path, not a leak.",
                            "Type": "Task",
                            "Resource": "arn:aws:states:::lambda:invoke.waitForTaskToken",
                            "ResultPath": null,
                            "Parameters": {
                                "FunctionName": "${InferenceLambdaArn}",
                                "Payload": {
                                    "operation": "StateAcquireLease",
                                    "service.$": "$.data.quota.service",
                                    "resource.$": "$.data.quota.resource",
                                    "max_concurrent.$": "$.data.quota.max_concurrent",
                                    "execution_arn.$": "$$.Execution.Id",
                                    "task_token.$": "$$.Task.Token"
                                }
                            },
                            "TimeoutSeconds": 86400,
                            "Retry": [
                                {
                                    "ErrorEquals": [
                                        "Lambda.ServiceException",
                                        "Lambda.AWSLambdaException",
                                        "Lambda.SdkClientException",
                                        "Lambda.TooManyRequestsException"
                                    ],
                                    "IntervalSeconds": 1,
                                    "MaxAttempts": 2,
                                    "BackoffRate": 1.2
                                }
                            ],
                            "Next": "Run inference"
                        },
                        "Run inference": {
                            "Comment": "The serial Converse loop. ONE in-flight call per lease (§10 item 1) — parallelising inside the held span would turn a cap of 3 into 3×N with no error anywhere. Forty serial calls do not fit in one 15-minute invocation, so the loop checkpoints per record in S3 and raises LambdaResourceTimeoutException; the Retry below is what re-enters it. MaxAttempts 10 × 15 min ≈ 2.5 h of wall clock, which is why 'auto' sends large sets to batch. BackoffRate 1 because the raise is a deliberate yield, not a failure to back off from — an exponential delay would idle a held lease.\n\nNo Catch: a failure here propagates to the parent, and the holder is reclaimed by the terminal-state rule on this execution's own FAILED event.",
                            "Type": "Task",
                            "Resource": "arn:aws:states:::lambda:invoke",
                            "OutputPath": "$.Payload",
                            "Parameters": {
                                "FunctionName": "${RunInferenceLambdaArn}",
                                "Payload": {
                                    "operation": "StateRunInference",
                                    "uuid.$": "$.uuid",
                                    "input.$": "$.input",
                                    "data.$": "$.data",
                                    "execution_arn.$": "$$.Execution.Id"
                                }
                            },
                            "Retry": [
                                {
                                    "ErrorEquals": [
                                        "LambdaResourceTimeoutException"
                                    ],
                                    "IntervalSeconds": 2,
                                    "MaxAttempts": 10,
                                    "BackoffRate": 1
                                },
                                {
                                    "ErrorEquals": [
                                        "Lambda.ServiceException",
                                        "Lambda.AWSLambdaException",
                                        "Lambda.SdkClientException",
                                        "Lambda.TooManyRequestsException"
                                    ],
                                    "IntervalSeconds": 2,
                                    "MaxAttempts": 3,
                                    "BackoffRate": 1.5
                                }
                            ],
                            "Next": "Release lease"
                        },
                        "Release lease": {
                            "Comment": "Trigger 1 of the three remaining holder-disappearance paths. Deletes the holder ONLY; the counter is decremented by this stack's own stream handler on the holder's REMOVE record, which is what makes all three paths converge on one decrement and one drain. This handler never raises — a release failure is reported in $.data.lease, and the holder TTL plus the terminal-state rule are the backstops.",
                            "Type": "Task",
                            "Resource": "arn:aws:states:::lambda:invoke",
                            "OutputPath": "$.Payload",
                            "Parameters": {
                                "FunctionName": "${InferenceLambdaArn}",
                                "Payload": {
                                    "operation": "StateReleaseLease",
                                    "uuid.$": "$.uuid",
                                    "input.$": "$.input",
                                    "data.$": "$.data",
                                    "execution_arn.$": "$$.Execution.Id"
                                }
                            },
                            "Retry": [
                                {
                                    "ErrorEquals": [
                                        "Lambda.ServiceException",
                                        "Lambda.AWSLambdaException",
                                        "Lambda.SdkClientException",
                                        "Lambda.TooManyRequestsException"
                                    ],
                                    "IntervalSeconds": 2,
                                    "MaxAttempts": 3,
                                    "BackoffRate": 1.5
                                }
                            ],
                            "Next": "Summarize"
                        },
                        "Summarize": {
                            "Comment": "This child's own terminal state, and the only state that sees the whole result set — which is why the all-records-failed decision lives here (§7). Duplicated with the batch child by design (README.md §M decision 1): both call the same lib/response.build_summary, and each child returning a complete summary.json is what makes it independently startable and independently useful. Partial success IS success: 39 of 40 ends SUCCEEDED with one FAILED line and its reason in summary.failures[]. Only EVERY record failing raises BedrockInferenceFailed, and summary.json is written first so the per-record reasons survive the failure.\n\nNote this runs AFTER the lease is released: summarizing is S3 and arithmetic, and holding a Bedrock concurrency slot through it would cap throughput on work that needs no slot.",
                            "Type": "Task",
                            "Resource": "arn:aws:states:::lambda:invoke",
                            "OutputPath": "$.Payload",
                            "Parameters": {
                                "FunctionName": "${InferenceLambdaArn}",
                                "Payload": {
                                    "operation": "StateSummarize",
                                    "uuid.$": "$.uuid",
                                    "input.$": "$.input",
                                    "data.$": "$.data"
                                }
                            },
                            "Retry": [
                                {
                                    "ErrorEquals": [
                                        "Lambda.ServiceException",
                                        "Lambda.AWSLambdaException",
                                        "Lambda.SdkClientException",
                                        "Lambda.TooManyRequestsException"
                                    ],
                                    "IntervalSeconds": 2,
                                    "MaxAttempts": 3,
                                    "BackoffRate": 1.5
                                }
                            ],
                            "End": true
                        }
                    }
                }

    BatchInferenceStateMachine:
        Type: AWS::StepFunctions::StateMachine
        Properties:
            StateMachineName: !Sub
                - ${ResourcePrefix}-${name}-batch
                - name: !FindInMap [Lambda, Function, Name]
            RoleArn: !GetAtt BatchStateMachineRole.Arn
            LoggingConfiguration:
                Destinations:
                    - CloudWatchLogsLogGroup:
                          LogGroupArn: !GetAtt BatchStateMachineLogGroup.Arn
                IncludeExecutionData: true
                Level: ALL
            TracingConfiguration:
                Enabled: true
            DefinitionSubstitutions:
                InferenceLambdaArn: !GetAtt BedrockInferenceLambda2Cores.Arn
                SubmitBatchLambdaArn: !GetAtt BedrockInferenceLambda2Cores.Arn
                # The repair tail IS the sync child machine (§8) — not a second copy
                # of its lease/checkpoint/release spine, and not a direct call to the
                # inference function. Same token name the orchestrator uses for the
                # same ARN, deliberately: each machine's substitutions are balanced
                # against its OWN ASL's tokens, so two spellings of one thing would
                # pass that test and confuse every reader.
                SyncInferenceStateMachineArn: !GetAtt SyncInferenceStateMachine.Arn
            DefinitionString: |-
                {
                    "Comment": "BATCH inference child (README.md §M1). Submits one Bedrock batch job for all N records, parks on a task token until the job finishes, collects the output, and summarizes. No lease on the SUBMISSION path: the in-progress-job limit is account-level and service-enforced, so a local cap would serialize submissions Bedrock is willing to accept in parallel (§1.1). Standalone and independently startable given a plan whose $.data.batch.can_batch is true. Input: {\"uuid\":\"<correlation>\",\"input\":{...},\"data\":{<plan>}}\n\nFOUR states, and the repair tail is a NESTED CALL rather than a copied spine (README.md §P8). Repairing failed records IS sync inference — lease, chain walk, checkpoint, release — so this machine invokes the sync CHILD MACHINE for it instead of duplicating four of its states here. What that buys: run_inference and the sync ASL are untouched, there is exactly one lease/checkpoint/release spine in the stack, and 'either child is startable on its own given a plan' still holds because the repair lives here and not in the orchestrator. What it costs: the start graph gains an edge, so it is stated as an invariant — orchestrator → {sync, batch}, batch → sync, sync → nothing, ACYCLIC, and a test pins it. A machine that could reach itself is a recursion with a real Bedrock bill.\n\nThe route into the repair is a Catch on 'Collect batch output', not a Choice. collect_batch RAISES BatchRecordsIncompleteException over already-committed S3 state, and the exception is control flow rather than a fault: the caught path summarizes normally and this execution SUCCEEDS. The cost is deliberate and accepted — a partial batch renders as a red state in the console and emits a LambdaFunctionsFailed datapoint — because a run that had a problem SHOULD be legible in the execution graph months later, where a boolean on a payload has to be dug out of the history. It is also the only mechanism that can discriminate: a .sync:2 child failure reaches its parent as States.TaskFailed, never as the child's own error name, so an equivalent Catch one level up in the orchestrator could not tell a repairable batch from any other failure.",
                    "StartAt": "Submit batch",
                    "States": {
                        "Submit batch": {
                            "Comment": "One job, all N records, parked on a task token. The row is written status=SUBMITTING before CreateModelInvocationJob, so a Lambda death in between still leaves a record of the attempt (§6.2). A quota-shaped refusal returns normally with status=PENDING and the task stays parked — a drain submits it when capacity frees, which is why TimeoutSeconds is a full day rather than sized to a job's runtime. There is no Catch: no lease was taken, and NotifyFunction reports a failed job through SendTaskFailure, so the failure surfaces as itself.\n\nResultPath (not OutputPath) is what makes the repair tail possible: it MERGES the resumed token's payload under $.batch_result and leaves $.data — the plan — intact for every state after this one, including the caught path, which needs the plan to start the repair child with.",
                            "Type": "Task",
                            "Resource": "arn:aws:states:::lambda:invoke.waitForTaskToken",
                            "ResultPath": "$.batch_result",
                            "Parameters": {
                                "FunctionName": "${SubmitBatchLambdaArn}",
                                "Payload": {
                                    "operation": "StateSubmitBatch",
                                    "uuid.$": "$.uuid",
                                    "input.$": "$.input",
                                    "data.$": "$.data",
                                    "task_token.$": "$$.Task.Token"
                                }
                            },
                            "TimeoutSeconds": 86400,
                            "Retry": [
                                {
                                    "ErrorEquals": [
                                        "Lambda.ServiceException",
                                        "Lambda.AWSLambdaException",
                                        "Lambda.SdkClientException",
                                        "Lambda.TooManyRequestsException"
                                    ],
                                    "IntervalSeconds": 2,
                                    "MaxAttempts": 3,
                                    "BackoffRate": 1.5
                                }
                            ],
                            "Next": "Collect batch output"
                        },
                        "Collect batch output": {
                            "Comment": "$.batch_result is the SendTaskSuccess payload from NotifyFunction, and it carries job_arn for a reason: the notifier DELETES the row after sending, so by the time this state runs the table lookup is usually a miss. Records are mapped from the job output by record_id, never by position — Bedrock does not guarantee output order and interleaves padding records.\n\nThe Catch is the fork into the repair tail (§8). collect_batch writes response.jsonl AND seeds _progress.json with the successful lines, and only THEN raises BatchRecordsIncompleteException — write-then-raise, so the raise is a routing signal over durable state rather than a lost result. Everything this state returned on that path is discarded, which is by design and not a leak: Summarize recomputes every count from response.jsonl, and the repair's own numbers come back through the repair state's ResultSelector.\n\nThe Catch carries an EXPLICIT ResultPath because the default is '$', which would replace the whole input with the error object and leave the repair with no plan, no keys and no workflow_id. $.data.batch_incomplete merges instead, and $.data is still there to merge into because a caught error replaces the state's RESULT, not its INPUT — see Submit batch's ResultPath.\n\nThe Retry ladder names only Lambda.* integration errors, and must never name States.ALL: Step Functions evaluates Retry before Catch, so a ladder that swallowed BatchRecordsIncompleteException would re-read the whole batch output three times before the repair it exists to trigger ever fired. A Python class name can never collide with the Lambda. prefix, so the ladder is self-enforcing; a test pins it anyway.",
                            "Type": "Task",
                            "Resource": "arn:aws:states:::lambda:invoke",
                            "OutputPath": "$.Payload",
                            "Parameters": {
                                "FunctionName": "${InferenceLambdaArn}",
                                "Payload": {
                                    "operation": "StateCollectBatch",
                                    "uuid.$": "$.uuid",
                                    "input.$": "$.input",
                                    "data.$": "$.data",
                                    "batch_result.$": "$.batch_result"
                                }
                            },
                            "Retry": [
                                {
                                    "ErrorEquals": [
                                        "Lambda.ServiceException",
                                        "Lambda.AWSLambdaException",
                                        "Lambda.SdkClientException",
                                        "Lambda.TooManyRequestsException"
                                    ],
                                    "IntervalSeconds": 2,
                                    "MaxAttempts": 3,
                                    "BackoffRate": 1.5
                                }
                            ],
                            "Catch": [
                                {
                                    "ErrorEquals": [
                                        "BatchRecordsIncompleteException"
                                    ],
                                    "ResultPath": "$.data.batch_incomplete",
                                    "Next": "Run repair inference"
                                }
                            ],
                            "Next": "Summarize"
                        },
                        "Run repair inference": {
                            "Comment": "The repair pass IS the sync child machine, started with this machine's own plan (§8). run_inference resumes from the _progress.json that collect_batch seeded with the successful batch lines, so it infers exactly the gaps — through the normal chain walk, with the primary model keeping first shot, which is what restores chain-fallback semantics to batch (a single-model job has nothing to fall back to; a batch miss was transient flakiness rather than a model verdict, and even a refusal deserves the primary's second look before the chain escalates it, because refusals are not deterministic). It re-writes response.jsonl in request order over the collect pass's copy. Repaired records price at the ON-DEMAND rate, which is truthful: a run that needed repair costs visibly more than a clean batch run.\n\nNAMED {workflow_id}-repair, so it cannot collide with the -sync sibling a mode flip on the same workflow_id would create, and so the console shows which pass an execution was. It runs EXACTLY ONCE by construction: the Catch that routes here is on Collect batch output, and this state's only exits are Summarize and its own degrade-to-Summarize Catch, so there is no edge back. A record that fails the repair too stays a FAILED line.\n\nResultSelector takes two fields and no more. records_resumed is the repair child's own count of records the seeded checkpoint made it SKIP — i.e. the batch successes — and Summarize turns it into records_repaired as succeeded minus resumed, which is what the repair RECOVERED rather than what it attempted. ResultPath is a NESTED path, so it merges under $.data rather than replacing it.\n\nThe Catch on States.ALL degrades rather than fails, and the reason is a perverse incentive: with repair OFF a 95/100 batch is a SUCCEEDED execution with five FAILED lines, so a failed repair must not turn that same run into a FAILED execution — response.jsonl is already complete and correct on S3 either way. The reason lands in summary.repair_error, which is the only trace of a caught error a caller can read. Retry is transport-only for the same reason the orchestrator's branches are: States.TaskFailed would re-issue startExecution under this fixed name and return ExecutionAlreadyExists, so the caller would see a name collision instead of the real error.\n\nTimeoutSeconds matches the orchestrator's sync branch because the child is the same child: up to 24 h queued for a lease plus ~2.5 h of checkpoint/re-enter retries.",
                            "Type": "Task",
                            "Resource": "arn:aws:states:::states:startExecution.sync:2",
                            "Parameters": {
                                "StateMachineArn": "${SyncInferenceStateMachineArn}",
                                "Name.$": "States.Format('{}-repair', $.data.workflow_id)",
                                "Input": {
                                    "uuid.$": "$.uuid",
                                    "input.$": "$.input",
                                    "data.$": "$.data"
                                }
                            },
                            "ResultSelector": {
                                "execution_arn.$": "$.ExecutionArn",
                                "records_resumed.$": "$.Output.data.records_resumed"
                            },
                            "ResultPath": "$.data.repair",
                            "TimeoutSeconds": 100800,
                            "Retry": [
                                {
                                    "ErrorEquals": [
                                        "StepFunctions.SdkClientException",
                                        "StepFunctions.ThrottlingException"
                                    ],
                                    "IntervalSeconds": 2,
                                    "MaxAttempts": 2,
                                    "BackoffRate": 2
                                }
                            ],
                            "Catch": [
                                {
                                    "ErrorEquals": [
                                        "States.ALL"
                                    ],
                                    "ResultPath": "$.data.repair_error",
                                    "Next": "Summarize"
                                }
                            ],
                            "Next": "Summarize"
                        },
                        "Summarize": {
                            "Comment": "This child's own terminal state — the same handler and the same lib/response.build_summary as the sync child's Summarize (README.md §M decision 1). Two call sites for one builder rather than a shared post-join state, which is what makes each child return a complete summary.json + response.jsonl on its own. Partial success IS success: 39 of 40 ends SUCCEEDED with one FAILED line and its reason in summary.failures[]. Only EVERY record failing raises BedrockInferenceFailed, and summary.json is written first so the per-record reasons survive the failure.\n\nThe SINGLE terminal state for all three paths — clean batch, repaired batch, failed repair — and that is safe because it is a pure idempotent function of response.jsonl plus the plan. The repair child writes summary.json too, from its own Summarize; this one runs after it, over the same response.jsonl, and is the only one of the two that can see $.data.repair. Last writer wins, and both writers agree on everything but the repair fields.\n\nsummary.quota_table is empty on a clean batch run, which is the accurate answer: batch takes no lease, so no cap governed it. On a repaired run it names the table, because the repair took a lease like any sync run.",
                            "Type": "Task",
                            "Resource": "arn:aws:states:::lambda:invoke",
                            "OutputPath": "$.Payload",
                            "Parameters": {
                                "FunctionName": "${InferenceLambdaArn}",
                                "Payload": {
                                    "operation": "StateSummarize",
                                    "uuid.$": "$.uuid",
                                    "input.$": "$.input",
                                    "data.$": "$.data"
                                }
                            },
                            "Retry": [
                                {
                                    "ErrorEquals": [
                                        "Lambda.ServiceException",
                                        "Lambda.AWSLambdaException",
                                        "Lambda.SdkClientException",
                                        "Lambda.TooManyRequestsException"
                                    ],
                                    "IntervalSeconds": 2,
                                    "MaxAttempts": 3,
                                    "BackoffRate": 1.5
                                }
                            ],
                            "End": true
                        }
                    }
                }

    # ResourcePrefix is a substitution here and not only a !Sub: the orchestrator's
    # Comment names the machine callers start, and a comment that drifts from the
    # deployed name is worse than no comment.
    InferenceStateMachine:
        Type: AWS::StepFunctions::StateMachine
        Properties:
            StateMachineName: !Sub
                - ${ResourcePrefix}-${name}
                - name: !FindInMap [Lambda, Function, Name]
            RoleArn: !GetAtt StateMachineRole.Arn
            LoggingConfiguration:
                Destinations:
                    - CloudWatchLogsLogGroup:
                          LogGroupArn: !GetAtt StateMachineLogGroup.Arn
                IncludeExecutionData: true
                Level: ALL
            TracingConfiguration:
                Enabled: true
            DefinitionSubstitutions:
                InferenceLambdaArn: !GetAtt BedrockInferenceLambda2Cores.Arn
                SyncInferenceStateMachineArn: !GetAtt SyncInferenceStateMachine.Arn
                BatchInferenceStateMachineArn: !GetAtt BatchInferenceStateMachine.Arn
                ResourcePrefix: !Ref ResourcePrefix
            DefinitionString: |-
                {
                    "Comment": "bedrock-inference ORCHESTRATOR (README.md §M1). Plans the work, routes it to one of two standalone child state machines, and collects usage tracking. It runs no Bedrock call itself and holds no lease — the sync child owns the lease, the batch child owns the queue, and each child ends with its own Summarize so each returns a complete summary.json + response.jsonl and is independently startable given a plan. This is the machine callers start: its name is ${ResourcePrefix}-bedrock-inference and its ARN is the InferenceStateMachineArn output, so a consumer calling startExecution.sync:2 on it reads $.Output.data.records_succeeded exactly as before the split. Input: {\"operation\":\"StateValidateAndPlan\",\"uuid\":\"<correlation>\",\"input\":{\"request_s3uri\":\"s3://.../input_params.json\"},\"data\":{}}\n\nFOUR STATES, ONE PATH, NO Catch ANYWHERE. Failures propagate as themselves: whatever the child raised — BedrockInferenceFailed from Summarize with its per-record message, a ValidationException from the plan, a genuine States.Timeout — is what the caller receives, because nothing here intercepts it. A Fail state cannot do better; its Error and Cause must be STATIC (a States.Timeout carries no Cause, and an intrinsic over an absent path fails the state), so catching in order to re-raise could only ever replace a specific error with a generic one. Lease cleanup does not need a Catch either: the child's holder is reclaimed by QuotaTerminalRule on the child's own terminal event, which also covers ABORTED — a status no Catch can see (README.md §M1.1).",
                    "StartAt": "Validate & plan",
                    "States": {
                        "Validate & plan": {
                            "Comment": "Everything that can fail deterministically fails here, BEFORE a token is spent and before a child execution exists: the request parses, the records parse, every model in the chain is registered, and the mode is chosen and reported. Planning lives in the orchestrator rather than in each child so the two children share one plan and neither has to re-read S3 to learn what it is running. No Catch: nothing has been acquired and no child has started, so there is nothing to release and a failure here should surface as itself.",
                            "Type": "Task",
                            "Resource": "arn:aws:states:::lambda:invoke",
                            "OutputPath": "$.Payload",
                            "Parameters": {
                                "FunctionName": "${InferenceLambdaArn}",
                                "Payload": {
                                    "operation": "StateValidateAndPlan",
                                    "uuid.$": "$.uuid",
                                    "input.$": "$.input",
                                    "data.$": "$.data",
                                    "execution_arn.$": "$$.Execution.Id"
                                }
                            },
                            "Retry": [
                                {
                                    "ErrorEquals": [
                                        "Lambda.ServiceException",
                                        "Lambda.AWSLambdaException",
                                        "Lambda.SdkClientException",
                                        "Lambda.TooManyRequestsException"
                                    ],
                                    "IntervalSeconds": 1,
                                    "MaxAttempts": 2,
                                    "BackoffRate": 1.2
                                }
                            ],
                            "Next": "Choose mode"
                        },
                        "Choose mode": {
                            "Comment": "The mode was RESOLVED in Validate & plan, not here — 'auto' never reaches this state. Choice states cannot read the model registry, and the auto decision needs the primary model's batchJob.canSupport plus the record count. Resolving it in the Lambda also means the reason is reportable ($.data.mode_reason → summary.mode_reason), which matters because mode is excluded from workflow_id (§3) and the summary is the only place a caller learns which path ran.\n\nNO Default, deliberately: a mode that is neither 'sync' nor 'batch' fails the execution with States.NoChoiceMatched, which is the same outcome a Fail state here would produce and needs no state to say it. What must never happen is a Default that falls through to sync — that would run a 5000-record set through a serial lease-held loop that cannot finish inside the child's retry budget. choose_mode() returns only these two values and a test pins that, so this is unreachable either way.",
                            "Type": "Choice",
                            "Choices": [
                                {
                                    "Variable": "$.data.mode",
                                    "StringEquals": "sync",
                                    "Next": "Run sync inference"
                                },
                                {
                                    "Variable": "$.data.mode",
                                    "StringEquals": "batch",
                                    "Next": "Run batch inference"
                                }
                            ]
                        },
                        "Run sync inference": {
                            "Comment": "The sync child, called synchronously so this execution's history carries the child's outcome. The child is NAMED {workflow_id}-sync rather than workflow_id: the same records through sync and through batch are deliberately the SAME workflow_id (EXCLUDED_KEYS contains 'mode'), so an unsuffixed child name would be ambiguous between the two children and a mode flip on a retried workflow_id would collide with the sibling's history. The orchestrator execution keeps the bare workflow_id, which is what makes a resubmit hit ExecutionAlreadyExists and return the existing run rather than paying twice (§3). TimeoutSeconds exceeds the child's own worst case (up to 24 h queued for a lease plus ~2.5 h of checkpoint/re-enter retries) so the child's own bounds fire first and report themselves.",
                            "Type": "Task",
                            "Resource": "arn:aws:states:::states:startExecution.sync:2",
                            "ResultPath": "$.child",
                            "ResultSelector": {
                                "data.$": "$.Output.data",
                                "execution_arn.$": "$.ExecutionArn",
                                "status.$": "$.Status"
                            },
                            "Parameters": {
                                "StateMachineArn": "${SyncInferenceStateMachineArn}",
                                "Name.$": "States.Format('{}-sync', $.data.workflow_id)",
                                "Input": {
                                    "uuid.$": "$.uuid",
                                    "input.$": "$.input",
                                    "data.$": "$.data"
                                }
                            },
                            "TimeoutSeconds": 100800,
                            "Retry": [
                                {
                                    "Comment": "TRANSPORT failures only. States.TaskFailed is deliberately absent: it is what a genuine child failure raises, and retrying that re-issues startExecution under the SAME name, which returns StepFunctions.ExecutionAlreadyExists — so the caller would see a name collision instead of the child's real error. StepFunctions.ExecutionAlreadyExists is likewise not retried: it means this exact child already ran or is running, and a second attempt under a new name would pay for the work twice. Both propagate.",
                                    "ErrorEquals": [
                                        "StepFunctions.SdkClientException",
                                        "StepFunctions.ThrottlingException"
                                    ],
                                    "IntervalSeconds": 2,
                                    "MaxAttempts": 2,
                                    "BackoffRate": 2
                                }
                            ],
                            "Next": "Usage tracking"
                        },
                        "Run batch inference": {
                            "Comment": "The batch child. No lease on its SUBMISSION path: the Bedrock in-progress-job limit is account-level and service-enforced, so a local cap would serialize submissions Bedrock is willing to accept in parallel (§1.1). Its repair tail does take one, by starting the sync child itself (§8) — which is why TimeoutSeconds is 190800 rather than 90000: the child's own worst case is now 86400 s parked on the submit token PLUS its repair grandchild's 100800 s bound, and a parent timeout shorter than that would ABORT a running repair mid-flight instead of letting the child report its own bound. The extra hour is collect and summarize.",
                            "Type": "Task",
                            "Resource": "arn:aws:states:::states:startExecution.sync:2",
                            "ResultPath": "$.child",
                            "ResultSelector": {
                                "data.$": "$.Output.data",
                                "execution_arn.$": "$.ExecutionArn",
                                "status.$": "$.Status"
                            },
                            "Parameters": {
                                "StateMachineArn": "${BatchInferenceStateMachineArn}",
                                "Name.$": "States.Format('{}-batch', $.data.workflow_id)",
                                "Input": {
                                    "uuid.$": "$.uuid",
                                    "input.$": "$.input",
                                    "data.$": "$.data"
                                }
                            },
                            "TimeoutSeconds": 190800,
                            "Retry": [
                                {
                                    "ErrorEquals": [
                                        "StepFunctions.SdkClientException",
                                        "StepFunctions.ThrottlingException"
                                    ],
                                    "IntervalSeconds": 2,
                                    "MaxAttempts": 2,
                                    "BackoffRate": 2
                                }
                            ],
                            "Next": "Usage tracking"
                        },
                        "Usage tracking": {
                            "Comment": "Rolls up Lambda cost across the whole execution TREE — this one, the child it started, and anything that child started in turn. Reading only the orchestrator would report near-zero: its own history is one child span and two short Lambda calls, while every Converse retry and every checkpoint re-entry lives in the child. Child spans are tagged and NOT billed as Lambda time, which is the whole reason this module uses face-recognition's kind-tagged model rather than the seven-stack state-span model (README.md §M4). $.child.data is the child's Summarize output, so this state's return carries records_succeeded / records_failed / keys.response unchanged and a caller's ResultSelector on $.Output.data keeps working across the split.\n\nNo child_execution_arn parameter, deliberately. A repaired batch run is a TREE — orchestrator → batch child → sync repair grandchild — and a scalar could name only one of the two, while the grandchild is where the repair's Converse calls and lease wait are billed. The handler discovers descendants instead, from the ExecutionArn each .sync:2 TaskSubmitted event carries, and recurses; the one edge the scalar covered is the first thing that discovery finds.\n\nSUCCESS PATH ONLY — there is no failure-path twin. A failed run's Lambda time is worth well under a cent (every function here is 1024-2048 MB) and it is an ESTIMATE from history timestamps, not billing data; the money that actually matters is Bedrock tokens, and those are already on S3 per record in _progress.json before any failure, priced, because run_inference checkpoints a full response line per record. Nobody bills a customer for a failed run or capacity-plans off failures, so the state that used to record this bought a sub-cent estimate at the price of laundering every distinct child error into one static Fail. The handler still never raises, for a different reason now: this is the terminal state, and a reporting exception here would fail an execution whose response.jsonl and summary.json are already written.",
                            "Type": "Task",
                            "Resource": "arn:aws:states:::lambda:invoke",
                            "OutputPath": "$.Payload",
                            "Parameters": {
                                "FunctionName": "${InferenceLambdaArn}",
                                "Payload": {
                                    "operation": "StateUsageTracking",
                                    "uuid.$": "$.uuid",
                                    "input.$": "$.input",
                                    "data.$": "$.child.data",
                                    "execution_arn.$": "$$.Execution.Id"
                                }
                            },
                            "Retry": [
                                {
                                    "ErrorEquals": [
                                        "Lambda.ServiceException",
                                        "Lambda.AWSLambdaException",
                                        "Lambda.SdkClientException",
                                        "Lambda.TooManyRequestsException"
                                    ],
                                    "IntervalSeconds": 2,
                                    "MaxAttempts": 3,
                                    "BackoffRate": 1.5
                                }
                            ],
                            "End": true
                        }
                    }
                }

    ############################################################################
    # The terminal-state rule — trigger 3 of the THREE holder-disappearance paths
    # (README.md §M3.4), and the one that matters most now that the sync child's
    # in-band `Release lease on failure` state is gone.
    #
    # The three paths, all of which DELETE a holder and converge on the stream's one
    # decrement:
    #   1. the sync child's own `Release lease` state, on the success path
    #   2. this rule, on any terminal status of any of the three machines
    #   3. the holder's TTL, up to an hour
    #
    # Path 2 is what reclaims a slot after a mid-lease failure, a StopExecution, or
    # an orchestrator timeout. Without it a killed execution would hold its lease
    # until TTL expiry with nothing anywhere reporting it.
    #
    # ALL THREE MACHINES are listed, though only the sync child ever holds a lease.
    # The orchestrator and the batch child are no-ops (list_leases returns [] and the
    # handler returns released: 0), and they are here so that an ABORTED orchestrator
    # whose child outlives it, or a future lease on the batch path, cannot become a
    # silent leak. The alternative — enumerating only the sync child — is correct today
    # and quietly wrong after the next ASL change.
    #
    # SUCCEEDED is in the list and is not redundant with path 1: it covers a Lambda
    # that released and crashed before returning, and an ASL that never reached its
    # release state at all. That the handler is idempotent is what lets one target
    # serve all four statuses with no branching.
    ############################################################################

    QuotaTerminalRule:
        Type: AWS::Events::Rule
        Properties:
            Name: !Sub ${ResourcePrefix}-bedrock-inference-quota-terminal
            Description: Release any concurrency lease still held by a terminated execution of any of this stack's three state machines
            EventPattern:
                source: [aws.states]
                detail-type: ["Step Functions Execution Status Change"]
                detail:
                    status: [SUCCEEDED, FAILED, ABORTED, TIMED_OUT]
                    # Scoped to THIS stack's machines. Unscoped, the rule would invoke
                    # the handler on every execution in the account — correct, because
                    # list_leases() returns [] for all of them, but expensive for
                    # nothing.
                    stateMachineArn:
                        - !GetAtt InferenceStateMachine.Arn
                        - !GetAtt SyncInferenceStateMachine.Arn
                        - !GetAtt BatchInferenceStateMachine.Arn
            State: ENABLED
            Targets:
                # The 2-cores tier, routed by event shape: the router sends any
                # source=aws.states event to states/handle_execution_terminal. That
                # handler DELETES and only deletes — the stream owns the decrement
                # (semaphore invariant 1), which is what makes an aborted execution wake
                # a waiter exactly as a clean release does.
                - Id: BedrockInferenceTerminalCleanup
                  Arn: !GetAtt BedrockInferenceLambda2Cores.Arn

    QuotaTerminalRulePermission:
        Type: AWS::Lambda::Permission
        Properties:
            FunctionName: !GetAtt BedrockInferenceLambda2Cores.Arn
            Action: lambda:InvokeFunction
            Principal: events.amazonaws.com
            SourceArn: !GetAtt QuotaTerminalRule.Arn

    ############################################################################
    # AgentCore Gateway tool
    #
    # Unlike the other gateway tools in the repo, this dispatcher WRITES the request
    # objects rather than passing an s3uri through: the output prefix is
    # micro-workflow/{target}/{workflow_id}, so the hash has to exist before the
    # objects can be written. It imports lib/identity.py rather than reimplementing
    # the rule, and StateValidateAndPlan recomputes the same hash from the same
    # material — two copies would be a hash that silently disagrees, and the symptom
    # is a resubmit that re-pays for work already done (README.md §3).
    ############################################################################

    GatewayToolLambda:
        Type: AWS::Lambda::Function
        Metadata:
            cfn_nag:
                rules_to_suppress:
                    - id: W89
                      reason: Not using VPC
                    - id: W92
                      reason: Single-purpose dispatcher; reserved concurrency unnecessary
        Properties:
            FunctionName: !Sub
                - ${ResourcePrefix}-${name}-${tool}
                - name: !FindInMap [Lambda, Function, Name]
                  tool: !FindInMap [Lambda, GatewayTool, Name]
            Description: !Sub
                - (${ResourcePrefix}) ${desc}
                - desc: !FindInMap [Lambda, GatewayTool, Description]
            Runtime: python3.13
            Architectures: [arm64]
            Handler: lambda_function.lambda_handler
            Role: !GetAtt GatewayToolRole.Arn
            MemorySize: !FindInMap [Lambda, GatewayTool, Memory]
            Timeout: !FindInMap [Lambda, GatewayTool, Timeout]
            Code:
                S3Bucket: !FindInMap [CodeBuild, Source, Bucket]
                S3Key: !Sub
                    - ${keyPrefix}/${pkg}
                    - keyPrefix: !FindInMap [CodeBuild, Source, KeyPrefix]
                      pkg: !FindInMap [CodeBuild, Source, GatewayToolPackage]
            Environment:
                Variables:
                    INFERENCE_STATE_MACHINE_ARN: !GetAtt InferenceStateMachine.Arn
                    PROXY_BUCKET: !Ref ProxyBucket
                    MODEL_REGISTRY_KEY: !FindInMap [ModelRegistry, Object, Key]
                    CALLBACK_TABLE: !Ref CallbackTokensTable
                    # Must equal the GatewayTarget Name in
                    # media-toolkit-gateway/cfnstack.yaml — it is the {target} segment of
                    # the derived output prefix, so a mismatch relocates every
                    # request object and breaks idempotent resubmit.
                    TARGET_NAME: "bedrock-inference"
                    # Inside workflow_id: a version bump re-runs everything, because
                    # a change to the shaping in lib/bedrock.py produces different
                    # calls for the same request and returning the old result would
                    # attribute it to the new code.
                    TOOL_VERSION: "%%VERSION%%"
            TracingConfig:
                Mode: Active

    GatewayToolPermission:
        Type: AWS::Lambda::Permission
        Properties:
            FunctionName: !GetAtt GatewayToolLambda.Arn
            Action: lambda:InvokeFunction
            Principal: bedrock-agentcore.amazonaws.com
            SourceAccount: !Ref AWS::AccountId

    ############################################################################
    # Callback waker (README.md §11) — the service-side half of
    # callback_task_token. ONE rule on the ORCHESTRATOR machine's native
    # status-change events (the same mechanism `.sync` uses internally) wakes
    # every consumer registered in CallbackTokensTable. The consumer-side
    # alternative — a table + rule + waker per consumer stack — multiplies by
    # N workflows and fans every completion out to N rules for N-1 misses;
    # notification is a SERVICE concern, owned here once.
    #
    # Orchestrator ONLY, unlike QuotaTerminalRule's three machines: consumers
    # hold orchestrator execution ARNs (job_id), and the children's terminal
    # events would be pure Query misses.
    ############################################################################

    CallbackWakerLogGroup:
        Type: AWS::Logs::LogGroup
        Metadata:
            cfn_nag:
                rules_to_suppress:
                    - id: W84
                      reason: CloudWatch Logs encrypts data at rest by default using an AWS-managed key
        Properties:
            LogGroupName: !Sub
                - /aws/lambda/${ResourcePrefix}-${name}-${tool}
                - name: !FindInMap [Lambda, Function, Name]
                  tool: !FindInMap [CustomResource, CallbackWaker, Name]
            RetentionInDays: 7

    CallbackWakerRole:
        Type: AWS::IAM::Role
        Metadata:
            cfn_nag:
                rules_to_suppress:
                    - id: W11
                      reason: states:SendTask* is scoped to this account+region's state machines — the token's machine is the caller's and unknowable at deploy time. This role can only redeem tokens it reads from the callback table, which only the gateway role writes.
        Properties:
            Path: !Sub /${ResourcePrefix}/
            AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                    - Effect: Allow
                      Principal:
                          Service: lambda.amazonaws.com
                      Action: sts:AssumeRole
            Policies:
                - PolicyName: !Sub ${ResourcePrefix}BedrockInferenceCallbackWakerPolicy
                  PolicyDocument:
                      Version: "2012-10-17"
                      Statement:
                          - Effect: Allow
                            Action:
                                - logs:CreateLogGroup
                                - logs:CreateLogStream
                                - logs:PutLogEvents
                            Resource: !GetAtt CallbackWakerLogGroup.Arn
                          - Effect: Allow
                            Action:
                                - dynamodb:Query
                                - dynamodb:DeleteItem
                            Resource: !GetAtt CallbackTokensTable.Arn
                          # Scoped to this account+region's machines
                          # (corrected 2026-10-09 — see the gateway role's
                          # W11); the token is the capability, the table is
                          # the gate.
                          - Effect: Allow
                            Action: states:SendTaskSuccess
                            # any machine in THIS account+region — the token's machine is the
                            # caller's (ours or a customer's own), never known at deploy time
                            Resource: !Sub arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:*

    CallbackWakerLambda:
        Type: AWS::Lambda::Function
        Metadata:
            cfn_nag:
                rules_to_suppress:
                    - id: W89
                      reason: Not using VPC
                    - id: W92
                      reason: Invoked once per terminal execution event; reserved concurrency unnecessary
        Properties:
            FunctionName: !Sub
                - ${ResourcePrefix}-${name}-${tool}
                - name: !FindInMap [Lambda, Function, Name]
                  tool: !FindInMap [CustomResource, CallbackWaker, Name]
            Description: !Sub
                - (${ResourcePrefix}) ${desc}
                - desc: !FindInMap [CustomResource, CallbackWaker, Description]
            Runtime: python3.13
            Architectures: [arm64]
            Handler: callback_waker.lambda_handler
            Role: !GetAtt CallbackWakerRole.Arn
            MemorySize: !FindInMap [CustomResource, CallbackWaker, Memory]
            Timeout: !FindInMap [CustomResource, CallbackWaker, Timeout]
            Code:
                S3Bucket: !FindInMap [CodeBuild, Source, Bucket]
                S3Key: !Sub
                    - ${keyPrefix}/${pkg}
                    - keyPrefix: !FindInMap [CodeBuild, Source, KeyPrefix]
                      pkg: !FindInMap [CodeBuild, Source, GatewayToolPackage]
            Environment:
                Variables:
                    CALLBACK_TABLE: !Ref CallbackTokensTable

    CallbackCompletionRule:
        Type: AWS::Events::Rule
        Properties:
            Name: !Sub ${ResourcePrefix}-bedrock-inference-callback-completion
            Description: Complete consumer callback task tokens when an orchestrator execution reaches a terminal state
            EventPattern:
                source: [aws.states]
                detail-type: ["Step Functions Execution Status Change"]
                detail:
                    status: [SUCCEEDED, FAILED, ABORTED, TIMED_OUT]
                    stateMachineArn:
                        - !GetAtt InferenceStateMachine.Arn
            State: ENABLED
            Targets:
                - Id: BedrockInferenceCallbackWaker
                  Arn: !GetAtt CallbackWakerLambda.Arn

    CallbackCompletionRulePermission:
        Type: AWS::Lambda::Permission
        Properties:
            FunctionName: !GetAtt CallbackWakerLambda.Arn
            Action: lambda:InvokeFunction
            Principal: events.amazonaws.com
            SourceArn: !GetAtt CallbackCompletionRule.Arn

Outputs:
    InferenceStateMachineArn:
        Description: ARN of the ORCHESTRATOR state machine — the one consumers start, with an execution named workflow_id; ExecutionAlreadyExists is success. The two children are started by this machine and never by a consumer.
        Value: !GetAtt InferenceStateMachine.Arn
    InferenceStateMachineName:
        Description: Name of the orchestrator state machine. The children are this name plus -sync / -batch.
        Value: !GetAtt InferenceStateMachine.Name
    GatewayToolLambdaArn:
        Description: ARN of the gateway tool Lambda — pass to media-toolkit-gateway as BedrockInferenceToolLambdaArn
        Value: !GetAtt GatewayToolLambda.Arn
    SyncInferQuotasTableName:
        Description: Name of the concurrency semaphore table. Diagnostic only — no other stack reads it. NOTE the cap is per ResourcePrefix, not per region, so two deployments with different prefixes hold two independent caps against one real Bedrock quota (see the template header).
        Value: !Ref SyncInferQuotasTable
    BatchInferTokensTableName:
        Description: Name of the batch queue / task token table. Diagnostic only — no other stack reads it. Separate from the semaphore table because the two have disjoint access patterns and disjoint roles.
        Value: !Ref BatchInferTokensTable
    CallbackTokensTableName:
        Description: Name of the consumer callback-token table (README.md §11). Diagnostic only — consumers never touch it; they pass callback_task_token to run_inference and the gateway/waker do the rest.
        Value: !Ref CallbackTokensTable
    BedrockBatchServiceRoleArn:
        Description: Role Bedrock assumes to read batch input and write batch output. Scoped to the micro-workflow/ prefix of the proxy bucket.
        Value: !GetAtt BedrockBatchServiceRole.Arn
