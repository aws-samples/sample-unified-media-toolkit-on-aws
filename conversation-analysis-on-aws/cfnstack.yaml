AWSTemplateFormatVersion: "2010-09-09"
# ============================================================================
# conversation-analysis-on-aws — the first llm-prompt-driven micro-workflow
# (README.md; the prompt-registry + bedrock-inference pair's validation
# exercise). Transcript in, merged coverage-validated topic segments out.
#
# TWO Lambdas out of ONE flat zip (the gateway dispatcher and the
# operation-routed workflow handler) and ONE state machine whose only wait
# is a single waitForTaskToken submit to bedrock-inference — completion is
# PUSH (bedrock's callback_task_token feature), no polling anywhere, and
# the machine never starts the sibling's state machine directly (README.md
# §8: the gateway Lambda is the submit brain; raw StartExecution would copy
# identity/staging logic and cannot absorb closed runs).
#
# CONSUMER WIRING (the same shape the bundle uses later): the two sibling
# gateway-Lambda ARNs arrive as parameters — explicit parameters, never
# Fn::ImportValue.
# ============================================================================
Description: >
    conversation-analysis micro-workflow: speech-diarization transcript in,
    merged coverage-validated topic segments out; chunks on natural
    boundaries, renders the registry conversation-analysis prompt, submits
    to bedrock-inference with push-based completion.

Metadata:
    AWS::CloudFormation::Interface:
        ParameterGroups:
            -
                Label:
                    default: Resource Naming
                Parameters:
                    - ResourcePrefix
            -
                Label:
                    default: S3 Bucket
                Parameters:
                    - ProxyBucket
            -
                Label:
                    default: Sibling Services (gateway-tool Lambda ARNs)
                Parameters:
                    - BedrockInferenceGatewayLambdaArn
                    - PromptRegistryGatewayLambdaArn
        ParameterLabels:
            ResourcePrefix:
                default: Resource Name Prefix
            ProxyBucket:
                default: Proxy Bucket (transcripts in, outputs out)
            BedrockInferenceGatewayLambdaArn:
                default: bedrock-inference GatewayToolLambdaArn output
            PromptRegistryGatewayLambdaArn:
                default: prompt-registry GatewayToolLambdaArn output

Parameters:
    ResourcePrefix:
        Type: String
        Description: Prefix applied to all resource names.
        AllowedPattern: "[a-z0-9][a-z0-9-]*"
    ProxyBucket:
        Type: String
        Description: S3 proxy bucket — transcripts are read from micro-workflow/* and outputs land under micro-workflow/conversation-analysis/. No default on purpose.
    BedrockInferenceGatewayLambdaArn:
        Type: String
        Description: The bedrock-inference stack's GatewayToolLambdaArn output. Invoked directly (README.md §8) for run_inference (with callback_task_token) and get_model; must be a deployment whose run_inference supports callback_task_token (alpha.20260817b+).
        AllowedPattern: "arn:aws[a-z-]*:lambda:.*"
    PromptRegistryGatewayLambdaArn:
        Type: String
        Description: The prompt-registry stack's GatewayToolLambdaArn output. Invoked directly for get_prompt; the workflow binds the conversation-analysis category's `default` version.
        AllowedPattern: "arn:aws[a-z-]*:lambda:.*"

Mappings:
    Solution:
        Package:
            GatewayTool: "%%PKG_GATEWAY_TOOL%%"
            Workflow: "%%PKG_WORKFLOW%%"
        Source:
            Bucket: "%%BUCKET_NAME%%"
            KeyPrefix: "%%KEY_PREFIX%%"
    Lambda:
        GatewayTool:
            Name: gateway-tool
            Memory: 512
            Timeout: 60
        Workflow:
            Name: workflow
            Memory: 1024
            Timeout: 300

Resources:
    ############################################################################
    # Gateway tool — analyze_conversation / get_job_status / describe_tool
    ############################################################################
    GatewayToolLogGroup:
        Type: AWS::Logs::LogGroup
        Properties:
            # -log suffix + LoggingConfig, never /aws/lambda/{name}: the
            # canonical group may exist as an orphan from an earlier deploy,
            # and CFN cannot adopt a group (micro-workflow-bundle/README.md §C8).
            LogGroupName: !Sub
                - ${ResourcePrefix}-conversation-analysis-${tool}-log
                - tool: !FindInMap [Lambda, GatewayTool, Name]
            RetentionInDays: 30

    GatewayToolRole:
        Type: AWS::IAM::Role
        Properties:
            AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                    - Effect: Allow
                      Principal:
                          Service: lambda.amazonaws.com
                      Action: sts:AssumeRole
            Policies:
                - PolicyName: !Sub ${ResourcePrefix}ConversationAnalysisGatewayToolPolicy
                  PolicyDocument:
                      Version: "2012-10-17"
                      Statement:
                          # Scoped logs, no AWSLambdaBasicExecutionRole (the
                          # managed policy lets a function that cannot reach
                          # its declared group silently create an unmanaged
                          # one).
                          - Effect: Allow
                            Action:
                                - logs:CreateLogStream
                                - logs:PutLogEvents
                            Resource: !GetAtt GatewayToolLogGroup.Arn
                          - Effect: Allow
                            Action: states:StartExecution
                            Resource: !Ref ConversationAnalysisStateMachine
                          # DescribeExecution / GetExecutionHistory take
                          # execution ARNs, not the machine ARN.
                          - Effect: Allow
                            Action:
                                - states:DescribeExecution
                                - states:GetExecutionHistory
                            Resource: !Sub
                                - arn:aws:states:${AWS::Region}:${AWS::AccountId}:execution:${smName}:*
                                - smName: !GetAtt ConversationAnalysisStateMachine.Name
                          # get_job_status lifts small header fields from the
                          # finished analysis.
                          - Effect: Allow
                            Action: s3:GetObject
                            Resource: !Sub arn:aws:s3:::${ProxyBucket}/micro-workflow/conversation-analysis/*
                          # Without ListBucket, GetObject on a MISSING key
                          # answers 403 AccessDenied instead of 404 NoSuchKey
                          # (measured live on prompt-registry, 2026-08-15).
                          - Effect: Allow
                            Action: s3:ListBucket
                            Resource: !Sub arn:aws:s3:::${ProxyBucket}
                            Condition:
                                StringLike:
                                    s3:prefix: micro-workflow/*

    GatewayToolLambda:
        Type: AWS::Lambda::Function
        Metadata:
            cfn_nag:
                rules_to_suppress:
                    - id: W89
                      reason: Not using VPC
                    - id: W92
                      reason: Single-purpose dispatcher; reserved concurrency unnecessary
        Properties:
            # Unnamed on purpose: reached through LoggingConfig, renames stay
            # one-update operations.
            Description: !Sub ${ResourcePrefix}-conversation-analysis gateway tool (analyze_conversation / get_job_status / describe_tool)
            Runtime: python3.13
            Architectures:
                - arm64
            Handler: lambda_function.lambda_handler
            Role: !GetAtt GatewayToolRole.Arn
            Code:
                S3Bucket: !FindInMap [Solution, Source, Bucket]
                S3Key: !Sub
                    - ${keyPrefix}/${pkg}
                    - keyPrefix: !FindInMap [Solution, Source, KeyPrefix]
                      pkg: !FindInMap [Solution, Package, GatewayTool]
            MemorySize: !FindInMap [Lambda, GatewayTool, Memory]
            Timeout: !FindInMap [Lambda, GatewayTool, Timeout]
            LoggingConfig:
                LogGroup: !Ref GatewayToolLogGroup
            Environment:
                Variables:
                    PROXY_BUCKET: !Ref ProxyBucket
                    STATE_MACHINE_ARN: !Ref ConversationAnalysisStateMachine
                    TOOL_VERSION: "%%VERSION%%"
                    # Must equal the GatewayTarget Name in media-toolkit-gateway.
                    TARGET_NAME: conversation-analysis

    ############################################################################
    # Workflow Lambda — one zip, operation-routed (states/router.py)
    ############################################################################
    WorkflowLogGroup:
        Type: AWS::Logs::LogGroup
        Properties:
            LogGroupName: !Sub
                - ${ResourcePrefix}-conversation-analysis-${tool}-log
                - tool: !FindInMap [Lambda, Workflow, Name]
            RetentionInDays: 30

    WorkflowRole:
        Type: AWS::IAM::Role
        Properties:
            AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                    - Effect: Allow
                      Principal:
                          Service: lambda.amazonaws.com
                      Action: sts:AssumeRole
            Policies:
                - PolicyName: !Sub ${ResourcePrefix}ConversationAnalysisWorkflowPolicy
                  PolicyDocument:
                      Version: "2012-10-17"
                      Statement:
                          - Effect: Allow
                            Action:
                                - logs:CreateLogStream
                                - logs:PutLogEvents
                            Resource: !GetAtt WorkflowLogGroup.Arn
                          # Reads transcripts (any micro-workflow/ output,
                          # speech-diarization first) and the bedrock runs
                          # response/summary/usage documents.
                          - Effect: Allow
                            Action: s3:GetObject
                            Resource: !Sub arn:aws:s3:::${ProxyBucket}/micro-workflow/*
                          # Writes ONLY its own run prefix and the caller-side
                          # inference history pointers (README.md §7b).
                          - Effect: Allow
                            Action: s3:PutObject
                            Resource:
                                - !Sub arn:aws:s3:::${ProxyBucket}/micro-workflow/conversation-analysis/*
                                - !Sub arn:aws:s3:::${ProxyBucket}/micro-workflow/histories/*
                          - Effect: Allow
                            Action: s3:ListBucket
                            Resource: !Sub arn:aws:s3:::${ProxyBucket}
                            Condition:
                                StringLike:
                                    s3:prefix: micro-workflow/*
                          # The 8 pattern: sibling gateway Lambdas invoked
                          # directly — run_inference/get_model on bedrock,
                          # get_prompt on the registry. Never their state
                          # machines.
                          - Effect: Allow
                            Action: lambda:InvokeFunction
                            Resource:
                                - !Ref BedrockInferenceGatewayLambdaArn
                                - !Ref PromptRegistryGatewayLambdaArn

    WorkflowLambda:
        Type: AWS::Lambda::Function
        Metadata:
            cfn_nag:
                rules_to_suppress:
                    - id: W89
                      reason: Not using VPC
                    - id: W92
                      reason: Serial workflow states; reserved concurrency unnecessary
        Properties:
            Description: !Sub ${ResourcePrefix}-conversation-analysis workflow states (operation-routed)
            Runtime: python3.13
            Architectures:
                - arm64
            Handler: lambda_function.lambda_handler
            Role: !GetAtt WorkflowRole.Arn
            Code:
                S3Bucket: !FindInMap [Solution, Source, Bucket]
                S3Key: !Sub
                    - ${keyPrefix}/${pkg}
                    - keyPrefix: !FindInMap [Solution, Source, KeyPrefix]
                      pkg: !FindInMap [Solution, Package, Workflow]
            MemorySize: !FindInMap [Lambda, Workflow, Memory]
            Timeout: !FindInMap [Lambda, Workflow, Timeout]
            LoggingConfig:
                LogGroup: !Ref WorkflowLogGroup
            Environment:
                Variables:
                    PROXY_BUCKET: !Ref ProxyBucket
                    TARGET_NAME: conversation-analysis
                    TOOL_VERSION: "%%VERSION%%"
                    BEDROCK_GATEWAY_ARN: !Ref BedrockInferenceGatewayLambdaArn
                    PROMPT_REGISTRY_ARN: !Ref PromptRegistryGatewayLambdaArn
                    # 5 chunking config: env-tunable per deployment, never
                    # per request (a per-request knob would enter the
                    # workflow_id preimage).
                    CHUNK_BUDGET_TOKENS: "15000"

    ############################################################################
    # State machine
    ############################################################################
    StateMachineRole:
        Type: AWS::IAM::Role
        Properties:
            AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                    - Effect: Allow
                      Principal:
                          Service: states.amazonaws.com
                      Action: sts:AssumeRole
            Policies:
                - PolicyName: !Sub ${ResourcePrefix}ConversationAnalysisStateMachinePolicy
                  PolicyDocument:
                      Version: "2012-10-17"
                      Statement:
                          - Effect: Allow
                            Action: lambda:InvokeFunction
                            Resource: !GetAtt WorkflowLambda.Arn

    ConversationAnalysisStateMachine:
        Type: AWS::StepFunctions::StateMachine
        Properties:
            StateMachineName: !Sub ${ResourcePrefix}-conversation-analysis
            RoleArn: !GetAtt StateMachineRole.Arn
            DefinitionSubstitutions:
                WorkflowLambdaArn: !GetAtt WorkflowLambda.Arn
            # Inline is the single source of truth for what deploys;
            # definitions.json is the readability copy — edit BOTH, the
            # build script fails on drift.
            DefinitionString: |-
                {
                  "Comment": "conversation-analysis: transcript -> chunk -> render -> ONE waitForTaskToken submit to bedrock-inference (README.md §8, no polling) -> validate coverage -> merge. FIVE linear states, deliberately (2026-08-18): no in-machine coverage retry (bedrock owns transport retries; a caller rerun with a fresh idempotency_token is the semantic retry), no deadman Catch (a timed-out wait FAILS, and a REDRIVE of the submit state absorbs into the finished run and is woken synchronously - redrive IS the reconcile). Readability copy of the template's inline DefinitionString; edit BOTH, the build fails on drift.",
                  "StartAt": "Validate and plan",
                  "TimeoutSeconds": 108000,
                  "States": {
                    "Validate and plan": {
                      "Type": "Task",
                      "Comment": "Everything that can refuse refuses HERE, before any inference dollar: transcript fetch+normalize (§7a), get_prompt (binds `default`, §1), model-chain validation against bedrock's registry (§7c), the §5 chunk plan, the §7b history scope. Persists _plan/plan.json; states pass URIs, never bodies (256 KB state I/O).",
                      "Resource": "arn:aws:states:::lambda:invoke",
                      "Parameters": {
                        "FunctionName": "${WorkflowLambdaArn}",
                        "Payload": {
                          "operation": "ValidateAndPlan",
                          "uuid.$": "$.uuid",
                          "input.$": "$.input"
                        }
                      },
                      "OutputPath": "$.Payload",
                      "Retry": [
                        {
                          "ErrorEquals": [
                            "Lambda.ServiceException",
                            "Lambda.AWSLambdaException",
                            "Lambda.SdkClientException",
                            "Lambda.TooManyRequestsException"
                          ],
                          "IntervalSeconds": 3,
                          "MaxAttempts": 4,
                          "BackoffRate": 2.0
                        }
                      ],
                      "Next": "Render and stage"
                    },
                    "Render and stage": {
                      "Type": "Task",
                      "Comment": "Per chunk: self-describing WebVTT envelope (§2) rendered through the copied prompt_render module, staged as records.jsonl under this run's prefix (§8: always staged, never inline).",
                      "Resource": "arn:aws:states:::lambda:invoke",
                      "Parameters": {
                        "FunctionName": "${WorkflowLambdaArn}",
                        "Payload": {
                          "operation": "RenderAndStage",
                          "uuid.$": "$.uuid",
                          "plan_s3uri.$": "$.plan_s3uri"
                        }
                      },
                      "OutputPath": "$.Payload",
                      "Retry": [
                        {
                          "ErrorEquals": [
                            "Lambda.ServiceException",
                            "Lambda.AWSLambdaException",
                            "Lambda.SdkClientException",
                            "Lambda.TooManyRequestsException"
                          ],
                          "IntervalSeconds": 3,
                          "MaxAttempts": 4,
                          "BackoffRate": 2.0
                        }
                      ],
                      "Next": "Submit and wait"
                    },
                    "Submit and wait": {
                      "Type": "Task",
                      "Comment": "The §8 shape: ONE held state, NO polling. The handler invokes bedrock-inference's gateway Lambda inline (records_s3uri + callback_task_token + idempotency_token = THIS run's uuid) and writes the §7 history pointer from the TRUE submit response - the wake payload always carries a message, so history cannot be written after the wake. bedrock's waker completes the token with the terminal status as DATA (SendTaskSuccess even for FAILED). NO Catch, deliberately: a timeout FAILS the execution, and a REDRIVE of this state resubmits, absorbs into the (finished) run, and is completed SYNCHRONOUSLY by the gateway's absorbed-closed path - redrive IS the reconcile. A mid-flight retry of this task is equally safe: same uuid-token -> same bedrock workflow_id -> absorbed.",
                      "Resource": "arn:aws:states:::lambda:invoke.waitForTaskToken",
                      "Parameters": {
                        "FunctionName": "${WorkflowLambdaArn}",
                        "Payload": {
                          "operation": "SubmitAndWait",
                          "uuid.$": "$.uuid",
                          "plan_s3uri.$": "$.plan_s3uri",
                          "records_s3uri.$": "$.records_s3uri",
                          "record_count.$": "$.record_count",
                          "task_token.$": "$$.Task.Token"
                        }
                      },
                      "ResultPath": "$.wait_result",
                      "TimeoutSeconds": 93600,
                      "Retry": [
                        {
                          "ErrorEquals": [
                            "Lambda.ServiceException",
                            "Lambda.AWSLambdaException",
                            "Lambda.SdkClientException",
                            "Lambda.TooManyRequestsException"
                          ],
                          "IntervalSeconds": 5,
                          "MaxAttempts": 4,
                          "BackoffRate": 2.0
                        }
                      ],
                      "Next": "Collect and finalize"
                    },
                    "Collect and finalize": {
                      "Type": "Task",
                      "Comment": "ONE state for both halves because nothing branches between them (2026-08-18): parse the JSONL output (§4), validate coverage per chunk (§3), then merge in pure code (§5-§6: continues_previous stitch, deterministic header vote, id -> authoritative timestamps) and write the analysis + chunk-manifest labels (§7e). Uncovered id ranges land in segments_gap HONESTLY - partial success is success; the rerun is the caller's fresh idempotency_token. A terminally FAILED bedrock run raises and propagates as itself - no Catch, no Fail state.",
                      "Resource": "arn:aws:states:::lambda:invoke",
                      "Parameters": {
                        "FunctionName": "${WorkflowLambdaArn}",
                        "Payload": {
                          "operation": "CollectAndFinalize",
                          "uuid.$": "$.uuid",
                          "plan_s3uri.$": "$.plan_s3uri",
                          "wait_result.$": "$.wait_result"
                        }
                      },
                      "OutputPath": "$.Payload",
                      "Retry": [
                        {
                          "ErrorEquals": [
                            "Lambda.ServiceException",
                            "Lambda.AWSLambdaException",
                            "Lambda.SdkClientException",
                            "Lambda.TooManyRequestsException"
                          ],
                          "IntervalSeconds": 3,
                          "MaxAttempts": 4,
                          "BackoffRate": 2.0
                        }
                      ],
                      "Next": "Usage tracking"
                    },
                    "Usage tracking": {
                      "Type": "Task",
                      "Comment": "Aggregates the run's summary/usage documents into the usage label. Success path only; the handler never raises - as the terminal state, an exception here would fail an execution whose products are already written.",
                      "Resource": "arn:aws:states:::lambda:invoke",
                      "Parameters": {
                        "FunctionName": "${WorkflowLambdaArn}",
                        "Payload": {
                          "operation": "UsageTracking",
                          "uuid.$": "$.uuid",
                          "plan_s3uri.$": "$.plan_s3uri"
                        }
                      },
                      "OutputPath": "$.Payload",
                      "Retry": [
                        {
                          "ErrorEquals": [
                            "Lambda.ServiceException",
                            "Lambda.AWSLambdaException",
                            "Lambda.SdkClientException",
                            "Lambda.TooManyRequestsException"
                          ],
                          "IntervalSeconds": 3,
                          "MaxAttempts": 4,
                          "BackoffRate": 2.0
                        }
                      ],
                      "End": true
                    }
                  }
                }
Outputs:
    GatewayToolLambdaArn:
        Description: ARN of the gateway tool Lambda — the value media-toolkit-gateway' ConversationAnalysisToolLambdaArn parameter will consume.
        Value: !GetAtt GatewayToolLambda.Arn
    StateMachineArn:
        Description: ARN of the conversation-analysis state machine.
        Value: !Ref ConversationAnalysisStateMachine
