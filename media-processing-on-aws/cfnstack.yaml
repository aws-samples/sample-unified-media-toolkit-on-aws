                - name: !FindInMap [Lambda, Function, Name]
            RetentionInDays: 7

    ################################################################################
    # Step Functions Execution Role
    ################################################################################
    MediaProcessingStateMachineRole:
        Type: AWS::IAM::Role
        Metadata:
            cfn_nag:
                rules_to_suppress:
                    -
                        id: W11
                        reason: X-ray tracing and CloudWatch Logs delivery require wildcard resources
        Properties:
            Path: !Sub /${ResourcePrefix}/
            AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                    -
                        Effect: Allow
                        Action: sts:AssumeRole
                        Principal:
                            Service: !Sub states.${AWS::Region}.amazonaws.com
            Policies:
                -
                    PolicyName: !Sub ${ResourcePrefix}SFNPolicy
                    PolicyDocument:
                        Version: "2012-10-17"
                        Statement:
                            -
                                Effect: Allow
                                Action: lambda:InvokeFunction
                                Resource:
                                    - !GetAtt MediaProcessingLambdaHalfCore.Arn
                                    - !GetAtt MediaProcessingLambda1Core.Arn
                                    - !GetAtt MediaProcessingLambda2Cores.Arn
                                    - !GetAtt MediaProcessingLambda3Cores.Arn
                                    - !GetAtt MediaProcessingLambda4Cores.Arn
                                    - !GetAtt MediaProcessingLambda5Cores.Arn
                                    - !GetAtt MediaProcessingLambda6Cores.Arn
                            -
                                Effect: Allow
                                Action:
                                    - logs:CreateLogDelivery
                                    - logs:GetLogDelivery
                                    - logs:UpdateLogDelivery
                                    - logs:DeleteLogDelivery
                                    - logs:ListLogDeliveries
                                    - logs:PutLogEvents
                                    - logs:PutResourcePolicy
                                    - logs:DescribeResourcePolicies
                                    - logs:DescribeLogGroups
                                Resource: "*"
                            -
                                Effect: Allow
                                Action:
                                    - xray:PutTraceSegments
                                    - xray:PutTelemetryRecords
                                    - xray:GetSamplingRules
                                    - xray:GetSamplingTargets
                                Resource: "*"

    ################################################################################
    # Step Functions State Machine
    #
    # ${MediaProcessingLambdaXxx.Arn} references resolved by CloudFormation !Sub.
    # Keeping the definition inline is deliberate: !Sub validates every
    # ${Resource.Arn} against the template, so a typo or a deleted Lambda is a
    # template error. DefinitionS3Location + DefinitionSubstitutions has no
    # equivalent check — an unmatched token is passed through literally and only
    # surfaces when the state machine runs.
    # $$.Execution.Id / $$.Map.Item.Value are Step Functions context-object paths;
    # !Sub passes them through untouched (it only expands ${...}).
    #
    # Only three tiers are named literally here; chunk transcode and merge
    # resolve theirs from the payload at runtime ($.item_data.function_arn and
    # $.data.function_arn), so their memory tier depends on the input.
    # 3-cores  : probe.
    # 6-cores  : chunk transcode timeout/Lambda.Unknown retry.
    # half-core: usage tracking.
    ################################################################################
    MediaProcessingStateMachine:
        Type: AWS::StepFunctions::StateMachine
        Properties:
            StateMachineName: !Sub
                - ${ResourcePrefix}-${name}
                - name: !FindInMap [Lambda, Function, Name]
            RoleArn: !GetAtt MediaProcessingStateMachineRole.Arn
            LoggingConfiguration:
                Destinations:
                    -
                        CloudWatchLogsLogGroup:
                            LogGroupArn: !GetAtt MediaProcessingStateMachineLogGroup.Arn
                IncludeExecutionData: true
                Level: ALL
            TracingConfiguration:
                Enabled: true
            DefinitionString:
                !Sub |-
                    {
                        "Comment": "Media processing state machine split into chunks, transcode, and stitch them back together",
                        "StartAt": "Probe media file",
                        "States": {
                            "Probe media file": {
                                "Type": "Task",
                                "Resource": "arn:aws:states:::lambda:invoke",
                                "OutputPath": "$.Payload",
                                "Parameters": {
                                    "FunctionName": "${MediaProcessingLambda3Cores.Arn}",
                                    "Payload": {
                                        "operation": "StateProbeMediaFile",
                                        "uuid.$": "$.uuid",
                                        "input.$": "$.input",
                                        "output.$": "$.output",
                                        "data.$": "$.data"
                                    }
                                },
                                "Retry": [
                                    {
                                        "ErrorEquals": [
                                            "Lambda.ServiceException",
                                            "Lambda.AWSLambdaException",
                                            "Lambda.SdkClientException",
                                            "Lambda.TooManyRequestsException"
                                        ],
                                        "IntervalSeconds": 1,
                                        "MaxAttempts": 2,
                                        "BackoffRate": 1.2
                                    }
                                ],
                                "Next": "Metadata only?"
                            },
                            "Metadata only?": {
                                "Comment": "Metadata-only requests are fully served by the probe state — skip the Map and merge, but still run usage tracking (the End state the gateway reads the final output from)",
                                "Type": "Choice",
                                "Choices": [
                                    {
                                        "Variable": "$.data.metadata_only",
                                        "BooleanEquals": true,
                                        "Next": "Usage tracking"
                                    }
                                ],
                                "Default": "Map transcode segment chunk iterators"
                            },
                            "Map transcode segment chunk iterators": {
                                "Type": "Map",
                                "MaxConcurrency": 40,
                                "ItemsPath": "$.data.iterators",
                                "ItemSelector": {
                                    "operation": "StateChunkTranscode",
                                    "item_data.$": "$$.Map.Item.Value"
                                },
                                "ItemProcessor": {
                                    "ProcessorConfig": {
                                        "Mode": "INLINE"
                                    },
                                    "StartAt": "Transcode segment chunk (X mins)",
                                    "States": {
                                        "Transcode segment chunk (X mins)": {
                                            "Type": "Task",
                                            "Resource": "arn:aws:states:::lambda:invoke",
                                            "OutputPath": "$.Payload",
                                            "Parameters": {
                                                "FunctionName.$": "$.item_data.function_arn",
                                                "Payload.$": "$"
                                            },
                                            "Catch": [
                                                {
                                                    "ErrorEquals": [
                                                        "Sandbox.Timedout",
                                                        "Lambda.Unknown"
                                                    ],
                                                    "Next": "Transcode segment chunk (Retry larger memory)",
                                                    "ResultPath": "$.error"
                                                }
                                            ],
                                            "Retry": [
                                                {
                                                    "ErrorEquals": [
                                                        "Sandbox.Timedout",
                                                        "Lambda.Unknown"
                                                    ],
                                                    "MaxAttempts": 0
                                                },
                                                {
                                                    "ErrorEquals": [
                                                        "ValidationException"
                                                    ],
                                                    "IntervalSeconds": 1,
                                                    "MaxAttempts": 2,
                                                    "BackoffRate": 1.0
                                                },
                                                {
                                                    "ErrorEquals": [
                                                        "Lambda.ServiceException",
                                                        "Lambda.AWSLambdaException",
                                                        "Lambda.SdkClientException",
                                                        "Lambda.TooManyRequestsException"
                                                    ],
                                                    "IntervalSeconds": 1,
                                                    "MaxAttempts": 2,
                                                    "BackoffRate": 1.2
                                                }
                                            ],
                                            "End": true
                                        },
                                        "Transcode segment chunk (Retry larger memory)": {
                                            "Type": "Task",
                                            "Resource": "arn:aws:states:::lambda:invoke",
                                            "OutputPath": "$.Payload",
                                            "Parameters": {
                                                "FunctionName": "${MediaProcessingLambda6Cores.Arn}",
                                                "Payload.$": "$"
                                            },
                                            "Retry": [
                                                {
                                                    "ErrorEquals": [
                                                        "ValidationException"
                                                    ],
                                                    "IntervalSeconds": 1,
                                                    "MaxAttempts": 2,
                                                    "BackoffRate": 1.0
                                                },
                                                {
                                                    "ErrorEquals": [
                                                        "Lambda.ServiceException",
                                                        "Lambda.AWSLambdaException",
                                                        "Lambda.SdkClientException",
                                                        "Lambda.TooManyRequestsException"
                                                    ],
                                                    "IntervalSeconds": 1,
                                                    "MaxAttempts": 2,
                                                    "BackoffRate": 1.0
                                                }
                                            ],
                                            "End": true
                                        }
                                    }
                                },
                                "ResultPath": "$.data.iterators",
                                "Next": "Merge segment chunks"
                            },
                            "Merge segment chunks": {
                                "Type": "Task",
                                "Resource": "arn:aws:states:::lambda:invoke",
                                "OutputPath": "$.Payload",
                                "Parameters": {
                                    "FunctionName.$": "$.data.function_arn",
                                    "Payload": {
                                        "operation": "StateMergeChunks",
                                        "uuid.$": "$.uuid",
                                        "input.$": "$.input",
                                        "output.$": "$.output",
                                        "data.$": "$.data"
                                    }
                                },
                                "Retry": [
                                    {
                                        "ErrorEquals": [
                                            "Lambda.ServiceException",
                                            "Lambda.AWSLambdaException",
                                            "Lambda.SdkClientException",
                                            "Lambda.TooManyRequestsException"
                                        ],
                                        "IntervalSeconds": 1,
                                        "MaxAttempts": 2,
                                        "BackoffRate": 1.2
                                    }
                                ],
                                "Next": "Usage tracking"
                            },
                            "Usage tracking": {
                                "Type": "Task",
                                "Resource": "arn:aws:states:::lambda:invoke",
                                "OutputPath": "$.Payload",
                                "Parameters": {
                                    "FunctionName": "${MediaProcessingLambdaHalfCore.Arn}",
                                    "Payload": {
                                        "operation": "StateUsageTracking",
                                        "uuid.$": "$.uuid",
                                        "input.$": "$.input",
                                        "output.$": "$.output",
                                        "data.$": "$.data",
                                        "execution_arn.$": "$$.Execution.Id"
                                    }
                                },
                                "Retry": [
                                    {
                                        "ErrorEquals": [
                                            "Lambda.ServiceException",
                                            "Lambda.AWSLambdaException",
                                            "Lambda.SdkClientException",
                                            "Lambda.TooManyRequestsException"
                                        ],
                                        "IntervalSeconds": 1,
                                        "MaxAttempts": 2,
                                        "BackoffRate": 1.2
                                    }
                                ],
                                "End": true
                            }
                        }
                    }

    ################################################################################
    # Gateway Tool Log Group
    ################################################################################
    MediaProcessingGatewayToolLogGroup:
        Type: AWS::Logs::LogGroup
        Metadata:
            cfn_nag:
                rules_to_suppress:
                    -
                        id: W84
                        reason: CloudWatch Logs encrypts data at rest by default using an AWS-managed key
        Properties:
            LogGroupName: !Sub
                - /aws/lambda/${ResourcePrefix}-${name}-${tool}
                - name: !FindInMap [Lambda, Function, Name]
                  tool: !FindInMap [Lambda, GatewayTool, Name]
            RetentionInDays: 7

    ################################################################################
    # Gateway Tool Lambda IAM Role
    # Separate role: needs only StartExecution + DescribeExecution on this workflow.
    # Does NOT need S3, ECR, or GetFunctionConfiguration — those are for the
    # workflow Lambdas, not this thin dispatcher.
    ################################################################################
    MediaProcessingGatewayToolRole:
        Type: AWS::IAM::Role
        Properties:
            Path: !Sub /${ResourcePrefix}/
            AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                    -
                        Effect: Allow
                        Principal:
                            Service: lambda.amazonaws.com
                        Action: sts:AssumeRole
            Policies:
                -
                    PolicyName: !Sub ${ResourcePrefix}MediaProcessingGatewayToolPolicy
                    PolicyDocument:
                        Version: "2012-10-17"
                        Statement:
                            -
                                Effect: Allow
                                Action:
                                    - logs:CreateLogGroup
                                    - logs:CreateLogStream
                                    - logs:PutLogEvents
                                Resource: !GetAtt MediaProcessingGatewayToolLogGroup.Arn
                            # Start a new media-processing execution
                            -
                                Effect: Allow
                                Action: states:StartExecution
                                Resource: !GetAtt MediaProcessingStateMachine.Arn
                            # Poll and inspect any execution of this state machine.
                            # Both DescribeExecution and GetExecutionHistory operate on
                            # execution ARNs, not the state machine ARN.
                            -
                                Effect: Allow
                                Action:
                                    - states:DescribeExecution
                                    - states:GetExecutionHistory
                                Resource: !Sub
                                    - arn:aws:states:${AWS::Region}:${AWS::AccountId}:execution:${smName}:*
                                    - smName: !GetAtt MediaProcessingStateMachine.Name
                            # callback_task_token (2026-09-18, the family
                            # consumer pattern): register rows at submit,
                            # complete synchronously on absorbed-finished
                            # runs. SendTaskSuccess cannot be resource-
                            # scoped — a task token is an opaque bearer
                            # credential, not an ARN.
                            -
                                Effect: Allow
                                Action:
                                    - dynamodb:PutItem
                                    - dynamodb:DeleteItem
                                Resource: !GetAtt MediaProcessingCallbackTokensTable.Arn
                            -
                                Effect: Allow
                                Action: states:SendTaskSuccess
                                # any machine in THIS account+region — the token's machine is the
                                # caller's (ours or a customer's own), never known at deploy time
                                Resource: !Sub arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:*

    ################################################################################
    # Gateway Tool Lambda
    # Pure Python zip — no Docker image needed. Packaged inline from gateway_tool/.
    ################################################################################
    MediaProcessingGatewayToolLambda:
        Type: AWS::Lambda::Function
        DependsOn: ProxyBucketValidator
        Metadata:
            cfn_nag:
                rules_to_suppress:
                    -
                        id: W89
                        reason: Not using VPC
                    -
                        id: W92
                        reason: Single-purpose dispatcher; reserved concurrency unnecessary
        Properties:
            FunctionName: !Sub
                - ${ResourcePrefix}-${name}-${tool}
                - name: !FindInMap [Lambda, Function, Name]
                  tool: !FindInMap [Lambda, GatewayTool, Name]
            Description: !Sub
                - (${ResourcePrefix}) ${desc}
                - desc: !FindInMap [Lambda, GatewayTool, Description]
            Runtime: python3.13
            Architectures:
                - arm64
            Handler: lambda_function.lambda_handler
            Role: !GetAtt MediaProcessingGatewayToolRole.Arn
            MemorySize: !FindInMap [Lambda, GatewayTool, Memory]
            Timeout: !FindInMap [Lambda, GatewayTool, Timeout]
            Environment:
                Variables:
                    MEDIA_PROCESSING_STATE_MACHINE_ARN: !GetAtt MediaProcessingStateMachine.Arn
                    PROXY_BUCKET: !Ref ProxyBucket
                    TOOL_VERSION: "%%VERSION%%"
                    # Must equal the GatewayTarget Name in media-toolkit-gateway/cfnstack.yaml
                    TARGET_NAME: "media-processing"
                    CALLBACK_TABLE: !Ref MediaProcessingCallbackTokensTable
            Code:
                S3Bucket: !FindInMap [CodeBuild, Source, Bucket]
                S3Key: !Sub
                    - ${keyPrefix}/${pkg}
                    - keyPrefix: !FindInMap [CodeBuild, Source, KeyPrefix]
                      pkg: !FindInMap [CodeBuild, Source, GatewayToolPackage]
            TracingConfig:
                Mode: Active

    ################################################################################
    # Lambda Resource-Based Policy
    # Allows the AgentCore service principal to invoke the gateway tool Lambda.
    ################################################################################
    MediaProcessingGatewayToolPermission:
        Type: AWS::Lambda::Permission
        Properties:
            FunctionName: !GetAtt MediaProcessingGatewayToolLambda.Arn
            Action: lambda:InvokeFunction
            Principal: bedrock-agentcore.amazonaws.com
            SourceAccount: !Ref AWS::AccountId

    ############################################################################
    # Callback mechanism — the service-side half of
    # callback_task_token, ported from bedrock-inference (README.md §11):
    # consumer workflows (speech-diarization, audiostem-separation,
    # face-recognition) submit process_media through the GATEWAY with a
    # task token and sleep on ONE waitForTaskToken state; one EventBridge
    # rule on THIS machine's native status-change events wakes every
    # registered consumer. Notification is a SERVICE concern, owned here
    # once — never a table+rule+waker per consumer stack.
    ############################################################################
    MediaProcessingCallbackTokensTable:
        Type: AWS::DynamoDB::Table
        Metadata:
            checkov:
                skip:
                    - id: CKV_AWS_119
                      comment: >-
                        sample posture: table holds rebuildable derived state; default SSE is deliberate (see README.md §11, table posture)
                    - id: CKV_AWS_28
                      comment: >-
                        sample posture: table is rebuildable derived state designed to delete with the stack; PITR protects nothing irreplaceable here
            cfn_nag:
                rules_to_suppress:
                    -
                        id: W74
                        reason: Ephemeral task-token rows with a TTL on every item — no customer data, nothing worth a CMK's key-management cost
                    -
                        id: W78
                        reason: Point-in-time recovery is pointless — a restored row's task token belongs to a wait state that has already timed out
        Properties:
            # named like every sibling's callback table (bi-/fi-/tts-)
            # so operators can find it by prefix; TableName is createOnly,
            # so adding it REPLACES the table — safe only while no callback
            # run is in flight (rows are transient tokens; a row lost
            # mid-flight sleeps its held state to its timeout)
            TableName: !Sub ${ResourcePrefix}-mp-callback-tokens
            BillingMode: PAY_PER_REQUEST
            AttributeDefinitions:
                - { AttributeName: execution_arn, AttributeType: S }
                - { AttributeName: token_hash, AttributeType: S }
            KeySchema:
                - { AttributeName: execution_arn, KeyType: HASH }
                - { AttributeName: token_hash, KeyType: RANGE }
            TimeToLiveSpecification:
                AttributeName: ttl
                Enabled: true

    MediaProcessingCallbackWakerLogGroup:
        Type: AWS::Logs::LogGroup
        Metadata:
            cfn_nag:
                rules_to_suppress:
                    -
                        id: W84
                        reason: CloudWatch Logs encrypts data at rest by default using an AWS-managed key
        Properties:
            LogGroupName: !Sub "/aws/lambda/${ResourcePrefix}-media-processing-callback-waker"
            RetentionInDays: 7

    MediaProcessingCallbackWakerRole:
        Type: AWS::IAM::Role
        Metadata:
            cfn_nag:
                rules_to_suppress:
                    -
                        id: W11
                        reason: states:SendTask* is scoped to this account+region's state machines — the token's machine is the caller's and unknowable at deploy time. This role can only redeem tokens it reads from the callback table, which only the gateway role writes.
        Properties:
            Path: !Sub /${ResourcePrefix}/
            AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                    -
                        Effect: Allow
                        Principal:
                            Service: lambda.amazonaws.com
                        Action: sts:AssumeRole
            Policies:
                -
                    PolicyName: !Sub ${ResourcePrefix}MediaProcessingCallbackWakerPolicy
                    PolicyDocument:
                        Version: "2012-10-17"
                        Statement:
                            -
                                Effect: Allow
                                Action:
                                    - logs:CreateLogGroup
                                    - logs:CreateLogStream
                                    - logs:PutLogEvents
                                Resource: !GetAtt MediaProcessingCallbackWakerLogGroup.Arn
                            -
                                Effect: Allow
                                Action:
                                    - dynamodb:Query
                                    - dynamodb:DeleteItem
                                Resource: !GetAtt MediaProcessingCallbackTokensTable.Arn
                            -
                                Effect: Allow
                                Action: states:SendTaskSuccess
                                # any machine in THIS account+region — the token's machine is the
                                # caller's (ours or a customer's own), never known at deploy time
                                Resource: !Sub arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:*

    MediaProcessingCallbackWakerLambda:
        Type: AWS::Lambda::Function
        DependsOn: MediaProcessingCallbackWakerLogGroup
        Metadata:
            cfn_nag:
                rules_to_suppress:
                    -
                        id: W89
                        reason: Not using VPC
                    -
                        id: W92
                        reason: Invoked once per terminal execution event; reserved concurrency unnecessary
        Properties:
            FunctionName: !Sub "${ResourcePrefix}-media-processing-callback-waker"
            Description: !Sub "(${ResourcePrefix}) Completes consumer task tokens on the media-processing machine's terminal EventBridge event"
            Runtime: python3.13
            Architectures:
                - arm64
            Handler: callback_waker.lambda_handler
            Role: !GetAtt MediaProcessingCallbackWakerRole.Arn
            MemorySize: 256
            Timeout: 60
            Environment:
                Variables:
                    CALLBACK_TABLE: !Ref MediaProcessingCallbackTokensTable
            Code:
                S3Bucket: !FindInMap [CodeBuild, Source, Bucket]
                S3Key: !Sub
                    - ${keyPrefix}/${pkg}
                    - keyPrefix: !FindInMap [CodeBuild, Source, KeyPrefix]
                      pkg: !FindInMap [CodeBuild, Source, GatewayToolPackage]

    MediaProcessingCallbackCompletionRule:
        Type: AWS::Events::Rule
        Properties:
            Name: !Sub ${ResourcePrefix}-media-processing-callback-completion
            Description: Complete consumer callback task tokens when a media-processing execution reaches a terminal state
            EventPattern:
                source: [aws.states]
                detail-type: ["Step Functions Execution Status Change"]
                detail:
                    status: [SUCCEEDED, FAILED, ABORTED, TIMED_OUT]
                    stateMachineArn:
                        - !GetAtt MediaProcessingStateMachine.Arn
            State: ENABLED
            Targets:
                -
                    Id: MediaProcessingCallbackWaker
                    Arn: !GetAtt MediaProcessingCallbackWakerLambda.Arn

    MediaProcessingCallbackCompletionRulePermission:
        Type: AWS::Lambda::Permission
        Properties:
            FunctionName: !GetAtt MediaProcessingCallbackWakerLambda.Arn
            Action: lambda:InvokeFunction
            Principal: events.amazonaws.com
            SourceArn: !GetAtt MediaProcessingCallbackCompletionRule.Arn

Outputs:

    IngestBucketReadRoleArns:
        Description: >
            Runtime role ARNs that read the Ingest bucket (comma-separated) —
            input for the ingest bucket owner's bucket policy. Read-only.
        Value: !GetAtt MediaProcessingRole.Arn
    ImageUri:
        Description: ECR URI of the container image
        Value: !Sub
            - ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${repositoryName}:${imageTag}
            - repositoryName: !FindInMap [ECR, Repository, Name]
              imageTag: !FindInMap [ECR, Repository, ImageTag]
    ECRRepositoryArn:
        Description: ARN of the ECR repository
        Value: !Sub
            - arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${repoName}
            - repoName: !FindInMap [ECR, Repository, Name]
    StateMachineArn:
        Description: ARN of the media processing state machine
        Value: !GetAtt MediaProcessingStateMachine.Arn
    StateMachineName:
        Description: Name of the media processing state machine
        Value: !GetAtt MediaProcessingStateMachine.Name
    GatewayToolLambdaArn:
        Description: ARN of the gateway tool Lambda — import as MediaProcessingToolLambdaArn
        Value: !GetAtt MediaProcessingGatewayToolLambda.Arn
