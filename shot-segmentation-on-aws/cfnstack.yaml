    ################################################################################
    # Step Functions CloudWatch Log Group
    ################################################################################
    ShotSegmentationStateMachineLogGroup:
        Type: AWS::Logs::LogGroup
        Metadata:
            cfn_nag:
                rules_to_suppress:
                    -
                        id: W84
                        reason: CloudWatch Logs encrypts data at rest by default using an AWS-managed key
        Properties:
            LogGroupName: !Sub
                - /aws/states/${ResourcePrefix}-${name}
                - name: !FindInMap [Lambda, Function, Name]
            RetentionInDays: 7

    ################################################################################
    # Step Functions Execution Role
    ################################################################################
    ShotSegmentationStateMachineRole:
        Type: AWS::IAM::Role
        Metadata:
            cfn_nag:
                rules_to_suppress:
                    -
                        id: W11
                        reason: X-ray tracing and CloudWatch log delivery require wildcard resource
        Properties:
            Path: !Sub /${ResourcePrefix}/
            AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                    -
                        Effect: Allow
                        Action: sts:AssumeRole
                        Principal:
                            Service: !Sub states.${AWS::Region}.amazonaws.com
            Policies:
                -
                    PolicyName: !Sub ${ResourcePrefix}ShotSegmentationSFNPolicy
                    PolicyDocument:
                        Version: "2012-10-17"
                        Statement:
                            # Invoke any of the 5 Lambda variants
                            -
                                Effect: Allow
                                Action: lambda:InvokeFunction
                                Resource:
                                    - !GetAtt ShotSegmentationLambdaHalfCore.Arn
                                    - !GetAtt ShotSegmentationLambda1Core.Arn
                                    - !GetAtt ShotSegmentationLambda3Cores.Arn
                                    - !GetAtt ShotSegmentationLambda4Cores.Arn
                                    - !GetAtt ShotSegmentationLambda6Cores.Arn
                            # Probe file size — SDK GetObject task reads from ingest bucket
                            -
                                Effect: Allow
                                Action:
                                    - s3:GetObject
                                Resource: !Sub arn:aws:s3:::${IngestBucket}/*
                            # CloudWatch Logs — required for LoggingConfiguration
                            -
                                Effect: Allow
                                Action:
                                    - logs:CreateLogDelivery
                                    - logs:GetLogDelivery
                                    - logs:UpdateLogDelivery
                                    - logs:DeleteLogDelivery
                                    - logs:ListLogDeliveries
                                    - logs:PutLogEvents
                                    - logs:PutResourcePolicy
                                    - logs:DescribeResourcePolicies
                                    - logs:DescribeLogGroups
                                Resource: "*"
                            # X-Ray tracing
                            -
                                Effect: Allow
                                Action:
                                    - xray:PutTraceSegments
                                    - xray:PutTelemetryRecords
                                    - xray:GetSamplingRules
                                    - xray:GetSamplingTargets
                                Resource: "*"

    ################################################################################
    # Step Functions State Machine
    #
    # Definition sourced from definitions.json.
    # ${...} references are resolved by CloudFormation !Sub.
    # $$$$.Execution.Id (four $) becomes $$.Execution.Id after !Sub — required for SFN context object access.
    ################################################################################
    ShotSegmentationStateMachine:
        Type: AWS::StepFunctions::StateMachine
        Properties:
            StateMachineName: !Sub
                - ${ResourcePrefix}-${name}
                - name: !FindInMap [Lambda, Function, Name]
            RoleArn: !GetAtt ShotSegmentationStateMachineRole.Arn
            LoggingConfiguration:
                Destinations:
                    -
                        CloudWatchLogsLogGroup:
                            LogGroupArn: !GetAtt ShotSegmentationStateMachineLogGroup.Arn
                IncludeExecutionData: true
                Level: ALL
            TracingConfiguration:
                Enabled: true
            DefinitionString:
                !Sub |-
                    {
                        "Comment": "Frame Embedding - DINOv2 with shot detection, dissolve/noise resolution, recurrence.",
                        "StartAt": "Probe video for chunk transcode",
                        "States": {
                            "Probe video for chunk transcode": {
                                "Type": "Task",
                                "Resource": "arn:aws:states:::lambda:invoke",
                                "OutputPath": "$.Payload",
                                "Parameters": {
                                    "FunctionName": "${ShotSegmentationLambda1Core.Arn}",
                                    "Payload": {
                                        "operation": "StateProbeVideoForChunkTranscode",
                                        "uuid.$": "$.uuid",
                                        "input.$": "$.input",
                                        "output.$": "$.output",
                                        "data.$": "$.data"
                                    }
                                },
                                "Retry": [
                                    {
                                        "ErrorEquals": [
                                            "Lambda.Unknown"
                                        ],
                                        "MaxAttempts": 0
                                    },
                                    {
                                        "ErrorEquals": [
                                            "Sandbox.Timedout"
                                        ],
                                        "IntervalSeconds": 6,
                                        "MaxAttempts": 4,
                                        "BackoffRate": 1
                                    },
                                    {
                                        "ErrorEquals": [
                                            "Lambda.ServiceException",
                                            "Lambda.AWSLambdaException",
                                            "Lambda.SdkClientException",
                                            "Lambda.ClientExecutionTimeoutException",
                                            "Lambda.TooManyRequestsException"
                                        ],
                                        "IntervalSeconds": 2,
                                        "MaxAttempts": 6,
                                        "BackoffRate": 2
                                    }
                                ],
                                "Catch": [
                                    {
                                        "ErrorEquals": [
                                            "LargeMediaFileException"
                                        ],
                                        "Next": "Probe video for chunk transcode (large file)",
                                        "ResultPath": "$.error"
                                    }
                                ],
                                "Next": "Map transcode processing"
                            },
                            "Probe video for chunk transcode (large file)": {
                                "Type": "Task",
                                "Resource": "arn:aws:states:::lambda:invoke",
                                "OutputPath": "$.Payload",
                                "Parameters": {
                                    "FunctionName": "${ShotSegmentationLambda3Cores.Arn}",
                                    "Payload": {
                                        "operation": "StateProbeVideoForChunkTranscodeLargeFile",
                                        "uuid.$": "$.uuid",
                                        "input.$": "$.input",
                                        "output.$": "$.output",
                                        "data.$": "$.data"
                                    }
                                },
                                "Retry": [
                                    {
                                        "ErrorEquals": [
                                            "Lambda.Unknown"
                                        ],
                                        "MaxAttempts": 0
                                    },
                                    {
                                        "ErrorEquals": [
                                            "Sandbox.Timedout"
                                        ],
                                        "IntervalSeconds": 6,
                                        "MaxAttempts": 4,
                                        "BackoffRate": 1
                                    },
                                    {
                                        "ErrorEquals": [
                                            "Lambda.ServiceException",
                                            "Lambda.AWSLambdaException",
                                            "Lambda.SdkClientException",
                                            "Lambda.ClientExecutionTimeoutException",
                                            "Lambda.TooManyRequestsException"
                                        ],
                                        "IntervalSeconds": 2,
                                        "MaxAttempts": 6,
                                        "BackoffRate": 2
                                    }
                                ],
                                "Next": "Map transcode processing"
                            },
                            "Map transcode processing": {
                                "Type": "Map",
                                "MaxConcurrency": 40,
                                "ItemsPath": "$.data.iterators",
                                "ItemSelector": {
                                    "operation": "StateRunFFmpegTranscode",
                                    "item_id.$": "$$.Map.Item.Index",
                                    "item_data.$": "$$.Map.Item.Value"
                                },
                                "ItemProcessor": {
                                    "ProcessorConfig": {
                                        "Mode": "INLINE"
                                    },
                                    "StartAt": "Run FFmpeg transcode",
                                    "States": {
                                        "Run FFmpeg transcode": {
                                            "Type": "Task",
                                            "Resource": "arn:aws:states:::lambda:invoke",
                                            "OutputPath": "$.Payload",
                                            "Parameters": {
                                                "FunctionName": "${ShotSegmentationLambda3Cores.Arn}",
                                                "Payload.$": "$"
                                            },
                                            "Retry": [
                                                {
                                                    "ErrorEquals": [
                                                        "Lambda.Unknown"
                                                    ],
                                                    "MaxAttempts": 0
                                                },
                                                {
                                                    "ErrorEquals": [
                                                        "Sandbox.Timedout"
                                                    ],
                                                    "IntervalSeconds": 6,
                                                    "MaxAttempts": 4,
                                                    "BackoffRate": 1
                                                },
                                                {
                                                    "ErrorEquals": [
                                                        "Lambda.ServiceException",
                                                        "Lambda.AWSLambdaException",
                                                        "Lambda.SdkClientException",
                                                        "Lambda.ClientExecutionTimeoutException",
                                                        "Lambda.TooManyRequestsException"
                                                    ],
                                                    "IntervalSeconds": 2,
                                                    "MaxAttempts": 6,
                                                    "BackoffRate": 2
                                                }
                                            ],
                                            "End": true
                                        }
                                    }
                                },
                                "ResultPath": "$.data.iterators",
                                "Next": "Dynamic chunking for frame embedding"
                            },
                            "Dynamic chunking for frame embedding": {
                                "Type": "Task",
                                "Resource": "arn:aws:states:::lambda:invoke",
                                "OutputPath": "$.Payload",
                                "Parameters": {
                                    "FunctionName": "${ShotSegmentationLambdaHalfCore.Arn}",
                                    "Payload": {
                                        "operation": "StateDynamicChunkingForFrameEmbedding",
                                        "uuid.$": "$.uuid",
                                        "input.$": "$.input",
                                        "output.$": "$.output",
                                        "data.$": "$.data"
                                    }
                                },
                                "Retry": [
                                    {
                                        "ErrorEquals": [
                                            "Lambda.Unknown"
                                        ],
                                        "MaxAttempts": 0
                                    },
                                    {
                                        "ErrorEquals": [
                                            "Sandbox.Timedout"
                                        ],
                                        "IntervalSeconds": 6,
                                        "MaxAttempts": 4,
                                        "BackoffRate": 1
                                    },
                                    {
                                        "ErrorEquals": [
                                            "Lambda.ServiceException",
                                            "Lambda.AWSLambdaException",
                                            "Lambda.SdkClientException",
                                            "Lambda.ClientExecutionTimeoutException",
                                            "Lambda.TooManyRequestsException"
                                        ],
                                        "IntervalSeconds": 2,
                                        "MaxAttempts": 6,
                                        "BackoffRate": 2
                                    }
                                ],
                                "Next": "Map frame features extraction"
                            },
                            "Map frame features extraction": {
                                "Type": "Map",
                                "MaxConcurrency": 40,
                                "ItemsPath": "$.data.iterators",
                                "ItemSelector": {
                                    "operation": "StateExtractFrameFeatures",
                                    "item_id.$": "$$.Map.Item.Index",
                                    "item_data.$": "$$.Map.Item.Value"
                                },
                                "ItemProcessor": {
                                    "ProcessorConfig": {
                                        "Mode": "INLINE"
                                    },
                                    "StartAt": "Extract frame features",
                                    "States": {
                                        "Extract frame features": {
                                            "Type": "Task",
                                            "Resource": "arn:aws:states:::lambda:invoke",
                                            "OutputPath": "$.Payload",
                                            "Parameters": {
                                                "FunctionName": "${ShotSegmentationLambda4Cores.Arn}",
                                                "Payload.$": "$"
                                            },
                                            "Retry": [
                                                {
                                                    "ErrorEquals": [
                                                        "LambdaResourceTimeoutException"
                                                    ],
                                                    "IntervalSeconds": 2,
                                                    "MaxAttempts": 10,
                                                    "BackoffRate": 1
                                                },
                                                {
                                                    "ErrorEquals": [
                                                        "Lambda.Unknown"
                                                    ],
                                                    "IntervalSeconds": 5,
                                                    "MaxAttempts": 2,
                                                    "BackoffRate": 1
                                                },
                                                {
                                                    "ErrorEquals": [
                                                        "Sandbox.Timedout"
                                                    ],
                                                    "IntervalSeconds": 6,
                                                    "MaxAttempts": 4,
                                                    "BackoffRate": 1
                                                },
                                                {
                                                    "ErrorEquals": [
                                                        "Lambda.ServiceException",
                                                        "Lambda.AWSLambdaException",
                                                        "Lambda.SdkClientException",
                                                        "Lambda.ClientExecutionTimeoutException",
                                                        "Lambda.TooManyRequestsException"
                                                    ],
                                                    "IntervalSeconds": 2,
                                                    "MaxAttempts": 6,
                                                    "BackoffRate": 2
                                                }
                                            ],
                                            "End": true
                                        }
                                    }
                                },
                                "ResultPath": "$.data.iterators",
                                "Next": "Merge and reconcile shots"
                            },
                            "Merge and reconcile shots": {
                                "Type": "Task",
                                "Resource": "arn:aws:states:::lambda:invoke",
                                "OutputPath": "$.Payload",
                                "Parameters": {
                                    "FunctionName": "${ShotSegmentationLambda3Cores.Arn}",
                                    "Payload": {
                                        "operation": "StateMergeAndReconcileShots",
                                        "uuid.$": "$.uuid",
                                        "input.$": "$.input",
                                        "output.$": "$.output",
                                        "data.$": "$.data"
                                    }
                                },
                                "Retry": [
                                    {
                                        "ErrorEquals": [
                                            "Lambda.Unknown"
                                        ],
                                        "MaxAttempts": 0
                                    },
                                    {
                                        "ErrorEquals": [
                                            "Sandbox.Timedout"
                                        ],
                                        "IntervalSeconds": 6,
                                        "MaxAttempts": 4,
                                        "BackoffRate": 1
                                    },
                                    {
                                        "ErrorEquals": [
                                            "Lambda.ServiceException",
                                            "Lambda.AWSLambdaException",
                                            "Lambda.SdkClientException",
                                            "Lambda.ClientExecutionTimeoutException",
                                            "Lambda.TooManyRequestsException"
                                        ],
                                        "IntervalSeconds": 2,
                                        "MaxAttempts": 6,
                                        "BackoffRate": 2
                                    }
                                ],
                                "Next": "Store debug shot images"
                            },
                            "Store debug shot images": {
                                "Type": "Task",
                                "Resource": "arn:aws:states:::lambda:invoke",
                                "OutputPath": "$.Payload",
                                "Parameters": {
                                    "FunctionName": "${ShotSegmentationLambda6Cores.Arn}",
                                    "Payload": {
                                        "operation": "StateStoreDebugShotImages",
                                        "uuid.$": "$.uuid",
                                        "input.$": "$.input",
                                        "output.$": "$.output",
                                        "data.$": "$.data"
                                    }
                                },
                                "Retry": [
                                    {
                                        "ErrorEquals": [
                                            "Lambda.Unknown"
                                        ],
                                        "MaxAttempts": 0
                                    },
                                    {
                                        "ErrorEquals": [
                                            "Sandbox.Timedout"
                                        ],
                                        "IntervalSeconds": 6,
                                        "MaxAttempts": 4,
                                        "BackoffRate": 1
                                    },
                                    {
                                        "ErrorEquals": [
                                            "Lambda.ServiceException",
                                            "Lambda.AWSLambdaException",
                                            "Lambda.SdkClientException",
                                            "Lambda.ClientExecutionTimeoutException",
                                            "Lambda.TooManyRequestsException"
                                        ],
                                        "IntervalSeconds": 2,
                                        "MaxAttempts": 6,
                                        "BackoffRate": 2
                                    }
                                ],
                                "Next": "Usage tracking"
                            },
                            "Usage tracking": {
                                "Type": "Task",
                                "Resource": "arn:aws:states:::lambda:invoke",
                                "OutputPath": "$.Payload",
                                "Parameters": {
                                    "FunctionName": "${ShotSegmentationLambdaHalfCore.Arn}",
                                    "Payload": {
                                        "operation": "StateUsageTracking",
                                        "execution_arn.$": "$$.Execution.Id",
                                        "uuid.$": "$.uuid",
                                        "input.$": "$.input",
                                        "output.$": "$.output",
                                        "data.$": "$.data"
                                    }
                                },
                                "Retry": [
                                    {
                                        "ErrorEquals": [
