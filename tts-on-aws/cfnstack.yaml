    # =========================================================================
    # Step Functions — synthesis pipeline + register-voice pipeline
    # =========================================================================
    StateMachineLogGroup:
        Type: AWS::Logs::LogGroup
        Properties:
            LogGroupName: !Sub /aws/states/${ResourcePrefix}-tts
            RetentionInDays: 30

    StateMachineRole:
        Type: AWS::IAM::Role
        Properties:
            AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                    - Effect: Allow
                      Principal:
                          Service: states.amazonaws.com
                      Action: sts:AssumeRole
            Policies:
                - PolicyName: InvokeWorkflowLambdas
                  PolicyDocument:
                      Version: "2012-10-17"
                      Statement:
                          - Effect: Allow
                            Action: lambda:InvokeFunction
                            Resource:
                                - !GetAtt TtsLambdaHalfCore.Arn
                                - !GetAtt TtsLambda1Core.Arn
                                - !GetAtt TtsLambda2Cores.Arn
                                - !GetAtt TtsLambda3Cores.Arn
                                - !GetAtt TtsLambda4Cores.Arn
                                - !GetAtt TtsLambda5Cores.Arn
                                - !GetAtt TtsLambda6Cores.Arn
                          - Effect: Allow
                            Action:
                                - logs:CreateLogDelivery
                                - logs:GetLogDelivery
                                - logs:UpdateLogDelivery
                                - logs:DeleteLogDelivery
                                - logs:ListLogDeliveries
                                - logs:PutResourcePolicy
                                - logs:DescribeResourcePolicies
                                - logs:DescribeLogGroups
                            Resource: "*"

    SynthesisStateMachine:
        Type: AWS::StepFunctions::StateMachine
        Properties:
            StateMachineName: !Sub ${ResourcePrefix}-tts-synthesis
            RoleArn: !GetAtt StateMachineRole.Arn
            LoggingConfiguration:
                Level: ERROR
                IncludeExecutionData: true
                Destinations:
                    - CloudWatchLogsLogGroup:
                          LogGroupArn: !GetAtt StateMachineLogGroup.Arn
            DefinitionString:
                !Sub |-
                    {
                        "Comment": "CosyVoice3 TTS synthesis - batch text-to-speech with voice cloning, per-clip ASR QC.",
                        "StartAt": "Check and preprocess",
                        "States": {
                            "Check and preprocess": {
                                "Type": "Task",
                                "Resource": "arn:aws:states:::lambda:invoke",
                                "OutputPath": "$.Payload",
                                "Parameters": {
                                    "FunctionName": "${TtsLambda1Core.Arn}",
                                    "Payload": {
                                        "operation": "StateCheckAndPreprocess",
                                        "uuid.$": "$.uuid",
                                        "input.$": "$.input",
                                        "data.$": "$.data"
                                    }
                                },
                                "Retry": [
                                    {
                                        "ErrorEquals": [
                                            "Lambda.ServiceException",
                                            "Lambda.AWSLambdaException",
                                            "Lambda.SdkClientException",
                                            "Lambda.TooManyRequestsException"
                                        ],
                                        "IntervalSeconds": 1,
                                        "MaxAttempts": 2,
                                        "BackoffRate": 1.2
                                    }
                                ],
                                "Next": "Map batch synthesis"
                            },
                            "Map batch synthesis": {
                                "Comment": "MaxConcurrency MUST equal MAP_MAX_CONCURRENCY in states/check_and_preprocess — that state splits the caller's transcripts into at most this many iterators, balanced by estimated work, so a lower value here queues the surplus into a second serial wave that pays every cold model load again while a higher one leaves slots idle. It can exceed this only when one invocation could not hold an iterator's Flow+HiFT work, where an extra iterator (parallel) beats an extra checkpoint resume (serial). Raised 10 -> 40 on 2026-08-10, after execution 630f729f ran 73 transcripts for 52 min at concurrency 1 because one caller batch was one iterator.",
                                "Type": "Map",
                                "MaxConcurrency": 40,
                                "ItemsPath": "$.data.iterators",
                                "ItemSelector": {
                                    "operation": "StateSynthesizeLLM",
                                    "item_id.$": "$$.Map.Item.Index",
                                    "item_data.$": "$$.Map.Item.Value"
                                },
                                "ItemProcessor": {
                                    "ProcessorConfig": {
                                        "Mode": "INLINE"
                                    },
                                    "StartAt": "Synthesize LLM",
                                    "States": {
                                        "Synthesize LLM": {
                                            "Type": "Task",
                                            "Resource": "arn:aws:states:::lambda:invoke",
                                            "OutputPath": "$.Payload",
                                            "Parameters": {
                                                "FunctionName": "${TtsLambda2Cores.Arn}",
                                                "Payload.$": "$"
                                            },
                                            "Retry": [
                                                {
                                                    "ErrorEquals": [
                                                        "LambdaResourceTimeoutException"
                                                    ],
                                                    "IntervalSeconds": 2,
                                                    "MaxAttempts": 10,
                                                    "BackoffRate": 1
                                                },
                                                {
                                                    "ErrorEquals": [
                                                        "Lambda.ClientExecutionTimeoutException",
                                                        "Lambda.ServiceException",
                                                        "Lambda.AWSLambdaException",
                                                        "Lambda.SdkClientException"
                                                    ],
                                                    "IntervalSeconds": 6,
                                                    "MaxAttempts": 4,
                                                    "BackoffRate": 2
                                                },
                                                {
                                                    "ErrorEquals": [
                                                        "Lambda.TooManyRequestsException"
                                                    ],
                                                    "IntervalSeconds": 1,
                                                    "MaxAttempts": 6,
                                                    "BackoffRate": 1.5
                                                },
                                                {
                                                    "ErrorEquals": [
                                                        "Sandbox.Timedout",
                                                        "Lambda.Unknown"
                                                    ],
                                                    "MaxAttempts": 0
                                                }
                                            ],
                                            "Next": "Synthesize Flow HiFT"
                                        },
                                        "Synthesize Flow HiFT": {
                                            "Type": "Task",
                                            "Resource": "arn:aws:states:::lambda:invoke",
                                            "OutputPath": "$.Payload",
                                            "Parameters": {
                                                "FunctionName": "${TtsLambda4Cores.Arn}",
                                                "Payload": {
                                                    "operation": "StateSynthesizeFlowHift",
                                                    "item_id.$": "$.item_id",
                                                    "item_data.$": "$.item_data"
                                                }
                                            },
                                            "Retry": [
                                                {
                                                    "ErrorEquals": [
                                                        "LambdaResourceTimeoutException"
                                                    ],
                                                    "IntervalSeconds": 2,
                                                    "MaxAttempts": 10,
                                                    "BackoffRate": 1
                                                },
                                                {
                                                    "ErrorEquals": [
                                                        "Lambda.ClientExecutionTimeoutException",
                                                        "Lambda.ServiceException",
                                                        "Lambda.AWSLambdaException",
                                                        "Lambda.SdkClientException"
                                                    ],
                                                    "IntervalSeconds": 6,
                                                    "MaxAttempts": 4,
                                                    "BackoffRate": 2
                                                },
                                                {
                                                    "ErrorEquals": [
                                                        "Lambda.TooManyRequestsException"
                                                    ],
                                                    "IntervalSeconds": 1,
                                                    "MaxAttempts": 6,
                                                    "BackoffRate": 1.5
                                                },
                                                {
                                                    "ErrorEquals": [
                                                        "Sandbox.Timedout",
                                                        "Lambda.Unknown"
                                                    ],
                                                    "MaxAttempts": 0
                                                }
                                            ],
                                            "Next": "Verify output"
                                        },
                                        "Verify output": {
                                            "Type": "Task",
                                            "Resource": "arn:aws:states:::lambda:invoke",
                                            "OutputPath": "$.Payload",
                                            "Parameters": {
                                                "FunctionName": "${TtsLambda1Core.Arn}",
                                                "Payload": {
                                                    "operation": "StateVerifyOutput",
                                                    "item_id.$": "$.item_id",
                                                    "item_data.$": "$.item_data"
                                                }
                                            },
                                            "Retry": [
                                                {
                                                    "ErrorEquals": [
                                                        "LambdaResourceTimeoutException"
                                                    ],
                                                    "IntervalSeconds": 2,
                                                    "MaxAttempts": 10,
                                                    "BackoffRate": 1
                                                },
                                                {
                                                    "ErrorEquals": [
                                                        "Lambda.ServiceException",
                                                        "Lambda.AWSLambdaException",
                                                        "Lambda.SdkClientException",
                                                        "Lambda.TooManyRequestsException"
                                                    ],
                                                    "IntervalSeconds": 2,
                                                    "MaxAttempts": 3,
                                                    "BackoffRate": 1.5
                                                }
                                            ],
                                            "End": true
                                        }
                                    }
                                },
                                "ResultPath": "$.data.iterators",
                                "Next": "Usage tracking"
                            },
                            "Usage tracking": {
                                "Type": "Task",
                                "Resource": "arn:aws:states:::lambda:invoke",
                                "OutputPath": "$.Payload",
                                "Parameters": {
                                    "FunctionName": "${TtsLambdaHalfCore.Arn}",
                                    "Payload": {
                                        "operation": "StateUsageTracking",
                                        "execution_arn.$": "$$.Execution.Id",
                                        "uuid.$": "$.uuid",
                                        "input.$": "$.input",
                                        "data.$": "$.data"
                                    }
                                },
                                "Retry": [
                                    {
                                        "ErrorEquals": [
                                            "Lambda.ServiceException",
                                            "Lambda.AWSLambdaException",
                                            "Lambda.SdkClientException",
                                            "Lambda.TooManyRequestsException"
                                        ],
                                        "IntervalSeconds": 1,
                                        "MaxAttempts": 2,
                                        "BackoffRate": 1.2
                                    }
                                ],
                                "End": true
                            }
                        }
                    }

    RegisterVoiceStateMachine:
        Type: AWS::StepFunctions::StateMachine
        Properties:
            StateMachineName: !Sub ${ResourcePrefix}-tts-register-voice
            RoleArn: !GetAtt StateMachineRole.Arn
            LoggingConfiguration:
                Level: ERROR
                IncludeExecutionData: true
                Destinations:
                    - CloudWatchLogsLogGroup:
                          LogGroupArn: !GetAtt StateMachineLogGroup.Arn
            DefinitionString:
                !Sub |-
                    {
                        "Comment": "CosyVoice3 voice registration — validate reference (format + ASR transcript match), extract conditioning in parallel, write registry record.",
                        "StartAt": "Validate reference",
                        "States": {
                            "Validate reference": {
                                "Type": "Task",
                                "Resource": "arn:aws:states:::lambda:invoke",
                                "OutputPath": "$.Payload",
                                "Parameters": {
                                    "FunctionName": "${TtsLambda1Core.Arn}",
                                    "Payload": {
                                        "operation": "StateValidateReference",
                                        "uuid.$": "$.uuid",
                                        "input.$": "$.input",
                                        "data.$": "$.data"
                                    }
                                },
                                "Retry": [
                                    {
                                        "ErrorEquals": [
                                            "Lambda.ServiceException",
                                            "Lambda.AWSLambdaException",
                                            "Lambda.SdkClientException",
                                            "Lambda.TooManyRequestsException"
                                        ],
                                        "IntervalSeconds": 1,
                                        "MaxAttempts": 2,
                                        "BackoffRate": 1.2
                                    }
                                ],
                                "Next": "Extract conditioning"
                            },
                            "Extract conditioning": {
                                "Type": "Parallel",
                                "ResultPath": "$.branches",
                                "Branches": [
                                    {
                                        "StartAt": "Extract speech tokens",
                                        "States": {
                                            "Extract speech tokens": {
                                                "Type": "Task",
                                                "Resource": "arn:aws:states:::lambda:invoke",
                                                "OutputPath": "$.Payload",
                                                "Parameters": {
                                                    "FunctionName": "${TtsLambda2Cores.Arn}",
                                                    "Payload": {
                                                        "operation": "StateExtractSpeechToken",
                                                        "uuid.$": "$.uuid",
                                                        "input.$": "$.input"
                                                    }
                                                },
                                                "Retry": [
                                                    {
                                                        "ErrorEquals": [
                                                            "Lambda.ClientExecutionTimeoutException",
                                                            "Lambda.ServiceException",
                                                            "Lambda.AWSLambdaException",
                                                            "Lambda.SdkClientException",
                                                            "Lambda.TooManyRequestsException"
                                                        ],
                                                        "IntervalSeconds": 3,
                                                        "MaxAttempts": 3,
                                                        "BackoffRate": 2
                                                    }
                                                ],
                                                "End": true
                                            }
                                        }
                                    },
                                    {
                                        "StartAt": "Extract speaker embedding",
                                        "States": {
                                            "Extract speaker embedding": {
                                                "Type": "Task",
                                                "Resource": "arn:aws:states:::lambda:invoke",
                                                "OutputPath": "$.Payload",
                                                "Parameters": {
                                                    "FunctionName": "${TtsLambdaHalfCore.Arn}",
                                                    "Payload": {
                                                        "operation": "StateExtractSpeakerEmbedding",
                                                        "uuid.$": "$.uuid",
                                                        "input.$": "$.input"
                                                    }
                                                },
                                                "Retry": [
                                                    {
                                                        "ErrorEquals": [
                                                            "Lambda.ServiceException",
                                                            "Lambda.AWSLambdaException",
                                                            "Lambda.SdkClientException",
                                                            "Lambda.TooManyRequestsException"
                                                        ],
                                                        "IntervalSeconds": 2,
                                                        "MaxAttempts": 3,
                                                        "BackoffRate": 1.5
                                                    }
                                                ],
                                                "End": true
                                            }
                                        }
                                    },
                                    {
                                        "StartAt": "Extract speech features",
                                        "States": {
                                            "Extract speech features": {
                                                "Type": "Task",
                                                "Resource": "arn:aws:states:::lambda:invoke",
                                                "OutputPath": "$.Payload",
                                                "Parameters": {
                                                    "FunctionName": "${TtsLambdaHalfCore.Arn}",
                                                    "Payload": {
                                                        "operation": "StateExtractSpeechFeat",
                                                        "uuid.$": "$.uuid",
                                                        "input.$": "$.input"
                                                    }
                                                },
                                                "Retry": [
                                                    {
                                                        "ErrorEquals": [
                                                            "Lambda.ServiceException",
                                                            "Lambda.AWSLambdaException",
                                                            "Lambda.SdkClientException",
                                                            "Lambda.TooManyRequestsException"
                                                        ],
                                                        "IntervalSeconds": 2,
                                                        "MaxAttempts": 3,
                                                        "BackoffRate": 1.5
                                                    }
                                                ],
                                                "End": true
                                            }
                                        }
                                    }
                                ],
                                "Next": "Write voice record"
                            },
                            "Write voice record": {
                                "Type": "Task",
                                "Resource": "arn:aws:states:::lambda:invoke",
                                "OutputPath": "$.Payload",
                                "Parameters": {
                                    "FunctionName": "${TtsLambdaHalfCore.Arn}",
                                    "Payload": {
                                        "operation": "StateWriteVoiceRecord",
                                        "uuid.$": "$.uuid",
                                        "input.$": "$.input",
                                        "data.$": "$.data",
                                        "branches.$": "$.branches"
                                    }
                                },
                                "Retry": [
                                    {
                                        "ErrorEquals": [
                                            "Lambda.ServiceException",
                                            "Lambda.AWSLambdaException",
                                            "Lambda.SdkClientException",
                                            "Lambda.TooManyRequestsException"
                                        ],
                                        "IntervalSeconds": 1,
                                        "MaxAttempts": 2,
                                        "BackoffRate": 1.2
                                    }
                                ],
                                "End": true
                            }
                        }
                    }

    # =========================================================================
    # AgentCore Gateway tool Lambda (zip-packaged, no Docker) — thin
    # dispatcher: synthesize_speech, register_voice, get_job_status,
    # list_voice_collection, get_voice, describe_tool
    # =========================================================================
    GatewayToolRole:
        Type: AWS::IAM::Role
        Properties:
            AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                    - Effect: Allow
                      Principal:
                          Service: lambda.amazonaws.com
                      Action: sts:AssumeRole
            ManagedPolicyArns:
                - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
            Policies:
                - PolicyName: GatewayToolAccess
                  PolicyDocument:
                      Version: "2012-10-17"
                      Statement:
                          - Effect: Allow
                            Action:
                                - states:StartExecution
                            Resource:
                                - !Ref SynthesisStateMachine
                                - !Ref RegisterVoiceStateMachine
                          - Effect: Allow
                            Action:
                                - states:DescribeExecution
                            Resource: !Sub arn:aws:states:${AWS::Region}:${AWS::AccountId}:execution:${ResourcePrefix}-tts*:*
                          - Effect: Allow
                            Action:
                                - dynamodb:GetItem
                                - dynamodb:Query
                            Resource:
                                - !GetAtt VoiceTable.Arn
                                - !Sub ${VoiceTable.Arn}/index/catalog-index
                          - Effect: Allow
                            Action:
                                - s3:GetObject
                            Resource: !Sub arn:aws:s3:::${ProxyBucket}/*
                          # callback support (2026-08-31): register/clean
                          # waiter tokens; complete a token synchronously
                          # on an absorbed-terminal submit; persist
                          # outputs.json on that same path
                          - Effect: Allow
                            Action:
                                - dynamodb:PutItem
                                - dynamodb:DeleteItem
                            Resource: !GetAtt CallbackTokensTable.Arn
                          - Effect: Allow
                            Action:
                                - states:SendTaskSuccess
                            # any machine in THIS account+region — the token's machine is the
                            # caller's (ours or a customer's own), never known at deploy time
                            Resource: !Sub arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:*
                          - Effect: Allow
                            Action:
                                - s3:PutObject
                            Resource: !Sub arn:aws:s3:::${ProxyBucket}/micro-workflow/tts-on-aws/*

    GatewayToolFunction:
        Type: AWS::Lambda::Function
        Properties:
            FunctionName: !Sub
                - ${ResourcePrefix}-tts-${fn}
                - fn: !FindInMap [Lambda, GatewayTool, Name]
            Description: !FindInMap [Lambda, GatewayTool, Description]
            Runtime: python3.12
            Handler: lambda_function.lambda_handler
            Timeout: !FindInMap [Lambda, GatewayTool, Timeout]
            MemorySize: !FindInMap [Lambda, GatewayTool, Memory]
            Role: !GetAtt GatewayToolRole.Arn
            Code:
                S3Bucket: !FindInMap [CodeBuild, Source, Bucket]
                S3Key: !Sub
                    - ${keyPrefix}/${package}
                    - keyPrefix: !FindInMap [CodeBuild, Source, KeyPrefix]
                      package: !FindInMap [CodeBuild, Source, GatewayToolPackage]
            Environment:
                Variables:
                    SYNTHESIS_STATE_MACHINE_ARN: !Ref SynthesisStateMachine
                    REGISTER_VOICE_STATE_MACHINE_ARN: !Ref RegisterVoiceStateMachine
                    VOICE_TABLE_NAME: !Ref VoiceTable
                    PROXY_BUCKET: !Ref ProxyBucket
                    CALLBACK_TABLE: !Ref CallbackTokensTable
                    TOOL_VERSION: "%%VERSION%%"
                    # Must equal the GatewayTarget Name in media-toolkit-gateway/cfnstack.yaml
                    TARGET_NAME: "text-to-speech"

    ################################################################################
    # Lambda Resource-Based Policy
    # Allows the AgentCore service principal to invoke the gateway tool Lambda.
    # bedrock-agentcore.amazonaws.com is the service principal for AgentCore Gateway.
    ################################################################################
    GatewayToolPermission:
        Type: AWS::Lambda::Permission
        Properties:
            FunctionName: !GetAtt GatewayToolFunction.Arn
            Action: lambda:InvokeFunction
            Principal: bedrock-agentcore.amazonaws.com
            SourceAccount: !Ref AWS::AccountId

    ############################################################################
    # Push completion (2026-08-31) — bedrock-inference's callback mechanism,
    # ported for audio-description's synth/repair loops: a consumer submits
    # synthesize_speech with callback_task_token and sleeps on ONE
    # waitForTaskToken state; the waker completes every registered token at
    # the SYNTHESIS machine's terminal event, persisting outputs.json at the
    # run prefix FIRST (the callback is a signal; S3 is the data channel).
    # Rows are written by the gateway (registered ONLY when a token is
    # supplied — agent-submitted runs cost one Query miss) and TTL-collected.
    ############################################################################
    CallbackTokensTable:
        Type: AWS::DynamoDB::Table
        Metadata:
            checkov:
                skip:
                    - id: CKV_AWS_119
                      comment: >-
                        sample posture: table holds rebuildable derived state; default SSE is deliberate (see README.md DeletionPolicy decision)
                    - id: CKV_AWS_28
                      comment: >-
                        sample posture: table is rebuildable derived state designed to delete with the stack; PITR protects nothing irreplaceable here
            cfn_nag:
                rules_to_suppress:
                    - id: W74
                      reason: Ephemeral task-token rows with a TTL on every item — no customer data, nothing worth a CMK's key-management cost
                    - id: W78
                      reason: Point-in-time recovery is pointless — a restored row's task token belongs to a wait state that has already timed out
                    - id: W28
                      reason: The explicit name is how the gateway and the waker agree on one table without a CFN import; the TTL is the recovery mechanism
        Properties:
            TableName: !Sub ${ResourcePrefix}-tts-callback-tokens
            BillingMode: PAY_PER_REQUEST
            AttributeDefinitions:
                - { AttributeName: execution_arn, AttributeType: S }
                - { AttributeName: token_hash, AttributeType: S }
            KeySchema:
                - { AttributeName: execution_arn, KeyType: HASH }
                - { AttributeName: token_hash, KeyType: RANGE }
            TimeToLiveSpecification:
                AttributeName: ttl
                Enabled: true

    CallbackWakerLogGroup:
        Type: AWS::Logs::LogGroup
        Properties:
            LogGroupName: !Sub /aws/lambda/${ResourcePrefix}-tts-callback-waker
            RetentionInDays: 30

    CallbackWakerRole:
        Type: AWS::IAM::Role
        Properties:
            AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                    - Effect: Allow
                      Principal:
                          Service: lambda.amazonaws.com
                      Action: sts:AssumeRole
            Policies:
                - PolicyName: CallbackWakerAccess
                  PolicyDocument:
                      Version: "2012-10-17"
                      Statement:
                          # no AWSLambdaBasicExecutionRole (house rule): its
                          # account-wide logs:CreateLogGroup lets a function
                          # that can't reach its declared group silently make
                          # an unmanaged one; logs are scoped to the declared
                          # group's ARN instead.
                          - Effect: Allow
                            Action:
                                - logs:CreateLogStream
                                - logs:PutLogEvents
                            Resource: !GetAtt CallbackWakerLogGroup.Arn
                          - Effect: Allow
                            Action:
                                - dynamodb:Query
                                - dynamodb:DeleteItem
                            Resource: !GetAtt CallbackTokensTable.Arn
                          - Effect: Allow
                            Action:
                                - states:SendTaskSuccess
                            # any machine in THIS account+region — the token's machine is the
                            # caller's (ours or a customer's own), never known at deploy time
                            Resource: !Sub arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:*
                          - Effect: Allow
                            Action:
                                - states:DescribeExecution
                            Resource: !Sub arn:aws:states:${AWS::Region}:${AWS::AccountId}:execution:${ResourcePrefix}-tts*:*
                          - Effect: Allow
                            Action:
                                - s3:PutObject
                            Resource: !Sub arn:aws:s3:::${ProxyBucket}/micro-workflow/tts-on-aws/*

    CallbackWakerFunction:
        Type: AWS::Lambda::Function
        # DependsOn: event-driven, so an in-flight synthesis terminating
        # mid-update could invoke it before its declared group exists —
        # without the edge, Lambda auto-creates the group and the stack
        # dies on the LogGroup create (the documented orphaned-group
        # gotcha). The scoped-logs role above makes the auto-create
        # impossible too; the edge makes the first invocation's logs land.
        DependsOn: CallbackWakerLogGroup
        Properties:
            FunctionName: !Sub ${ResourcePrefix}-tts-callback-waker
            Description: Completes waiting consumers' task tokens at the synthesis machine's terminal event; persists outputs.json first
            Runtime: python3.12
            Handler: callback_waker.lambda_handler
            Timeout: 60
            MemorySize: 256
            Role: !GetAtt CallbackWakerRole.Arn
            Code:
                S3Bucket: !FindInMap [CodeBuild, Source, Bucket]
                S3Key: !Sub
                    - ${keyPrefix}/${package}
                    - keyPrefix: !FindInMap [CodeBuild, Source, KeyPrefix]
                      package: !FindInMap [CodeBuild, Source, GatewayToolPackage]
            Environment:
                Variables:
                    CALLBACK_TABLE: !Ref CallbackTokensTable
                    PROXY_BUCKET: !Ref ProxyBucket

    CallbackTerminalRule:
        Type: AWS::Events::Rule
        Properties:
            Name: !Sub ${ResourcePrefix}-tts-callback-terminal
            Description: Complete registered consumer task tokens when a synthesis execution terminates
            EventPattern:
                source: [aws.states]
                detail-type: ["Step Functions Execution Status Change"]
                detail:
                    status: [SUCCEEDED, FAILED, ABORTED, TIMED_OUT]
                    stateMachineArn:
                        - !Ref SynthesisStateMachine
            State: ENABLED
            Targets:
                - Id: TtsCallbackWaker
                  Arn: !GetAtt CallbackWakerFunction.Arn

    CallbackTerminalRulePermission:
        Type: AWS::Lambda::Permission
        Properties:
            FunctionName: !GetAtt CallbackWakerFunction.Arn
            Action: lambda:InvokeFunction
            Principal: events.amazonaws.com
            SourceArn: !GetAtt CallbackTerminalRule.Arn

Outputs:
    SynthesisStateMachineArn:
        Value: !Ref SynthesisStateMachine
    RegisterVoiceStateMachineArn:
        Value: !Ref RegisterVoiceStateMachine
    VoiceTableName:
        Value: !Ref VoiceTable
    GatewayToolLambdaArn:
        Description: >
            ARN of the AgentCore Gateway tool Lambda.
            Pass this as TextToSpeechToolLambdaArn when deploying media-toolkit-gateway/cfnstack.yaml.
        Value: !GetAtt GatewayToolFunction.Arn
