AWSTemplateFormatVersion: "2010-09-09"

Description: Build and deploy tts-on-aws (CosyVoice3 ONNX) container to ECR, seed model artefacts to S3, deploy synthesis + register-voice state machines. Version %%VERSION%%

Mappings:
    CodeBuild:
        Source:
            Package: "%%PKG_TTS_ON_AWS%%"
            GatewayToolPackage: "%%PKG_GATEWAY_TOOL%%"
            Bucket: "%%BUCKET_NAME%%"
            KeyPrefix: "%%KEY_PREFIX%%"
        Project:
            Type: ARM_CONTAINER
            ComputeType: BUILD_GENERAL1_LARGE
            Image: aws/codebuild/amazonlinux2-aarch64-standard:3.0
    ECR:
        Repository:
            Name: tts-on-aws
            ImageTag: "%%VERSION%%"
    Lambda:
        Function:
            Name: tts
            Description: CosyVoice3 TTS (ONNX Runtime, zero-shot voice cloning)
        GatewayTool:
            Name: gateway-tool
            Description: AgentCore Gateway dispatcher — synthesize_speech + register_voice + voice catalog
            Memory: 256
            Timeout: 30
        # Memory tiers — the full house set of seven
        # (896 / 1792 / 3584 / 5376 / 7168 / 8960 / 10240 MB), so a state can
        # be re-pointed at a different tier during testing without a template
        # change. media-processing, speech-diarization and audiostem-separation
        # declare all seven; shot-segmentation declares five and
        # face-recognition two, but no workflow declares a tier at a DIFFERENT
        # memory or name, so the seven pairs below are the house vocabulary.
        # Declaring a tier no state routes to is likewise already the norm —
        # media-processing routes to 3 of its 7, audiostem 4 of 7,
        # speech-diarization 5 of 7. Each tier costs a Function + a LogGroup +
        # an InvokeFunction grant at deploy time and nothing at runtime,
        # because an unrouted function is never invoked.
        #
        # Which tiers the state machines actually route to today is MEASURED
        # on live runs (README.md §9), not projected. Real Max Memory Used:
        #   HalfCore  — usage tracking (94 MB), write-record
        #   OneCore   — preprocess (86 MB), QC whisper (704 MB)
        #   TwoCores  — LLM INT4 (peak 2873/2938 MB), speech-tokenizer
        #               extraction (peak 3179 MB)
        #   FourCores — Flow+HiFT, FP32 estimator (peak 4998 MB)
        # ThreeCores, FiveCores and SixCores are declared-but-unrouted, and
        # that is deliberate: Flow+HiFT is NOT on the 5376 MB tier despite
        # fitting it, because 5376 was adequate but tight at a 5029 MB peak
        # and 3→4 vCPU cut cold synthesis ~43% (7.4→4.2 s per audio-second)
        # for ~14% more cost — README.md §9 settles it as "keep Flow+HiFT on
        # 7168 MB (4 vCPU); return the LLM to 3584 MB". Re-point a state at
        # 5376 to re-measure that; do not delete the tier.
        HalfCore:
            Memory: 896
            Name: half-core
        OneCore:
            Memory: 1792
            Name: 1-core
        TwoCores:
            Memory: 3584
            Name: 2-cores
        ThreeCores:
            Memory: 5376
            Name: 3-cores
        FourCores:
            Memory: 7168
            Name: 4-cores
        FiveCores:
            Memory: 8960
            Name: 5-cores
        SixCores:
            Memory: 10240
            Name: 6-cores
    DynamoDB:
        Table:
            Suffix: voice-registry
    Models:
        CloudFront:
            BaseUrl: https://dx2y1cac29mt3.cloudfront.net
        S3:
            Prefix: _model_artefacts

Parameters:
    ResourcePrefix:
        Type: String
        Description: Prefix for resource names
    ProxyBucket:
        Type: String
        Description: S3 proxy bucket for model artefacts, voice conditioning blobs, and synthesized output

Resources:

    # =========================================================================
    # Proxy bucket validator — same custom-resource pattern as the sibling
    # workflows (creates the bucket if absent, verifies ownership).
    # =========================================================================
    ProxyBucketValidatorRole:
        Type: AWS::IAM::Role
        Properties:
            AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                    - Effect: Allow
                      Principal:
                          Service: lambda.amazonaws.com
                      Action: sts:AssumeRole
            Policies:
                - PolicyName: ProxyBucketValidation
                  PolicyDocument:
                      Version: "2012-10-17"
                      Statement:
                          # Scoped to the declared group, and deliberately NOT
                          # AWSLambdaBasicExecutionRole: that managed policy
                          # grants logs:CreateLogGroup on every group, which
                          # lets a function that cannot reach its declared
                          # group silently create an unmanaged one instead of
                          # failing visibly.
                          - Effect: Allow
                            Action:
                                - logs:CreateLogStream
                                - logs:PutLogEvents
                            Resource: !GetAtt ProxyBucketValidatorLogGroup.Arn
                          - Effect: Allow
                            Action:
                                - s3:ListBucket
                                - s3:CreateBucket
                                - s3:PutBucketPublicAccessBlock
                            Resource: !Sub "arn:aws:s3:::${ProxyBucket}"

    ProxyBucketValidatorFunction:
        Type: AWS::Lambda::Function
        Properties:
            FunctionName: !Sub ${ResourcePrefix}-tts-bucket-check
            Description: Validates/creates the proxy bucket at stack create/update
            Runtime: python3.12
            Handler: bucket_validator.handler
            Timeout: 60
            MemorySize: 128
            Role: !GetAtt ProxyBucketValidatorRole.Arn
            Code:
                S3Bucket: !FindInMap [CodeBuild, Source, Bucket]
                S3Key: !Sub
                    - ${keyPrefix}/${package}
                    - keyPrefix: !FindInMap [CodeBuild, Source, KeyPrefix]
                      package: !FindInMap [CodeBuild, Source, GatewayToolPackage]

    # Declared explicitly so retention is 30 days and the group dies with the
    # stack. Lambda auto-creates /aws/lambda/<fn> on first invocation with
    # never-expire retention and no stack ownership, which orphans the group
    # on stack delete — and then makes the NEXT create fail with
    # "already exists". Both custom-resource functions shipped that way once.
    #
    # This name tracks the function's -bucket-check rename. LogGroupName is a
    # createOnlyProperty, so the rename REPLACES the resource and CFN deletes
    # the old -tts-proxy-bucket-validator group with everything in it. That was
    # acceptable exactly once, here, because the deployed group held 0 bytes
    # (checked before renaming). Never rename a stack-owned group that holds
    # logs you want.
    ProxyBucketValidatorLogGroup:
        Type: AWS::Logs::LogGroup
        Properties:
            LogGroupName: !Sub /aws/lambda/${ResourcePrefix}-tts-bucket-check
            RetentionInDays: 30

    # Logical id and Type both match the five sibling workflows
    # (ProxyBucketValidator / Custom::ProxyBucketValidator). Renaming BOTH is
    # a replacement, which CFN performs create-before-delete — safe here only
    # because this resource has no explicit physical name and its Delete is a
    # documented no-op that never touches the bucket. Contrast the log groups
    # below, where an explicit LogGroupName makes the same rename fail at
    # pre-flight; see StartBuildLambdaLogGroup.
    ProxyBucketValidator:
        Type: Custom::ProxyBucketValidator
        # The log group must exist BEFORE the function is first invoked, or
        # Lambda wins the race and creates the unmanaged one anyway.
        DependsOn: ProxyBucketValidatorLogGroup
        Properties:
            ServiceToken: !GetAtt ProxyBucketValidatorFunction.Arn
            BucketName: !Ref ProxyBucket
            AccountId: !Ref AWS::AccountId
            Region: !Ref AWS::Region

    # =========================================================================
    # Voice registry table (README.md §5 — modeled on face-recognition's
    # FaceTable). catalog-index: catalog_created = "{catalog}#{epoch:015d}".
    # =========================================================================
    VoiceTable:
        Type: AWS::DynamoDB::Table
        Metadata:
            checkov:
                skip:
                    - id: CKV_AWS_119
                      comment: >-
                        sample posture: table holds rebuildable derived state; default SSE is deliberate (see README.md DeletionPolicy decision)
        Properties:
            TableName: !Sub
                - ${ResourcePrefix}-${suffix}
                - suffix: !FindInMap [DynamoDB, Table, Suffix]
            BillingMode: PAY_PER_REQUEST
            AttributeDefinitions:
                - { AttributeName: pk, AttributeType: S }
                - { AttributeName: sk, AttributeType: S }
                - { AttributeName: catalog, AttributeType: S }
                - { AttributeName: catalog_created, AttributeType: S }
            KeySchema:
                - { AttributeName: pk, KeyType: HASH }
                - { AttributeName: sk, KeyType: RANGE }
            GlobalSecondaryIndexes:
                - IndexName: catalog-index
                  KeySchema:
                      - { AttributeName: catalog, KeyType: HASH }
                      - { AttributeName: catalog_created, KeyType: RANGE }
                  Projection:
                      ProjectionType: ALL
            TimeToLiveSpecification:
                AttributeName: ttl
                Enabled: true
            PointInTimeRecoverySpecification:
                PointInTimeRecoveryEnabled: true

    # =========================================================================
    # CodeBuild — builds the container image, pushes to ECR, seeds model
    # artefacts to S3 (idempotent: skip-if-exists at image and model level).
    # Model archives are produced by package_models.sh and hosted on the
    # house CloudFront under opensource_models/cosyvoice3/…
    # =========================================================================
    CodeBuildRole:
        Type: AWS::IAM::Role
        Properties:
            AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                    - Effect: Allow
                      Principal:
                          Service: codebuild.amazonaws.com
                      Action: sts:AssumeRole
            Policies:
                - PolicyName: CodeBuildAccess
                  PolicyDocument:
                      Version: "2012-10-17"
                      Statement:
                          - Effect: Allow
                            Action:
                                - logs:CreateLogGroup
                                - logs:CreateLogStream
                                - logs:PutLogEvents
                            Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild*
                          - Effect: Allow
                            Action:
                                - ecr:GetAuthorizationToken
                            Resource: "*"
                          - Effect: Allow
                            Action:
                                - ecr:CreateRepository
                                - ecr:DescribeImages
                                - ecr:BatchCheckLayerAvailability
                                - ecr:CompleteLayerUpload
                                - ecr:InitiateLayerUpload
                                - ecr:PutImage
                                - ecr:UploadLayerPart
                            Resource: !Sub
                                - arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${repositoryName}
                                - repositoryName: !FindInMap [ECR, Repository, Name]
                          - Effect: Allow
                            Action:
                                - s3:GetObject
                            Resource: !Sub
                                - arn:aws:s3:::${bucket}/*
                                - bucket: !FindInMap [CodeBuild, Source, Bucket]
                          - Effect: Allow
                            Action:
                                - s3:GetObject
                                - s3:PutObject
                            Resource: !Sub arn:aws:s3:::${ProxyBucket}/*
                          - Effect: Allow
                            Action:
                                - dynamodb:BatchWriteItem
                            Resource: !GetAtt VoiceTable.Arn

    CodeBuildProject:
        Type: AWS::CodeBuild::Project
        Properties:
            Name: !Sub
                - ${ResourcePrefix}-${repositoryName}
                - repositoryName: !FindInMap [ECR, Repository, Name]
            Description: !Sub
                - Build and publish ${desc} docker image to ECR; seed model artefacts to S3
                - desc: !FindInMap [Lambda, Function, Description]
            ServiceRole: !GetAtt CodeBuildRole.Arn
            Source:
                Type: S3
                Location: !Sub
                    - ${bucket}/${keyPrefix}/${package}
                    - bucket: !FindInMap [CodeBuild, Source, Bucket]
                      keyPrefix: !FindInMap [CodeBuild, Source, KeyPrefix]
                      package: !FindInMap [CodeBuild, Source, Package]
                BuildSpec: |
                    version: 0.2
                    phases:
                        pre_build:
                            commands:
                                - echo "== Logging in to Amazon ECR =="
                                - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com
                                - |
                                    echo "== Creating ECR repository if it does not exist =="
                                    aws ecr create-repository --region $AWS_REGION --repository-name $IMAGE_REPO_NAME --image-scanning-configuration scanOnPush=true --encryption-configuration encryptionType=AES256; EXITCODE=$?
                                    if [ $EXITCODE -ne 0 ] && [ $EXITCODE -ne 254 ]; then
                                        echo "ECR create-repository failed with exit code $EXITCODE"
                                        exit $EXITCODE
                                    fi
                                - |
                                    echo "== Checking if $IMAGE_REPO_NAME:$IMAGE_TAG already exists =="
                                    if aws ecr describe-images --region $AWS_REGION --repository-name $IMAGE_REPO_NAME --image-ids imageTag=$IMAGE_TAG 2>/dev/null; then
                                        echo "Image $IMAGE_REPO_NAME:$IMAGE_TAG already exists — skipping build"
                                        touch /tmp/skip_build
                                    else
                                        echo "Image not found — proceeding with build"
                                    fi
                                - |
                                    echo "== Seeding model artefacts to s3://$MODEL_BUCKET/$MODEL_PREFIX =="
                                    seed_model() {
                                        local cf_path=$1
                                        local s3_key=$2
                                        local dest="s3://$MODEL_BUCKET/$s3_key"
                                        if aws s3api head-object --bucket "$MODEL_BUCKET" --key "$s3_key" 2>/dev/null; then
                                            echo "SKIP: $dest already exists"
                                        else
                                            echo "DOWNLOAD: $CF_BASE_URL/$cf_path"
                                            curl -fsSL "$CF_BASE_URL/$cf_path" -o /tmp/model.tar.gz
                                            echo "UPLOAD: $dest"
                                            aws s3 cp /tmp/model.tar.gz "$dest"
                                            rm -f /tmp/model.tar.gz
                                            echo "DONE: $dest"
                                        fi
                                    }
                                    seed_model "opensource_models/cosyvoice3/llm/model.tar.gz"              "$MODEL_PREFIX/cosyvoice3/llm/model.tar.gz"
                                    seed_model "opensource_models/cosyvoice3/flow_hift/model.tar.gz"        "$MODEL_PREFIX/cosyvoice3/flow_hift/model.tar.gz"
                                    seed_model "opensource_models/cosyvoice3/speech_tokenizer/model.tar.gz" "$MODEL_PREFIX/cosyvoice3/speech_tokenizer/model.tar.gz"
                                    seed_model "opensource_models/cosyvoice3/campplus/model.tar.gz"         "$MODEL_PREFIX/cosyvoice3/campplus/model.tar.gz"
                                    seed_model "opensource_models/whisper/base/model.tar.gz"                "$MODEL_PREFIX/faster-whisper-base/model.tar.gz"
                                - |
                                    echo "== Seeding default voice catalog to s3://$MODEL_BUCKET and $VOICE_TABLE_NAME =="
                                    echo "DOWNLOAD: $CF_BASE_URL/opensource_models/voice_catalog/voice_catalog.tar.gz"
                                    curl -fsSL "$CF_BASE_URL/opensource_models/voice_catalog/voice_catalog.tar.gz" -o /tmp/voice_catalog.tar.gz
                                    mkdir -p /tmp/voice_catalog && tar -xzf /tmp/voice_catalog.tar.gz -C /tmp/voice_catalog
                                    echo "== Copying conditioning/preview blobs to $MODEL_BUCKET (unconditional overwrite — small, idempotent data) =="
                                    # Bundle layout is {catalog}/{voice_id}/{conditioning.npz,preview.wav}
                                    # (see package_catalog.sh), flattened directly under
                                    # _model_artefacts/voice_catalog/ — a single recursive copy
                                    # lands every blob at the exact key the manifest's own
                                    # s3_conditioning_key/s3_preview_key already reference
                                    # (rewritten at export time to this destination, not the
                                    # export's own source bucket layout).
                                    aws s3 cp /tmp/voice_catalog/ "s3://$MODEL_BUCKET/_model_artefacts/voice_catalog/" --recursive --no-progress
                                    echo "== Batch-writing voice records into $VOICE_TABLE_NAME =="
                                    # Each {catalog}/manifest.json is already DynamoDB's Item
                                    # wire format (from the export's `aws dynamodb scan` output)
                                    # — BatchWriteItem accepts it directly, no reshaping. 25
                                    # items/call is BatchWriteItem's own hard limit; pure
                                    # bash+jq (no embedded Python — a leading-whitespace-
                                    # preserving YAML block scalar is not a safe place for
                                    # indentation-sensitive Python).
                                    for manifest in /tmp/voice_catalog/*/manifest.json; do
                                        CATALOG_N=$(jq 'length' "$manifest")
                                        ci=0
                                        while [ "$ci" -lt "$CATALOG_N" ]; do
                                            jq -c --argjson i "$ci" --argjson chunk 25 --arg table "$VOICE_TABLE_NAME" \
                                                '{($table): [.[$i:($i+$chunk)][] | {PutRequest: {Item: .}}]}' \
                                                "$manifest" > /tmp/batch.json
                                            aws dynamodb batch-write-item --request-items file:///tmp/batch.json
                                            ci=$((ci + 25))
                                            echo "wrote $(( ci < CATALOG_N ? ci : CATALOG_N ))/$CATALOG_N voice records from $manifest"
                                        done
                                    done
                                    rm -rf /tmp/voice_catalog /tmp/voice_catalog.tar.gz /tmp/batch.json
                        build:
                            commands:
                                - |
                                    if [ -f /tmp/skip_build ]; then
                                        echo "== Skipping docker build — image already exists =="
                                    else
                                        echo "== Building $IMAGE_REPO_NAME:$IMAGE_TAG [$(date)] =="
                                        docker build -t $IMAGE_REPO_NAME:$IMAGE_TAG .
                                        docker tag $IMAGE_REPO_NAME:$IMAGE_TAG $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$IMAGE_REPO_NAME:$IMAGE_TAG
                                        echo "== Pushing $IMAGE_REPO_NAME:$IMAGE_TAG [$(date)] =="
                                        docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$IMAGE_REPO_NAME:$IMAGE_TAG
                                        echo "== Push complete [$(date)] =="
                                    fi
                        post_build:
                            commands:
                                - |
                                    echo "=== post_build CODEBUILD_BUILD_SUCCEEDING=$CODEBUILD_BUILD_SUCCEEDING ==="
                                    if [ -n "$CFN_ResponseURL" ]; then
                                        if [ "$CODEBUILD_BUILD_SUCCEEDING" = "1" ]; then
                                            echo "== Sending SUCCESS to CloudFormation =="
                                            curl -s -X PUT -H "Content-Type:" \
                                                --data-binary "{\"Status\":\"SUCCESS\",\"Reason\":\"Docker image ready and models seeded\",\"PhysicalResourceId\":\"$CFN_PhysicalResourceId\",\"StackId\":\"$CFN_StackId\",\"RequestId\":\"$CFN_RequestId\",\"LogicalResourceId\":\"$CFN_LogicalResourceId\",\"Data\":{\"ImageUri\":\"$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$IMAGE_REPO_NAME:$IMAGE_TAG\"}}" \
                                                "$CFN_ResponseURL"
                                        else
                                            echo "== Sending FAILED to CloudFormation =="
                                            curl -s -X PUT -H "Content-Type:" \
                                                --data-binary "{\"Status\":\"FAILED\",\"Reason\":\"Build or model seeding failed — see CodeBuild logs\",\"PhysicalResourceId\":\"$CFN_PhysicalResourceId\",\"StackId\":\"$CFN_StackId\",\"RequestId\":\"$CFN_RequestId\",\"LogicalResourceId\":\"$CFN_LogicalResourceId\",\"Data\":{}}" \
                                                "$CFN_ResponseURL"
                                        fi
                                    fi
            Environment:
                Type: !FindInMap [CodeBuild, Project, Type]
                ComputeType: !FindInMap [CodeBuild, Project, ComputeType]
                Image: !FindInMap [CodeBuild, Project, Image]
                PrivilegedMode: true
                EnvironmentVariables:
                    - Name: AWS_REGION
                      Value: !Ref AWS::Region
                    - Name: AWS_ACCOUNT_ID
                      Value: !Ref AWS::AccountId
                    - Name: IMAGE_REPO_NAME
                      Value: !FindInMap [ECR, Repository, Name]
                    - Name: IMAGE_TAG
                      Value: !FindInMap [ECR, Repository, ImageTag]
                    - Name: MODEL_BUCKET
                      Value: !Ref ProxyBucket
                    - Name: MODEL_PREFIX
                      Value: !FindInMap [Models, S3, Prefix]
                    - Name: CF_BASE_URL
                      Value: !FindInMap [Models, CloudFront, BaseUrl]
                    - Name: VOICE_TABLE_NAME
                      Value: !Ref VoiceTable
            Artifacts:
                Type: NO_ARTIFACTS
            EncryptionKey: !Sub arn:aws:kms:${AWS::Region}:${AWS::AccountId}:alias/aws/s3
            TimeoutInMinutes: 90
            QueuedTimeoutInMinutes: 60
            LogsConfig:
                CloudWatchLogs:
                    GroupName: /aws/codebuild
                    StreamName: !Sub
                        - ${ResourcePrefix}-${repositoryName}
                        - repositoryName: !FindInMap [ECR, Repository, Name]
                    Status: ENABLED

    # =========================================================================
    # StartBuild custom resource — kicks CodeBuild at stack create and waits
    # for the CFN callback from the buildspec's post_build phase.
    # =========================================================================
    StartBuildLambdaRole:
        Type: AWS::IAM::Role
        Properties:
            AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                    - Effect: Allow
                      Principal:
                          Service: lambda.amazonaws.com
                      Action: sts:AssumeRole
            Policies:
                - PolicyName: !Sub ${ResourcePrefix}StartBuildPolicy
                  PolicyDocument:
                      Version: "2012-10-17"
                      Statement:
                          # Scoped to the declared group, and deliberately NOT
                          # AWSLambdaBasicExecutionRole: that managed policy
                          # grants logs:CreateLogGroup on every group, which
                          # lets a function that cannot reach its declared
                          # group silently create an unmanaged one instead of
                          # failing visibly.
                          - Effect: Allow
                            Action:
                                - logs:CreateLogStream
                                - logs:PutLogEvents
                            Resource: !GetAtt StartBuildLambdaLogGroup.Arn
                          - Effect: Allow
                            Action:
                                - codebuild:StartBuild
                                - codebuild:BatchGetBuilds
                            Resource: !GetAtt CodeBuildProject.Arn

    # UNNAMED, matching the six siblings. CFN generates the physical name, so
    # /aws/lambda/{FunctionName} is unknowable at author time and LoggingConfig
    # below is the only way an unnamed function reaches a declared, stack-owned
    # group. Dropping the old FunctionName REPLACES the function, which is what
    # frees the canonical /aws/lambda/${ResourcePrefix}-tts-start-build name
    # that the group keeps using.
    StartBuildLambda:
        Type: AWS::Lambda::Function
        DependsOn: StartBuildLambdaLogGroup
        Properties:
            Description: Custom resource — starts the CodeBuild project, passes CFN callback env
            Runtime: python3.12
            Handler: index.lambda_handler
            Timeout: 300
            MemorySize: 128
            Role: !GetAtt StartBuildLambdaRole.Arn
            LoggingConfig:
                LogGroup: !Ref StartBuildLambdaLogGroup
            Code:
                ZipFile: |
                    import json
                    import urllib.request
                    import boto3

                    def send_cfn(event, status, reason="", data=None):
                        body = json.dumps({
                            "Status": status, "Reason": reason,
                            "PhysicalResourceId": event.get("PhysicalResourceId",
                                                            event["LogicalResourceId"]),
                            "StackId": event["StackId"],
                            "RequestId": event["RequestId"],
                            "LogicalResourceId": event["LogicalResourceId"],
                            "Data": data or {},
                        }).encode()
                        req = urllib.request.Request(event["ResponseURL"], data=body,
                                                     method="PUT",
                                                     headers={"Content-Type": ""})
                        urllib.request.urlopen(req)

                    def lambda_handler(event, context):
                        print('Event keys:', sorted(event))
                        if event["RequestType"] == "Delete":
                            send_cfn(event, "SUCCESS", "delete no-op")
                            return
                        try:
                            cb = boto3.client("codebuild")
                            cb.start_build(
                                projectName=event["ResourceProperties"]["ProjectName"],
                                environmentVariablesOverride=[
                                    {"name": "CFN_ResponseURL", "value": event["ResponseURL"]},
                                    {"name": "CFN_StackId", "value": event["StackId"]},
                                    {"name": "CFN_RequestId", "value": event["RequestId"]},
                                    {"name": "CFN_LogicalResourceId",
                                     "value": event["LogicalResourceId"]},
                                    {"name": "CFN_PhysicalResourceId",
                                     "value": event.get("PhysicalResourceId",
                                                        event["LogicalResourceId"])},
                                ])
                            # buildspec post_build sends the final CFN response
                        except Exception as exc:
                            send_cfn(event, "FAILED", str(exc))

    # Renamed from StartBuildLogGroup to match the siblings. A logical-id
    # rename that KEEPS an explicit LogGroupName cannot be applied in one
    # update: CFN replaces create-before-delete, so the new id tries to create
    # a name the old id still owns and the stack fails at PRE-FLIGHT —
    # "Validation failed with 1 error(s)" with no per-resource event naming the
    # culprit, then UPDATE_ROLLBACK_COMPLETE. Measured live 2026-08-05 on a
    # throwaway stack with two log groups differing only in logical id.
    #
    # The live eu-west-1 tts stack holds 1913 bytes in this group, so migrating
    # it is a TWO-STEP deploy (drop the resource, then re-add it under the new
    # id) and the logs do not survive. See README.md §12 item 12.
    StartBuildLambdaLogGroup:
        Type: AWS::Logs::LogGroup
        Properties:
            LogGroupName: !Sub /aws/lambda/${ResourcePrefix}-tts-start-build
            RetentionInDays: 30

    # Type matches the six siblings (Custom::StartBuildDelayResponse) — the
    # CodeBuild buildspec's post_build phase, not this Lambda, sends the final
    # CFN response, which is what the name records. The logical id stays
    # BuildAndSeedModels rather than the siblings' StartBuild: this stack's
    # build ALSO seeds six model archives to S3 (see the CodeBuild project),
    # so the id is load-bearing documentation and the deploy-time model
    # seeding is deliberately out of scope for the naming sweep.
    BuildAndSeedModels:
        Type: Custom::StartBuildDelayResponse
        # ProxyBucketValidator: the bucket must exist before CodeBuild seeds
        # models into it. StartBuildLambdaLogGroup: see the note there.
        DependsOn:
            - ProxyBucketValidator
            - StartBuildLambdaLogGroup
        Properties:
            ServiceToken: !GetAtt StartBuildLambda.Arn
            ProjectName: !Ref CodeBuildProject
            Version: "%%VERSION%%"

    # =========================================================================
    # Log groups — one per Lambda tier + gateway, all seven tiers including the
    # three no state routes to yet. The two custom-resource functions declare
    # theirs next to the function itself, because they also need a DependsOn to
    # beat Lambda's auto-creation. Every AWS::Lambda::Function in this template
    # must have a group here or there; enforced by
    # test_units.py::TestEveryLambdaHasADeclaredLogGroup.
    # =========================================================================
    TtsLambdaHalfCoreLogGroup:
        Type: AWS::Logs::LogGroup
        Properties:
            LogGroupName: !Sub
                - /aws/lambda/${ResourcePrefix}-${fn}-${tier}
                - fn: !FindInMap [Lambda, Function, Name]
                  tier: !FindInMap [Lambda, HalfCore, Name]
            RetentionInDays: 30

    TtsLambda1CoreLogGroup:
        Type: AWS::Logs::LogGroup
