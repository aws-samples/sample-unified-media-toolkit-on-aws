    # =========================================================================
    # Workflow Lambda execution role — shared by all three tiers
    # =========================================================================
    TtsLambdaRole:
        Type: AWS::IAM::Role
        Properties:
            AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                    - Effect: Allow
                      Principal:
                          Service: lambda.amazonaws.com
                      Action: sts:AssumeRole
            ManagedPolicyArns:
                - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
            Policies:
                - PolicyName: TtsWorkflowAccess
                  PolicyDocument:
                      Version: "2012-10-17"
                      Statement:
                          - Effect: Allow
                            Action:
                                - s3:GetObject
                                - s3:PutObject
                                - s3:DeleteObject
                            Resource: !Sub arn:aws:s3:::${ProxyBucket}/*
                          - Effect: Allow
                            Action:
                                - s3:ListBucket
                            Resource: !Sub arn:aws:s3:::${ProxyBucket}
                          - Effect: Allow
                            Action:
                                - dynamodb:GetItem
                                - dynamodb:PutItem
                                - dynamodb:DeleteItem
                                - dynamodb:Query
                            Resource:
                                - !GetAtt VoiceTable.Arn
                                - !Sub ${VoiceTable.Arn}/index/catalog-index
                          - Effect: Allow
                            Action:
                                - states:GetExecutionHistory
                            Resource: !Sub arn:aws:states:${AWS::Region}:${AWS::AccountId}:execution:${ResourcePrefix}-*:*
                          - Effect: Allow
                            Action:
                                - lambda:GetFunctionConfiguration
                            Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${ResourcePrefix}-*

    # =========================================================================
    # Workflow Lambda functions — one container image, seven memory tiers.
    # All seven are declared so a state can be re-pointed at another tier
    # without a template change; only four are routed to today. EphemeralStorage
    # follows the routed tiers: 4096 MB at half/1-core, 6144 MB from 2-cores up
    # (the model artefacts land on /tmp).
    # =========================================================================
    TtsLambdaHalfCore:
        Type: AWS::Lambda::Function
        DependsOn: BuildAndSeedModels
        Properties:
            FunctionName: !Sub
                - ${ResourcePrefix}-${fn}-${tier}
                - fn: !FindInMap [Lambda, Function, Name]
                  tier: !FindInMap [Lambda, HalfCore, Name]
            Description: !FindInMap [Lambda, Function, Description]
            PackageType: Image
            Code:
                ImageUri: !Sub
                    - ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${repo}:${tag}
                    - repo: !FindInMap [ECR, Repository, Name]
                      tag: !FindInMap [ECR, Repository, ImageTag]
            Architectures: [arm64]
            MemorySize: !FindInMap [Lambda, HalfCore, Memory]
            Timeout: 900
            EphemeralStorage:
                Size: 4096
            Role: !GetAtt TtsLambdaRole.Arn
            Environment:
                Variables:
                    PROXY_BUCKET: !Ref ProxyBucket
                    MODEL_BUCKET: !Ref ProxyBucket
                    VOICE_TABLE_NAME: !Ref VoiceTable

