<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unified Media Toolkit · content compliance</title>
<style>
/* Palette: dataviz reference instance, house metadata-viz scheme. The three
   categorical slots carry the EVIDENCE LAYER (visual / spoken / word-list);
   moderation categories carry identity by lane position + label, never by
   color. Light-mode green is 2.74:1 (documented WARN) -> relief shipped as
   always-visible lane labels, the findings list, and the table view. */
.viz-root {
  color-scheme: dark;
  --surface-1: #1a1a19; --page: #0d0d0d;
  --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #898781;
  --grid: #2c2c2a; --baseline: #383835; --border: rgba(255,255,255,0.10);
  --series-1: #3987e5;   /* visual (depicted)        */
  --series-2: #d95926;   /* spoken (discourse_facts) */
  --series-3: #199e70;   /* word-list                */
  --good: #0ca30c; --warning: #fab219;
}
:root[data-theme="light"] .viz-root {
  color-scheme: light;
  --surface-1: #fcfcfb; --page: #f9f9f7;
  --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #898781;
  --grid: #e1e0d9; --baseline: #c3c2b7; --border: rgba(11,11,11,0.10);
  --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a;
  --good: #006300; --warning: #fab219;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  background: var(--page); color: var(--text-primary); font-size: 13px; }
.viz-root { display: flex; flex-direction: column; height: 100vh;
  background: var(--page); }
header.bar { display: flex; align-items: center; gap: 10px;
  padding: 10px 16px; border-bottom: 1px solid var(--border);
  background: var(--surface-1); }
header.bar h1 { font-size: 14px; margin: 0; font-weight: 650; }
header.bar .sub { color: var(--text-muted); font-size: 11px; margin-top: 2px; }
.spacer { flex: 1; }
.pill { border: 1px solid var(--border); border-radius: 999px;
  padding: 3px 10px; font-size: 11px; color: var(--text-secondary);
  white-space: nowrap; font-variant-numeric: tabular-nums; }
.pill.rating { color: var(--text-primary); font-weight: 650;
  border-color: var(--warning); }
button { background: var(--surface-1); color: var(--text-secondary);
  border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px;
  font-size: 11px; cursor: pointer; }
button[aria-pressed="true"] { color: var(--text-primary);
  border-color: var(--text-muted); }

.top { display: grid; grid-template-columns: minmax(380px, 52%) 1fr;
  gap: 1px; background: var(--border); min-height: 0; flex: 1; }
.player-pane, .find-pane { background: var(--page); min-width: 0;
  display: flex; flex-direction: column; min-height: 0;
  overflow: hidden; }   /* a squeezed pane clips; the video must never
                           float over the timeline when the table opens */
.video-wrap { background: #000; flex: 0 1 auto; min-height: 0;
  display: flex; align-items: center; justify-content: center; }
video { max-width: 100%; max-height: min(44vh, 100%); display: block; }
.controls { display: flex; align-items: center; gap: 10px;
  padding: 8px 12px; }
.tc { font-family: ui-monospace, Menlo, monospace; font-size: 11px;
  color: var(--text-muted); font-variant-numeric: tabular-nums; }
.just { padding: 4px 12px 10px; color: var(--text-secondary);
  font-size: 12px; line-height: 1.5; overflow: auto; }
.just b { color: var(--text-primary); }

.find-head { display: flex; gap: 8px; align-items: center;
  padding: 8px 12px; border-bottom: 1px solid var(--border); }
.find-head strong { font-size: 12px; }
.find-head select { background: var(--surface-1);
  color: var(--text-secondary); border: 1px solid var(--border);
  border-radius: 6px; font-size: 11px; padding: 3px 6px; }
.find-list { overflow: auto; flex: 1; min-height: 0; }
.finding { display: grid; grid-template-columns: 66px 14px 1fr;
  gap: 8px; padding: 7px 12px; border-bottom: 1px solid var(--grid);
  cursor: pointer; align-items: baseline; }
.finding:hover { background: var(--surface-1); }
.finding.active { background: var(--surface-1);
  box-shadow: inset 2px 0 0 var(--text-muted); }
.finding .ts { font-family: ui-monospace, Menlo, monospace; font-size: 11px;
  color: var(--text-muted); font-variant-numeric: tabular-nums; }
.finding .dot { width: 8px; height: 8px; border-radius: 2px;
  margin-top: 2px; }
.finding .dot.spoken { border-radius: 50%; }
.finding .dot.wordlist { width: 9px; height: 9px; border-radius: 50%;
  border: 2px solid; background: transparent !important; }
.finding .what { min-width: 0; }
.finding .cat { font-size: 10px; font-weight: 700; letter-spacing: .05em;
  color: var(--text-secondary); }
.finding .act { color: var(--text-muted); font-size: 10px;
  font-family: ui-monospace, Menlo, monospace; }
.finding .ev { color: var(--text-primary); font-size: 12px;
  overflow-wrap: break-word; }
.finding .vfy { color: var(--good); font-size: 10px; }

.tl-pane { border-top: 1px solid var(--border); background: var(--surface-1);
  flex-shrink: 0; }
.tl-head { display: flex; align-items: center; gap: 14px;
  padding: 8px 16px 4px; }
.legend { display: flex; gap: 14px; font-size: 11px;
  color: var(--text-secondary); }
.legend .chip { display: inline-block; width: 10px; height: 10px;
  border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.strip { position: relative; height: 44px; margin: 4px 16px 0 116px;
  overflow: hidden; }
.strip img { position: absolute; top: 0; height: 40px;
  border: 1px solid var(--border); border-radius: 2px; cursor: pointer; }
.tl-wrap { position: relative; margin: 2px 16px 10px 0; }
canvas { display: block; width: 100%; }
#tip { position: fixed; z-index: 50; pointer-events: none; display: none;
  background: var(--page); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: 6px; padding: 6px 9px;
  font-size: 11px; max-width: 320px;
  box-shadow: 0 4px 16px rgba(0,0,0,.4); }
#tip .tt { color: var(--text-muted);
  font-family: ui-monospace, Menlo, monospace; }
#tableview { display: none; padding: 12px 16px; overflow: auto;
  background: var(--surface-1); border-top: 1px solid var(--border);
  max-height: 44vh; }
#tableview.on { display: block; }
table { border-collapse: collapse; font-size: 12px; width: 100%; }
th, td { text-align: left; padding: 4px 10px;
  border-bottom: 1px solid var(--grid);
  font-variant-numeric: tabular-nums; vertical-align: top; }
th { color: var(--text-muted); font-weight: 600; font-size: 10px;
  text-transform: uppercase; letter-spacing: .06em; position: sticky;
  top: 0; background: var(--surface-1); }
.note { color: var(--text-muted); font-size: 11px; padding: 6px 16px 10px; }
</style>
</head>
<body class="viz-root" data-palette="#3987e5,#d95926,#199e70">
<div class="viz-root">

<header class="bar">
  <div>
    <h1 id="hdr-title">Content compliance</h1>
    <div class="sub" id="hdr-sub"></div>
  </div>
  <div class="spacer"></div>
  <span class="pill rating" id="pill-rating"></span>
  <span class="pill" id="pill-rec"></span>
  <span class="pill" id="pill-count"></span>
  <button id="btn-table" aria-pressed="false">Table view</button>
  <button id="btn-theme">Light</button>
</header>

<div class="top">
  <div class="player-pane">
    <div class="video-wrap">
      <video id="v" controls preload="metadata" playsinline></video>
    </div>
    <div class="controls">
      <span class="tc" id="tc">00:00 / 00:00</span>
      <button id="btn-cc" aria-pressed="true">Subtitles: On</button>
      <div class="spacer"></div>
      <span class="pill" id="pill-profile"></span>
    </div>
    <div class="just" id="just"></div>
  </div>

  <div class="find-pane">
    <div class="find-head">
      <strong>Flagged moments</strong>
      <select id="cat-filter"><option value="">All categories</option></select>
      <select id="layer-filter">
        <option value="">All layers</option>
        <option value="visual">visual</option>
        <option value="spoken">spoken</option>
        <option value="word-list">word-list</option>
      </select>
      <div class="spacer"></div>
      <button id="btn-follow" aria-pressed="true">Follow</button>
    </div>
    <div class="find-list" id="find-list"></div>
  </div>
</div>

<div class="tl-pane">
  <div class="tl-head">
    <div class="legend" id="legend"></div>
    <div class="spacer"></div>
    <span class="tc" id="tl-info"></span>
  </div>
  <div class="strip" id="strip"></div>
  <div class="tl-wrap">
    <canvas id="tl"></canvas>
    <canvas id="ov" style="position:absolute;inset:0"></canvas>
  </div>
  <div class="note" id="note"></div>
</div>

<div id="tableview"></div>
<div id="tip"></div>
</div>

<script>
const DATA = /*__DATA__*/;

const $ = s => document.querySelector(s);
const css = n => getComputedStyle($('.viz-root')).getPropertyValue(n).trim();
const DUR = DATA.meta.duration_sec;
const LAYER = { visual: '--series-1', spoken: '--series-2',
                'word-list': '--series-3' };
const hms = t => `${String(Math.floor(t/60)).padStart(2,'0')}:` +
                 `${String(Math.floor(t%60)).padStart(2,'0')}`;
const esc = v => String(v ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* header */
$('#hdr-title').textContent = 'Content compliance · ' + DATA.meta.title;
$('#hdr-sub').textContent = DATA.meta.subtitle;
$('#pill-rating').textContent = 'Rating: ' + DATA.rating.suggested;
$('#pill-rec').textContent = DATA.rating.recommendation;
$('#pill-count').textContent = DATA.findings.length + ' findings';
$('#pill-profile').textContent = 'profile: ' + DATA.rating.profile;
$('#just').innerHTML = '<b>Justification.</b> ' + esc(DATA.rating.justification)  // nosemgrep: html.security.audit.insecure-document-method
  + '<br><b>Elements:</b> ' + esc(DATA.rating.elements)
  + '<br><b>Attested none:</b> ' + esc(DATA.attested_none.join(', '));
$('#note').textContent = DATA.meta.note;

/* video */
const v = $('#v');
v.src = DATA.media.video;
v.addEventListener('loadedmetadata', () =>
  $('#tc').textContent = `${hms(0)} / ${hms(v.duration)}`);
const seek = t => { v.currentTime = Math.max(0, t); v.play(); };

/* diarized-transcript subtitle track (inlined VTT via Blob URL) */
if (DATA.vtt) {
  const tr = document.createElement('track');
  tr.kind = 'subtitles'; tr.label = 'Diarized transcript';
  tr.srclang = 'en'; tr.default = true;
  tr.src = URL.createObjectURL(
    new Blob([DATA.vtt], { type: 'text/vtt' }));
  v.appendChild(tr);
  tr.addEventListener('load', () =>
    v.textTracks[0].mode = 'showing');
  $('#btn-cc').onclick = e => {
    const on = v.textTracks[0].mode !== 'showing';
    v.textTracks[0].mode = on ? 'showing' : 'hidden';
    e.target.setAttribute('aria-pressed', on);
    e.target.textContent = on ? 'Subtitles: On' : 'Subtitles: Off';
  };
} else { $('#btn-cc').style.display = 'none'; }

/* findings list */
const catSel = $('#cat-filter');
[...new Set(DATA.findings.map(f => f.cat))].forEach(c => {
  const o = document.createElement('option'); o.value = o.textContent = c;
  catSel.appendChild(o);
});
function renderList() {
  const cat = catSel.value, lay = $('#layer-filter').value;
  const list = $('#find-list'); list.innerHTML = '';  // nosemgrep: html.security.audit.insecure-document-method
  DATA.findings.forEach((f, i) => {
    if ((cat && f.cat !== cat) || (lay && f.layer !== lay)) return;
    const d = document.createElement('div');
    d.className = 'finding'; d.dataset.i = i;
    const col = css(LAYER[f.layer]);
    d.innerHTML = `<span class="ts">${esc(f.ts)}</span>` +  // nosemgrep: html.security.audit.insecure-document-method
      `<span class="dot ${f.layer === 'word-list' ? 'wordlist' :
        f.layer === 'spoken' ? 'spoken' : ''}" style="background:${col};` +
      `border-color:${col}"></span>` +
      `<span class="what"><span class="cat">${esc(f.cat)}</span> ` +
      `<span class="act">${esc(f.act)}</span>` +
      `${f.verified ? ' <span class="vfy">✓ verified</span>' : ''}<br>` +
      `<span class="ev">${esc(f.evidence)}</span></span>`;
    d.onclick = () => seek(f.t - 0.5);
    list.appendChild(d);
  });
}
renderList();
catSel.onchange = renderList; $('#layer-filter').onchange = renderList;

/* legend */
[['visual — depicted (per shot)', '--series-1'],
 ['spoken — discourse_facts (per cue)', '--series-2'],
 ['word-list (per cue)', '--series-3']].forEach(([t, vn]) => {
  const s = document.createElement('span');
  s.innerHTML = `<span class="chip" style="background:${css(vn)}"></span>${t}`;  // nosemgrep: html.security.audit.insecure-document-method
  $('#legend').appendChild(s);
});

/* filmstrip */
const strip = $('#strip');
function layoutStrip() {
  const W = strip.clientWidth;
  strip.innerHTML = '';  // nosemgrep: html.security.audit.insecure-document-method
  DATA.shots.forEach(s => {
    if (!s.thumb) return;
    const img = document.createElement('img');
    img.src = s.thumb; img.title = `shot ${s.id} · ${hms(s.start)}`;
    img.style.left = (s.start / DUR * W) + 'px';
    img.onclick = () => seek(s.start);
    strip.appendChild(img);
  });
}

/* timeline canvas */
const LANES = DATA.categories;
const ROW = 26, PAD_L = 116, PAD_T = 18, PAD_B = 6;
const tl = $('#tl'), ov = $('#ov');
let hitboxes = [];
function drawTL() {
  const wrap = tl.parentElement, W = wrap.clientWidth,
        H = PAD_T + LANES.length * ROW + PAD_B, dpr = devicePixelRatio || 1;
  for (const c of [tl, ov]) {
    c.width = W * dpr; c.height = H * dpr;
    c.style.height = H + 'px';
  }
  const g = tl.getContext('2d'); g.scale(dpr, dpr);
  g.clearRect(0, 0, W, H);
  const x = t => PAD_L + t / DUR * (W - PAD_L - 8);
  /* ruler */
  g.font = '10px ui-monospace, Menlo, monospace';
  g.fillStyle = css('--text-muted'); g.strokeStyle = css('--grid');
  const step = DUR > 300 ? 60 : DUR > 120 ? 30 : 10;
  for (let t = 0; t <= DUR; t += step) {
    g.beginPath(); g.moveTo(x(t), PAD_T - 4);
    g.lineTo(x(t), H - PAD_B); g.stroke();
    g.fillText(hms(t), x(t) + 3, PAD_T - 7);
  }
  hitboxes = [];
  LANES.forEach((cat, li) => {
    const y = PAD_T + li * ROW;
    g.fillStyle = css('--text-secondary');
    g.font = '600 10px system-ui';
    g.fillText(cat, 10, y + ROW / 2 + 3);
    g.strokeStyle = css('--grid');
    g.beginPath(); g.moveTo(PAD_L, y + ROW);
    g.lineTo(W - 8, y + ROW); g.stroke();
    DATA.findings.forEach((f, i) => {
      if (f.cat !== cat) return;
      const col = css(LAYER[f.layer]);
      g.fillStyle = col;
      if (f.layer === 'visual') {           /* span bar, rounded 2px */
        const x0 = x(f.t), x1 = Math.max(x(f.end), x0 + 4);
        const h = 12, yy = y + (ROW - h) / 2;
        g.beginPath(); g.roundRect(x0, yy, x1 - x0, h, 2); g.fill();
        /* 2px surface gap between adjacent fills */
        g.strokeStyle = css('--surface-1'); g.lineWidth = 2; g.stroke();
        hitboxes.push({ x0, x1, y0: yy, y1: yy + h, i });
      } else {                              /* instant marker >= 8px */
        const cx = x(f.t), cy = y + ROW / 2, r = 4.5;
        g.beginPath(); g.arc(cx, cy, r, 0, 7); g.fill();
        g.strokeStyle = css('--surface-1'); g.lineWidth = 2; g.stroke();
        hitboxes.push({ x0: cx - 7, x1: cx + 7, y0: cy - 7, y1: cy + 7, i });
      }
    });
  });
  $('#tl-info').textContent = `${LANES.length} categories · ${hms(DUR)}`;
  layoutStrip();
}
function drawPlayhead() {
  const W = ov.clientWidth, H = ov.clientHeight, dpr = devicePixelRatio || 1;
  const g = ov.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);
  const px = PAD_L + (v.currentTime / DUR) * (W - PAD_L - 8);
  g.strokeStyle = css('--text-primary'); g.lineWidth = 1;
  g.beginPath(); g.moveTo(px, 4); g.lineTo(px, H - 2); g.stroke();
}

/* hover tooltip + click-seek on the overlay canvas */
const tip = $('#tip');
ov.addEventListener('mousemove', e => {
  const r = ov.getBoundingClientRect(),
        mx = e.clientX - r.left, my = e.clientY - r.top;
  const hb = hitboxes.find(h => mx >= h.x0 && mx <= h.x1 &&
                                my >= h.y0 && my <= h.y1);
  if (!hb) { tip.style.display = 'none'; ov.style.cursor = 'default'; return; }
  const f = DATA.findings[hb.i];
  tip.innerHTML = `<span class="tt">${esc(f.ts)}</span> · <b>${esc(f.cat)}</b> · ` +  // nosemgrep: html.security.audit.insecure-document-method
    `${esc(f.layer)}<br>${esc(f.act)}: ${esc(f.evidence)}<br>` +
    `<span class="tt">${esc(f.src)}${f.verified ? ' · verified' : ''}</span>`;
  tip.style.display = 'block';
  tip.style.left = Math.min(e.clientX + 12, innerWidth - 330) + 'px';
  tip.style.top = (e.clientY + 12) + 'px';
  ov.style.cursor = 'pointer';
});
ov.addEventListener('mouseleave', () => tip.style.display = 'none');
ov.addEventListener('click', e => {
  const r = ov.getBoundingClientRect(),
        mx = e.clientX - r.left, my = e.clientY - r.top;
  const hb = hitboxes.find(h => mx >= h.x0 && mx <= h.x1 &&
                                my >= h.y0 && my <= h.y1);
  if (hb) seek(DATA.findings[hb.i].t - 0.5);
  else if (mx > PAD_L) seek((mx - PAD_L) / (r.width - PAD_L - 8) * DUR);
});

/* follow: highlight active finding while playing */
v.addEventListener('timeupdate', () => {
  $('#tc').textContent = `${hms(v.currentTime)} / ${hms(v.duration || DUR)}`;
  drawPlayhead();
  if ($('#btn-follow').getAttribute('aria-pressed') !== 'true') return;
  let last = null;
  document.querySelectorAll('.finding').forEach(el => {
    const f = DATA.findings[+el.dataset.i];
    el.classList.remove('active');
    if (f.t <= v.currentTime + 0.25) last = el;
  });
  if (last) { last.classList.add('active');
    last.scrollIntoView({ block: 'nearest' }); }
});
$('#btn-follow').onclick = e => {
  const b = e.target;
  b.setAttribute('aria-pressed',
    b.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
};

/* table view */
const tv = $('#tableview');
tv.innerHTML = '<table><thead><tr><th>time</th><th>category</th>' +  // nosemgrep: html.security.audit.insecure-document-method
  '<th>layer</th><th>act / kind</th><th>evidence</th><th>source</th>' +
  '<th>verified</th></tr></thead><tbody>' +
  DATA.findings.map(f =>
    `<tr><td>${esc(f.ts)}</td><td>${esc(f.cat)}</td><td>${esc(f.layer)}</td>` +
    `<td>${esc(f.act)}</td><td>${esc(f.evidence)}</td><td>${esc(f.src)}</td>` +
    `<td>${f.verified ? 'yes' : 'NO'}</td></tr>`).join('') +
  '</tbody></table>';
$('#btn-table').onclick = e => {
  tv.classList.toggle('on');
  e.target.setAttribute('aria-pressed', tv.classList.contains('on'));
};

/* theme */
$('#btn-theme').onclick = e => {
  const root = document.documentElement;
  const light = root.getAttribute('data-theme') !== 'light';
  root.setAttribute('data-theme', light ? 'light' : 'dark');
  e.target.textContent = light ? 'Dark' : 'Light';
  drawTL(); drawPlayhead(); renderList();
};

addEventListener('resize', () => { drawTL(); drawPlayhead(); });
drawTL();
</script>
</body>
</html>
