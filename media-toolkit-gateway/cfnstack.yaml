                            - !Ref AWS::NoValue
                          - !If
                            - IngestListEnabled
                            - Effect: Allow
                              Action: lambda:InvokeFunction
                              Resource: !GetAtt UploadFunction.Arn
                            - !Ref AWS::NoValue
            Tags:
                - Key: Environment
                  Value: !Ref Environment
