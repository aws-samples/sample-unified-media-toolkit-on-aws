                                          input_examples:
                                              Type: object
                                              Description: "Per tool (keyed by tool name under tools): required lists the fields the gateway refuses without — a prose entry like 'a OR b' states a one-of rule this schema cannot express — and example is a minimal valid request including recommended optionals; every other accepted parameter is declared, with type and description, in the tool's InputSchema. The shapes and field names are the contract; every s3 uri, ARN, and id value is an invented placeholder to substitute. Each submit example passes the gateway's own input validation (pinned by a unit test); where a one-of rule exists, alternatives holds one valid example of each other form. Static per tool version — cache it for the session."


    ProgramStructureAnalysisTarget:
        Type: AWS::BedrockAgentCore::GatewayTarget
        Condition: ProgramStructureAnalysisEnabled
        Properties:
            Name: program-structure-analysis
            Description: "Program structure (Layer-2, code-only, no model calls): CPL-style markers, graded break candidates, narrative sequences, and in news mode the rundown with per-shot roles"
            GatewayIdentifier: !Ref MediaWorkflowGateway
            CredentialProviderConfigurations:
                - CredentialProviderType: GATEWAY_IAM_ROLE
            TargetConfiguration:
                Mcp:
                    Lambda:
                        LambdaArn: !Ref ProgramStructureAnalysisToolLambdaArn
                        ToolSchema:
                            InlinePayload:
                                - Name: analyze_program_structure
                                  Description: "Assemble a programme's structure from completed sibling runs: CPL-style markers (blackframes, technical slate, bars+tone, opening/main title, interior title cards, end credits + logos, textless tail), graded break candidates (prospective — where a break COULD cleanly go, with per-seam evidence; never a claim about where a network historically broke), the word-level gap map + per-scene orientation necessity, and per mode: narrative -> evidence-graded sequences; news -> the rundown (stories with three start times, first-class tease/promo/headlines interstitials, per-shot studio/field/graphics roles). Pure code over existing artifacts — runs in seconds, costs no inference, free to re-run. Async: poll get_job_status with the returned job_id."
                                  InputSchema:
                                      Type: object
                                      Description: "Structure request. Two run pointers are required; the rest widen the products."
                                      Properties:
                                          shot_segmentation_s3uri:
                                              Type: string
                                              Description: "s3:// uri of a COMPLETED shot-segmentation run prefix on the proxy bucket (micro-workflow/shot-segmentation/{workflow_id})."
                                          shot_metadata_s3uri:
                                              Type: string
                                              Description: "s3:// uri of a COMPLETED shot-metadata-enrichment run prefix — shot_metadata.jsonl (shot kinds, news fields) and scenes.json drive markers, roles and sequences."
                                          conversation_analysis_s3uri:
                                              Type: string
                                              Description: "Optional: a conversation-analysis run (prefix or its conversation_analysis.json). REQUIRED for news mode (the stories ARE its discourse segments); on narrative content it supplies the content type for mode=auto."
                                          transcript_s3uri:
                                              Type: string
                                              Description: "Optional: a speech-diarization run (prefix or its transcripts/final_transcript.json). Enables the gap map (word-level dialogue-free windows incl. soft untranscribed-speech windows) and orientation necessity."
                                          audiostem_s3uri:
                                              Type: string
                                              Description: "Optional: an audiostem-separation run prefix. Its stem_activity.json corroborates bars+tone, scores break-candidate silence, gates music-dominant windows and anchors sequence music bridges."
                                          mode:
                                              Type: string
                                              Description: "auto (default: conversation-analysis's overall_content_type decides, News Program -> news, else narrative) | narrative | news. The chosen mode and its evidence land in psa_manifest.json."
                                          idempotency_token:
                                              Type: string
                                              Description: "Same token + same parameters returns the EXISTING run. PSA is deterministic over its inputs, so identical requests genuinely are the same work."
                                      Required: ["shot_segmentation_s3uri", "shot_metadata_s3uri"]
                                - Name: get_job_status
                                  Description: "Poll a program-structure-analysis job by its execution ARN. Runs complete in seconds. On SUCCEEDED, reports the resolved mode and lists the labeled outputs (structure, rundown in news mode, manifest) — presign uris via media-outputs to download."
                                  InputSchema:
                                      Type: object
                                      Description: "Status request."
                                      Properties:
                                          job_id:
                                              Type: string
                                              Description: "The execution ARN returned by analyze_program_structure."
                                      Required: ["job_id"]
                                - Name: describe_tool
                                  Description: "Backend metadata for this target: tool version, state machine ARN, a one-paragraph description, and the field-level output contract for structure.json / rundown.json / psa_manifest.json."
                                  InputSchema:
                                      Type: object
                                      Description: "No parameters."
                                      Properties:
                                          detail:
                                              Type: string
                                              Description: "Ignored; present because an empty Properties block is rejected by schema validation."
                                  OutputSchema:
                                      Type: object
                                      Description: "Backend metadata."
                                      Properties:
                                          version:
                                              Type: string
                                              Description: "Deployed tool version"
                                          state_machine_arn:
                                              Type: string
                                              Description: "The program-structure-analysis state machine ARN"
                                          description:
                                              Type: string
                                              Description: "One-paragraph backend description"
                                          output_contract:
                                              Type: object
                                              Description: "Field-level contract for the labeled outputs: basename, mime, description, and a compact example of each file's field names/nesting. Anything not listed is internal and may change without notice."
                                          input_examples:
                                              Type: object
                                              Description: "Per tool (keyed by tool name under tools): required lists the fields the gateway refuses without — a prose entry like 'a OR b' states a one-of rule this schema cannot express — and example is a minimal valid request including recommended optionals; every other accepted parameter is declared, with type and description, in the tool's InputSchema. The shapes and field names are the contract; every s3 uri, ARN, and id value is an invented placeholder to substitute. Each submit example passes the gateway's own input validation (pinned by a unit test); where a one-of rule exists, alternatives holds one valid example of each other form. Static per tool version — cache it for the session."

    # -------------------------------------------------------------------------
    # Gateway Target — Audio Description
    # -------------------------------------------------------------------------
    AudioDescriptionTarget:
        Type: AWS::BedrockAgentCore::GatewayTarget
        Condition: AudioDescriptionEnabled
        Properties:
            Name: audio-description
            Description: "Audio description (Layer-2, LLM + TTS): timed broadcast-practice AD script from sibling runs — srt/vtt/DAPT captions, cue ledger, review page, render manifest for media-processing ad_mix"
            GatewayIdentifier: !Ref MediaWorkflowGateway
            CredentialProviderConfigurations:
                - CredentialProviderType: GATEWAY_IAM_ROLE
            TargetConfiguration:
                Mcp:
                    Lambda:
                        LambdaArn: !Ref AudioDescriptionToolLambdaArn
                        ToolSchema:
                            InlinePayload:
                                - Name: generate_ad
                                  Description: "Write, synthesize, fit and repair an audio-description script for a programme from completed sibling runs. Long-running (roughly 15-60 minutes with model and TTS spend; loops sleep on push callbacks) — poll get_job_status with the returned job_id. The workflow renders NO audio mix: on SUCCEEDED, chain media-processing___process_media with output_groups=[{format: 'ad_mix', render_manifest_s3uri: <the render-manifest output uri>}] on the programme source to get the ducked, loudness-normalized AD track. A `mix` parameter here is refused with exactly that instruction."
                                  InputSchema:
                                      Type: object
                                      Description: "AD request. Four sibling run prefixes, a people source (face_recognition_s3uri or cast_resolution_s3uri), and a voice are required."
                                      Properties:
                                          shot_segmentation_s3uri:
                                              Type: string
                                              Description: "s3:// uri of a COMPLETED shot-segmentation run prefix on the proxy bucket (micro-workflow/shot-segmentation/{workflow_id})."
                                          shot_metadata_s3uri:
                                              Type: string
                                              Description: "s3:// uri of a COMPLETED shot-metadata-enrichment run prefix — shot descriptions, on-screen text and shot kinds are the visual evidence the script is written from."
                                          speech_diarization_s3uri:
                                              Type: string
                                              Description: "s3:// uri of a COMPLETED speech-diarization run prefix — word-level timings define the dialogue-free windows narration must fit into."
                                          conversation_analysis_s3uri:
                                              Type: string
                                              Description: "s3:// uri of a COMPLETED conversation-analysis run prefix — scenes and settings drive scene-entry grounding duties."
                                          face_recognition_s3uri:
                                              Type: string
                                              Description: "s3:// uri of a COMPLETED face-recognition run prefix — identity keys the name map binds to speakable character names. Required UNLESS cast_resolution_s3uri is supplied: a cast run (2026-09-08 or later) exports person appearance timelines and can be the sole people source."
                                          voice:
                                              Type: string
                                              Description: "REQUIRED: a text-to-speech voice_id for the narration (text-to-speech___list_voice_collection shows the catalog)."
                                          audiostem_s3uri:
                                              Type: string
                                              Description: "Optional: an audiostem-separation run prefix — music/sfx activity evidence; enables the sung-vocal policy."
                                          decisions_s3uri:
                                              Type: string
                                              Description: "Optional: reviewer-accepted absence decisions from a previous run's review."
                                          cast_resolution_s3uri:
                                              Type: string
                                              Description: "A COMPLETED cast-resolution run prefix — adjudicated person bindings anchoring the character name map, and (runs from 2026-09-08 on) a full people source that can replace face_recognition_s3uri. When face_recognition/speech_diarization are also passed they must be the runs this cast run was built from (ids are per-run labels); a mismatch fails at validation — the submit still returns a handle."
                                          sung_vocal_policy:
                                              Type: string
                                              Description: "narrate (default) | avoid — avoid closes narration windows over untranscribed sung vocals."
                                          language:
                                              Type: string
                                              Description: "Optional narration language; defaults to the programme's language from diarization."
                                          title:
                                              Type: string
                                              Description: "Optional delivery basename for the srt/vtt/DAPT files."
                                          history_scope:
                                              Type: string
                                              Description: "YOUR asset identity for the inference-history prefix (1-64 chars of A-Za-z0-9_.-), e.g. asset.{yourAssetId}. Absent -> derived from the sibling runs' workflow ids."
                                          idempotency_token:
                                              Type: string
                                              Description: "Same token + same parameters returns the EXISTING run; a new token is also the rerun mechanism after a prompt rebuild (prompt bytes are not in the request hash)."
                                      Required: ["shot_segmentation_s3uri", "shot_metadata_s3uri", "speech_diarization_s3uri", "conversation_analysis_s3uri", "voice"]
                                  OutputSchema:
                                      Type: object
                                      Description: "A job HANDLE, never results — poll get_job_status."
                                      Properties:
                                          job_id:
                                              Type: string
                                              Description: "Step Functions execution ARN — pass to get_job_status"
                                          workflow_id:
                                              Type: string
                                              Description: "Deterministic id derived from the request (uuid5); identical requests share it"
                                          status:
                                              Type: string
                                              Description: "Step Functions execution status (RUNNING on a fresh start; an absorbed resubmit reports the existing run's)"
                                          output_s3_prefix:
                                              Type: string
                                              Description: "s3:// prefix every output of this run lands under"
                                          current_state:
                                              Type: string
                                              Description: "The state a RUNNING absorbed run is currently in"
                                          message:
                                              Type: string
                                              Description: "Present when absorbed into an existing run: this call did not resubmit"
                                          error:
                                              Type: string
                                              Description: "Failure cause when an absorbed run already ended terminally"
                                - Name: get_job_status
                                  Description: "Poll an audio-description job by its execution ARN. On SUCCEEDED, lists the labeled outputs (srt, vtt, dapt, review, cue-ledger, windows, gaps, render-manifest, manifest, usage) with per-label descriptions — presign uris via media-outputs to download; feed the render-manifest uri to media-processing ad_mix for the audio track."
                                  InputSchema:
                                      Type: object
                                      Description: "Status request."
                                      Properties:
                                          job_id:
                                              Type: string
                                              Description: "The execution ARN returned by generate_ad."
                                      Required: ["job_id"]
                                  OutputSchema:
                                      Type: object
                                      Description: "Job status; outputs[] on SUCCEEDED."
                                      Properties:
                                          job_id:
                                              Type: string
                                              Description: "The execution ARN polled"
                                          status:
                                              Type: string
                                              Description: "RUNNING | SUCCEEDED | FAILED | TIMED_OUT | ABORTED"
                                          workflow_id:
                                              Type: string
                                              Description: "The run's deterministic id (the execution name)"
                                          output_s3_prefix:
                                              Type: string
                                              Description: "s3:// prefix the outputs land under"
                                          current_state:
                                              Type: string
                                              Description: "The state a RUNNING execution is currently in"
                                          shipped_cues:
                                              Type: number
                                              Description: "Cues in the delivered script (on SUCCEEDED)"
                                          gaps:
                                              Type: number
                                              Description: "Unnarrated coverage gaps the run recorded (on SUCCEEDED; details in the gaps output)"
                                          outputs:
                                              Type: array
                                              Description: "Labeled output files (on SUCCEEDED). Select by label, never parse filenames."
                                              Items:
                                                  Type: object
                                                  Description: "One labeled output file"
                                                  Properties:
                                                      uri:
                                                          Type: string
                                                          Description: "s3:// uri — presign via media-outputs___get_download_url"
                                                      mime:
                                                          Type: string
                                                          Description: "Content type"
                                                      label:
                                                          Type: string
                                                          Description: "Role: srt | vtt | dapt | review | cue-ledger | windows | gaps | render-manifest | manifest | usage"
                                                      desc:
                                                          Type: string
                                                          Description: "One-line role description from the tool's output contract"
                                                  Required:
                                                      - uri
                                                      - label
                                          error:
                                              Type: string
                                              Description: "Failure cause (present when status is FAILED, TIMED_OUT, or ABORTED)"
                                - Name: describe_tool
                                  Description: "Backend metadata for this target: tool version, state machine ARN, a one-paragraph description, and the field-level output contract for the labeled outputs."
                                  InputSchema:
                                      Type: object
                                      Description: "No parameters."
                                      Properties:
                                          detail:
                                              Type: string
                                              Description: "Ignored; present because an empty Properties block is rejected by schema validation."
                                  OutputSchema:
                                      Type: object
                                      Description: "Backend metadata."
                                      Properties:
                                          version:
                                              Type: string
                                              Description: "Deployed tool version"
                                          state_machine_arn:
                                              Type: string
                                              Description: "The audio-description state machine ARN"
                                          description:
                                              Type: string
                                              Description: "One-paragraph backend description"
                                          output_contract:
                                              Type: object
                                              Description: "Field-level contract for the labeled outputs. Anything not listed is internal and may change without notice."
                                          input_examples:
                                              Type: object
                                              Description: "Per tool (keyed by tool name under tools): required lists the fields the gateway refuses without — a prose entry like 'a OR b' states a one-of rule this schema cannot express — and example is a minimal valid request including recommended optionals; every other accepted parameter is declared, with type and description, in the tool's InputSchema. The shapes and field names are the contract; every s3 uri, ARN, and id value is an invented placeholder to substitute. Each submit example passes the gateway's own input validation (pinned by a unit test); where a one-of rule exists, alternatives holds one valid example of each other form. Static per tool version — cache it for the session."


    # -------------------------------------------------------------------------
    # Gateway Target: cast-resolution
    # Resolves WHO is in a media asset: binds diarization SPEAKER_IDs,
    # face-recognition person ids and on-screen text into person entities.
    # Consumes frame-inspection and bedrock-inference INTERNALLY (witness
    # reads + LLM enrichment) — an agent hands over sibling run prefixes.
    # -------------------------------------------------------------------------
    CastResolutionTarget:
        Type: AWS::BedrockAgentCore::GatewayTarget
        Condition: CastResolutionEnabled
        Properties:
            Name: cast-resolution
            Description: "Person binding: sibling run prefixes in, person entities with names/types/roles + pinned remap tables out — names only from independent mechanisms, abstention over fabrication"
            GatewayIdentifier: !Ref MediaWorkflowGateway
            CredentialProviderConfigurations:
                - CredentialProviderType: GATEWAY_IAM_ROLE
            TargetConfiguration:
                Mcp:
                    Lambda:
                        LambdaArn: !Ref CastResolutionToolLambdaArn
                        ToolSchema:
                            InlinePayload:
                                - Name: resolve_cast
                                  Description: "Bind the anonymous identities sibling runs emit — diarization SPEAKER_IDs, face person ids, on-screen text names — into person entities with names, types (on_camera_speaker/voice_only/silent_face/depicted_only/uncertain), character names and news roles, plus remap tables pinned to the exact sibling workflow_ids. Names come only from independent mechanisms (self-introductions, vocatives, chyrons, credits, face sources); co-occurrence alone proposes, never names; a critic demotes contradictions rather than guessing. Async — poll get_job_status. Feed it the RUN PREFIXES of completed sibling runs (at least one identity source)."
                                  InputSchema:
                                      Type: object
                                      Description: "Binding request. All inputs are sibling RUN PREFIXES on the proxy bucket (the s3:// prefix a sibling's get_job_status reports as output_s3_prefix). At least one of the two identity sources is required; more sources = more binding evidence."
                                      Properties:
                                          speech_diarization_s3uri:
                                              Type: string
                                              Description: "A speech-diarization run prefix (identity source): speakers, quotes, transcript name cues"
                                          face_recognition_s3uri:
                                              Type: string
                                              Description: "A face-recognition run prefix (identity source): face tracks, celebrity/collection names"
                                          shot_segmentation_s3uri:
                                              Type: string
                                              Description: "A shot-segmentation run prefix (optional; REQUIRED for on-screen text reads — the witness reads its retained frame archives)"
                                          shot_metadata_s3uri:
                                              Type: string
                                              Description: "A shot-metadata-enrichment run prefix (optional): overlay-text names and text-presence evidence that trigger focus reads"
                                          read_onscreen_text:
                                              Type: boolean
                                              Description: "Absent -> true: read credits/chyrons/titles from frames via the internal witness (~$0.35/asset batch; the on-screen name channel, the only source of character/cast pairs). false binds on free evidence only ($0). In the request hash: different economics is different work."
                                          llm_enrichment:
                                              Type: boolean
                                              Description: "Absent -> true: the LLM enrichment tier (~$0.05/asset) — dialogue-addressee resolution, credits cast adjudication (verbatim-universe firewalled), report-only contradiction flags in critic_review. false skips both enrichment rounds. In the request hash."
                                          use_batch:
                                              Type: boolean
                                              Description: "Absent -> true: batch-price the witness reads (up to the 24h Bedrock batch SLA — right for bulk). false = sync reads for latency-sensitive callers at ~2x read cost. In the request hash."
                                          idempotency_token:
                                              Type: string
                                              Description: "Optional (1-80 chars of A-Z a-z 0-9 _ . -). Same token + same parameters returns the EXISTING run; a fresh token forces a re-bind of identical inputs."
                                  OutputSchema:
                                      Type: object
                                      Description: "A HANDLE, never results (results come from get_job_status). An identical resubmit is ABSORBED into the existing run and carries a `message` saying so."
                                      Properties:
                                          job_id:
                                              Type: string
                                              Description: "Step Functions execution ARN — pass to get_job_status"
                                          workflow_id:
                                              Type: string
                                              Description: "The service's name for the run; outputs land under micro-workflow/cast-resolution/{workflow_id}/"
                                          status:
                                              Type: string
                                              Description: "RUNNING on a fresh start; the existing run's status on an absorbed resubmit"
                                          output_s3_prefix:
                                              Type: string
                                              Description: "s3:// prefix where the labeled outputs land"
                                          message:
                                              Type: string
                                              Description: "Present ONLY on an absorbed resubmit — the signal this call did not start a second run"
                                          current_state:
                                              Type: string
                                              Description: "Present only on a RUNNING absorb: the state the existing run is in"
                                          error:
                                              Type: string
                                              Description: "Present only when an absorbed run already failed: the cause"
                                - Name: get_job_status
                                  Description: "Poll a cast-resolution job by its execution ARN. Free-evidence binds finish in seconds; with on-screen reads, minutes (sync) or up to the batch SLA (use_batch). On SUCCEEDED, lifts the persons header (persons, named, cross_modal, vetoes, sources) and lists the labeled outputs that EXIST (speaker-map/face-map are conditional on their source being present) — presign uris via media-outputs to download."
                                  InputSchema:
                                      Type: object
                                      Description: "Poll request"
                                      Properties:
                                          job_id:
                                              Type: string
                                              Description: "Step Functions execution ARN returned by resolve_cast"
                                      Required:
                                          - job_id
                                  OutputSchema:
                                      Type: object
                                      Description: "Status + header + outputs when complete"
                                      Properties:
                                          job_id:
                                              Type: string
                                              Description: "The execution ARN polled"
                                          status:
                                              Type: string
                                              Description: "RUNNING | SUCCEEDED | FAILED | TIMED_OUT | ABORTED"
                                          workflow_id:
                                              Type: string
                                              Description: "The run id (last ARN segment)"
                                          output_s3_prefix:
                                              Type: string
                                              Description: "Where the outputs land"
                                          current_state:
                                              Type: string
                                              Description: "Present while RUNNING: the state machine's current state"
                                          persons:
                                              Type: integer
                                              Description: "On SUCCEEDED: person entities found"
                                          named:
                                              Type: integer
                                              Description: "On SUCCEEDED: persons with a resolved name (unnamed persons are first-class output, never dropped)"
                                          cross_modal:
                                              Type: integer
                                              Description: "On SUCCEEDED: on_camera_speaker persons (speaker+face bound)"
                                          vetoes:
                                              Type: integer
                                              Description: "On SUCCEEDED: critic vetoes (merges blocked / names demoted, each with a machine-readable reason in persons.json)"
                                          sources:
                                              Type: array
                                              Description: "On SUCCEEDED: which sibling sources fed this bind"
                                              Items:
                                                  Type: string
                                                  Description: "Source key"
                                          outputs:
                                              Type: array
                                              Description: "On SUCCEEDED: labeled outputs that exist — persons (persons.json), speaker-map, face-map, usage"
                                              Items:
                                                  Type: object
                                                  Description: "One output: {uri, mime, label, desc?}"
                                          error:
                                              Type: string
                                              Description: "Present on FAILED/TIMED_OUT/ABORTED: the cause"
                                - Name: describe_tool
                                  Description: "Describe this tool: deployed version, state machine ARN, backend description, and the output contract (field-level meaning of persons.json and the remap tables)."
                                  InputSchema:
                                      Type: object
                                      Description: "No parameters"
                                  OutputSchema:
                                      Type: object
                                      Description: "Static metadata"
                                      Properties:
                                          version:
                                              Type: string
                                              Description: "Deployed tool version"
                                          state_machine_arn:
                                              Type: string
                                              Description: "The cast-resolution state machine ARN"
                                          description:
                                              Type: string
                                              Description: "One-paragraph backend description"
                                          output_contract:
                                              Type: object
                                              Description: "Field-level contract for the labeled outputs. Anything not listed is internal and may change without notice."
                                          input_examples:
                                              Type: object
                                              Description: "Per tool (keyed by tool name under tools): required lists the fields the gateway refuses without — a prose entry like 'a OR b' states a one-of rule this schema cannot express — and example is a minimal valid request including recommended optionals; every other accepted parameter is declared, with type and description, in the tool's InputSchema. The shapes and field names are the contract; every s3 uri, ARN, and id value is an invented placeholder to substitute. Each submit example passes the gateway's own input validation (pinned by a unit test); where a one-of rule exists, alternatives holds one valid example of each other form. Static per tool version — cache it for the session."

    # -------------------------------------------------------------------------
    # Gateway Target: artwork-selection
    # Selects representative artwork frames per archetype (hero close-up,
    # two-shot, establishing vista). Code qualifies candidates from sibling
    # run outputs; ONE vision pass (bedrock-inference, consumed INTERNALLY)
    # orders each pre-qualified slate and flags unusable frames — the model
    # never scans the program and cannot add a candidate.
    # -------------------------------------------------------------------------
    ArtworkSelectionTarget:
        Type: AWS::BedrockAgentCore::GatewayTarget
        Condition: ArtworkSelectionEnabled
        Properties:
            Name: artwork-selection
            Description: "Artwork selection: sibling run prefixes in, ranked diverse artwork candidate slates per archetype out — code qualifies, one vision pass orders and flags; the final pick stays editorial"
            GatewayIdentifier: !Ref MediaWorkflowGateway
            CredentialProviderConfigurations:
                - CredentialProviderType: GATEWAY_IAM_ROLE
            TargetConfiguration:
                Mcp:
                    Lambda:
                        LambdaArn: !Ref ArtworkSelectionToolLambdaArn
                        ToolSchema:
                            InlinePayload:
                                - Name: select_artwork
                                  Description: "Select representative artwork frames for an asset: code filters and ranks candidate shots per archetype (hero_closeup / two_shot / establishing_vista) from sibling run outputs, grabs one proxy-resolution frame per candidate, and one vision pass reranks WITHIN each pre-qualified slate and flags unusable frames. Output is a ranked diverse slate per archetype (one candidate per shot, no shot shared across archetypes) with the evidence that qualified each frame. Async — poll get_job_status. Feed it the RUN PREFIXES of completed sibling runs."
                                  InputSchema:
                                      Type: object
                                      Description: "Selection request. Prefix inputs are sibling RUN PREFIXES on the proxy bucket (the s3:// prefix a sibling's get_job_status reports as output_s3_prefix). shot_segmentation and shot_metadata are required; without an identity source (cast_resolution, or face_recognition as fallback) the person archetypes return empty slates."
                                      Properties:
                                          shot_segmentation_s3uri:
                                              Type: string
                                              Description: "A shot-segmentation run prefix (REQUIRED): shot lattice, stability statistics, and the per-shot frame archives the grabs come from"
                                          shot_metadata_s3uri:
                                              Type: string
                                              Description: "A shot-metadata-enrichment run prefix (REQUIRED): the semantic fields the archetype queries read (camera shot type, people, on-screen text, sentiment)"
                                          cast_resolution_s3uri:
                                              Type: string
                                              Description: "A cast-resolution run prefix (recommended): top cast by screen time drives hero/two-shot targeting with real names"
                                          face_recognition_s3uri:
                                              Type: string
                                              Description: "A face-recognition run prefix (optional): identity FALLBACK when cast_resolution is absent — top faces by screen time via temporal track join; unnamed face clusters ride under anonymous person_* labels. Ignored for identity when cast_resolution_s3uri is present."
                                          program_structure_s3uri:
                                              Type: string
                                              Description: "A program-structure-analysis run prefix (optional): credits/titles/bars spans are excluded IN ADDITION to the spoiler cut"
                                          selection_brief:
                                              Type: string
                                              Description: "Optional editorial free text (max 2000 chars), e.g. 'feature the guest star, favor warm dusk exteriors, avoid weapons'. Translated into closed-vocabulary amendments: it re-weights among pre-qualified candidates and steers the judge, but can never touch eligibility rules, invent an archetype, or move the spoiler cut. In the request hash."
                                          genre:
                                              Type: string
                                              Description: "Optional genre hint selecting the archetype profile; never inferred from content. Unknown or absent = the neutral profile. In the request hash."
                                          archetypes:
                                              Type: array
                                              Description: "Optional explicit archetype list from the closed vocabulary: hero_closeup, two_shot, establishing_vista. Order matters — earlier archetypes get first claim on shots that could serve two. Absent = profile-driven (all three). In the request hash."
                                              Items:
                                                  Type: string
                                                  Description: "An archetype name from the closed vocabulary"
                                          candidates_per_archetype:
                                              Type: integer
                                              Description: "Absent -> 4. Slate depth per archetype, 1-10; an upper bound — slates come back shorter when fewer shots qualify. In the request hash."
                                          spoiler_cutoff:
                                              Type: number
                                              Description: "Absent -> 0.75. Positional reveal-avoidance cut in (0, 1]: no candidate is taken after this fraction of the runtime. In the request hash."
                                          model_chain:
                                              Type: array
                                              Description: "Absent -> Sonnet 4.6 with Nova 2 Lite backup. 1-4 Bedrock model ids (primary first) for BOTH inference rounds (brief translation + vision rerank); ids must be registered with the bedrock-inference deployment. In the request hash."
                                              Items:
                                                  Type: string
                                                  Description: "A Bedrock model id"
                                          use_batch:
                                              Type: boolean
                                              Description: "Absent -> false (sync — the rounds are single records and finish in seconds). true batch-prices them at up to the 24h Bedrock batch SLA. In the request hash."
                                          idempotency_token:
                                              Type: string
                                              Description: "Optional (1-80 chars of A-Z a-z 0-9 _ . -). Same token + same parameters returns the EXISTING run; a fresh token forces a re-run of identical inputs."
                                      Required:
                                          - shot_segmentation_s3uri
                                          - shot_metadata_s3uri
                                  OutputSchema:
                                      Type: object
                                      Description: "A HANDLE, never results (results come from get_job_status). An identical resubmit is ABSORBED into the existing run and carries a `message` saying so."
                                      Properties:
                                          job_id:
                                              Type: string
                                              Description: "Step Functions execution ARN — pass to get_job_status"
                                          workflow_id:
                                              Type: string
                                              Description: "The service's name for the run; outputs land under micro-workflow/artwork-selection/{workflow_id}/"
                                          status:
                                              Type: string
                                              Description: "RUNNING on a fresh start; the existing run's status on an absorbed resubmit"
                                          output_s3_prefix:
                                              Type: string
                                              Description: "s3:// prefix where the labeled outputs land"
                                          message:
                                              Type: string
                                              Description: "Present ONLY on an absorbed resubmit — the signal this call did not start a second run"
                                          current_state:
                                              Type: string
                                              Description: "Present only on a RUNNING absorb: the state the existing run is in"
                                          error:
                                              Type: string
                                              Description: "Present only when an absorbed run already failed: the cause"
                                - Name: get_job_status
                                  Description: "Poll an artwork-selection job by its execution ARN. Sync runs finish in about a minute; use_batch runs can take up to the batch SLA. On SUCCEEDED, lifts the product header (per-archetype candidate counts, rerank status) and lists the outputs — artwork (artwork_candidates.json, the ranked slates with frame uris) and candidates (the pre-vision working document). Presign uris via media-outputs to download; the frames/ prefix holds the JPEGs."
                                  InputSchema:
                                      Type: object
                                      Description: "Poll request"
                                      Properties:
                                          job_id:
                                              Type: string
                                              Description: "Step Functions execution ARN returned by select_artwork"
                                      Required:
                                          - job_id
                                  OutputSchema:
                                      Type: object
                                      Description: "Status + header + outputs when complete"
                                      Properties:
                                          job_id:
                                              Type: string
                                              Description: "The execution ARN polled"
                                          status:
                                              Type: string
                                              Description: "RUNNING | SUCCEEDED | FAILED | TIMED_OUT | ABORTED"
                                          workflow_id:
                                              Type: string
                                              Description: "The run id (last ARN segment)"
                                          output_s3_prefix:
                                              Type: string
                                              Description: "Where the outputs land"
                                          current_state:
                                              Type: string
                                              Description: "Present while RUNNING: the state machine's current state"
                                          candidates:
                                              Type: object
                                              Description: "On SUCCEEDED: candidate count per archetype, e.g. {hero_closeup: 4, two_shot: 4, establishing_vista: 4}"
                                          rerank:
                                              Type: string
                                              Description: "On SUCCEEDED: applied | skipped | failed — whether the slates are in vision order or metadata order (the product's rerank block carries the reason)"
                                          outputs:
                                              Type: array
                                              Description: "On SUCCEEDED: labeled outputs that exist — artwork (artwork_candidates.json), candidates (candidates.json)"
                                              Items:
                                                  Type: object
                                                  Description: "One output: {uri, mime, label, desc?}"
                                          error:
                                              Type: string
                                              Description: "Present on FAILED/TIMED_OUT/ABORTED: the cause"
                                - Name: describe_tool
                                  Description: "Describe this tool: deployed version, state machine ARN, backend description, and the output contract (field-level meaning of artwork_candidates.json, including the unusable flags and identity_source semantics)."
                                  InputSchema:
                                      Type: object
                                      Description: "No parameters"
                                  OutputSchema:
                                      Type: object
                                      Description: "Static metadata"
                                      Properties:
                                          version:
                                              Type: string
                                              Description: "Deployed tool version"
                                          state_machine_arn:
                                              Type: string
                                              Description: "The artwork-selection state machine ARN"
                                          description:
                                              Type: string
                                              Description: "One-paragraph backend description"
                                          output_contract:
                                              Type: object
                                              Description: "Field-level contract for the labeled outputs. Anything not listed is internal and may change without notice."
                                          input_examples:
                                              Type: object
                                              Description: "Per tool (keyed by tool name under tools): required lists the fields the gateway refuses without — a prose entry like 'a OR b' states a one-of rule this schema cannot express — and example is a minimal valid request including recommended optionals; every other accepted parameter is declared, with type and description, in the tool's InputSchema. The shapes and field names are the contract; every s3 uri, ARN, and id value is an invented placeholder to substitute. Each submit example passes the gateway's own input validation (pinned by a unit test); where a one-of rule exists, alternatives holds one valid example of each other form. Static per tool version — cache it for the session."


Outputs:

    IngestBucketReadRoleArns:
        Description: >
            Runtime role ARNs that read the Ingest bucket (comma-separated) —
            input for the ingest bucket owner's bucket policy. Read-only.
            Empty when the ingest-list tool is disabled (no IngestBucket).
        Value: !If [IngestListEnabled, !GetAtt IngestListRole.Arn, ""]

    GatewayIdentifier:
        Description: AgentCore Gateway identifier
        Value: !Ref MediaWorkflowGateway

    GatewayArn:
        Description: AgentCore Gateway ARN
        Value: !GetAtt MediaWorkflowGateway.GatewayArn

    GatewayUrl:
        Description: AgentCore Gateway MCP endpoint URL
        Value: !GetAtt MediaWorkflowGateway.GatewayUrl

    GatewayCredentialsSecretArn:
        Description: >
            Secrets Manager ARN containing the full credentials bundle:
            endpointUrl, tokenEndpoint, clientId, clientSecret, scope.
        Value: !Ref GatewayCredentialsSecret

    GatewayCredentialsSecretName:
        Description: Secrets Manager secret name (for console lookup)
        Value: !Sub "/${GatewayName}/${Environment}/gateway-credentials"

    UserPoolId:
        Description: Cognito User Pool ID
        Value: !Ref GatewayUserPool

    GatewayExecutionRoleArn:
        Description: IAM role used by the gateway to invoke tool Lambdas
        Value: !GetAtt GatewayExecutionRole.Arn

    AudioStemTargetId:
        Description: Gateway Target ID for audio stem separation
        Value: !Ref AudioStemTarget

    SpeechDiarizationTargetId:
        Description: Gateway Target ID for speech diarization
        Value: !Ref SpeechDiarizationTarget

    SpeechEnhancementTargetId:
        Condition: SpeechEnhancementEnabled
        Description: Gateway Target ID for speech-enhancement
        Value: !Ref SpeechEnhancementTarget

    MediaProcessingTargetId:
        Description: Gateway Target ID for media processing
        Value: !Ref MediaProcessingTarget

    HybridSearchTargetId:
        Condition: HybridSearchEnabled
        Description: Gateway Target ID for hybrid-search
        Value: !Ref HybridSearchTarget

    HybridSearchAdminTargetId:
        Condition: HybridSearchAdminEnabled
        Description: Gateway Target ID for hybrid-search-admin
        Value: !Ref HybridSearchAdminTarget

    FaceRecognitionTargetId:
        Condition: FaceRecognitionEnabled
        Description: Gateway Target ID for face recognition
        Value: !Ref FaceRecognitionTarget

    ShotSegmentationTargetId:
        Condition: ShotSegmentationEnabled
        Description: Gateway Target ID for shot segmentation
        Value: !Ref ShotSegmentationTarget

    TextToSpeechTargetId:
        Condition: TextToSpeechEnabled
        Description: Gateway Target ID for text-to-speech
        Value: !Ref TextToSpeechTarget
    BedrockInferenceTargetId:
        Condition: BedrockInferenceEnabled
        Description: Gateway Target ID for bedrock inference
        Value: !Ref BedrockInferenceTarget
    PromptRegistryTargetId:
        Condition: PromptRegistryEnabled
        Description: Gateway Target ID for prompt registry
        Value: !Ref PromptRegistryTarget

    PromptRegistryAdminTargetId:
        Condition: PromptRegistryAdminEnabled
        Description: Gateway Target ID for prompt-registry-admin (only when PromptRegistryAdminToolLambdaArn is set)
        Value: !Ref PromptRegistryAdminTarget

    ConversationAnalysisTargetId:
        Condition: ConversationAnalysisEnabled
        Description: Gateway Target ID for conversation analysis
        Value: !Ref ConversationAnalysisTarget

    AudioDescriptionTargetId:
        Condition: AudioDescriptionEnabled
        Description: Gateway Target ID for audio description
        Value: !Ref AudioDescriptionTarget

    CastResolutionTargetId:
        Condition: CastResolutionEnabled
        Description: Gateway Target ID for person binding
        Value: !Ref CastResolutionTarget

    ProgramStructureAnalysisTargetId:
        Condition: ProgramStructureAnalysisEnabled
        Description: Gateway Target ID for program structure analysis
        Value: !Ref ProgramStructureAnalysisTarget

    ShotMetadataEnrichmentTargetId:
        Condition: ShotMetadataEnrichmentEnabled
        Description: Gateway Target ID for shot metadata enrichment
        Value: !Ref ShotMetadataEnrichmentTarget

    MediaOutputsTargetId:
        Description: Gateway Target ID for the shared media-outputs download tool
        Value: !Ref MediaOutputsTarget

    DownloadUrlFunctionArn:
        Description: ARN of the media-outputs download-URL Lambda (serves get_download_url and get_download_urls)
        Value: !GetAtt DownloadUrlFunction.Arn

    MediaIngestTargetId:
        Condition: IngestListEnabled
        Description: Gateway Target ID for the media-ingest source listing tool
        Value: !Ref MediaIngestTarget

    IngestListFunctionArn:
        Condition: IngestListEnabled
        Description: ARN of the media-ingest listing Lambda (serves list_files)
        Value: !GetAtt IngestListFunction.Arn

    MediaUploadsTargetId:
        Condition: IngestListEnabled
        Description: Gateway Target ID for media-uploads
        Value: !Ref MediaUploadsTarget

    UploadFunctionArn:
        Condition: IngestListEnabled
        Description: ARN of the media-uploads presigning Lambda (serves the four upload tools)
        Value: !GetAtt UploadFunction.Arn
