    # -------------------------------------------------------------------------
    # media-outputs target Lambda — presigns GET URLs for micro-workflow
    # output objects.  Shared across all workflow targets; the only way
    # callers obtain HTTP access to outputs (get_job_status returns plain
    # s3:// URIs).  IAM restricts reads to micro-workflow/* plus the tts
    # voice-catalog previews (_model_artefacts/voice_catalog/*) — the same
    # allow-list the handler enforces in code.
    #
    # Code: gateway_tool/download_url.py, packaged into the gateway_tool zip
    # by build-deploy-s3-dist.sh. Not an inline ZipFile because CFN names
    # inline code "index", forcing Handler: index.handler — which the two
    # handlers in this stack cannot share. Size is not the reason (the
    # inline ceiling is 4 MB).
    # -------------------------------------------------------------------------
    DownloadUrlRole:
        Type: AWS::IAM::Role
        Properties:
            AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                    - Effect: Allow
                      Principal:
                          Service: lambda.amazonaws.com
                      Action: sts:AssumeRole
            Policies:
                - PolicyName: PresignMicroWorkflowOutputs
                  PolicyDocument:
                      Version: "2012-10-17"
                      Statement:
                          # See SecretsPopulatorRole: scoped to the declared
                          # group, and NOT AWSLambdaBasicExecutionRole, whose
                          # logs:CreateLogGroup would let this function create
                          # an unmanaged group instead of failing visibly.
                          - Effect: Allow
                            Action:
                                - logs:CreateLogStream
                                - logs:PutLogEvents
                            Resource: !GetAtt DownloadUrlLogGroup.Arn
                          - Effect: Allow
                            Action: s3:GetObject
                            Resource:
                                - !Sub "arn:aws:s3:::${ProxyBucket}/micro-workflow/*"
                                - !Sub "arn:aws:s3:::${ProxyBucket}/_model_artefacts/voice_catalog/*"

    # See SecretsPopulatorLogGroup for why this is declared rather than left to
    # Lambda's auto-creation, and why the name carries a "-log" suffix instead
    # of being the canonical /aws/lambda/{FunctionName}.
    DownloadUrlLogGroup:
        Type: AWS::Logs::LogGroup
        Properties:
            LogGroupName: !Sub "/aws/lambda/${GatewayName}-download-url-${Environment}-log"
            RetentionInDays: 30

    DownloadUrlFunction:
        Type: AWS::Lambda::Function
        Metadata:
            cfn_nag:
                rules_to_suppress:
                    - id: W89
                      reason: Stateless presigner with no persistent connections; VPC placement adds no security value.
                    - id: W92
                      reason: Low-volume tool dispatcher; reserved concurrency is unnecessary.
        Properties:
            FunctionName: !Sub "${GatewayName}-download-url-${Environment}"
            Description: "media-outputs___get_download_url / ___get_download_urls: presigns GET URLs for micro-workflow output objects"
            Runtime: python3.13
            Architectures: [arm64]
            Handler: download_url.handler
            Role: !GetAtt DownloadUrlRole.Arn
            Timeout: 30
            MemorySize: 128
            # See SecretsPopulatorFunction: the declared group is not named
            # /aws/lambda/{FunctionName}, so this is the only route to it.
            LoggingConfig:
                LogGroup: !Ref DownloadUrlLogGroup
            Environment:
                Variables:
                    PROXY_BUCKET: !Ref ProxyBucket
            Code:
                S3Bucket: !FindInMap [CodeBuild, Source, Bucket]
                S3Key: !Sub
                    - ${keyPrefix}/${pkg}
                    - keyPrefix: !FindInMap [CodeBuild, Source, KeyPrefix]
                      pkg: !FindInMap [CodeBuild, Source, GatewayToolPackage]

    DownloadUrlPermission:
        Type: AWS::Lambda::Permission
        Properties:
            FunctionName: !GetAtt DownloadUrlFunction.Arn
            Action: lambda:InvokeFunction
            Principal: bedrock-agentcore.amazonaws.com
            SourceAccount: !Ref AWS::AccountId

    # -------------------------------------------------------------------------
    # media-ingest target Lambda — lists the caller's SOURCE media in the
    # ingest bucket (prefix + extension filters, StartAfter pagination).
    # A separate Lambda/role from download_url on purpose: the presigner
    # is scoped to GetObject on ${ProxyBucket}/micro-workflow/*, this one
    # to ListBucket on ${IngestBucket} — one concern per policy. Read-only:
    # no GetObject, no presigning; workflows read ingest objects server-side
    # by the s3uri this tool returns.
    #
    # Code: gateway_tool/ingest_list.py, same flat zip as the other two
    # handlers (see the DownloadUrl comment for why not inline ZipFile).
    # -------------------------------------------------------------------------
    IngestListRole:
        Type: AWS::IAM::Role
        Condition: IngestListEnabled
        Properties:
            AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                    - Effect: Allow
                      Principal:
                          Service: lambda.amazonaws.com
                      Action: sts:AssumeRole
            Policies:
                - PolicyName: ListIngestBucket
                  PolicyDocument:
                      Version: "2012-10-17"
                      Statement:
                          # See SecretsPopulatorRole: scoped to the declared
                          # group, and NOT AWSLambdaBasicExecutionRole, whose
                          # logs:CreateLogGroup would let this function create
                          # an unmanaged group instead of failing visibly.
                          - Effect: Allow
                            Action:
                                - logs:CreateLogStream
                                - logs:PutLogEvents
                            Resource: !GetAtt IngestListLogGroup.Arn
                          - Effect: Allow
                            Action: s3:ListBucket
                            Resource: !Sub "arn:aws:s3:::${IngestBucket}"

    # See SecretsPopulatorLogGroup for why this is declared rather than left to
    # Lambda's auto-creation, and why the name carries a "-log" suffix instead
    # of being the canonical /aws/lambda/{FunctionName}.
    IngestListLogGroup:
        Type: AWS::Logs::LogGroup
        Condition: IngestListEnabled
        Properties:
            LogGroupName: !Sub "/aws/lambda/${GatewayName}-ingest-list-${Environment}-log"
            RetentionInDays: 30

    IngestListFunction:
        Type: AWS::Lambda::Function
        Condition: IngestListEnabled
        Metadata:
            cfn_nag:
                rules_to_suppress:
                    - id: W89
                      reason: Stateless lister with no persistent connections; VPC placement adds no security value.
                    - id: W92
                      reason: Low-volume tool dispatcher; reserved concurrency is unnecessary.
        Properties:
            FunctionName: !Sub "${GatewayName}-ingest-list-${Environment}"
            Description: "media-ingest___list_files: lists source media in the ingest bucket (prefix/extension filters, paginated)"
            Runtime: python3.13
            Architectures: [arm64]
            Handler: ingest_list.handler
            Role: !GetAtt IngestListRole.Arn
            Timeout: 30
            MemorySize: 128
            # See SecretsPopulatorFunction: the declared group is not named
            # /aws/lambda/{FunctionName}, so this is the only route to it.
            LoggingConfig:
                LogGroup: !Ref IngestListLogGroup
            Environment:
                Variables:
                    INGEST_BUCKET: !Ref IngestBucket
            Code:
                S3Bucket: !FindInMap [CodeBuild, Source, Bucket]
                S3Key: !Sub
                    - ${keyPrefix}/${pkg}
                    - keyPrefix: !FindInMap [CodeBuild, Source, KeyPrefix]
                      pkg: !FindInMap [CodeBuild, Source, GatewayToolPackage]

    IngestListPermission:
        Type: AWS::Lambda::Permission
        Condition: IngestListEnabled
        Properties:
            FunctionName: !GetAtt IngestListFunction.Arn
            Action: lambda:InvokeFunction
            Principal: bedrock-agentcore.amazonaws.com
            SourceAccount: !Ref AWS::AccountId

    # -------------------------------------------------------------------------
    # media-uploads target Lambda — presigned uploads INTO the ingest bucket.
    # The data plane is the CLIENT PUTting bytes straight to S3 via the
    # presigned URLs; this Lambda is control plane only. A third separate
    # role on purpose: it WRITES (PutObject covers single PUT, UploadPart,
    # Create/CompleteMultipartUpload) plus AbortMultipartUpload and
    # ListBucket (the overwrite-existence check), and still has NO
    # GetObject — one concern per policy, same doctrine as the other two.
    #
    # Code: gateway_tool/upload_tool.py, same flat zip as the other
    # handlers (see the DownloadUrl comment for why not inline ZipFile).
    # -------------------------------------------------------------------------
    UploadRole:
        Type: AWS::IAM::Role
        Condition: IngestListEnabled
        Properties:
            AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                    - Effect: Allow
                      Principal:
                          Service: lambda.amazonaws.com
                      Action: sts:AssumeRole
            Policies:
                - PolicyName: UploadToIngestBucket
                  PolicyDocument:
                      Version: "2012-10-17"
                      Statement:
                          # See SecretsPopulatorRole: scoped to the declared
                          # group, and NOT AWSLambdaBasicExecutionRole, whose
                          # logs:CreateLogGroup would let this function create
                          # an unmanaged group instead of failing visibly.
                          - Effect: Allow
                            Action:
                                - logs:CreateLogStream
                                - logs:PutLogEvents
                            Resource: !GetAtt UploadLogGroup.Arn
                          - Effect: Allow
                            Action:
                                - s3:PutObject
                                - s3:AbortMultipartUpload
                                # ListMultipartUploadParts backs the
                                # authoritative cap check at complete time
                                # (sum of S3-stored part sizes)
                                - s3:ListMultipartUploadParts
                            Resource: !Sub "arn:aws:s3:::${IngestBucket}/${UploadPrefix}*"
                          - Effect: Allow
                            Action: s3:ListBucket
                            Resource: !Sub "arn:aws:s3:::${IngestBucket}"
                            # the lister exists ONLY for the exact-key
                            # existence check — confine it to the same
                            # prefix the write grant has ("" -> "*")
                            Condition:
                                StringLike:
                                    s3:prefix: !Sub "${UploadPrefix}*"

    # See SecretsPopulatorLogGroup for why this is declared rather than left to
    # Lambda's auto-creation, and why the name carries a "-log" suffix instead
    # of being the canonical /aws/lambda/{FunctionName}.
    UploadLogGroup:
        Type: AWS::Logs::LogGroup
        Condition: IngestListEnabled
        Properties:
            LogGroupName: !Sub "/aws/lambda/${GatewayName}-upload-${Environment}-log"
            RetentionInDays: 30

    UploadFunction:
        Type: AWS::Lambda::Function
        Condition: IngestListEnabled
        Metadata:
            cfn_nag:
                rules_to_suppress:
                    - id: W89
                      reason: Stateless presigner with no persistent connections; VPC placement adds no security value.
                    - id: W92
                      reason: Low-volume tool dispatcher; reserved concurrency is unnecessary.
        Properties:
            FunctionName: !Sub "${GatewayName}-upload-${Environment}"
            Description: "media-uploads tools: presigned single/multipart uploads into the ingest bucket (control plane only — bytes go client-to-S3)"
            Runtime: python3.13
            Architectures: [arm64]
            Handler: upload_tool.handler
            Role: !GetAtt UploadRole.Arn
            Timeout: 30
            MemorySize: 128
            # See SecretsPopulatorFunction: the declared group is not named
            # /aws/lambda/{FunctionName}, so this is the only route to it.
            LoggingConfig:
                LogGroup: !Ref UploadLogGroup
            Environment:
                Variables:
                    INGEST_BUCKET: !Ref IngestBucket
                    UPLOAD_PREFIX: !Ref UploadPrefix
            Code:
                S3Bucket: !FindInMap [CodeBuild, Source, Bucket]
                S3Key: !Sub
                    - ${keyPrefix}/${pkg}
                    - keyPrefix: !FindInMap [CodeBuild, Source, KeyPrefix]
                      pkg: !FindInMap [CodeBuild, Source, GatewayToolPackage]

    UploadPermission:
        Type: AWS::Lambda::Permission
        Condition: IngestListEnabled
        Properties:
            FunctionName: !GetAtt UploadFunction.Arn
            Action: lambda:InvokeFunction
            Principal: bedrock-agentcore.amazonaws.com
            SourceAccount: !Ref AWS::AccountId

    # -------------------------------------------------------------------------
    # AgentCore Gateway
    # AuthorizerType CUSTOM_JWT — callers present a Bearer token issued by
    # the Cognito User Pool above. No SigV4 signing required.
    # -------------------------------------------------------------------------
    MediaWorkflowGateway:
        Type: AWS::BedrockAgentCore::Gateway
        DependsOn: GatewayUserPoolDomain
        Properties:
            Name: !Sub "${GatewayName}-${Environment}"
            Description: "AgentCore Gateway for media micro-workflow tools"
            AuthorizerType: CUSTOM_JWT
            AuthorizerConfiguration:
                CustomJWTAuthorizer:
                    # AgentCore fetches the JWKS from this URL to validate token signatures
                    DiscoveryUrl: !Sub
                        - "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPoolId}/.well-known/openid-configuration"
                        - UserPoolId: !Ref GatewayUserPool
                    # AllowedClients — validated against the client_id claim in the token
                    AllowedClients:
                        - !Ref GatewayAppClient
                    # AllowedScopes — validated against the scope claim in the token.
                    # Cognito M2M access tokens carry scope but no aud claim, so
                    # AllowedAudience would always fail. Use AllowedScopes instead.
                    AllowedScopes:
                        - !Sub "${OAuthScope}/invoke"
            RoleArn: !GetAtt GatewayExecutionRole.Arn
            ProtocolType: MCP
            Tags:
                Environment: !Ref Environment
                ManagedBy: CloudFormation

    # -------------------------------------------------------------------------
    # Gateway Target — Audio Stem Separation
    # InlinePayload is a native YAML list of ToolDefinition structs.
    # SchemaDefinition supports: Type, Description, Properties, Required, Items only.
    # -------------------------------------------------------------------------
    AudioStemTarget:
        Type: AWS::BedrockAgentCore::GatewayTarget
        Properties:
            Name: audio-stem
            Description: "Bandit v2 audio stem separation: speech, music, SFX — per-stem enable/disable, sample rate control"
            GatewayIdentifier: !Ref MediaWorkflowGateway
            CredentialProviderConfigurations:
                - CredentialProviderType: GATEWAY_IAM_ROLE
            TargetConfiguration:
                Mcp:
                    Lambda:
                        LambdaArn: !Ref AudioStemToolLambdaArn
                        ToolSchema:
                            InlinePayload:
                                - Name: separate_audio_stems
                                  Description: "Separate an audio or video asset into speech, music, and SFX stems using the Bandit v2 model. Each stem is a separate WAV file. Non-WAV sources are converted automatically. Async — call get_job_status with the returned job_id to poll. Disabling a stem skips its inference entirely."
                                  InputSchema:
                                      Type: object
                                      Description: "Parameters for audio stem separation"
                                      Required:
                                          - asset_s3uri
                                      Properties:
                                          asset_s3uri:
                                              Type: string
                                              Description: "S3 URI of the source media file (e.g. s3://bucket/key.mp4)"
                                          idempotency_token:
                                              Type: string
                                              Description: "Optional idempotency token (1-80 chars of A-Z a-z 0-9 _ . -). Folded into the workflow_id hash and then DISCARDED — never forwarded, never stored, and no response echoes it. Same token + same parameters returns the EXISTING run; any parameter or token change starts a fresh run. Omitting it still dedups on the parameters alone, so a token is only needed to distinguish two otherwise-identical requests."
                                          fixed_chunk_size_secs:
                                              Type: integer
                                              Description: "Processing chunk size in seconds (min 60, default 180). Aligned internally to nearest 8 s multiple."
                                          speech_stem:
                                              Type: boolean
                                              Description: "Extract the speech stem (default true). Set false to skip and save inference cost."
                                          speech_resampl_freq:
                                              Type: integer
                                              Description: "Output sample rate for speech WAV in Hz (default 16000). Valid values: 8000, 16000, 32000, 44100, 48000, 96000."
                                          music_stem:
                                              Type: boolean
                                              Description: "Extract the music stem (default true). Set false to skip."
                                          music_resampl_freq:
                                              Type: integer
                                              Description: "Output sample rate for music WAV in Hz (default 48000). Valid values: 8000, 16000, 32000, 44100, 48000, 96000."
                                          sfx_stem:
                                              Type: boolean
                                              Description: "Extract the SFX stem (default true). Set false to skip."
                                          sfx_resampl_freq:
                                              Type: integer
                                              Description: "Output sample rate for SFX WAV in Hz (default 32000). Valid values: 8000, 16000, 32000, 44100, 48000, 96000."
                                          speech_safe:
                                              Type: boolean
                                              Description: "Also produce audio_speech_safe.wav (default false): the speech stem with attenuated ORIGINAL mix patched into the spans the separation model deleted (quiet/background speech), crossfaded at the edges — guaranteed never silent where the source had sound. Use it wherever the track is played or mixed: audio-description mixes, review/QC playback, dialogue-forward renders. As an ASR input the original mix measured better pooled and is the validated default, while music-heavy content measured ahead on speech_safe. Additive: never replaces audio_speech.wav. Runs the speech decoder even when speech_stem is false."
                                          speech_safe_resampl_freq:
                                              Type: integer
                                              Description: "Output sample rate for the speech_safe WAV in Hz (default 48000 — full fidelity for playback and mixing). Valid values: 8000, 16000, 32000, 44100, 48000, 96000."
                                  OutputSchema:
                                      Type: object
                                      Description: "Job submission result — a HANDLE, never results. Every field here is present on a fresh start AND on an absorbed resubmit of an already-finished run; only `status` differs. Read `status` and `message`, then call get_job_status for anything else."
                                      Properties:
                                          job_id:
                                              Type: string
                                              Description: "Step Functions execution ARN — pass to get_job_status to poll"
                                          status:
                                              Type: string
                                              Description: "RUNNING on a fresh start. An identical request already submitted is NOT started twice: this returns the EXISTING run's status instead, which may be RUNNING | SUCCEEDED | FAILED | TIMED_OUT | ABORTED. A non-RUNNING status here carries NO results — it only reports that the run already reached that state; call get_job_status with this job_id to read anything about it."
                                          message:
                                              Type: string
                                              Description: "Present ONLY when this call did not resubmit because an identical request already exists. Its absence means a new execution was just started. Every other field is identical in both cases, so this is the only field that distinguishes them."
                                          current_state:
                                              Type: string
                                              Description: "Active pipeline stage. Present while the run is RUNNING; absent once it has stopped, because a stopped execution is in no state."
                                          workflow_id:
                                              Type: string
                                              Description: "Identifier of this run; also the final path segment of output_s3_prefix (micro-workflow/{target}/{workflow_id}/)"
                                          output_s3_prefix:
                                              Type: string
                                              Description: "Service-derived S3 prefix where all outputs are written"
                                          asset_s3uri:
                                              Type: string
                                              Description: "S3 URI of the source media file (echoed from input)"
                                          error:
                                              Type: string
                                              Description: "Failure cause as 'code: message' (compacted exactly like get_job_status's error). Present only when this call was absorbed into a run that had already FAILED, TIMED_OUT, or been ABORTED. A terminal failure is STICKY: Step Functions reserves the execution name for 90 days, so resubmitting the identical request returns this same failure for that whole window. Retrying verbatim never re-runs it — change a parameter, or pass a different idempotency_token."
                                          error_code:
                                              Type: string
                                              Description: "Stable failure code of the absorbed run alone — the raised exception's class name (e.g. a terminal content fact like NoAudioStream/NoVideoStream) or the Step Functions error field. Present only beside error."

                                - Name: get_job_status
                                  Description: "Poll an audio stem separation job by its execution ARN. Returns the active pipeline stage while running, or the full structured results when complete."
                                  InputSchema:
                                      Type: object
                                      Description: "Job poll request. Takes no idempotency_token, and the retired `uuid` names nothing here — a poll starts no execution, so neither key could change what this returns. Sent anyway, either is ignored with a log line and never rejected: a hallucinated parameter must not fail a poll that is otherwise correct."
                                      Required:
                                          - job_id
                                      Properties:
                                          job_id:
                                              Type: string
                                              Description: "Step Functions execution ARN returned by separate_audio_stems"
                                  OutputSchema:
                                      Type: object
                                      Description: "Job status and results"
                                      Properties:
                                          job_id:
                                              Type: string
                                              Description: "Step Functions execution ARN — the value you polled with, echoed on every branch (including RUNNING and every failure) so a status reply always names its own run"
                                          status:
                                              Type: string
                                              Description: "RUNNING | SUCCEEDED | FAILED | TIMED_OUT | ABORTED"
                                          current_state:
                                              Type: string
                                              Description: "Active pipeline stage name (present when RUNNING)"
                                          workflow_id:
                                              Type: string
                                              Description: "Identifier of this run; also the final path segment of output_s3_prefix (micro-workflow/{target}/{workflow_id}/)"
                                          output_s3_prefix:
                                              Type: string
                                              Description: "Service-derived S3 prefix where all outputs are written. Read back from the execution's own input, so it is present on EVERY branch — including RUNNING and every failure, where partial results already live under it."
                                          asset_s3uri:
                                              Type: string
                                              Description: "S3 URI of the source media file (echoed from input)"
                                          speech_key:
                                              Type: string
                                              Description: "S3 key of the speech stem WAV (absent if speech_stem was false)"
                                          music_key:
                                              Type: string
                                              Description: "S3 key of the music stem WAV (absent if music_stem was false)"
                                          sfx_key:
                                              Type: string
                                              Description: "S3 key of the SFX stem WAV (absent if sfx_stem was false)"
                                          speech_safe_key:
                                              Type: string
                                              Description: "S3 key of the gated-mix speech_safe WAV (present only when speech_safe was true): the speech stem with attenuated original mix patched into separator-deleted spans — see the speech-safe output contract entry"
                                          metrics_key:
                                              Type: string
                                              Description: "S3 key of audiostem_sep.json with per-stem summary, timings, and per-chunk data"
                                          stem_activity_key:
                                              Type: string
                                              Description: "S3 key of stem_activity.json: per-lane activity spans (original = non-silence of the mix; each active stem = energy above threshold), the speech_stem_gaps lane (mix active while the speech stem is near-silent — audio the stem does not cover, an upper bound on deleted speech; present when speech_stem was enabled), plus line-up tones measured on the original mix"
                                          stem_waveforms_key:
                                              Type: string
                                              Description: "S3 key of stem_waveforms.json: peak-normalized per-bin RMS envelopes for the original mix and each active stem — draw timeline waveform lanes without reading the WAVs"
                                          pipeline_wall_sec:
                                              Type: number
                                              Description: "Total wall-clock time for the pipeline in seconds"
                                          total_estimated_cost:
                                              Type: number
                                              Description: "Estimated total cost in USD (includes media conversion if run)"
                                          usage_key:
                                              Type: string
                                              Description: "S3 key of usage_tracking.json with full per-state cost breakdown"
                                          media_processing_arn:
                                              Type: string
                                              Description: "Child execution ARN of the media-processing workflow (present only when format conversion was required)"
                                          outputs:
                                              Type: array
                                              Description: "All job outputs as S3 objects: {uri, mime, label, desc}. Entries whose uri ends with '/' are prefixes containing multiple objects and carry no mime. Labels (speech, music, sfx, speech-safe, metrics, stem-activity, stem-waveforms, usage) and output basenames are stable API. To fetch a file over HTTP, pass its uri to media-outputs___get_download_url."
                                              Items:
                                                  Type: object
                                                  Description: "One output object or prefix"
                                                  Properties:
                                                      uri:
                                                          Type: string
                                                          Description: "s3:// URI of the output object, or prefix when ending with '/'"
                                                      mime:
                                                          Type: string
                                                          Description: "Registered MIME type; absent for prefix entries"
                                                      label:
                                                          Type: string
                                                          Description: "Stable semantic label for selecting outputs"
                                                      desc:
                                                          Type: string
                                                          Description: "One-line role description (what the file is and what to use it for), joined from the tool's output contract; absent when the contract lacks the label"
                                                  Required:
                                                      - uri
                                                      - label
                                          error:
                                              Type: string
                                              Description: "Failure cause as 'code: message' (present when status is FAILED, TIMED_OUT, or ABORTED). One code is a terminal content fact, not a retryable fault: NoAudioStream (the source has no audio stream) — treat it as 'nothing to separate' and do not resubmit."
                                          error_code:
                                              Type: string
                                              Description: "Stable failure code alone — the raised exception's class name (e.g. NoAudioStream) or the Step Functions error field (e.g. Lambda.Unknown). Match on this; the human detail lives in error."

                                - Name: describe_tool
                                  Description: "Return the deployed version of the audio stem separation tool and its backend info (state machine ARN, short description, output contract)."
                                  InputSchema:
                                      Type: object
                                      Description: "No input required. Takes no idempotency_token — this is pure introspection with no execution and no state, so there is nothing to deduplicate. Sent anyway it is ignored with a log line, never rejected."
                                  OutputSchema:
                                      Type: object
                                      Description: "Tool version and backend info"
                                      Properties:
                                          version:
                                              Type: string
                                              Description: "Semantic version of the deployed tool (e.g. 1.2.0)"
                                          state_machine_arn:
                                              Type: string
                                              Description: "ARN of the backing Step Functions state machine (for console/CLI debugging)"
                                          description:
                                              Type: string
                                              Description: "Short description of the backend pipeline"
                                          output_contract:
                                              Type: object
                                              Description: "Field-level contract for every outputs[] label: basename, kind (file/prefix), mime, the one-line description that doubles as the entries' desc, and a compact example of the file's field names/nesting (contents block for binary files). Static per tool version — cache it for the session. Anything not listed is internal and may change without notice."
                                          input_examples:
                                              Type: object
                                              Description: "Per tool (keyed by tool name under tools): required lists the fields the gateway refuses without — a prose entry like 'a OR b' states a one-of rule this schema cannot express — and example is a minimal valid request including recommended optionals; every other accepted parameter is declared, with type and description, in the tool's InputSchema. The shapes and field names are the contract; every s3 uri, ARN, and id value is an invented placeholder to substitute. Each submit example passes the gateway's own input validation (pinned by a unit test); where a one-of rule exists, alternatives holds one valid example of each other form. Static per tool version — cache it for the session."

    # -------------------------------------------------------------------------
    # Gateway Target — Speech Enhancement
    # -------------------------------------------------------------------------
    SpeechEnhancementTarget:
        Type: AWS::BedrockAgentCore::GatewayTarget
        Condition: SpeechEnhancementEnabled
        Properties:
            Name: speech-enhancement
            Description: "DeepFilterNet3 speech enhancement: noise-suppresses the dialogue in place — one enhanced WAV, no stem extraction"
            GatewayIdentifier: !Ref MediaWorkflowGateway
            CredentialProviderConfigurations:
                - CredentialProviderType: GATEWAY_IAM_ROLE
            TargetConfiguration:
                Mcp:
                    Lambda:
                        LambdaArn: !Ref SpeechEnhancementToolLambdaArn
                        ToolSchema:
                            InlinePayload:
                                - Name: enhance_speech
                                  Description: "Noise-suppress the dialogue in a media asset's audio using the DeepFilterNet3 model. One enhanced WAV out, in place — everything keeps its timeline position, no stem extraction. Listening-quality enhancement; the current model measured worse than the original mix as a transcription input, so the mix is the validated speech-analysis default and routing the enhanced output into ASR/diarization is not recommended today. Non-WAV sources are converted automatically. Async — call get_job_status with the returned job_id to poll."
                                  InputSchema:
                                      Type: object
                                      Description: "Parameters for speech enhancement"
                                      Required:
                                          - asset_s3uri
                                      Properties:
                                          asset_s3uri:
                                              Type: string
                                              Description: "S3 URI of the source media file (e.g. s3://bucket/key.mp4)"
                                          idempotency_token:
                                              Type: string
                                              Description: "Optional idempotency token (1-80 chars of A-Z a-z 0-9 _ . -). Folded into the workflow_id hash and then DISCARDED — never forwarded, never stored, and no response echoes it. Same token + same parameters returns the EXISTING run; any parameter or token change starts a fresh run. Omitting it still dedups on the parameters alone, so a token is only needed to distinguish two otherwise-identical requests."
                                          fixed_chunk_size_secs:
                                              Type: integer
                                              Description: "Processing chunk size in seconds (min 10, default 360). Aligned internally to nearest 10 s multiple."
                                          output_resampl_freq:
                                              Type: integer
                                              Description: "Output sample rate for the enhanced WAV in Hz (default 16000). Valid values: 8000, 16000, 32000, 44100, 48000, 96000."
                                          atten_lim_db:
                                              Type: number
                                              Description: "Cap on noise attenuation in dB, 0-100, enforced as a full-band guarantee (the original signal is mixed back in, so the output is never more than this many dB quieter than the source). A lower cap means gentler enhancement that keeps more of the original ambience; values near 0 disable enhancement entirely and 100 means uncapped. Omit (or null) for the model default: full suppression."
                                  OutputSchema:
                                      Type: object
                                      Description: "Job submission result — a HANDLE, never results. Every field here is present on a fresh start AND on an absorbed resubmit of an already-finished run; only `status` differs. Read `status` and `message`, then call get_job_status for anything else."
                                      Properties:
                                          job_id:
                                              Type: string
                                              Description: "Step Functions execution ARN — pass to get_job_status to poll"
                                          status:
                                              Type: string
                                              Description: "RUNNING on a fresh start. An identical request already submitted is NOT started twice: this returns the EXISTING run's status instead, which may be RUNNING | SUCCEEDED | FAILED | TIMED_OUT | ABORTED. A non-RUNNING status here carries NO results — it only reports that the run already reached that state; call get_job_status with this job_id to read anything about it."
                                          message:
                                              Type: string
                                              Description: "Present ONLY when this call did not resubmit because an identical request already exists. Its absence means a new execution was just started. Every other field is identical in both cases, so this is the only field that distinguishes them."
                                          current_state:
                                              Type: string
                                              Description: "Active pipeline stage. Present while the run is RUNNING; absent once it has stopped, because a stopped execution is in no state."
                                          workflow_id:
                                              Type: string
                                              Description: "Identifier of this run; also the final path segment of output_s3_prefix (micro-workflow/{target}/{workflow_id}/)"
                                          output_s3_prefix:
                                              Type: string
                                              Description: "Service-derived S3 prefix where all outputs are written"
                                          asset_s3uri:
                                              Type: string
                                              Description: "S3 URI of the source media file (echoed from input)"
                                          error:
                                              Type: string
                                              Description: "Failure cause as 'code: message' (compacted exactly like get_job_status's error). Present only when this call was absorbed into a run that had already FAILED, TIMED_OUT, or been ABORTED. A terminal failure is STICKY: Step Functions reserves the execution name for 90 days, so resubmitting the identical request returns this same failure for that whole window. Retrying verbatim never re-runs it — change a parameter, or pass a different idempotency_token."
                                          error_code:
                                              Type: string
                                              Description: "Stable failure code of the absorbed run alone — the raised exception's class name (e.g. a terminal content fact like NoAudioStream/NoVideoStream) or the Step Functions error field. Present only beside error."

                                - Name: get_job_status
                                  Description: "Poll a speech enhancement job by its execution ARN. Returns the active pipeline stage while running, or the full structured results when complete."
                                  InputSchema:
                                      Type: object
                                      Description: "Job poll request. Takes no idempotency_token, and the retired `uuid` names nothing here — a poll starts no execution, so neither key could change what this returns. Sent anyway, either is ignored with a log line and never rejected: a hallucinated parameter must not fail a poll that is otherwise correct."
                                      Required:
                                          - job_id
                                      Properties:
                                          job_id:
                                              Type: string
                                              Description: "Step Functions execution ARN returned by enhance_speech"
                                  OutputSchema:
                                      Type: object
                                      Description: "Job status and results"
                                      Properties:
                                          job_id:
                                              Type: string
                                              Description: "Step Functions execution ARN — the value you polled with, echoed on every branch (including RUNNING and every failure) so a status reply always names its own run"
                                          status:
                                              Type: string
                                              Description: "RUNNING | SUCCEEDED | FAILED | TIMED_OUT | ABORTED"
                                          current_state:
                                              Type: string
                                              Description: "Active pipeline stage name (present when RUNNING)"
                                          workflow_id:
                                              Type: string
                                              Description: "Identifier of this run; also the final path segment of output_s3_prefix (micro-workflow/{target}/{workflow_id}/)"
                                          output_s3_prefix:
                                              Type: string
                                              Description: "Service-derived S3 prefix where all outputs are written. Read back from the execution's own input, so it is present on EVERY branch — including RUNNING and every failure, where partial results already live under it."
                                          asset_s3uri:
                                              Type: string
                                              Description: "S3 URI of the source media file (echoed from input)"
                                          enhanced_key:
                                              Type: string
                                              Description: "S3 key of the enhanced audio WAV (full source duration, mono)"
                                          metrics_key:
                                              Type: string
                                              Description: "S3 key of speech_enhancement.json with the output summary (RMS in/out), timings, and per-chunk data"
                                          resampl_freq:
                                              Type: integer
                                              Description: "Sample rate of the enhanced WAV in Hz"
                                          rms_db_in:
                                              Type: number
                                              Description: "RMS level of the model's input audio in dBFS"
                                          rms_db_out:
                                              Type: number
                                              Description: "RMS level of the enhanced output in dBFS — the drop from rms_db_in is the noise removed"
                                          duration_sec:
                                              Type: number
                                              Description: "Duration of the enhanced WAV in seconds"
                                          pipeline_wall_sec:
                                              Type: number
                                              Description: "Total wall-clock time for the pipeline in seconds"
                                          total_estimated_cost:
                                              Type: number
                                              Description: "Estimated total cost in USD (includes media conversion if run)"
                                          usage_key:
                                              Type: string
                                              Description: "S3 key of usage_tracking.json with full per-state cost breakdown"
                                          media_processing_arn:
                                              Type: string
                                              Description: "Child execution ARN of the media-processing workflow (present only when format conversion was required)"
                                          outputs:
                                              Type: array
                                              Description: "All job outputs as S3 objects: {uri, mime, label, desc}. Labels (enhanced, metrics, usage) and output basenames are stable API. To fetch a file over HTTP, pass its uri to media-outputs___get_download_url."
                                              Items:
                                                  Type: object
                                                  Description: "One output object"
                                                  Properties:
                                                      uri:
                                                          Type: string
                                                          Description: "s3:// URI of the output object"
                                                      mime:
                                                          Type: string
                                                          Description: "Registered MIME type"
                                                      label:
                                                          Type: string
                                                          Description: "Stable semantic label for selecting outputs"
                                                      desc:
                                                          Type: string
                                                          Description: "One-line role description (what the file is and what to use it for), joined from the tool's output contract; absent when the contract lacks the label"
                                                  Required:
                                                      - uri
                                                      - label
                                          error:
                                              Type: string
                                              Description: "Failure cause as 'code: message' (present when status is FAILED, TIMED_OUT, or ABORTED). One code is a terminal content fact, not a retryable fault: NoAudioStream (the source has no audio stream) — treat it as 'nothing to enhance' and do not resubmit."
                                          error_code:
                                              Type: string
                                              Description: "Stable failure code alone — the raised exception's class name (e.g. NoAudioStream) or the Step Functions error field (e.g. Lambda.Unknown). Match on this; the human detail lives in error."

                                - Name: describe_tool
                                  Description: "Return the deployed version of the speech enhancement tool and its backend info (state machine ARN, short description, output contract)."
                                  InputSchema:
                                      Type: object
                                      Description: "No input required. Takes no idempotency_token — this is pure introspection with no execution and no state, so there is nothing to deduplicate. Sent anyway it is ignored with a log line, never rejected."
                                  OutputSchema:
                                      Type: object
                                      Description: "Tool version and backend info"
                                      Properties:
                                          version:
                                              Type: string
                                              Description: "Semantic version of the deployed tool (e.g. 1.2.0)"
                                          state_machine_arn:
                                              Type: string
                                              Description: "ARN of the backing Step Functions state machine (for console/CLI debugging)"
                                          description:
                                              Type: string
                                              Description: "Short description of the backend pipeline"
                                          output_contract:
                                              Type: object
                                              Description: "Field-level contract for every outputs[] label: basename, kind (file/prefix), mime, the one-line description that doubles as the entries' desc, and a compact example of the file's field names/nesting (contents block for binary files). Static per tool version — cache it for the session. Anything not listed is internal and may change without notice."
                                          input_examples:
                                              Type: object
                                              Description: "Per tool (keyed by tool name under tools): required lists the fields the gateway refuses without, and example is a minimal valid request including recommended optionals; every other accepted parameter is declared, with type and description, in the tool's InputSchema. The shapes and field names are the contract; every s3 uri, ARN, and id value is an invented placeholder to substitute. Each submit example passes the gateway's own input validation (pinned by a unit test). Static per tool version — cache it for the session."

