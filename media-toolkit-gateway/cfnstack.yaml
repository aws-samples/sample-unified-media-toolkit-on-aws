                                              Type: number
                                              Description: "VAD: minimum silence gap in seconds to split adjacent speech segments (default 0.3)."
                                          speech_group_max_gap_sec:
                                              Type: number
                                              Description: "VAD: merge adjacent turns within this gap in seconds (default 1.0)."
                                          beam_size:
                                              Type: integer
                                              Description: "ASR: Whisper beam size 1-5. Higher values improve accuracy at the cost of speed (default 2)."
                                          initial_prompt:
                                              Type: string
                                              Description: "ASR: context hint passed to Whisper to bias transcription (e.g. domain vocabulary, speaker names)."
                                          merge_gap_threshold_sec:
                                              Type: number
                                              Description: "ASR: merge inter-sentence gaps shorter than this value in seconds (default 0.20)."
                                          min_embedding_duration_sec:
                                              Type: number
                                              Description: "Embedding: minimum sentence duration in seconds to compute a full speaker embedding (default 0.75)."
                                          num_speakers:
                                              Type: integer
                                              Description: "Clustering: known number of speakers. Omit to auto-detect. Minimum 1."
                                          max_k:
                                              Type: integer
                                              Description: "Clustering: upper bound on speaker count when auto-detecting (default 50). Minimum 1."
                                          min_cluster_size:
                                              Type: integer
                                              Description: "Clustering: minimum embeddings per cluster (default 2). Minimum 2."
                                          min_turns_per_speaker:
                                              Type: integer
                                              Description: "Clustering: minimum number of turns to retain a speaker label (default 3). Minimum 2."
                                          outlier_global_percentile:
                                              Type: number
                                              Description: "Clustering: remove embeddings beyond this percentile as outliers 0-100 (default 97.0)."
                                          apply_snorm:
                                              Type: boolean
                                              Description: "Clustering: apply score normalisation before clustering (default false)."
                                          speaker_channels:
                                              Type: boolean
                                              Description: "Output: write a separate WAV file per speaker (default true)."
                                          channel_mode:
                                              Type: string
                                              Description: "Output: per-speaker channel layout — aligned (silence-padded to original timeline) or compact (speech-only). Default aligned."
                                  OutputSchema:
                                      Type: object
                                      Description: "Job submission result — a HANDLE, never results. Every field here is present on a fresh start AND on an absorbed resubmit of an already-finished run; only `status` differs. Read `status` and `message`, then call get_job_status for anything else."
                                      Properties:
                                          job_id:
