                                  OutputSchema:
                                      Type: object
                                      Description: "RUNNING -> status + current_state. SUCCEEDED -> the scenes header plus outputs[] of {uri, mime, label, desc} for labels shots / scenes / window-manifest / usage. FAILED -> error with the cause. shots_gap lists shot_ids left unanswered — HONEST partial coverage on a SUCCEEDED run; rerun with a fresh idempotency_token only if the gaps matter. A pairing_repair_rate well above 0 marks INTERLEAVED content (news, magazine): treat scenes[] as shot groups, not final scene structure."
                                      Properties:
