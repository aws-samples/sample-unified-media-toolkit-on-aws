AWSTemplateFormatVersion: "2010-09-09"
Description: >
    AgentCore Gateway with Lambda targets for media micro-workflow tools:
    audio stem separation, speech diarization, media processing, and shot segmentation.
    Auth: OAuth 2.0 client credentials (CUSTOM_JWT) via Cognito M2M.

# ---------------------------------------------------------------------------
# Mappings
# The double-percent placeholders below are substituted by
# build-deploy-s3-dist.sh, which fails the build if any survive. This stack
# carries no Docker image; the only artifact is the gateway_tool zip, which
# holds both of the stack's Lambda handlers (download_url, secrets_populator).
# ---------------------------------------------------------------------------
Mappings:
    CodeBuild:
        Source:
            GatewayToolPackage: "%%PKG_GATEWAY_TOOL%%"
            Bucket: "%%BUCKET_NAME%%"
            KeyPrefix: "%%KEY_PREFIX%%"

# ---------------------------------------------------------------------------
# Parameters
# ---------------------------------------------------------------------------
Parameters:

    # Tool Lambda ARNs — imported from each micro-workflow stack
    AudioStemToolLambdaArn:
        Type: String
        Description: GatewayToolLambdaArn output from the audiostem-separation-on-aws stack

    SpeechDiarizationToolLambdaArn:
        Type: String
        Description: GatewayToolLambdaArn output from the speech-diarization-on-aws stack

    MediaProcessingToolLambdaArn:
        Type: String
        Description: GatewayToolLambdaArn output from the media-processing stack

    ShotSegmentationToolLambdaArn:
        Type: String
        Default: ""
        Description: "GatewayToolLambdaArn output from the shot-segmentation-on-aws stack. Leave empty to omit the shot-segmentation target."

    FaceRecognitionToolLambdaArn:
        Type: String
        Default: ""
        Description: "GatewayToolLambdaArn output from the face-recognition-on-aws stack. Leave empty to omit the face-recognition target."

    HybridSearchToolLambdaArn:
        Type: String
        Default: ""
        Description: "GatewayToolLambdaArn output from the hybrid-search stack. Leave empty to omit the hybrid-search target."

    HybridSearchAdminToolLambdaArn:
        Type: String
        Default: ""
        Description: "AdminToolLambdaArn output from the hybrid-search stack (collection weight edits + deletion). Leave empty to omit the hybrid-search-admin target. SECURITY: this target grants destructive/config powers — attach it only to gateways serving trusted admin agents."

    TextToSpeechToolLambdaArn:
        Type: String
        Default: ""
        Description: "GatewayToolLambdaArn output from the tts-on-aws stack. Leave empty to omit the text-to-speech target."

    BedrockInferenceToolLambdaArn:
        Type: String
        Default: ""
        Description: "GatewayToolLambdaArn output from the bedrock-inference-on-aws stack. Leave empty to omit the bedrock-inference target."

    PromptRegistryAdminToolLambdaArn:
        Type: String
        Default: ""
        Description: AdminToolLambdaArn output from the prompt-registry-on-aws stack — the SUPERUSER surface serving internal categories. Leave empty to omit the prompt-registry-admin target (recommended for gateways serving untrusted agents).
    PromptRegistryToolLambdaArn:
        Type: String
        Default: ""
        Description: "GatewayToolLambdaArn output from the prompt-registry-on-aws stack. Leave empty to omit the prompt-registry target."

    ConversationAnalysisToolLambdaArn:
        Type: String
        Default: ""
        Description: "GatewayToolLambdaArn output from the conversation-analysis-on-aws stack. Leave empty to omit the conversation-analysis target."

    ShotMetadataEnrichmentToolLambdaArn:
        Type: String
        Default: ""
        Description: "GatewayToolLambdaArn output from the shot-metadata-enrichment-on-aws stack. Leave empty to omit the shot-metadata-enrichment target."

    ProgramStructureAnalysisToolLambdaArn:
        Type: String
        Default: ""
        Description: "GatewayToolLambdaArn output from the program-structure-analysis-on-aws stack. Leave empty to omit the program-structure-analysis target."

    AudioDescriptionToolLambdaArn:
        Type: String
        Default: ""
        Description: "GatewayToolLambdaArn output from the audio-description-on-aws stack. Leave empty to omit the audio-description target."

    CastResolutionToolLambdaArn:
        Type: String
        Default: ""
        Description: "GatewayToolLambdaArn output from the cast-resolution-on-aws stack. Leave empty to omit the cast-resolution target."

    ArtworkSelectionToolLambdaArn:
        Type: String
        Default: ""
        Description: "GatewayToolLambdaArn output from the artwork-selection-on-aws stack. Leave empty to omit the artwork-selection target."

    SpeechEnhancementToolLambdaArn:
        Type: String
        Default: ""
        Description: "GatewayToolLambdaArn output from the speech-enhancement-on-aws stack. Leave empty to omit the speech-enhancement target."

    ProxyBucket:
        Type: String
        Description: >
            S3 proxy bucket the micro-workflows write outputs to (the same
            ProxyBucket passed to each micro-workflow stack).  Used by the
            media-outputs download-URL tools to presign GET URLs for keys
            under micro-workflow/.

    IngestBucket:
        Type: String
        Default: ""
        Description: >
            S3 ingest bucket holding the caller's source media. Used by the
            media-ingest list_files tool (read-only ListBucket) and the
            media-uploads presigned-upload tools (PutObject, no GetObject).
            Leave empty to omit both targets entirely.

    UploadPrefix:
        Type: String
        Default: ""
        # No leading '/': this value is embedded VERBATIM in both the IAM
        # resource ARN and the Lambda's key validation — a leading slash
        # would make the two disagree and 403 every PUT (which the agent
        # guidance would then retry forever).
        AllowedPattern: "^$|^[^/].*$"
        ConstraintDescription: must not start with '/'
        Description: >
            Optional key prefix the media-uploads tools are restricted to
            writing under (e.g. "uploads/"). Empty (the default) allows the
            whole ingest bucket — it is the caller's own source bucket.
            Ignored when IngestBucket is empty.

    GatewayName:
        Type: String
        Default: media-toolkit-gateway
        Description: Name of the AgentCore Gateway (alphanumeric + hyphens, max 100 chars)

    Environment:
        Type: String
        Default: dev
        AllowedValues: [dev, staging, prod]

    OAuthScope:
        Type: String
        Default: media-workflows
        Description: >
            Cognito resource server Identifier. The full scope string is
            constructed as <OAuthScope>/invoke in AllowedOAuthScopes and Scope fields.

    SecretsKmsKeyId:
        Type: String
        Default: alias/aws/secretsmanager
        Description: >
            KMS key ID, ARN, or alias used to encrypt the gateway credentials secret.
            Defaults to the AWS-managed Secrets Manager key. Provide a customer-managed
            key ARN for cross-account sharing or stricter key policy control.

Metadata:
    AWS::CloudFormation::Interface:
        ParameterGroups:
            -
                Label:
                    default: AgentCore Gateway Configuration
                Parameters:
                    - GatewayName
                    - Environment
                    - OAuthScope
                    - SecretsKmsKeyId
            -
                Label:
                    default: Agent Tool Configurations
                Parameters:
                    - MediaProcessingToolLambdaArn
                    - AudioStemToolLambdaArn
                    - SpeechDiarizationToolLambdaArn
                    - ShotSegmentationToolLambdaArn
                    - FaceRecognitionToolLambdaArn
                    - HybridSearchToolLambdaArn
                    - HybridSearchAdminToolLambdaArn
                    - TextToSpeechToolLambdaArn
                    - BedrockInferenceToolLambdaArn
                    - PromptRegistryToolLambdaArn
                    - ConversationAnalysisToolLambdaArn
                    - ShotMetadataEnrichmentToolLambdaArn
                    - ProgramStructureAnalysisToolLambdaArn
                    - AudioDescriptionToolLambdaArn
                    - CastResolutionToolLambdaArn
                    - ArtworkSelectionToolLambdaArn
                    - SpeechEnhancementToolLambdaArn
                    - ProxyBucket
        ParameterLabels:
            GatewayName:
                default: Gateway Name
            Environment:
                default: Deployment Environment
            OAuthScope:
                default: OAuth Scope Identifier
            SecretsKmsKeyId:
                default: Credentials Secret KMS Key
            MediaProcessingToolLambdaArn:
                default: Media Processing Tool Lambda ARN
            AudioStemToolLambdaArn:
                default: Audio Stem Tool Lambda ARN
            SpeechDiarizationToolLambdaArn:
                default: Speech Diarization Tool Lambda ARN
            ShotSegmentationToolLambdaArn:
                default: Shot Segmentation Tool Lambda ARN (optional)
            FaceRecognitionToolLambdaArn:
                default: Face Recognition Tool Lambda ARN (optional)
            HybridSearchToolLambdaArn:
                default: Hybrid Search Tool Lambda ARN (optional)
            HybridSearchAdminToolLambdaArn:
                default: Hybrid Search ADMIN Tool Lambda ARN (optional)
            TextToSpeechToolLambdaArn:
                default: Text-to-Speech Tool Lambda ARN (optional)
            BedrockInferenceToolLambdaArn:
                default: Bedrock Inference Tool Lambda ARN (optional)
            PromptRegistryToolLambdaArn:
                default: Prompt Registry Tool Lambda ARN (optional)
            ConversationAnalysisToolLambdaArn:
                default: Conversation Analysis Tool Lambda ARN (optional)
            ShotMetadataEnrichmentToolLambdaArn:
                default: Shot Metadata Enrichment Tool Lambda ARN (optional)
            ProgramStructureAnalysisToolLambdaArn:
                default: Program Structure Analysis Tool Lambda ARN (optional)
            AudioDescriptionToolLambdaArn:
                default: Audio Description Tool Lambda ARN (optional)
            CastResolutionToolLambdaArn:
                default: Person Binding Tool Lambda ARN (optional)
            ArtworkSelectionToolLambdaArn:
                default: Artwork Selection Tool Lambda ARN (optional)
            SpeechEnhancementToolLambdaArn:
                default: Speech Enhancement Tool Lambda ARN (optional)
            ProxyBucket:
                default: Proxy Bucket (micro-workflow outputs)
            IngestBucket:
                default: Ingest Bucket (source media listing, optional)

# ---------------------------------------------------------------------------
# Conditions
# ---------------------------------------------------------------------------
Conditions:
    ShotSegmentationEnabled: !Not [!Equals [!Ref ShotSegmentationToolLambdaArn, ""]]
    FaceRecognitionEnabled: !Not [!Equals [!Ref FaceRecognitionToolLambdaArn, ""]]
    HybridSearchEnabled: !Not [!Equals [!Ref HybridSearchToolLambdaArn, ""]]
    HybridSearchAdminEnabled: !Not [!Equals [!Ref HybridSearchAdminToolLambdaArn, ""]]
    TextToSpeechEnabled: !Not [!Equals [!Ref TextToSpeechToolLambdaArn, ""]]
    BedrockInferenceEnabled: !Not [!Equals [!Ref BedrockInferenceToolLambdaArn, ""]]
    PromptRegistryEnabled: !Not [!Equals [!Ref PromptRegistryToolLambdaArn, ""]]
    PromptRegistryAdminEnabled: !Not [!Equals [!Ref PromptRegistryAdminToolLambdaArn, ""]]
    ConversationAnalysisEnabled: !Not [!Equals [!Ref ConversationAnalysisToolLambdaArn, ""]]
    ShotMetadataEnrichmentEnabled: !Not [!Equals [!Ref ShotMetadataEnrichmentToolLambdaArn, ""]]
    ProgramStructureAnalysisEnabled: !Not [!Equals [!Ref ProgramStructureAnalysisToolLambdaArn, ""]]
    AudioDescriptionEnabled: !Not [!Equals [!Ref AudioDescriptionToolLambdaArn, ""]]
    CastResolutionEnabled: !Not [!Equals [!Ref CastResolutionToolLambdaArn, ""]]
    ArtworkSelectionEnabled: !Not [!Equals [!Ref ArtworkSelectionToolLambdaArn, ""]]
    SpeechEnhancementEnabled: !Not [!Equals [!Ref SpeechEnhancementToolLambdaArn, ""]]
    IngestListEnabled: !Not [!Equals [!Ref IngestBucket, ""]]

# ---------------------------------------------------------------------------
# Resources
# ---------------------------------------------------------------------------
Resources:

    # -------------------------------------------------------------------------
    # Cognito User Pool — acts as the OAuth 2.0 authorisation server.
    # No human sign-in needed; M2M client credentials flow only.
    # -------------------------------------------------------------------------
    GatewayUserPool:
        Type: AWS::Cognito::UserPool
        Properties:
            UserPoolName: !Sub "${GatewayName}-user-pool-${Environment}"
            # M2M pool — disable all human auth flows
            AdminCreateUserConfig:
                AllowAdminCreateUserOnly: true
            UserPoolTags:
                Environment: !Ref Environment
                ManagedBy: CloudFormation

    # Resource server defines the scope clients must request
    GatewayResourceServer:
        Type: AWS::Cognito::UserPoolResourceServer
        Properties:
            UserPoolId: !Ref GatewayUserPool
            Identifier: !Ref OAuthScope
            # The Identifier doubles as the audience (aud) claim in the token.
            # Callers request: <Identifier>/<scope-name>
            Name: !Sub "${GatewayName}-resource-server"
            Scopes:
                - ScopeName: invoke
                  ScopeDescription: "Invoke AgentCore Gateway tools"

    # M2M app client — issues client_credentials tokens
    GatewayAppClient:
        Type: AWS::Cognito::UserPoolClient
        DependsOn: GatewayResourceServer
        Properties:
            ClientName: !Sub "${GatewayName}-m2m-client-${Environment}"
            UserPoolId: !Ref GatewayUserPool
            GenerateSecret: true                    # required for client_credentials flow
            AllowedOAuthFlows:
                - client_credentials
            AllowedOAuthScopes:
                - !Sub "${OAuthScope}/invoke"
            AllowedOAuthFlowsUserPoolClient: true
            ExplicitAuthFlows: []                   # no human flows
            # Codifies the 2026-09-03 console change (Cognito default is 60
            # MINUTES). Declared here because UpdateUserPoolClient RESETS any
            # unspecified attribute to its default — an update touching this
            # client for any other reason would silently knock tokens back to
            # 1h and break long pollers mid-wait.
            AccessTokenValidity: 12
            TokenValidityUnits:
                AccessToken: hours

    # Cognito domain — required to expose the token endpoint
    GatewayUserPoolDomain:
        Type: AWS::Cognito::UserPoolDomain
        Properties:
            UserPoolId: !Ref GatewayUserPool
            # Must be globally unique — stack name + account suffix keeps it so
            Domain: !Sub "${GatewayName}-${Environment}-${AWS::AccountId}"

    # -------------------------------------------------------------------------
    # Secrets Manager — gateway credentials bundle
    # Created here as a placeholder; the custom resource Lambda populates it
    # after the gateway and Cognito client both exist.
    # -------------------------------------------------------------------------
    GatewayCredentialsSecret:
        Type: AWS::SecretsManager::Secret
        Metadata:
            checkov:
                skip:
                    - id: CKV_AWS_149
                      comment: >-
                        the SecretsKmsKeyId parameter already accepts a CMK; alias/aws/secretsmanager is the documented sample default
        Properties:
            Name: !Sub "/${GatewayName}/${Environment}/gateway-credentials"
            Description: "AgentCore Gateway OAuth credentials and endpoint URLs"
            KmsKeyId: !Ref SecretsKmsKeyId
            # Placeholder — overwritten by GatewaySecretsPopulator custom resource
            SecretString: '{"status":"pending"}'
            Tags:
                - Key: Environment
                  Value: !Ref Environment
                - Key: ManagedBy
                  Value: CloudFormation

    # -------------------------------------------------------------------------
    # IAM Role — custom resource Lambda
    # Needs cognito-idp:DescribeUserPoolClient to read the client secret,
    # and secretsmanager:PutSecretValue to write the bundle.
    # -------------------------------------------------------------------------
    SecretsPopulatorRole:
        Type: AWS::IAM::Role
        Properties:
            AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                    - Effect: Allow
                      Principal:
                          Service: lambda.amazonaws.com
                      Action: sts:AssumeRole
            Policies:
                - PolicyName: ReadCognitoAndWriteSecret
                  PolicyDocument:
                      Version: "2012-10-17"
                      Statement:
                          # Scoped to the declared group, and deliberately NOT
                          # AWSLambdaBasicExecutionRole: that managed policy
                          # grants logs:CreateLogGroup on every group, which
                          # lets a function that cannot reach its declared
                          # group silently create an unmanaged one instead of
                          # failing visibly. That is how the two orphaned
                          # groups this stack now routes around came to exist.
                          - Effect: Allow
                            Action:
                                - logs:CreateLogStream
                                - logs:PutLogEvents
                            Resource: !GetAtt SecretsPopulatorLogGroup.Arn
                          - Effect: Allow
                            Action: cognito-idp:DescribeUserPoolClient
                            Resource: !GetAtt GatewayUserPool.Arn
                          - Effect: Allow
                            Action:
                                - secretsmanager:PutSecretValue
                                - secretsmanager:GetSecretValue
                            Resource: !Ref GatewayCredentialsSecret

    # -------------------------------------------------------------------------
    # Custom resource Lambda — fetches client secret from Cognito and writes
    # the full credentials bundle to Secrets Manager.
    # Runs on Create and Update; no-ops on Delete (secret deleted with stack).
    #
    # Code: gateway_tool/secrets_populator.py, packaged into the gateway_tool
    # zip by build-deploy-s3-dist.sh. It could legally be an inline ZipFile,
    # but inline code is always named "index" — so it would have to be
    # index.handler while download_url could not. Sharing the zip gives both
    # distinct module names and one place to look for Lambda source.
    # -------------------------------------------------------------------------
    # Declared explicitly so retention is 30 days and the group dies with the
    # stack. Lambda auto-creates /aws/lambda/<fn> on first invocation with
    # never-expire retention and no stack ownership, which orphans the group
    # on stack delete — and then makes the NEXT create fail with
    # "already exists". Both functions here shipped that way once.
    # Named off GatewayName/Environment to match FunctionName: this stack has
    # no ResourcePrefix, so those two are its only uniqueness key.
    #
    # The "-log" SUFFIX is load-bearing and is NOT cosmetic. Declaring the
    # canonical /aws/lambda/{FunctionName} name failed the create at PRE-FLIGHT
    # ("Validation failed with 2 error(s)", no per-resource event) because
    # earlier standalone deploys of this stack left both canonical groups behind
    # as unowned, Lambda-auto-created groups — measured 2026-08-05 in
    # eu-west-1, retentionInDays None, 2172 and 7952 bytes, with neither
    # function still existing. CFN cannot adopt an existing group and cannot
    # skip a resource conditionally on a runtime lookup.
    #
    # So the declared name is deliberately NOT the canonical one, and
    # LoggingConfig.LogGroup on the function points at it. That decouples the
    # group name from FunctionName exactly the way the seven StartBuildLambdas
    # do it, and leaves the two pre-existing orphans to be swept separately
    # rather than deleting 10 KB of historical logs to satisfy a name.
    SecretsPopulatorLogGroup:
        Type: AWS::Logs::LogGroup
        Properties:
            LogGroupName: !Sub "/aws/lambda/${GatewayName}-secrets-populator-${Environment}-log"
            RetentionInDays: 30

    SecretsPopulatorFunction:
        Type: AWS::Lambda::Function
        Metadata:
            cfn_nag:
                rules_to_suppress:
                    - id: W89
                      reason: Custom resource Lambda runs once at deploy time; VPC placement adds no security value for a one-shot Cognito/SecretsManager call with no persistent connections.
                    - id: W92
                      reason: Custom resource Lambda is invoked exclusively by CloudFormation during stack operations; reserved concurrency is unnecessary.
        Properties:
            FunctionName: !Sub "${GatewayName}-secrets-populator-${Environment}"
            Description: "Custom resource: writes AgentCore gateway credentials to Secrets Manager"
            Runtime: python3.13
            Architectures: [arm64]
            Handler: secrets_populator.handler
            Role: !GetAtt SecretsPopulatorRole.Arn
            Timeout: 60
            MemorySize: 128
            # The ONLY way this function reaches its declared group: the group's
            # name is not /aws/lambda/{FunctionName} (see SecretsPopulatorLogGroup).
            LoggingConfig:
                LogGroup: !Ref SecretsPopulatorLogGroup
            Code:
                S3Bucket: !FindInMap [CodeBuild, Source, Bucket]
                S3Key: !Sub
                    - ${keyPrefix}/${pkg}
                    - keyPrefix: !FindInMap [CodeBuild, Source, KeyPrefix]
                      pkg: !FindInMap [CodeBuild, Source, GatewayToolPackage]

    # -------------------------------------------------------------------------
    # Custom Resource — triggers SecretsPopulatorFunction after all dependents
    # are ready. DependsOn ensures gateway URL and Cognito client both exist.
    # -------------------------------------------------------------------------
    GatewaySecretsPopulator:
        Type: Custom::GatewaySecretsPopulator
        # SecretsPopulatorLogGroup: the group must exist BEFORE the function is
        # first invoked, or Lambda wins the race and creates the unmanaged one
        # anyway. DownloadUrlFunction is gateway-invoked, so it needs no such
        # edge — nothing in the stack triggers it at deploy time.
        DependsOn:
            - GatewayUserPoolDomain
            - SecretsPopulatorLogGroup
        Properties:
            ServiceToken: !GetAtt SecretsPopulatorFunction.Arn
            # Changing any value here triggers re-population on stack update
            UserPoolId:    !Ref GatewayUserPool
            ClientId:      !Ref GatewayAppClient
            SecretArn:     !Ref GatewayCredentialsSecret
            GatewayUrl:    !GetAtt MediaWorkflowGateway.GatewayUrl
            TokenEndpoint: !Sub
                - "https://${Domain}.auth.${AWS::Region}.amazoncognito.com/oauth2/token"
                - Domain: !Sub "${GatewayName}-${Environment}-${AWS::AccountId}"
            Scope:         !Sub "${OAuthScope}/invoke"

    # -------------------------------------------------------------------------
    # Client kit publisher — writes the customer-facing client kit
    # (skills + configure.sh + get_gateway_token.sh + README) to the
    # proxy bucket under _toolkit/ on every Create/Update. The kit is
    # BAKED INTO the gateway_tool zip at build time (client_kit.zip),
    # never copied from the dist bucket — customers deploying from our
    # template may not have GetObject there. Customers fetch it with
    # only their own AWS access:
    #     aws s3 cp s3://<proxy>/_toolkit/client-kit.zip .
    # -------------------------------------------------------------------------
    KitPublisherLogGroup:
        Type: AWS::Logs::LogGroup
        Properties:
            # "-log" suffix + LoggingConfig, never /aws/lambda/{name} —
            # see SecretsPopulatorLogGroup for the measured reason.
            LogGroupName: !Sub "/aws/lambda/${GatewayName}-kit-publisher-${Environment}-log"
            RetentionInDays: 30

    KitPublisherRole:
        Type: AWS::IAM::Role
        Properties:
            AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                    - Effect: Allow
                      Principal:
                          Service: lambda.amazonaws.com
                      Action: sts:AssumeRole
            Policies:
                - PolicyName: WriteClientKit
                  PolicyDocument:
                      Version: "2012-10-17"
                      Statement:
                          # Scoped logs, deliberately not
                          # AWSLambdaBasicExecutionRole (see
                          # SecretsPopulatorRole for why).
                          - Effect: Allow
                            Action:
                                - logs:CreateLogStream
                                - logs:PutLogEvents
                            Resource: !GetAtt KitPublisherLogGroup.Arn
                          # Reads AND writes ONLY the kit prefix —
                          # nowhere near micro-workflow/* outputs.
                          # GetObject backs the idempotency probe (skip
                          # a byte-identical republish); ListBucket is
                          # what makes a probe on a MISSING key answer
                          # 404 NoSuchKey instead of 403 AccessDenied
                          # (same reasoning as the gateway tool role).
                          - Effect: Allow
                            Action:
                                - s3:PutObject
                                - s3:GetObject
                            Resource: !Sub "arn:aws:s3:::${ProxyBucket}/_toolkit/*"
                          - Effect: Allow
                            Action: s3:ListBucket
                            Resource: !Sub "arn:aws:s3:::${ProxyBucket}"
                            Condition:
                                StringLike:
                                    s3:prefix: "_toolkit/*"

    KitPublisherFunction:
        Type: AWS::Lambda::Function
        Metadata:
            cfn_nag:
                rules_to_suppress:
                    - id: W89
                      reason: Custom resource Lambda runs once at deploy time; VPC placement adds no security value for a one-shot S3 put.
                    - id: W92
                      reason: Custom resource Lambda is invoked exclusively by CloudFormation during stack operations; reserved concurrency is unnecessary.
        Properties:
            FunctionName: !Sub "${GatewayName}-kit-publisher-${Environment}"
            Description: "Custom resource: publishes the client kit (skills + configure) to the proxy bucket _toolkit/ prefix"
            Runtime: python3.13
            Architectures: [arm64]
            Handler: kit_publisher.handler
            Role: !GetAtt KitPublisherRole.Arn
            Timeout: 60
            MemorySize: 128
            LoggingConfig:
                LogGroup: !Ref KitPublisherLogGroup
            Code:
                S3Bucket: !FindInMap [CodeBuild, Source, Bucket]
                S3Key: !Sub
                    - ${keyPrefix}/${pkg}
                    - keyPrefix: !FindInMap [CodeBuild, Source, KeyPrefix]
                      pkg: !FindInMap [CodeBuild, Source, GatewayToolPackage]

    ClientKitPublisher:
        Type: Custom::ClientKitPublisher
        # The group must exist BEFORE first invocation or Lambda races
        # it with an unmanaged auto-created group.
        DependsOn:
            - KitPublisherLogGroup
        Properties:
            ServiceToken: !GetAtt KitPublisherFunction.Arn
            Bucket: !Ref ProxyBucket
            # Version is in the properties so every .version bump
            # re-fires the publish on stack update.
            Version: "%%VERSION%%"
            # This deployment's secret path, injected into the published
            # kit as kit.env so configure.sh defaults to its OWN gateway
            # (a derived GatewayName has no well-known name). MUST mirror
            # GatewayCredentialsSecret's Name — the test suite pins the
            # two expressions equal.
            SecretName: !Sub "/${GatewayName}/${Environment}/gateway-credentials"

    # -------------------------------------------------------------------------
    # IAM Role — AgentCore Gateway execution role
    # Needs lambda:InvokeFunction on each tool Lambda.
    # -------------------------------------------------------------------------
    GatewayExecutionRole:
        Type: AWS::IAM::Role
        Properties:
            AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                    - Effect: Allow
                      Principal:
                          Service: bedrock-agentcore.amazonaws.com
                      Action: sts:AssumeRole
                      Condition:
                          StringEquals:
                              aws:SourceAccount: !Ref AWS::AccountId
            Policies:
                - PolicyName: InvokeToolLambdas
                  PolicyDocument:
                      Version: "2012-10-17"
                      Statement:
                          - Effect: Allow
                            Action: lambda:InvokeFunction
                            Resource:
                                - !Ref AudioStemToolLambdaArn
                                - !Ref SpeechDiarizationToolLambdaArn
                                - !Ref MediaProcessingToolLambdaArn
                                - !GetAtt DownloadUrlFunction.Arn
                          - !If
                            - ShotSegmentationEnabled
                            - Effect: Allow
                              Action: lambda:InvokeFunction
                              Resource: !Ref ShotSegmentationToolLambdaArn
                            - !Ref AWS::NoValue
                          - !If
                            - FaceRecognitionEnabled
                            - Effect: Allow
                              Action: lambda:InvokeFunction
                              Resource: !Ref FaceRecognitionToolLambdaArn
                            - !Ref AWS::NoValue
                          - !If
                            - HybridSearchEnabled
                            - Effect: Allow
                              Action: lambda:InvokeFunction
                              Resource: !Ref HybridSearchToolLambdaArn
                            - !Ref AWS::NoValue
                          - !If
                            - HybridSearchAdminEnabled
                            - Effect: Allow
                              Action: lambda:InvokeFunction
                              Resource: !Ref HybridSearchAdminToolLambdaArn
                            - !Ref AWS::NoValue
                          - !If
                            - TextToSpeechEnabled
                            - Effect: Allow
                              Action: lambda:InvokeFunction
                              Resource: !Ref TextToSpeechToolLambdaArn
                            - !Ref AWS::NoValue
                          - !If
                            - BedrockInferenceEnabled
                            - Effect: Allow
                              Action: lambda:InvokeFunction
                              Resource: !Ref BedrockInferenceToolLambdaArn
                            - !Ref AWS::NoValue
                          - !If
                            - PromptRegistryEnabled
                            - Effect: Allow
                              Action: lambda:InvokeFunction
                              Resource: !Ref PromptRegistryToolLambdaArn
                            - !Ref AWS::NoValue
                          - !If
                            - PromptRegistryAdminEnabled
                            - Effect: Allow
                              Action: lambda:InvokeFunction
                              Resource: !Ref PromptRegistryAdminToolLambdaArn
                            - !Ref AWS::NoValue
                          - !If
                            - ConversationAnalysisEnabled
                            - Effect: Allow
                              Action: lambda:InvokeFunction
                              Resource: !Ref ConversationAnalysisToolLambdaArn
                            - !Ref AWS::NoValue
                          - !If
                            - ShotMetadataEnrichmentEnabled
                            - Effect: Allow
                              Action: lambda:InvokeFunction
                              Resource: !Ref ShotMetadataEnrichmentToolLambdaArn
                            - !Ref AWS::NoValue
                          - !If
                            - ProgramStructureAnalysisEnabled
                            - Effect: Allow
                              Action: lambda:InvokeFunction
                              Resource: !Ref ProgramStructureAnalysisToolLambdaArn
                            - !Ref AWS::NoValue
                          - !If
                            - AudioDescriptionEnabled
                            - Effect: Allow
                              Action: lambda:InvokeFunction
                              Resource: !Ref AudioDescriptionToolLambdaArn
                            - !Ref AWS::NoValue
                          - !If
                            - CastResolutionEnabled
                            - Effect: Allow
                              Action: lambda:InvokeFunction
                              Resource: !Ref CastResolutionToolLambdaArn
                            - !Ref AWS::NoValue
                          - !If
                            - ArtworkSelectionEnabled
                            - Effect: Allow
                              Action: lambda:InvokeFunction
                              Resource: !Ref ArtworkSelectionToolLambdaArn
                            - !Ref AWS::NoValue
                          - !If
                            - SpeechEnhancementEnabled
