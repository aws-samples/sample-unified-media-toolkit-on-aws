                                          error_code:
                                              Type: string
                                              Description: "Stable failure code alone — the raised exception's class name (e.g. NoAudioStream, NoSpeechDetected) or the Step Functions error field (e.g. Lambda.Unknown). Match on this; the human detail lives in error."

                                - Name: describe_tool
                                  Description: "Return the deployed version of the speech diarization tool and its backend info (state machine ARN, short description, output contract)."
                                  InputSchema:
                                      Type: object
                                      Description: "No input required. Takes no idempotency_token — this is pure introspection with no execution and no state, so there is nothing to deduplicate. Sent anyway it is ignored with a log line, never rejected."
                                  OutputSchema:
                                      Type: object
                                      Description: "Tool version and backend info"
                                      Properties:
                                          version:
                                              Type: string
                                              Description: "Semantic version of the deployed tool (e.g. 1.2.0)"
                                          state_machine_arn:
                                              Type: string
                                              Description: "ARN of the backing Step Functions state machine (for console/CLI debugging)"
                                          description:
                                              Type: string
                                              Description: "Short description of the backend pipeline"
                                          output_contract:
                                              Type: object
                                              Description: "Field-level contract for every outputs[] label: basename, kind (file/prefix), mime, the one-line description that doubles as the entries' desc, and a compact example of the file's field names/nesting (contents block for binary files). Static per tool version — cache it for the session. Anything not listed is internal and may change without notice."
                                          input_examples:
                                              Type: object
                                              Description: "Per tool (keyed by tool name under tools): required lists the fields the gateway refuses without — a prose entry like 'a OR b' states a one-of rule this schema cannot express — and example is a minimal valid request including recommended optionals; every other accepted parameter is declared, with type and description, in the tool's InputSchema. The shapes and field names are the contract; every s3 uri, ARN, and id value is an invented placeholder to substitute. Each submit example passes the gateway's own input validation (pinned by a unit test); where a one-of rule exists, alternatives holds one valid example of each other form. Static per tool version — cache it for the session."

    # -------------------------------------------------------------------------
    # Gateway Target — Media Processing
    # -------------------------------------------------------------------------
    MediaProcessingTarget:
        Type: AWS::BedrockAgentCore::GatewayTarget
        Properties:
            Name: media-processing
            Description: "ffmpeg-based media processing: proxy transcode, audio extraction, frame capture — flexible output groups, partial clip support"
            GatewayIdentifier: !Ref MediaWorkflowGateway
            CredentialProviderConfigurations:
                - CredentialProviderType: GATEWAY_IAM_ROLE
            TargetConfiguration:
                Mcp:
                    Lambda:
                        LambdaArn: !Ref MediaProcessingToolLambdaArn
                        ToolSchema:
                            InlinePayload:
                                - Name: process_media
                                  Description: "Transcode, extract audio, capture frames, or read technical metadata from a media asset using ffmpeg. Supports multiple simultaneous output groups (mp4, wav, m4a, jpeg, png, metadata). Accepts MXF, MP4, MKV, ProRes, and other broadcast formats. For metadata only, request a single metadata group — that path runs no transcode and is far cheaper than producing a throwaway proxy. Async — call get_job_status with the returned job_id to poll. Defaults to a single MP4 proxy if output_groups is omitted."
                                  InputSchema:
                                      Type: object
                                      Description: "Parameters for media processing"
                                      Required:
                                          - asset_s3uri
                                      Properties:
                                          asset_s3uri:
                                              Type: string
                                              Description: "S3 URI of the source media file (e.g. s3://bucket/key.mxf)"
                                          idempotency_token:
                                              Type: string
                                              Description: "Optional idempotency token (1-80 chars of A-Z a-z 0-9 _ . -). Folded into the workflow_id hash and then DISCARDED — never forwarded, never stored, and no response echoes it. Same token + same parameters returns the EXISTING run; any parameter or token change starts a fresh run. Omitting it still dedups on the parameters alone, so a token is only needed to distinguish two otherwise-identical requests."
                                          output_groups:
                                              Type: array
                                              Description: "List of output groups to produce. Each group requires group_name and format (mp4, wav, m4a, jpeg, png, metadata). Defaults to a single mp4 proxy if omitted. Only the first mp4 and first jpeg/png group are processed; multiple wav/m4a groups are all produced. A metadata group writes a JSON file of technical facts and requires no transcode."
                                              Items:
                                                  Type: object
                                                  Description: "Output group definition"
                                                  Required:
                                                      - group_name
                                                      - format
                                                  Properties:
                                                      group_name:
                                                          Type: string
                                                          Description: "Unique name for this output group; used as the output subdirectory"
                                                      format:
                                                          Type: string
                                                          Description: "Output format: mp4, wav, m4a, jpeg, png, or metadata"
                                                      name:
                                                          Type: string
                                                          Description: "Output filename stem (sanitised); defaults to group_name"
                                                      codec:
                                                          Type: string
                                                          Description: "Codec override. mp4: libopenh264 (default). wav: pcm_s16le (default). m4a: aac (default)."
                                                      gop_seconds:
                                                          Type: number
                                                          Description: "mp4 only: GOP length in seconds (default 2.0)"
                                                      motion_factor:
                                                          Type: number
                                                          Description: "mp4 only: bitrate tuning multiplier (default 1.6; increase for high-motion content)"
                                                      sampling_rate:
                                                          Type: integer
                                                          Description: "wav/m4a only: output sample rate in Hz (default 48000)"
                                                      audio_channels:
                                                          Type: integer
                                                          Description: "wav/m4a only: number of output audio channels (default 1 for wav, 2 for m4a)"
                                                      audio_bitrate:
                                                          Type: integer
                                                          Description: "m4a only: audio bitrate in kbps (default 96)"
                                                      frame_interval_sec:
                                                          Type: number
                                                          Description: "jpeg/png only: capture one frame every N seconds (default 1.0; must be > 0)"
                                                      detail:
                                                          Type: string
                                                          Description: "metadata only: 'default' (container format, streams, chapters, programs) or 'full' (adds per-stream disposition and tags — language, track title, default/forced flags). Default 'default'. Both cost the same single read; 'full' is a filtering decision. Chapter titles and MPEG-TS program service names are present at BOTH levels — only per-stream keys are gated. Frame- and packet-level detail is not available at any level. MXF sources additionally get an 'mxf' block (essence type, edit rate, start timecode, frame-accurate duration) automatically — it is never requested."
                                          mark_in_out:
                                              Type: array
                                              Description: "Clip window [start_sec, end_sec]. Automatically enables partial processing. end_sec must be greater than start_sec."
                                              Items:
                                                  Type: number
                                          use_partial:
                                              Type: boolean
                                              Description: "Trim the source to the mark_in_out window (default false). Implied true whenever mark_in_out is supplied, so an explicit value is only needed to document intent."
                                          width:
                                              Type: integer
                                              Description: "Output video width in pixels (default 960). Applies to mp4 and all frame groups; ignored for metadata groups. Minimum 1."
                                          height:
                                              Type: integer
                                              Description: "Output video height in pixels (default 540). Applies to mp4 and all frame groups; ignored for metadata groups. Minimum 1."
                                          crop_x:
                                              Type: integer
                                              Description: "Pixels to crop from the left before scaling (default 0). Shared across all video and frame groups; ignored for metadata groups."
                                          crop_y:
                                              Type: integer
                                              Description: "Pixels to crop from the top before scaling (default 0). Shared across all video and frame groups; ignored for metadata groups."
                                          use_channel_mapping:
                                              Type: boolean
                                              Description: "Apply audio_channel_mapping to select specific audio streams (default false). Set automatically when audio_channel_mapping is provided."
                                          audio_channel_mapping:
                                              Type: array
                                              Description: "1-based audio stream indices to select (up to 2 elements). Out-of-range indices fall back to auto-selection."
                                              Items:
                                                  Type: integer
                                  OutputSchema:
                                      Type: object
                                      Description: "Job submission result — a HANDLE, never results. Every field here is present on a fresh start AND on an absorbed resubmit of an already-finished run; only `status` differs. Read `status` and `message`, then call get_job_status for anything else."
                                      Properties:
                                          job_id:
                                              Type: string
                                              Description: "Step Functions execution ARN — pass to get_job_status to poll"
                                          status:
                                              Type: string
                                              Description: "RUNNING on a fresh start. An identical request already submitted is NOT started twice: this returns the EXISTING run's status instead, which may be RUNNING | SUCCEEDED | FAILED | TIMED_OUT | ABORTED. A non-RUNNING status here carries NO results — it only reports that the run already reached that state; call get_job_status with this job_id to read anything about it."
                                          message:
                                              Type: string
                                              Description: "Present ONLY when this call did not resubmit because an identical request already exists. Its absence means a new execution was just started. Every other field is identical in both cases, so this is the only field that distinguishes them."
                                          current_state:
                                              Type: string
                                              Description: "Active pipeline stage. Present while the run is RUNNING; absent once it has stopped, because a stopped execution is in no state."
                                          workflow_id:
                                              Type: string
                                              Description: "Identifier of this run; also the final path segment of output_s3_prefix (micro-workflow/{target}/{workflow_id}/)"
                                          output_s3_prefix:
                                              Type: string
                                              Description: "Service-derived S3 prefix where all outputs are written"
                                          asset_s3uri:
                                              Type: string
                                              Description: "S3 URI of the source media file (echoed from input)"
                                          error:
                                              Type: string
                                              Description: "Failure cause. Present only when this call was absorbed into a run that had already FAILED, TIMED_OUT, or been ABORTED. A terminal failure is STICKY: Step Functions reserves the execution name for 90 days, so resubmitting the identical request returns this same failure for that whole window. Retrying verbatim never re-runs it — change a parameter, or pass a different idempotency_token."

                                - Name: get_job_status
                                  Description: "Poll a media-processing job by its execution ARN. Returns the active pipeline stage while running, or the full structured results when complete."
                                  InputSchema:
                                      Type: object
                                      Description: "Job poll request. Takes no idempotency_token, and the retired `uuid` names nothing here — a poll starts no execution, so neither key could change what this returns. Sent anyway, either is ignored with a log line and never rejected: a hallucinated parameter must not fail a poll that is otherwise correct."
                                      Required:
                                          - job_id
                                      Properties:
                                          job_id:
                                              Type: string
                                              Description: "Step Functions execution ARN returned by process_media"
                                  OutputSchema:
                                      Type: object
                                      Description: "Job status and results"
                                      Properties:
                                          job_id:
                                              Type: string
                                              Description: "Step Functions execution ARN — the value you polled with, echoed on every branch (including RUNNING and every failure) so a status reply always names its own run"
                                          status:
                                              Type: string
                                              Description: "RUNNING | SUCCEEDED | FAILED | TIMED_OUT | ABORTED"
                                          current_state:
                                              Type: string
                                              Description: "Active pipeline stage name (present when RUNNING)"
                                          workflow_id:
                                              Type: string
                                              Description: "Identifier of this run; also the final path segment of output_s3_prefix (micro-workflow/{target}/{workflow_id}/)"
                                          output_s3_prefix:
                                              Type: string
                                              Description: "Service-derived S3 prefix where all outputs are written. Read back from the execution's own input, so it is present on EVERY branch — including RUNNING and every failure, where partial results already live under it."
                                          asset_s3uri:
                                              Type: string
                                              Description: "S3 URI of the source media file (echoed from input)"
                                          duration_sec:
                                              Type: number
                                              Description: "Source media duration in seconds"
                                          has_video:
                                              Type: boolean
                                              Description: "True if the source has a video stream"
                                          has_audio:
                                              Type: boolean
                                              Description: "True if the source has an audio stream"
                                          is_all_intra:
                                              Type: boolean
                                              Description: "True for ProRes/DNxHD/D10; false for H.264/HEVC; absent for ambiguous codecs"
                                          output_keys:
                                              Type: object
                                              Description: "Map of group_name to S3 key for each completed output group. Frame groups point to frame_manifest.json; metadata groups point to the metadata JSON."
                                          probe_s3_key:
                                              Type: string
                                              Description: "S3 key of probe.json with full container, codec, and stream metadata"
                                          pipeline_wall_sec:
                                              Type: number
                                              Description: "Total wall-clock time for the pipeline in seconds"
                                          total_estimated_cost:
                                              Type: number
                                              Description: "Estimated total cost in USD"
                                          usage_key:
                                              Type: string
                                              Description: "S3 key of the full per-state cost and usage breakdown"
                                          outputs:
                                              Type: array
                                              Description: "All job outputs as S3 objects: {uri, mime, label, desc}. Entries whose uri ends with '/' are prefixes containing multiple objects and carry no mime. Labels (one per output group_name, plus probe, usage) and output basenames are stable API. To fetch a file over HTTP, pass its uri to media-outputs___get_download_url."
                                              Items:
                                                  Type: object
                                                  Description: "One output object or prefix"
                                                  Properties:
                                                      uri:
                                                          Type: string
                                                          Description: "s3:// URI of the output object, or prefix when ending with '/'"
                                                      mime:
                                                          Type: string
                                                          Description: "Registered MIME type; absent for prefix entries"
                                                      label:
                                                          Type: string
                                                          Description: "Stable semantic label for selecting outputs"
                                                      desc:
                                                          Type: string
                                                          Description: "One-line role description (what the file is and what to use it for), joined from the tool's output contract; absent when the contract lacks the label"
                                                  Required:
                                                      - uri
                                                      - label
                                          error:
                                              Type: string
                                              Description: "Failure cause (present when status is FAILED, TIMED_OUT, or ABORTED)"

                                - Name: describe_tool
                                  Description: "Return the deployed version of the media processing tool and its backend info (state machine ARN, short description, output contract)."
                                  InputSchema:
                                      Type: object
                                      Description: "No input required. Takes no idempotency_token — this is pure introspection with no execution and no state, so there is nothing to deduplicate. Sent anyway it is ignored with a log line, never rejected."
                                  OutputSchema:
                                      Type: object
                                      Description: "Tool version and backend info"
                                      Properties:
                                          version:
                                              Type: string
                                              Description: "Semantic version of the deployed tool (e.g. 1.2.0)"
                                          state_machine_arn:
                                              Type: string
                                              Description: "ARN of the backing Step Functions state machine (for console/CLI debugging)"
                                          description:
                                              Type: string
                                              Description: "Short description of the backend pipeline"
                                          output_contract:
                                              Type: object
                                              Description: "Field-level contract keyed by output format kind (mp4, wav, m4a, jpeg, png, metadata) plus the fixed probe/usage labels — outputs[] labels are runtime group names, so desc is joined by each group's format. Same envelope as the sibling targets: basename, kind, mime, one-line description, compact example. Static per tool version — cache it for the session. Anything not listed is internal and may change without notice."
                                          input_examples:
                                              Type: object
                                              Description: "Per tool (keyed by tool name under tools): required lists the fields the gateway refuses without — a prose entry like 'a OR b' states a one-of rule this schema cannot express — and example is a minimal valid request including recommended optionals; every other accepted parameter is declared, with type and description, in the tool's InputSchema. The shapes and field names are the contract; every s3 uri, ARN, and id value is an invented placeholder to substitute. Each submit example passes the gateway's own input validation (pinned by a unit test); where a one-of rule exists, alternatives holds one valid example of each other form. Static per tool version — cache it for the session."
                                - Name: quick_edit
                                  Description: "Compose ONE output video from a cut list over one or more source videos: per-segment in/out marks in milliseconds (frame-accurate against the target rate), transitions (cut, fade, crossfade — a crossfade consumes its duration from both neighbours, so output duration = sum of marked durations minus crossfades), a reserved source 'black' for black holds/opens, per-segment normalized crop for reframing (e.g. vertical social clips — derive the window from face-recognition boxes), channel selection (av/v/a), and audio overlays (voiceover 'replace' or music-bed 'mix', record- or boundary-anchored). Sources are normalized to one target canvas/rate (fit + letterbox, never stretch); loudness is normalized to -23 LUFS by default when segments span more than one source. HDR sources are refused — supply SDR. Use process_media to render one whole asset; use capture_frames for stills. Async — poll get_job_status; the edit_manifest output records requested vs actual per cut. Caps: 100 segments, 25 distinct sources (overlay sources count), 25 overlays, 1 hour total, 5 s transitions."
                                  InputSchema:
                                      Type: object
                                      Description: "The inline JSON cut list — never an EDL file. Segment order IS the output timeline; the segment list is the duration budget."
                                      Required:
                                          - segments
                                      Properties:
                                          segments:
                                              Type: array
                                              Description: "Sequential segments. Each needs source_s3uri (s3:// uri, or the reserved generator 'black'), in_ms and out_ms (source position, in-inclusive/out-exclusive). Optional per segment: transition_in {type: cut|fade|crossfade, duration_ms ≤5000, optional audio_bed {source_s3uri, in_ms, out_ms, lead_ms, mode, gain_db, fade_in_ms, fade_out_ms}} — how this segment ARRIVES (first segment: cut or fade only); channel 'av'(default)|'v' (picture only, silence under)|'a' (audio only, black picture); crop {x,y,width,height} as NORMALIZED 0-1 ratios of the source frame (face-recognition bounding boxes are already in this space)."
                                              Items:
                                                  Type: object
                                                  Description: "One segment of the cut list"
                                                  Required:
                                                      - source_s3uri
                                                      - in_ms
                                                      - out_ms
                                                  Properties:
                                                      source_s3uri:
                                                          Type: string
                                                          Description: "s3:// uri of the source video, or the literal 'black' for a generated black+silence segment"
                                                      in_ms:
                                                          Type: integer
                                                          Description: "Source in-point in milliseconds (inclusive)"
                                                      out_ms:
                                                          Type: integer
                                                          Description: "Source out-point in milliseconds (exclusive)"
                                                      channel:
                                                          Type: string
                                                          Description: "What the segment contributes: av (default), v (picture only), a (audio only, black picture)"
                                                      crop:
                                                          Type: object
                                                          Description: "Normalized 0-1 reframe window {x, y, width, height}; x+width ≤ 1, y+height ≤ 1. Not allowed on 'black'."
                                                      transition_in:
                                                          Type: object
                                                          Description: "How this segment arrives: {type: cut|fade|crossfade, duration_ms (fade/crossfade only, ≤5000), audio_bed (optional music sting bridging this boundary)}"
                                          audio_overlays:
                                              Type: array
                                              Description: "Audio elements over the derived output timeline (max 25). Each: source_s3uri (audio or video with audio), in_ms/out_ms (element range), at_record_ms (position on the OUTPUT timeline), mode 'replace' (substitutes programme audio — J/L cuts, voiceover) or 'mix' (under programme audio — beds; set gain_db, e.g. -15), optional fade_in_ms/fade_out_ms. replace overlays may not overlap each other."
                                              Items:
                                                  Type: object
                                                  Description: "One audio overlay element"
                                                  Required:
                                                      - source_s3uri
                                                      - in_ms
                                                      - out_ms
                                                      - at_record_ms
                                                      - mode
                                                  Properties:
                                                      source_s3uri:
                                                          Type: string
                                                          Description: "s3:// uri of the audio source"
                                                      in_ms:
                                                          Type: integer
                                                          Description: "Element in-point in milliseconds"
                                                      out_ms:
                                                          Type: integer
                                                          Description: "Element out-point in milliseconds"
                                                      at_record_ms:
                                                          Type: integer
                                                          Description: "Where the element starts on the output timeline, in milliseconds"
                                                      mode:
                                                          Type: string
                                                          Description: "replace (substitutes programme audio) or mix (layers under it)"
                                                      gain_db:
                                                          Type: number
                                                          Description: "Static gain for mix elements, -60 to +12 dB (default 0)"
                                          transition:
                                              Type: object
                                              Description: "Global default transition where a segment has no transition_in: {type: cut|fade|crossfade, duration_ms}. Default cut."
                                          target:
                                              Type: object
                                              Description: "{resolution: 'WIDTHxHEIGHT' (even dimensions, e.g. '1920x1080' or vertical '1080x1920'), fps: '25' or '30000/1001'}. Derived automatically when every video source agrees; REQUIRED when they differ."
                                          loudnorm:
                                              Type: boolean
                                              Description: "Override the loudness-normalization default (-23 LUFS EBU R128). Measured ONCE PER UNIQUE SOURCE over a fixed window and applied as one constant gain per source — segments cut from the same master keep their relative dynamics rather than each being normalized to target. Default: on when segments span >1 distinct source, off for single-source edits."
                                          idempotency_token:
                                              Type: string
                                              Description: "Optional idempotency token (1-80 chars of A-Z a-z 0-9 _ . -). Folded into the workflow_id hash and discarded; same token + same cut list returns the existing run."
                                  OutputSchema:
                                      Type: object
                                      Description: "A job HANDLE, never results — poll get_job_status with job_id. Outputs on SUCCEEDED: the stitched mp4 (label 'edit' by default) and the edit_manifest evidence file."
                                      Properties:
                                          job_id:
                                              Type: string
                                              Description: "Step Functions execution ARN — pass to get_job_status"
                                          status:
                                              Type: string
                                              Description: "RUNNING on a fresh start; the existing run's status on an absorbed resubmit"
                                          workflow_id:
                                              Type: string
                                              Description: "The service's name for this run; outputs land under micro-workflow/media-processing/{workflow_id}/"
                                          output_s3_prefix:
                                              Type: string
                                              Description: "Service-derived output prefix"
                                          current_state:
                                              Type: string
                                              Description: "Active pipeline stage (present only while RUNNING)"
                                          segment_count:
                                              Type: integer
                                              Description: "Validated segment count"
                                          source_count:
                                              Type: integer
                                              Description: "Distinct sources (segments + overlays)"
                                          message:
                                              Type: string
                                              Description: "Present only when the call was absorbed into an existing run"
                                          error:
                                              Type: string
                                              Description: "Present when an absorbed run already failed terminally"
                                - Name: capture_frames
                                  Description: "Capture one still image per marker (milliseconds, snapped to each source's own frame grid) across one or more source videos — e.g. thumbnails, artwork candidates, QC spot-checks. Optional per-marker normalized crop (same reframe window as quick_edit) and a global resize canvas (fit + pad, never stretch; native size otherwise). HDR sources are refused — supply SDR. Async — poll get_job_status; the capture_manifest output maps marker index → image key with requested vs actual ms. Caps: 500 markers, 25 distinct sources. Deterministic names frame_{index:04d}.jpg|png."
                                  InputSchema:
                                      Type: object
                                      Description: "Markers over one or more sources"
                                      Required:
                                          - markers
                                      Properties:
                                          markers:
                                              Type: array
                                              Description: "Up to 500 markers. Each: source_s3uri (s3:// uri), at_ms (position in milliseconds), optional crop {x,y,width,height} as normalized 0-1 ratios."
                                              Items:
                                                  Type: object
                                                  Description: "One capture marker"
                                                  Required:
                                                      - source_s3uri
                                                      - at_ms
                                                  Properties:
                                                      source_s3uri:
                                                          Type: string
                                                          Description: "s3:// uri of the source video"
                                                      at_ms:
                                                          Type: integer
                                                          Description: "Capture position in milliseconds; snapped to the nearest source frame (requested vs actual reported in the manifest)"
                                                      crop:
                                                          Type: object
                                                          Description: "Normalized 0-1 reframe window {x, y, width, height}"
                                          format:
                                              Type: string
                                              Description: "jpeg (default) or png"
                                          resize:
                                              Type: string
                                              Description: "Optional output canvas 'WIDTHxHEIGHT' (even dimensions); fit + pad, never stretch. Omit for native size."
                                          idempotency_token:
                                              Type: string
                                              Description: "Optional idempotency token (1-80 chars of A-Z a-z 0-9 _ . -). Folded into the workflow_id hash and discarded."
                                  OutputSchema:
                                      Type: object
                                      Description: "A job HANDLE, never results — poll get_job_status with job_id. Outputs on SUCCEEDED: the stills under frames/ and the capture_manifest."
                                      Properties:
                                          job_id:
                                              Type: string
                                              Description: "Step Functions execution ARN — pass to get_job_status"
                                          status:
                                              Type: string
                                              Description: "RUNNING on a fresh start; the existing run's status on an absorbed resubmit"
                                          workflow_id:
                                              Type: string
                                              Description: "The service's name for this run"
                                          output_s3_prefix:
                                              Type: string
                                              Description: "Service-derived output prefix"
                                          current_state:
                                              Type: string
                                              Description: "Active pipeline stage (present only while RUNNING)"
                                          marker_count:
                                              Type: integer
                                              Description: "Validated marker count"
                                          source_count:
                                              Type: integer
                                              Description: "Distinct sources"
                                          message:
                                              Type: string
                                              Description: "Present only when the call was absorbed into an existing run"
                                          error:
                                              Type: string
                                              Description: "Present when an absorbed run already failed terminally"

    # -------------------------------------------------------------------------
    # Gateway Target — Shot Segmentation
    # -------------------------------------------------------------------------
    ShotSegmentationTarget:
        Type: AWS::BedrockAgentCore::GatewayTarget
        Condition: ShotSegmentationEnabled
        Properties:
            Name: shot-segmentation
            Description: "DINOv2-based video shot segmentation: frame embeddings, shot boundaries, recurrence detection — all hyperparameters configurable"
            GatewayIdentifier: !Ref MediaWorkflowGateway
            CredentialProviderConfigurations:
                - CredentialProviderType: GATEWAY_IAM_ROLE
            TargetConfiguration:
                Mcp:
                    Lambda:
                        LambdaArn: !Ref ShotSegmentationToolLambdaArn
                        ToolSchema:
                            InlinePayload:
                                - Name: segment_shots
                                  Description: "Detect shot boundaries and recurring shot groups in a video asset using DINOv2 frame embeddings. Produces shots.json (global shot list with timecodes), embeddings.npz (per-frame embeddings), and recurrence.json (recurring shot groups). Async — call get_job_status with the returned job_id to poll."
                                  InputSchema:
                                      Type: object
                                      Description: "Parameters for shot segmentation"
                                      Required:
                                          - asset_s3uri
                                      Properties:
                                          asset_s3uri:
                                              Type: string
                                              Description: "S3 URI of the source video file (e.g. s3://bucket/key.mxf)"
                                          idempotency_token:
                                              Type: string
                                              Description: "Optional idempotency token (1-80 chars of A-Z a-z 0-9 _ . -). Folded into the workflow_id hash and then DISCARDED — never forwarded, never stored, and no response echoes it. Same token + same parameters returns the EXISTING run; any parameter or token change starts a fresh run. Omitting it still dedups on the parameters alone, so a token is only needed to distinguish two otherwise-identical requests."
                                          segment_duration_secs:
                                              Type: integer
                                              Description: "Transcode segment length in seconds (min 60, default 1200). Longer segments reduce state machine overhead."
                                          coarse_fps:
                                              Type: integer
                                              Description: "DINOv2 frame sampling rate in frames per second (min 1, default 4)."
                                          cosdist_threshold:
                                              Type: number
                                              Description: "Cosine-distance zoom-in trigger: when adjacent-frame distance exceeds this value additional frames are sampled at the boundary (0–1, default 0.10)."
                                          shot_boundary_threshold:
                                              Type: number
                                              Description: "Primary shot-cut sensitivity: frames with cosine distance above this value trigger a shot boundary (0–1, default 0.20)."
                                          black_pixel_threshold:
                                              Type: number
                                              Description: "Per-pixel luminance threshold for black-frame detection (0–1, default 0.04)."
                                          black_coverage_pct:
                                              Type: number
                                              Description: "Percentage of pixels that must be below black_pixel_threshold to classify a frame as black (0–100, default 99.5)."
                                          black_entropy_max:
                                              Type: number
                                              Description: "Maximum Shannon entropy for a frame to qualify as black (0–10, default 0.20)."
                                          black_max_bright_pixel:
                                              Type: number
                                              Description: "Maximum luma value (0–255) of any single pixel for a frame to qualify as black (default 30.0). Prevents title cards and logos on black backgrounds from being misclassified as black frames."
                                          noise_distance_threshold:
                                              Type: number
                                              Description: "Maximum cosine distance between the neighbours of a short shot for it to be merged as a noise artifact (0–1, default 0.18). Tune up for content with fast cuts, down for slow documentary-style content."
                                          min_shot_duration:
                                              Type: number
                                              Description: "Unconditional minimum shot duration in seconds (default 0.25). Shots shorter than this are absorbed into the more similar neighbouring shot — they cannot be real editorial shots at any frame rate. Must be less than 0.5 (the fixed noise-shot duration ceiling)."
                                          adjacent_centroid_threshold:
                                              Type: number
                                              Description: "Maximum cosine distance between adjacent shot centroids to merge them as a motion-blur false cut (0 to shot_boundary_threshold, default 0.20). Must not exceed shot_boundary_threshold."
                                          max_adjacent_merge_duration:
                                              Type: number
                                              Description: "Hard ceiling in seconds on the result of an adjacent-drift merge (> 0, default 30.0). Prevents runaway merge chains from producing multi-minute shots across commercial breaks. Raise for content with genuine long uncut shots (live events, oners)."
                                          near_black_entropy_max:
                                              Type: number
                                              Description: "Shots with mean luma entropy below this are reclassified as 'black' (0–10, default 1.5). Catches near-black shots the per-frame black detector missed, protecting them from being merged into content. Lower it if legitimate low-light content gets reclassified."
                                          fade_split_threshold:
                                              Type: number
                                              Description: "Minimum cosine distance between the centroids of the two halves of a long shot to split it as a fade transition (0–1, default 0.45). Higher values suppress splits; lower values catch subtler fades and cross-dissolves. Default is provisional and content-type dependent — tune down for documentary or drama, up for high-motion content such as sport or news where intra-shot centroid drift is naturally higher."
                                          fade_split_min_duration_sec:
                                              Type: number
                                              Description: "Minimum shot duration in seconds before a fade-split is attempted (default 8.0). Shots shorter than this are never split regardless of centroid distance. Must be less than drift_split_min_duration_sec."
                                          drift_split_threshold:
                                              Type: number
                                              Description: "Minimum 1-second-stride cosine distance peak to split a very long shot at a slow scene drift (0–1, default 0.40). Catches gradual transitions (studio-to-exterior camera moves, slow dissolves) that never exceed shot_boundary_threshold frame-to-frame but accumulate over a second. Only applies to shots longer than drift_split_min_duration_sec."
                                          drift_split_min_duration_sec:
                                              Type: number
                                              Description: "Only shots longer than this many seconds are drift-split candidates (default 60.0, must exceed fade_split_min_duration_sec). A single uncut shot longer than 60s is a-priori improbable in edited content."
                                          embed_geometry:
                                              Type: string
                                              Description: "Model-input geometry, one of: letterbox (default), squeeze, crop. letterbox fits the frame at native aspect ratio with black padding; squeeze does an anamorphic resize; crop scales the shortest side and center-crops. All distance thresholds are calibrated on letterbox — changing this shifts the embedding distribution and requires threshold recalibration. Leave at default unless running a controlled A/B."
                                          max_recurrence_threshold:
                                              Type: number
                                              Description: "Maximum cosine distance between shot centroids to group them as recurring (0–1, default 0.05). Lower values are stricter."
                                          min_recurrence_count:
                                              Type: integer
                                              Description: "Minimum number of temporally separated OCCURRENCES for a group to be reported as recurring (min 2, default 3). Enforced on occurrences, not raw shots — dialogue coverage inside one scene counts once."
                                          min_occurrence_gap_sec:
                                              Type: number
                                              Description: "Temporal-separation gate: group members closer than this many seconds END-to-START collapse into one occurrence (>= 0, default 60.0). min_recurrence_count is enforced on those occurrences."
                                          max_recurrence_count:
                                              Type: integer
                                              Description: "Set-recurrence reference ceiling, published in recurrence.json (min 2, default 8). Groups are NEVER dropped for size — consumers compare a group's recurrence_count against this value to spot recurring-set shapes (anchor desks, game-show podiums); note ad-break countdown slates legitimately exceed it and read hash_confirmed true."
                                  OutputSchema:
                                      Type: object
                                      Description: "Job submission result — a HANDLE, never results. Every field here is present on a fresh start AND on an absorbed resubmit of an already-finished run; only `status` differs. Read `status` and `message`, then call get_job_status for anything else."
                                      Properties:
                                          job_id:
                                              Type: string
                                              Description: "Step Functions execution ARN — pass to get_job_status to poll"
                                          status:
                                              Type: string
                                              Description: "RUNNING on a fresh start. An identical request already submitted is NOT started twice: this returns the EXISTING run's status instead, which may be RUNNING | SUCCEEDED | FAILED | TIMED_OUT | ABORTED. A non-RUNNING status here carries NO results — it only reports that the run already reached that state; call get_job_status with this job_id to read anything about it."
                                          message:
                                              Type: string
                                              Description: "Present ONLY when this call did not resubmit because an identical request already exists. Its absence means a new execution was just started. Every other field is identical in both cases, so this is the only field that distinguishes them."
                                          current_state:
                                              Type: string
                                              Description: "Active pipeline stage. Present while the run is RUNNING; absent once it has stopped, because a stopped execution is in no state."
                                          workflow_id:
                                              Type: string
                                              Description: "Identifier of this run; also the final path segment of output_s3_prefix (micro-workflow/{target}/{workflow_id}/)"
                                          output_s3_prefix:
                                              Type: string
                                              Description: "Service-derived S3 prefix where all outputs are written"
                                          asset_s3uri:
                                              Type: string
                                              Description: "S3 URI of the source video file (echoed from input)"
                                          error:
                                              Type: string
                                              Description: "Failure cause. Present only when this call was absorbed into a run that had already FAILED, TIMED_OUT, or been ABORTED. A terminal failure is STICKY: Step Functions reserves the execution name for 90 days, so resubmitting the identical request returns this same failure for that whole window. Retrying verbatim never re-runs it — change a parameter, or pass a different idempotency_token."

                                - Name: get_job_status
                                  Description: "Poll a shot segmentation job by its execution ARN. Returns the active pipeline stage while running, or the full structured results when complete."
                                  InputSchema:
                                      Type: object
                                      Description: "Job poll request. Takes no idempotency_token, and the retired `uuid` names nothing here — a poll starts no execution, so neither key could change what this returns. Sent anyway, either is ignored with a log line and never rejected: a hallucinated parameter must not fail a poll that is otherwise correct."
                                      Required:
                                          - job_id
                                      Properties:
                                          job_id:
                                              Type: string
                                              Description: "Step Functions execution ARN returned by segment_shots"
                                  OutputSchema:
                                      Type: object
                                      Description: "Job status and results"
                                      Properties:
                                          job_id:
                                              Type: string
                                              Description: "Step Functions execution ARN — the value you polled with, echoed on every branch (including RUNNING and every failure) so a status reply always names its own run"
                                          status:
                                              Type: string
                                              Description: "RUNNING | SUCCEEDED | FAILED | TIMED_OUT | ABORTED"
                                          current_state:
                                              Type: string
                                              Description: "Active pipeline stage name (present when RUNNING)"
                                          workflow_id:
                                              Type: string
                                              Description: "Identifier of this run; also the final path segment of output_s3_prefix (micro-workflow/{target}/{workflow_id}/)"
                                          asset_s3uri:
                                              Type: string
                                              Description: "S3 URI of the source video file (echoed from input)"
                                          output_s3_prefix:
                                              Type: string
                                              Description: "S3 prefix under which all outputs were written"
                                          shots_key:
                                              Type: string
                                              Description: "S3 key of shots.json — global shot list with start/end timecodes, shot type, entropy stats, and anomaly markers (sync_pop/flash_frame); per-shot centroid embeddings live in shot_centroids.npy (see centroids_key)"
                                          embeddings_key:
                                              Type: string
                                              Description: "S3 key of embeddings.npz — per-frame embeddings (float16 — cast to float32 before matmuls), frame numbers, source timestamps, and entropy values"
                                          centroids_key:
                                              Type: string
                                              Description: "S3 key of shot_centroids.npy — [n_shots, 384] float16 array of per-shot centroid embeddings; row index equals shot_id in shots.json; cast to float32 before matmuls"
                                          recurrence_key:
                                              Type: string
                                              Description: "S3 key of recurrence.json — recurring shot groups with member shot IDs, max distance, and relative timeline positions"
                                          n_shots:
                                              Type: integer
                                              Description: "Total number of shots detected"
                                          n_recurrence_groups:
                                              Type: integer
                                              Description: "Number of recurring shot groups detected"
                                          total_frames:
                                              Type: integer
                                              Description: "Total number of frames that received a DINOv2 embedding"
                                          actual_duration_sec:
                                              Type: number
                                              Description: "Actual video duration in seconds (derived from last embedded frame)"
                                          pipeline_wall_sec:
                                              Type: number
                                              Description: "Total wall-clock time for the pipeline in seconds"
                                          total_estimated_cost:
                                              Type: number
                                              Description: "Estimated total cost in USD"
                                          usage_key:
                                              Type: string
                                              Description: "S3 key of usage_tracking.json with full per-state cost breakdown"
                                          outputs:
                                              Type: array
                                              Description: "All job outputs as S3 objects: {uri, mime, label, desc}. Entries whose uri ends with '/' are prefixes containing multiple objects and carry no mime. Labels (shot-list, frame-embeddings, shot-centroids, recurrence, debug-grids, usage) and output basenames are stable API. To fetch a file over HTTP, pass its uri to media-outputs___get_download_url."
                                              Items:
                                                  Type: object
                                                  Description: "One output object or prefix"
                                                  Properties:
                                                      uri:
                                                          Type: string
                                                          Description: "s3:// URI of the output object, or prefix when ending with '/'"
                                                      mime:
                                                          Type: string
                                                          Description: "Registered MIME type; absent for prefix entries"
                                                      label:
                                                          Type: string
                                                          Description: "Stable semantic label for selecting outputs"
                                                      desc:
                                                          Type: string
                                                          Description: "One-line role description (what the file is and what to use it for), joined from the tool's output contract; absent when the contract lacks the label"
                                                  Required:
                                                      - uri
                                                      - label
                                          error:
                                              Type: string
                                              Description: "Failure cause (present when status is FAILED, TIMED_OUT, or ABORTED)"

                                - Name: describe_tool
                                  Description: "Return the deployed version of the shot segmentation tool and its backend info (state machine ARN, short description, output contract)."
                                  InputSchema:
                                      Type: object
                                      Description: "No input required. Takes no idempotency_token — this is pure introspection with no execution and no state, so there is nothing to deduplicate. Sent anyway it is ignored with a log line, never rejected."
                                  OutputSchema:
                                      Type: object
                                      Description: "Tool version and backend info"
                                      Properties:
                                          version:
                                              Type: string
                                              Description: "Semantic version of the deployed tool (e.g. 1.0.0)"
                                          state_machine_arn:
                                              Type: string
                                              Description: "ARN of the backing Step Functions state machine (for console/CLI debugging)"
                                          description:
                                              Type: string
                                              Description: "Short description of the backend pipeline"
                                          output_contract:
                                              Type: object
                                              Description: "Field-level contract for every outputs[] label: basename, kind (file/prefix), mime, the one-line description that doubles as the entries' desc, and a compact example of the file's field names/nesting (contents block for binary files). Static per tool version — cache it for the session. Anything not listed is internal and may change without notice."
                                          input_examples:
                                              Type: object
                                              Description: "Per tool (keyed by tool name under tools): required lists the fields the gateway refuses without — a prose entry like 'a OR b' states a one-of rule this schema cannot express — and example is a minimal valid request including recommended optionals; every other accepted parameter is declared, with type and description, in the tool's InputSchema. The shapes and field names are the contract; every s3 uri, ARN, and id value is an invented placeholder to substitute. Each submit example passes the gateway's own input validation (pinned by a unit test); where a one-of rule exists, alternatives holds one valid example of each other form. Static per tool version — cache it for the session."

    # -------------------------------------------------------------------------
    # Gateway Target — Face Recognition (optional)
    # -------------------------------------------------------------------------
    FaceRecognitionTarget:
        Type: AWS::BedrockAgentCore::GatewayTarget
        Condition: FaceRecognitionEnabled
        Properties:
            # Must equal the TARGET_NAME env var on the face-recognition gateway tool Lambda
            Name: face-recognition
            Description: "Face detection, tracking, celebrity recognition, and identity clustering on video via Amazon Rekognition"
            GatewayIdentifier: !Ref MediaWorkflowGateway
            CredentialProviderConfigurations:
                - CredentialProviderType: GATEWAY_IAM_ROLE
            TargetConfiguration:
                Mcp:
                    Lambda:
                        LambdaArn: !Ref FaceRecognitionToolLambdaArn
                        ToolSchema:
                            InlinePayload:
                                - Name: recognize_faces
                                  Description: "Detect, track, and identify faces in a video asset via Amazon Rekognition. Extracts frames at frame_interval_sec, detects faces on batched grid images (probe-then-fill cost optimization), builds temporal tracks, optionally recognizes celebrities and matches/indexes against a persistent face collection. GDPR recipes: talent tracking = celebrity_recognition false + max_faces_to_index 0; no persistent biometrics = collection_id \"\"; detection-only = both. Async — call get_job_status with the returned job_id to poll."
                                  InputSchema:
                                      Type: object
                                      Description: "Parameters for face recognition"
                                      Required:
                                          - asset_s3uri
                                      Properties:
                                          asset_s3uri:
                                              Type: string
                                              Description: "S3 URI of the source video file (e.g. s3://bucket/key.mp4)"
                                          idempotency_token:
                                              Type: string
                                              Description: "Optional idempotency token (1-80 chars of A-Z a-z 0-9 _ . -). Folded into the workflow_id hash and then DISCARDED — never forwarded, never stored, never echoed. Supply one to make a retry safe: the same token with the same parameters returns the EXISTING run instead of paying for Rekognition twice. OMIT it and every call starts a fresh run — which is what you want when re-running the same video after the face collection has changed, since this tool reads a persistent collection and identical parameters do not imply an identical result."
                                          frame_interval_sec:
                                              Type: number
                                              Description: "Seconds between analyzed frames (0.2-10, default 1.0). Raise for long content or lower cost; lower to catch very brief appearances."
                                          mark_in_out:
                                              Type: array
                                              Description: "Process only [start_sec, end_sec] of the asset (0 <= start < end)"
                                              Items:
                                                  Type: number
                                          celebrity_recognition:
                                              Type: boolean
                                              Description: "Run RecognizeCelebrities on face tracks (default true). Set false for talent-tracking or detection-only use cases."
                                          collection_id:
                                              Type: string
                                              Description: "Persistent Rekognition collection for cross-video identity (default from the stack). Pass \"\" to disable ALL persistent-collection operations (search and index) — no biometric data is stored beyond the job. The per-job transient clustering sandbox is unaffected."
                                          max_faces_to_index:
                                              Type: integer
                                              Description: "Max new faces auto-indexed into the persistent collection per run (default 10). 0 disables auto-indexing while keeping collection search enabled."
                                          index_named_faces_only:
                                              Type: boolean
                                              Description: "When true, only faces with a high-confidence celebrity name are auto-indexed (default false)"
                                          min_appearances:
                                              Type: integer
                                              Description: "Distinct track appearances required before an identity is searched/indexed against the persistent collection (default 3)"
                                          min_confidence:
                                              Type: number
                                              Description: "Minimum face detection confidence 0-100 (default 80)"
                                          probe_stride:
                                              Type: integer
                                              Description: "Probe-then-fill stride: pass 1 detects every Nth frame, empty static regions are skipped, face regions get dense detection (default 4). 0 = single-pass dense detection of every frame."
                                          dedup_hamming_threshold:
                                              Type: integer
                                              Description: "Near-duplicate frame skip threshold inside face regions; skipped frames get interpolated boxes tagged source=interpolated (default 4). Set 0 for frame-exact detected boxes (e.g. redaction workflows)."
                                          shot_segmentation_s3uri:
                                              Type: string
                                              Description: "Optional s3:// uri of a shots.json from a shot-segmentation job (the outputs entry labeled shot-list) for the SAME asset. Its DINOv2 shot boundaries replace the built-in hash cut detector for face-track containment — better tracks across flashes and slow dissolves. Must be under the deployment's proxy bucket; the run fails if the file does not match the asset (wrong fps/duration)."
                                          max_concurrent_executions:
                                              Type: integer
                                              Description: "DynamoDB semaphore slots for concurrent Rekognition usage (1-50, default 5). The stored cap only ever ratchets up across all callers — a lower value here never reduces a cap already raised by a prior request."
                                          detect_map_concurrency:
                                              Type: integer
                                              Description: "Step Functions Map state concurrency for the detection/recognition passes (1-10, default 4). Lower for low-TPS Rekognition regions."
                                  OutputSchema:
                                      Type: object
                                      Description: "Job submission result — a HANDLE, never results. Every field here is present on a fresh start AND on an absorbed resubmit of an already-finished run; only `status` differs. Read `status` and `message`, then call get_job_status for anything else."
                                      Properties:
                                          job_id:
                                              Type: string
                                              Description: "Step Functions execution ARN — pass to get_job_status to poll"
                                          status:
                                              Type: string
                                              Description: "RUNNING on a fresh start. An identical request already submitted is NOT started twice: this returns the EXISTING run's status instead, which may be RUNNING | SUCCEEDED | FAILED | TIMED_OUT | ABORTED. A non-RUNNING status here carries NO results — it only reports that the run already reached that state; call get_job_status with this job_id to read anything about it."
                                          message:
                                              Type: string
                                              Description: "Present ONLY when this call did not resubmit because an identical request already exists. Its absence means a new execution was just started. Every other field is identical in both cases, so this is the only field that distinguishes them."
                                          current_state:
                                              Type: string
                                              Description: "Active pipeline stage. Present while the run is RUNNING; absent once it has stopped, because a stopped execution is in no state."
                                          workflow_id:
                                              Type: string
                                              Description: "Identifier of this run; also the final path segment of output_s3_prefix (micro-workflow/{target}/{workflow_id}/)"
                                          output_s3_prefix:
                                              Type: string
                                              Description: "Service-derived S3 prefix where all outputs are written"
                                          asset_s3uri:
                                              Type: string
                                              Description: "S3 URI of the source video file (echoed from input)"
                                          error:
                                              Type: string
                                              Description: "Failure cause as 'code: message' (compacted exactly like get_job_status's error). Present only when this call was absorbed into a run that had already FAILED, TIMED_OUT, or been ABORTED. A terminal failure is STICKY: Step Functions reserves the execution name for 90 days, so resubmitting the identical request returns this same failure for that whole window. Retrying verbatim never re-runs it — change a parameter, or pass a different idempotency_token."
                                          error_code:
                                              Type: string
                                              Description: "Stable failure code of the absorbed run alone — the raised exception's class name (e.g. a terminal content fact like NoAudioStream/NoVideoStream) or the Step Functions error field. Present only beside error."

                                - Name: get_job_status
                                  Description: "Poll a face recognition job by its execution ARN. Returns the active pipeline stage while running, or the structured results and outputs list when complete."
                                  InputSchema:
                                      Type: object
                                      Description: "Job poll request. Takes no idempotency_token, and the retired `uuid` names nothing here — a poll starts no execution, so neither key could change what this returns. Sent anyway, either is ignored with a log line and never rejected: a hallucinated parameter must not fail a poll that is otherwise correct."
                                      Required:
                                          - job_id
                                      Properties:
                                          job_id:
                                              Type: string
                                              Description: "Step Functions execution ARN returned by recognize_faces"
                                  OutputSchema:
                                      Type: object
                                      Description: "Job status and results"
                                      Properties:
                                          job_id:
                                              Type: string
                                              Description: "Step Functions execution ARN — the value you polled with, echoed on every branch (including RUNNING and every failure) so a status reply always names its own run"
                                          action:
                                              Type: string
                                              Description: "For an index-management job (batch_index_faces, batch_delete_faces, delete_collection): which action ran. Absent for a recognize_faces job — that is how you tell the two result shapes apart."
                                          num_indexed:
                                              Type: integer
                                              Description: "Index job: faces successfully indexed"
                                          num_skipped:
                                              Type: integer
                                              Description: "Index job: manifest lines skipped because that image ETag was already indexed under the same name"
                                          num_failed:
                                              Type: integer
                                              Description: "Index job: manifest lines that produced no face record"
                                          num_deleted:
                                              Type: integer
                                              Description: "Delete job: face records removed"
                                          num_manifest_entries:
                                              Type: integer
                                              Description: "Index job: total manifest lines submitted — indexed + skipped + failed must equal this"
                                          usage:
                                              Type: object
                                              Description: "Index/delete job: Rekognition API call counts for this run"
                                          report_uri:
                                              Type: string
                                              Description: "s3:// URI of the per-line index/delete report — the audit record of what happened to each manifest entry"
                                          media_processing_arn:
                                              Type: string
                                              Description: "Child execution ARN of the media-processing frame-extraction workflow (recognize_faces only)"
                                          warning:
                                              Type: string
                                              Description: "Non-fatal condition worth surfacing (e.g. a collection whose Rekognition FaceCount and managed record count have drifted)"
                                          status:
                                              Type: string
                                              Description: "RUNNING | SUCCEEDED | FAILED | TIMED_OUT | ABORTED"
                                          current_state:
                                              Type: string
                                              Description: "Active pipeline stage (RUNNING only)"
                                          workflow_id:
                                              Type: string
                                              Description: "Identifier of this run; also the final path segment of output_s3_prefix (micro-workflow/{target}/{workflow_id}/)"
                                          asset_s3uri:
                                              Type: string
                                              Description: "Source S3 URI"
                                          output_s3_prefix:
                                              Type: string
                                              Description: "Service-derived S3 prefix where all outputs are written"
                                          num_people_recognized:
                                              Type: integer
                                              Description: "People with a resolved name (celebrity, collection match, or indexed)"
                                          num_people_unrecognized:
                                              Type: integer
                                              Description: "Anonymous Person_N identities"
                                          num_faces_indexed:
                                              Type: integer
                                              Description: "New faces auto-indexed into the persistent collection this run"
                                          collection_id:
                                              Type: string
                                              Description: "Persistent collection used (empty when disabled)"
                                          duration_sec:
                                              Type: number
                                              Description: "Source duration in seconds"
                                          frames_analyzed:
                                              Type: integer
                                              Description: "Frames that passed triage and entered detection"
                                          frames_skipped:
                                              Type: integer
                                              Description: "Frames dropped by triage (black/mono/blur)"
                                          pipeline_wall_sec:
                                              Type: number
                                              Description: "Total wall-clock time"
                                          total_estimated_cost:
                                              Type: number
                                              Description: "Estimated cost in USD (Lambda + Rekognition + media-processing child)"
                                          usage_key:
                                              Type: string
                                              Description: "S3 key of usage_tracking.json with per-state cost and API-call breakdown"
                                          outputs:
                                              Type: array
                                              Description: "Self-describing result files: {uri, mime, label, desc}. Labels: face-metadata (people list with appearances), face-groups (full per-face detail), face-clusters (MDS 2D coords for visualization), people-images (per-person montage prefix), debug-grids (detection grid prefix), usage. Entries whose uri ends with / are prefixes and carry no mime. Pass a file uri to media-outputs___get_download_url for HTTP access."
                                              Items:
                                                  Type: object
                                                  Required:
                                                      - uri
                                                      - label
                                                  Properties:
                                                      uri:
                                                          Type: string
                                                          Description: "s3:// URI of the output file or prefix"
                                                      mime:
                                                          Type: string
                                                          Description: "MIME type; omitted for prefix entries"
                                                      label:
                                                          Type: string
                                                          Description: "Stable output label"
                                                      desc:
                                                          Type: string
                                                          Description: "One-line role description (what the file is and what to use it for), joined from the tool's output contract; absent when the contract lacks the label"
                                          error:
                                              Type: string
                                              Description: "Failure cause as 'code: message' (present when status is FAILED, TIMED_OUT, or ABORTED). One code is a terminal content fact, not a retryable fault: NoVideoStream (the source has no video stream) — treat it as 'no frames to recognize' and do not resubmit."
                                          error_code:
                                              Type: string
                                              Description: "Stable failure code alone — the raised exception's class name (e.g. NoVideoStream) or the Step Functions error field (e.g. Lambda.Unknown). Match on this; the human detail lives in error."

                                - Name: describe_tool
                                  Description: "Return the deployed version of the face recognition tool and its backend info (state machine ARN, short description, output contract)."
                                  InputSchema:
                                      Type: object
                                      Description: "No input required. Takes no idempotency_token — this is pure introspection with no execution and no state, so there is nothing to deduplicate. Sent anyway it is ignored with a log line, never rejected."
                                  OutputSchema:
                                      Type: object
                                      Description: "Tool version and backend info"
                                      Properties:
                                          version:
                                              Type: string
                                              Description: "Semantic version of the deployed tool (e.g. 1.0.0)"
                                          state_machine_arn:
                                              Type: string
                                              Description: "ARN of the backing Step Functions state machine (for console/CLI debugging)"
                                          description:
                                              Type: string
                                              Description: "Short description of the backend pipeline"
                                          output_contract:
                                              Type: object
                                              Description: "Field-level contract for every outputs[] label: basename, kind (file/prefix), mime, the one-line description that doubles as the entries' desc, and a compact example of the file's field names/nesting (contents block for binary files). Static per tool version — cache it for the session. Anything not listed — including ephemeral/ intermediates — is internal and may change without notice."
                                          input_examples:
                                              Type: object
                                              Description: "Per tool (keyed by tool name under tools): required lists the fields the gateway refuses without — a prose entry like 'a OR b' states a one-of rule this schema cannot express — and example is a minimal valid request including recommended optionals; every other accepted parameter is declared, with type and description, in the tool's InputSchema. The shapes and field names are the contract; every s3 uri, ARN, and id value is an invented placeholder to substitute. Each submit example passes the gateway's own input validation (pinned by a unit test); where a one-of rule exists, alternatives holds one valid example of each other form. Static per tool version — cache it for the session."

                                # ── Phase 2: face index management ────────────
                                - Name: create_collection
                                  Description: "Create (or adopt) a persistent face collection. Fails only if the collection exists with faces none of which are managed by this stack (foreign collection). Reports both Rekognition FaceCount and DynamoDB record count; a mismatch is returned as a drift warning."
                                  InputSchema:
                                      Type: object
                                      Description: "Collection to create. Takes no idempotency_token — this is a synchronous, condition-guarded write that is already safe to repeat, so a token would add nothing. Sent anyway it is ignored with a log line, never rejected."
                                      Required:
                                          - collection_id
                                      Properties:
                                          collection_id:
                                              Type: string
                                              Description: "Rekognition collection id to create or adopt"
                                  OutputSchema:
                                      Type: object
                                      Description: "Creation/adoption result with face and record counts"
                                      Properties:
                                          collection_id:
                                              Type: string
                                              Description: "The collection id"
                                          created:
                                              Type: boolean
                                              Description: "true if newly created; false if adopted"
                                          face_count:
                                              Type: integer
                                              Description: "Rekognition FaceCount"
                                          record_count:
                                              Type: integer
                                              Description: "Managed DynamoDB record count"
                                          warning:
                                              Type: string
                                              Description: "Present when the two counts drift"
                                - Name: list_collections
                                  Description: "List face collections with Rekognition FaceCount and managed record count per collection — a count mismatch flags drift (crashed delete/manual edits). Transient sandbox-* clustering collections are hidden."
                                  InputSchema:
                                      Type: object
                                      Description: "No input required. Takes no idempotency_token — this tool starts no execution and must reflect current state, so there is nothing to deduplicate. Sent anyway it is ignored with a log line, never rejected."
                                  OutputSchema:
                                      Type: object
                                      Description: "Collections with counts"
                                      Properties:
                                          collections:
                                              Type: array
                                              Description: "Per collection: collection_id, face_count, record_count, is_default, drift?"
                                              Items:
                                                  Type: object
                                                  Description: "One collection summary"
                                - Name: list_faces
                                  Description: "List managed face records in a collection, paginated and sorted by celebrity name (unnamed faces last). Filters: origin (user|auto), named (true|false), workflow_id, celebrity_name. Each record includes thumbnail_uri, full_image_uri and the normalized face coordinate [x,y,w,h] locating the face in the full image."
                                  InputSchema:
                                      Type: object
                                      Description: "Listing request. Takes no idempotency_token — this tool starts no execution and must reflect current state, so there is nothing to deduplicate. Sent anyway it is ignored with a log line, never rejected."
                                      Properties:
                                          collection_id:
                                              Type: string
                                              Description: "Collection to list (default: the stack default collection)"
                                          page_size:
                                              Type: integer
                                              Description: "Faces per page (default 25, max 100)"
                                          next_token:
                                              Type: string
                                              Description: "Opaque pagination token from the previous page"
                                          celebrity_name:
                                              Type: string
                                              Description: "Only faces bound to this exact name (a name may have multiple reference faces)"
                                          origin:
                                              Type: string
                                              Description: "Filter by how the face was indexed: user | auto"
                                          named:
                                              Type: boolean
                                              Description: "true = only named faces; false = only unnamed"
                                          workflow_id:
                                              Type: string
                                              Description: "Only faces auto-indexed by this workflow run"
                                  OutputSchema:
                                      Type: object
                                      Description: "One page of face records"
                                      Properties:
                                          faces:
                                              Type: array
                                              Description: "Face records (face_id, celeb, origin, coord, thumbnail_uri, full_image_uri, ...)"
                                              Items:
                                                  Type: object
                                                  Description: "One face record"
                                          next_token:
                                              Type: string
                                              Description: "Present when more pages exist"
                                - Name: get_face
                                  Description: "Fetch one face record by face_id — the late-binding name resolver: facemetadata.json from past runs carries face_id; query here for the LIVE celebrity name. For a deleted face returns deleted=true with the deletion reason from its tombstone."
                                  InputSchema:
                                      Type: object
                                      Description: "Face lookup. Takes no idempotency_token — this tool starts no execution and must reflect current state, so there is nothing to deduplicate. Sent anyway it is ignored with a log line, never rejected."
                                      Required:
                                          - face_id
                                      Properties:
                                          face_id:
                                              Type: string
                                              Description: "Rekognition face id"
                                  OutputSchema:
                                      Type: object
                                      Description: "The face record, or a tombstone (deleted=true, reason)"
                                      Properties:
                                          face_id:
                                              Type: string
                                              Description: "Rekognition face id"
                                          celeb:
                                              Type: string
                                              Description: "Current (live) celebrity name binding"
                                          deleted:
                                              Type: boolean
                                              Description: "true when the face was hard-deleted (tombstone)"
                                - Name: batch_update_faces
                                  Description: "Rename/tag up to 500 faces in one call: bind face_ids to celebrity names (late binding — historical outputs are never rewritten; future runs and get_face resolve the new name). DynamoDB-only, synchronous."
                                  InputSchema:
                                      Type: object
                                      Description: "Rename request. Takes no idempotency_token — this is a synchronous, condition-guarded write that is already safe to repeat, so a token would add nothing. Sent anyway it is ignored with a log line, never rejected."
                                      Required:
                                          - updates
                                      Properties:
                                          updates:
                                              Type: array
                                              Description: "List of {face_id, celebrity_name} (max 500)"
                                              Items:
                                                  Type: object
                                                  Description: "{face_id, celebrity_name}"
                                  OutputSchema:
                                      Type: object
                                      Description: "Per-face update results"
                                      Properties:
                                          updated:
                                              Type: integer
                                              Description: "Number successfully updated"
                                          failed:
                                              Type: integer
                                              Description: "Number not found"
                                          results:
                                              Type: array
                                              Description: "Per-face outcome"
                                              Items:
                                                  Type: object
                                                  Description: "{face_id, updated, reason?}"
                                - Name: batch_index_faces
                                  Description: "Index reference face images into a collection (async — poll job_id via get_job_status). Images MUST live under the deployment's proxy bucket (the stack has no read access elsewhere). Input: s3_prefix (celebrity name = file basename) OR manifest_s3uri (JSONL {image_uri, celebrity_name}). Idempotent by content ETag: re-runs skip already-indexed images; a name change on the same image renames instead of re-indexing. Formats: JPEG/PNG/WebP/TIFF/HEIC/GIF (content-detected; EXIF orientation honored). Cost: ~1 IndexFaces call per 48 images (tiled grids, largest-face-per-image, phantom removal). The completed job's report.json lists every input file as indexed | skipped | failed with a reason."
                                  InputSchema:
                                      Type: object
                                      Description: "Batch index request — exactly one of s3_prefix | manifest_s3uri; both must be under the proxy bucket. Takes no idempotency_token by design — this is an accumulating write, so two calls with different inputs must BOTH run and collapsing them on an input hash would silently drop the second. Deduplication lives one layer down and is content-addressed, which survives a re-run without the caller remembering anything. Sent anyway a token is ignored with a log line, never rejected."
                                      Properties:
                                          collection_id:
                                              Type: string
                                              Description: "Target collection (default: the stack default). Must already exist."
                                          s3_prefix:
                                              Type: string
                                              Description: "s3:// prefix of image files under the proxy bucket; celebrity name = file basename"
                                          manifest_s3uri:
                                              Type: string
                                              Description: "s3:// uri (proxy bucket) of a JSONL manifest: one {\"image_uri\", \"celebrity_name\"} per line"
                                          max_concurrent_executions:
                                              Type: integer
                                              Description: "Shared Rekognition semaphore slots (1-50, default 5). The stored cap only ever ratchets up across all callers."
                                  OutputSchema:
                                      Type: object
                                      Description: "Job submission result — a HANDLE, never results. Counts and the report URI come from get_job_status."
                                      Properties:
                                          job_id:
                                              Type: string
                                              Description: "Step Functions execution ARN — poll with get_job_status for status and results"
                                          status:
                                              Type: string
                                              Description: "RUNNING. These jobs are named with a fresh random id rather than a hash of the request, so every call starts a NEW run — an index job mutates a persistent collection, so two identical calls are two intended operations, not a duplicate. There is no absorbed-resubmit case here and therefore no `message` field."
                                          current_state:
                                              Type: string
                                              Description: "Active pipeline stage. Always present on submission — a just-started execution is in its first state."
                                          workflow_id:
                                              Type: string
                                              Description: "Identifier of this run; the execution name and the final path segment of output_s3_prefix"
                                          action:
                                              Type: string
                                              Description: "The index action this run performs: batch_index | batch_delete | delete_collection"
                                          collection_id:
                                              Type: string
                                              Description: "Collection this job operates on"
                                          output_s3_prefix:
                                              Type: string
                                              Description: "Service-derived S3 prefix where this job's report is written"
                                          manifest_s3uri:
                                              Type: string
                                              Description: "The manifest driving the batch (generated for prefix mode — the audit record)"
                                - Name: batch_delete_faces
                                  Description: "Hard-delete faces from a collection by face_ids OR by celebrity_name (async — poll job_id via get_job_status). Faces stop matching immediately; records are tombstoned (30 d audit trail readable via get_face) and stored derivatives are removed."
                                  InputSchema:
                                      Type: object
                                      Description: "Delete request — exactly one of face_ids | celebrity_name. Takes no idempotency_token by design — this is an accumulating write, so two calls with different inputs must BOTH run and collapsing them on an input hash would silently drop the second. Deduplication lives one layer down and is content-addressed, which survives a re-run without the caller remembering anything. Sent anyway a token is ignored with a log line, never rejected."
                                      Properties:
                                          collection_id:
                                              Type: string
                                              Description: "Collection to delete from (default: the stack default)"
                                          face_ids:
                                              Type: array
                                              Description: "Explicit face ids to delete"
                                              Items:
                                                  Type: string
                                                  Description: "Rekognition face id"
                                          celebrity_name:
                                              Type: string
                                              Description: "Delete ALL faces bound to this name"
                                  OutputSchema:
                                      Type: object
                                      Description: "Job submission result — a HANDLE, never results. Counts and the report URI come from get_job_status."
                                      Properties:
                                          job_id:
                                              Type: string
                                              Description: "Step Functions execution ARN — poll with get_job_status for status and results"
                                          status:
                                              Type: string
                                              Description: "RUNNING. These jobs are named with a fresh random id rather than a hash of the request, so every call starts a NEW run — an index job mutates a persistent collection, so two identical calls are two intended operations, not a duplicate. There is no absorbed-resubmit case here and therefore no `message` field."
                                          current_state:
                                              Type: string
                                              Description: "Active pipeline stage. Always present on submission — a just-started execution is in its first state."
                                          workflow_id:
                                              Type: string
                                              Description: "Identifier of this run; the execution name and the final path segment of output_s3_prefix"
                                          action:
                                              Type: string
                                              Description: "The index action this run performs: batch_index | batch_delete | delete_collection"
                                          collection_id:
                                              Type: string
                                              Description: "Collection this job operates on"
                                          output_s3_prefix:
                                              Type: string
                                              Description: "Service-derived S3 prefix where this job's report is written"
                                - Name: delete_collection
                                  Description: "Delete an entire face collection: every managed record (tombstoned), all stored derivatives, then the Rekognition collection itself (async — poll job_id via get_job_status). The stack default collection requires force=true. In-flight recognition runs using the collection have undefined naming results — coordinate before deleting."
                                  InputSchema:
                                      Type: object
                                      Description: "Collection deletion request. Takes no idempotency_token by design — this is an accumulating write, so two calls with different inputs must BOTH run and collapsing them on an input hash would silently drop the second. Deduplication lives one layer down and is content-addressed, which survives a re-run without the caller remembering anything. Sent anyway a token is ignored with a log line, never rejected."
                                      Required:
                                          - collection_id
                                      Properties:
                                          collection_id:
                                              Type: string
                                              Description: "Collection to delete"
                                          force:
                                              Type: boolean
                                              Description: "Required true to delete the stack default collection"
                                  OutputSchema:
                                      Type: object
                                      Description: "Job submission result — a HANDLE, never results. Counts and the report URI come from get_job_status."
                                      Properties:
                                          job_id:
                                              Type: string
                                              Description: "Step Functions execution ARN — poll with get_job_status for status and results"
                                          status:
                                              Type: string
                                              Description: "RUNNING. These jobs are named with a fresh random id rather than a hash of the request, so every call starts a NEW run — an index job mutates a persistent collection, so two identical calls are two intended operations, not a duplicate. There is no absorbed-resubmit case here and therefore no `message` field."
                                          current_state:
                                              Type: string
                                              Description: "Active pipeline stage. Always present on submission — a just-started execution is in its first state."
                                          workflow_id:
                                              Type: string
                                              Description: "Identifier of this run; the execution name and the final path segment of output_s3_prefix"
                                          action:
                                              Type: string
                                              Description: "The index action this run performs: batch_index | batch_delete | delete_collection"
                                          collection_id:
                                              Type: string
                                              Description: "Collection this job operates on"
                                          output_s3_prefix:
                                              Type: string
                                              Description: "Service-derived S3 prefix where this job's report is written"

    # -------------------------------------------------------------------------
    # Gateway Target: hybrid-search (normal callers)
    # -------------------------------------------------------------------------
    HybridSearchTarget:
        Type: AWS::BedrockAgentCore::GatewayTarget
        Condition: HybridSearchEnabled
        Properties:
            # Must equal the TARGET_NAME convention on the hybrid-search gateway tool Lambda
            Name: hybrid-search
            Description: "Hybrid (semantic + keyword) search over media metadata: multi-collection LanceDB FTS + LanceDB/S3-Vectors ANN, contract-driven indexing"
            GatewayIdentifier: !Ref MediaWorkflowGateway
            CredentialProviderConfigurations:
                - CredentialProviderType: GATEWAY_IAM_ROLE
            TargetConfiguration:
                Mcp:
                    Lambda:
                        LambdaArn: !Ref HybridSearchToolLambdaArn
                        ToolSchema:
                            InlinePayload:
                                - Name: index_content
                                  Description: "Index media metadata documents into a collection (async — poll job_id via get_job_status). Each document is a CONTENT CONTRACT: you declare WHAT you hand over (kind: text | image content items targeting schema fields); the backend does ALL embedding, FTS writes, and optional entity extraction. Exactly one of documents (inline, max 100) | documents_s3uri (JSONL manifest under the proxy bucket, for bulk). Idempotent per document: doc_id derives from collection+asset+doc_type+timespan, so identical resubmits skip already-indexed documents before any model call. Set refresh=true on a document to replace that asset's rows in that table."
                                  InputSchema:
                                      Type: object
                                      Description: "Batch of content-contract documents for ONE collection. Takes no idempotency_token by design — this is an accumulating write, so two calls with different inputs must BOTH run and collapsing them on an input hash would silently drop the second. Deduplication lives one layer down and is content-addressed, which survives a re-run without the caller remembering anything. Sent anyway a token is ignored with a log line, never rejected."
                                      Properties:
                                          collection_id:
                                              Type: string
                                              Description: "Target collection (omit for 'default'). Must exist — create_collection first."
                                          documents:
                                              Type: array
                                              Description: "Inline contract documents (max 100). Each: {asset_id, doc_type, start_ms, end_ms, chunk_idx?, refresh?, fields?{verbatim scalars}, content:[{kind: text|image, field, value, extract_entities?}]}. kind=image value is an s3:// frame uri and must target the schema's vector field; the caller pre-selects the representative frame."
                                              Items:
                                                  Type: object
                                                  Description: "One content-contract document"
                                          documents_s3uri:
                                              Type: string
                                              Description: "s3:// uri (proxy bucket) of a JSONL manifest — one contract document per line. Use for bulk (a full asset's scenes/utterances)."
                                          asset_metadata:
                                              Type: object
                                              Description: "Optional once-per-submission asset record: {title, genres[], content_category, casts[]} — enables @Title search filtering and result enrichment"
                                  OutputSchema:
                                      Type: object
                                      Description: "Job submission result — a HANDLE, never results. Row counts come from get_job_status."
                                      Properties:
                                          job_id:
                                              Type: string
                                              Description: "Step Functions execution ARN — poll with get_job_status for status and counts"
                                          status:
                                              Type: string
                                              Description: "RUNNING. Indexing jobs are named with a fresh random id rather than a hash of the request, so every call starts a NEW run — re-indexing an asset is a legitimate operation (its metadata changes, schemas change) and duplicate work is dropped per-document by content-addressed dedup, not by refusing the submission. There is no absorbed-resubmit case here and therefore no `message` field."
                                          collection_id:
                                              Type: string
                                              Description: "Resolved collection (\"default\" when the request omitted one)"
                                          num_inline_documents:
                                              Type: integer
                                              Description: "How many contracts this call sent inline; 0 in manifest mode. This is what was SUBMITTED — how many were embedded vs deduped comes back from get_job_status as prepared/skipped."
                                          documents_s3uri:
                                              Type: string
                                              Description: "The JSONL manifest driving the batch; empty string in inline mode"
                                - Name: search_content
                                  Description: "Search a collection (synchronous — results in the response). Hybrid retrieval: the query is SLM-decomposed (entities, retrieval paths), embedded, and fanned out as parallel ANN + FTS sub-queries per active index, merged with weighted RRF. Operators: @Title (asset filter), \"quoted phrase\", says:\"dialog\", #scope. Pass search_image_s3uri INSTEAD of search_term for image similarity search."
                                  InputSchema:
                                      Type: object
                                      Description: "Search request — exactly one of search_term | search_image_s3uri. Takes no idempotency_token — this is a query, not a job: results must reflect the collection as it is now, so the execution behind it is deliberately never reused. Sent anyway a token is ignored with a log line, never rejected."
                                      Properties:
                                          collection_id:
                                              Type: string
                                              Description: "Collection to search (omit for 'default')"
                                          search_term:
                                              Type: string
                                              Description: "Natural-language query, optionally with @Title / quoted / says: / #scope operators"
                                          search_image_s3uri:
                                              Type: string
                                              Description: "s3:// image uri for visual similarity search (no text query)"
                                          k:
                                              Type: integer
                                              Description: "Result count (default 10, max 50)"
                                  OutputSchema:
                                      Type: object
                                      Description: "Ranked results"
                                      Properties:
                                          results:
                                              Type: array
                                              Description: "Top-k docs: {doc_id, asset_id, start_ms, end_ms, text?, final_score, source_index, match_sources, highlights?, title?}"
                                              Items:
                                                  Type: object
                                                  Description: "One result document"
                                          total:
                                              Type: integer
                                              Description: "Total merged candidates before the k cut"
                                          skipped_indices:
                                              Type: array
                                              Description: "Scopes skipped (not yet indexed)"
                                              Items:
                                                  Type: string
                                                  Description: "doc_type scope"
                                - Name: create_collection
                                  Description: "Create a new collection (create-if-absent; existing collections are never modified — weight edits require the admin tool). New collections get convention-default retrieval weights filtered to their scopes and are immediately searchable."
                                  InputSchema:
                                      Type: object
                                      Description: "Collection to create. Takes no idempotency_token — this is a synchronous, condition-guarded write that is already safe to repeat, so a token would add nothing. Sent anyway it is ignored with a log line, never rejected."
                                      Required:
                                          - collection_id
                                          - active_scopes
                                      Properties:
                                          collection_id:
                                              Type: string
                                              Description: "Lowercase id, 3-48 chars of a-z 0-9 _ - (e.g. 'news', 'sport-2026'). Reserved (rejected): schema, shot, scene, segment, utterance, topic."
                                          name:
                                              Type: string
                                              Description: "Display name"
                                          active_scopes:
                                              Type: array
                                              Description: "doc_types this collection indexes: shot | scene | segment | utterance | topic"
                                              Items:
                                                  Type: string
                                                  Description: "doc_type"
                                          schema_map:
                                              Type: object
                                              Description: "Optional doc_type -> schema-file-key overrides; defaults to _lancedb_index/schema/default_{scope}.json"
                                  OutputSchema:
                                      Type: object
                                      Description: "Creation result — synchronous, nothing to poll"
                                      Properties:
                                          collection_id:
                                              Type: string
                                              Description: "The collection id"
                                          created:
                                              Type: boolean
                                              Description: "false = already existed (no changes applied)"
                                          active_scopes:
                                              Type: array
                                              Description: "Doc types this collection indexes and searches, as stored. Items are strings."
                                          schema_map:
                                              Type: object
                                              Description: "doc_type -> schema file key. Scopes the caller did not map were filled in by convention as _lancedb_index/schema/default_{scope}.json."
                                          retrieval_paths:
                                              Type: array
                                              Description: "Per-subquery retrieval weights, inherited from the default collection at creation. Items are objects. Editing these requires the admin target."
                                          note:
                                              Type: string
                                              Description: "Empty on a fresh creation. On created=false it states that nothing was changed and that weight edits require the admin target — so an agent does not read the unchanged record back as confirmation that its parameters were applied."
                                - Name: list_collections
                                  Description: "List collections with their active scopes and a per-index summary (last_indexed_at, pending doc counts) from registry state — no storage round-trips."
                                  InputSchema:
                                      Type: object
                                      Description: "No input required. Takes no idempotency_token — this tool starts no execution and must reflect current state, so there is nothing to deduplicate. Sent anyway it is ignored with a log line, never rejected."
                                  OutputSchema:
                                      Type: object
                                      Description: "Registry listing"
                                      Properties:
                                          collections:
                                              Type: array
                                              Description: "Per collection: collection_id, name, active_scopes, weights_locked, indexes[]"
                                              Items:
                                                  Type: object
                                                  Description: "One collection summary"
                                - Name: get_job_status
                                  Description: "Poll an index_content job by execution ARN. SUCCEEDED returns prepared/skipped/indexed document counts."
                                  InputSchema:
                                      Type: object
                                      Description: "Job poll request. Takes no idempotency_token, and the retired `uuid` names nothing here — a poll starts no execution, so neither key could change what this returns. Sent anyway, either is ignored with a log line and never rejected: a hallucinated parameter must not fail a poll that is otherwise correct."
                                      Required:
                                          - job_id
                                      Properties:
                                          job_id:
                                              Type: string
                                              Description: "Execution ARN returned by index_content"
                                  OutputSchema:
                                      Type: object
                                      Description: "Job status and results"
                                      Properties:
                                          job_id:
                                              Type: string
                                              Description: "Step Functions execution ARN — the value you polled with, echoed on every branch (including RUNNING and every failure) so a status reply always names its own run"
                                          status:
                                              Type: string
                                              Description: "RUNNING | SUCCEEDED | FAILED | TIMED_OUT | ABORTED"
                                          collection_id:
                                              Type: string
                                              Description: "Collection that was indexed (present when SUCCEEDED)"
                                          prepared:
                                              Type: integer
                                              Description: "Documents embedded + written this run"
                                          skipped:
                                              Type: integer
                                              Description: "Documents deduped (already indexed)"
                                          indexed:
                                              Type: integer
                                              Description: "Rows written across physical tables"
                                          error:
                                              Type: string
                                              Description: "Failure cause (non-SUCCEEDED)"
                                - Name: describe_tool
                                  Description: "Return the deployed tool version, backend state machine ARNs, and the output contract."
                                  InputSchema:
                                      Type: object
                                      Description: "No input required. Takes no idempotency_token — this is pure introspection with no execution and no state, so there is nothing to deduplicate. Sent anyway it is ignored with a log line, never rejected."
                                  OutputSchema:
                                      Type: object
                                      Description: "Tool version and backend info"
                                      Properties:
                                          version:
                                              Type: string
                                              Description: "Deployed version"
                                          index_state_machine_arn:
                                              Type: string
                                              Description: "Index SFN ARN"
                                          search_state_machine_arn:
                                              Type: string
                                              Description: "Search SFN ARN"
                                          description:
                                              Type: string
                                              Description: "Backend description"
                                          output_contract:
                                              Type: object
                                              Description: "Field-level contract for this target's INLINE result shapes: search_content result-doc fields (invariant scoring fields; payload fields vary by collection schema) and index-job status counts. This target returns results inline, never labeled files. Static per tool version — cache it for the session. Anything not listed is internal and may change without notice."
                                          input_examples:
                                              Type: object
                                              Description: "Per tool (keyed by tool name under tools): required lists the fields the gateway refuses without — a prose entry like 'a OR b' states a one-of rule this schema cannot express — and example is a minimal valid request including recommended optionals; every other accepted parameter is declared, with type and description, in the tool's InputSchema. The shapes and field names are the contract; every s3 uri, ARN, and id value is an invented placeholder to substitute. Each submit example passes the gateway's own input validation (pinned by a unit test); where a one-of rule exists, alternatives holds one valid example of each other form. Static per tool version — cache it for the session."

    # -------------------------------------------------------------------------
    # Gateway Target: hybrid-search-admin (SEPARATE Lambda + IAM boundary)
    # Destructive/config tools — attach only for trusted admin agents.
    # -------------------------------------------------------------------------
    HybridSearchAdminTarget:
        Type: AWS::BedrockAgentCore::GatewayTarget
        Condition: HybridSearchAdminEnabled
        Properties:
            Name: hybrid-search-admin
            Description: "ADMIN tools for hybrid-search: collection retrieval-weight configuration and full collection deletion. Separate Lambda + IAM role from the normal-caller target."
            GatewayIdentifier: !Ref MediaWorkflowGateway
            CredentialProviderConfigurations:
                - CredentialProviderType: GATEWAY_IAM_ROLE
            TargetConfiguration:
                Mcp:
                    Lambda:
                        LambdaArn: !Ref HybridSearchAdminToolLambdaArn
                        ToolSchema:
                            InlinePayload:
                                - Name: configure_search_backend
                                  Description: "Update an EXISTING collection's retrieval weights, scopes, or schema map. Any weight edit sets weights_locked. This is the ONLY way to change a collection after creation — indexing never adds scopes; contracts for a doc_type outside active_scopes fail."
                                  InputSchema:
                                      Type: object
                                      Description: "Collection update — at least one optional field. Takes no idempotency_token — this is a synchronous, condition-guarded write that is already safe to repeat, so a token would add nothing. Sent anyway it is ignored with a log line, never rejected."
                                      Required:
                                          - collection_id
                                      Properties:
                                          collection_id:
                                              Type: string
                                              Description: "Collection to update (must exist)"
                                          retrieval_paths:
                                              Type: object
                                              Description: "Text-search path weights: {path: {subquery_key: weight}} e.g. {\"dialogue\": {\"utterance_text_fts\": 0.9}}. FULL replacement — send the complete set (read the current one from list_collections); a payload omitting existing path groups is refused unless replace_all is true"
                                          image_retrieval_paths:
                                              Type: object
                                              Description: "Image-search path weights (ANN sub-queries only). Same full-replacement rule as retrieval_paths"
                                          replace_all:
                                              Type: boolean
                                              Description: "Confirm a payload that OMITS members the record currently carries (path groups, scopes, or schema_map keys — every field here is a FULL replacement); without it such a payload is refused naming the omitted members"
                                          active_scopes:
                                              Type: array
                                              Description: "Replace the active doc_type list"
                                              Items:
                                                  Type: string
                                                  Description: "doc_type"
                                          schema_map:
                                              Type: object
                                              Description: "Replace the doc_type -> schema-file-key map"
                                  OutputSchema:
                                      Type: object
                                      Description: "Update result"
                                      Properties:
                                          collection_id:
                                              Type: string
                                              Description: "Updated collection"
                                          updated:
                                              Type: boolean
                                              Description: "true on success"
                                          weights_locked:
                                              Type: boolean
                                              Description: "The collection's lock state after this update (true once ANY weight edit has ever occurred)"
                                - Name: delete_collection
                                  Description: "Delete an entire collection: all physical LanceDB tables (S3), S3 Vectors indexes, staged row groups, state/lock/pending/asset records, dedup records, and the registry entry. The 'default' collection requires force=true."
                                  InputSchema:
                                      Type: object
                                      Description: "Collection deletion request. Takes no idempotency_token — this is a synchronous, condition-guarded write that is already safe to repeat, so a token would add nothing. Sent anyway it is ignored with a log line, never rejected."
                                      Required:
                                          - collection_id
                                      Properties:
                                          collection_id:
                                              Type: string
                                              Description: "Collection to delete"
                                          force:
                                              Type: boolean
                                              Description: "Required true to delete the 'default' collection"
                                  OutputSchema:
                                      Type: object
                                      Description: "Sweep result"
                                      Properties:
                                          collection_id:
                                              Type: string
                                              Description: "Deleted collection"
                                          deleted:
                                              Type: boolean
                                              Description: "true on success"
                                          physical_tables:
                                              Type: integer
                                              Description: "Physical tables swept"
                                          s3_objects_deleted:
                                              Type: integer
                                              Description: "S3 objects removed"
                                - Name: describe_tool
                                  Description: "Return the deployed admin-tool version."
                                  InputSchema:
                                      Type: object
                                      Description: "No input required. Takes no idempotency_token — this is pure introspection with no execution and no state, so there is nothing to deduplicate. Sent anyway it is ignored with a log line, never rejected."
                                  OutputSchema:
                                      Type: object
                                      Description: "Tool version"
                                      Properties:
                                          version:
                                              Type: string
                                              Description: "Deployed version"

    # -------------------------------------------------------------------------
    # Gateway Target — Text-to-Speech (optional)
    # -------------------------------------------------------------------------
    TextToSpeechTarget:
        Type: AWS::BedrockAgentCore::GatewayTarget
        Condition: TextToSpeechEnabled
        Properties:
            Name: text-to-speech
            Description: "CosyVoice3 text-to-speech (ONNX, CPU): batch synthesis with zero-shot voice cloning, per-clip ASR QC, voice catalog with user-registered voices, pace/emotion style hints"
            GatewayIdentifier: !Ref MediaWorkflowGateway
            CredentialProviderConfigurations:
                - CredentialProviderType: GATEWAY_IAM_ROLE
            TargetConfiguration:
                Mcp:
                    Lambda:
                        LambdaArn: !Ref TextToSpeechToolLambdaArn
                        ToolSchema:
                            InlinePayload:
                                - Name: synthesize_speech
                                  Description: "Synthesize one or more transcripts with a registered voice via zero-shot cloning. Async — call get_job_status with the returned job_id to poll. Every transcript in the batch shares the same voice_id, flow_steps, seed, and style."
                                  InputSchema:
                                      Type: object
                                      Description: "Synthesis request"
                                      Required:
                                          - voice_id
                                          - transcripts
                                      Properties:
                                          idempotency_token:
                                              Type: string
                                              Description: "Optional idempotency token (1-80 chars of A-Z a-z 0-9 _ . -). Folded into the workflow_id hash and then DISCARDED — never forwarded, never stored, never echoed. Supply one to make a retry safe: the same token with the same parameters returns the EXISTING run instead of synthesizing twice. OMIT it and every call synthesizes fresh — which is what you want for a new take, since without an explicit seed the sampling differs per call and the voice catalog can change between calls."
                                          voice_id:
                                              Type: string
                                              Description: "Registered voice to synthesize with (see list_voice_collection / get_voice)"
                                          transcripts:
                                              Type: array
                                              Description: "Text to synthesize, spoken verbatim in whatever language it's written in — one WAV per entry"
                                              Items:
                                                  Type: string
                                                  Description: "One transcript"
                                          flow_steps:
                                              Type: integer
                                              Description: "Flow-matching Euler steps, 1-10 (default 6). Higher is marginally higher quality at higher cost; 6 vs 10 was found audibly indistinguishable in testing."
                                          seed:
                                              Type: integer
                                              Description: "Sampling seed for reproducible output. Omit for a fresh take each call; also forces single-shot when style is a best-of-3 style (see style)."
                                          target_durations_s:
                                              Type: array
                                              Description: "Per-transcript target duration in seconds, aligned 1:1 with transcripts (use 0 or omit an entry to leave that transcript unstretched). Enforces a bounded ±10% pitch-preserving time-stretch fit; a transcript whose natural length misses the target beyond that bound fails for that transcript only."
                                              Items:
                                                  Type: number
                                                  Description: "Target duration in seconds, or 0 for no stretch"
                                          style:
                                              Type: string
                                              Description: "Optional pace/emotion hint applied to every transcript in this batch, ONLY VERIFIED FOR ENGLISH VOICES (non-English voice_id + style is rejected — see the tts-on-aws README.md for why): fast, slow (pace, single-shot) or happy, sad, angry, cute, loud, soft (emotion, best-of-3 candidate selection). Unknown names fail the whole request, not silently ignored."
                                  OutputSchema:
                                      Type: object
                                      Description: "Job submission result — a HANDLE, never results. Every field here is present on a fresh start AND on an absorbed resubmit of an already-finished run; only `status` differs. Read `status` and `message`, then call get_job_status for anything else."
                                      Properties:
                                          job_id:
                                              Type: string
                                              Description: "Step Functions execution ARN — pass to get_job_status to poll"
                                          status:
                                              Type: string
                                              Description: "RUNNING on a fresh start. An identical request already submitted is NOT started twice: this returns the EXISTING run's status instead, which may be RUNNING | SUCCEEDED | FAILED | TIMED_OUT | ABORTED. A non-RUNNING status here carries NO results — no clips, no QC summary; it only reports that the run already reached that state. Call get_job_status with this job_id to read anything about it, whatever the status says."
                                          message:
                                              Type: string
                                              Description: "Present ONLY when this call did not resubmit because an identical request already exists. Its absence means a new execution was just started. Every other field is identical in both cases, so this is the only field that distinguishes them."
                                          workflow_id:
                                              Type: string
                                              Description: "Deterministic job identifier (hash of parameters) — identical requests return the same job_id instead of starting a duplicate run"
                                          output_s3_prefix:
                                              Type: string
                                              Description: "Where this run's clips (and outputs.json, for callback-driven consumers) land — s3://{proxy}/micro-workflow/tts-on-aws/output/{workflow_id}. A pointer, not results: read results via get_job_status."
                                          error:
                                              Type: string
                                              Description: "Failure cause. Present only when this call was absorbed into a run that had already FAILED, TIMED_OUT, or been ABORTED. A terminal failure is STICKY: Step Functions reserves the execution name for 90 days, so resubmitting the identical request returns this same failure for that whole window. Retrying verbatim never re-runs it — change a parameter, or pass a different idempotency_token."

                                - Name: register_voice
                                  Description: "Register a new voice for zero-shot cloning from a short reference WAV. Async — call get_job_status with the returned job_id to poll. Registration validates the supplied ref_transcript against the reference audio via ASR and rejects a mismatch."
                                  InputSchema:
                                      Type: object
                                      Description: "Voice registration request. Takes no idempotency_token — it already dedups on the parameters alone (identical parameters return the EXISTING run), and nothing behind it dedups per record, so a token could not make a duplicate registration safe either. Sent anyway it is ignored with a log line, never rejected."
                                      Required:
                                          - ref_s3uri
                                          - ref_transcript
                                      Properties:
                                          ref_s3uri:
                                              Type: string
                                              Description: "s3://bucket/key of the reference WAV (1-30s, clean single-speaker speech)"
                                          ref_transcript:
                                              Type: string
                                              Description: "Exact transcript of what is spoken in the reference audio — validated by ASR at registration time; a mismatch is rejected, not silently accepted"
                                          name:
                                              Type: string
                                              Description: "Human-readable display name for the voice"
                                          gender:
                                              Type: string
                                              Description: "Voice gender, free-form (e.g. male, female)"
                                          language:
                                              Type: string
                                              Description: "Language of the reference audio"
                                          catalog:
                                              Type: string
                                              Description: "Catalog/collection this voice belongs to (default: \"default\")"
                                          comment:
                                              Type: string
                                              Description: "Free-form note about the voice"
                                          license:
                                              Type: string
                                              Description: "License term for the voice; defaults to \"IC\" (Individual Contributor — the uploader attests they hold the rights) if omitted"
                                  OutputSchema:
                                      Type: object
                                      Description: "Job submission result — a HANDLE, never results. Every field here is present on a fresh start AND on an absorbed resubmit of an already-finished run; only `status` differs. Read `status` and `message`, then call get_job_status for anything else."
                                      Properties:
                                          job_id:
                                              Type: string
                                              Description: "Step Functions execution ARN — pass to get_job_status to poll"
                                          status:
                                              Type: string
                                              Description: "RUNNING on a fresh start. Registering the same reference audio with the same metadata twice does NOT re-register: this returns the EXISTING run's status instead, which may be RUNNING | SUCCEEDED | FAILED | TIMED_OUT | ABORTED. A non-RUNNING status here carries NO results — the voice record comes from get_job_status (or get_voice), never from this reply."
                                          message:
                                              Type: string
                                              Description: "Present ONLY when this call did not resubmit because an identical request already exists. Its absence means a new execution was just started. Every other field is identical in both cases, so this is the only field that distinguishes them."
                                          workflow_id:
                                              Type: string
                                              Description: "Deterministic job identifier (hash of parameters)"
                                          error:
                                              Type: string
                                              Description: "Failure cause. Present only when this call was absorbed into a run that had already FAILED, TIMED_OUT, or been ABORTED. A terminal failure is STICKY: Step Functions reserves the execution name for 90 days, so resubmitting the identical request returns this same failure for that whole window. Retrying verbatim never re-runs it — change a parameter, or pass a different idempotency_token."

                                - Name: get_job_status
                                  Description: "Poll a synthesize_speech or register_voice job by its execution ARN. Returns RUNNING while in progress, or the full structured result when complete."
                                  InputSchema:
                                      Type: object
                                      Description: "Job poll request. Takes no idempotency_token, and the retired `uuid` names nothing here — a poll starts no execution, so neither key could change what this returns. Sent anyway, either is ignored with a log line and never rejected: a hallucinated parameter must not fail a poll that is otherwise correct."
                                      Required:
                                          - job_id
                                      Properties:
                                          job_id:
                                              Type: string
                                              Description: "Step Functions execution ARN returned by synthesize_speech or register_voice"
                                  OutputSchema:
                                      Type: object
                                      Description: "Job status and results — shape differs for a synthesis job vs. a register_voice job"
                                      Properties:
                                          job_id:
                                              Type: string
                                              Description: "Step Functions execution ARN — the value you polled with, echoed on every branch (including RUNNING and every failure) so a status reply always names its own run"
                                          status:
                                              Type: string
                                              Description: "RUNNING | SUCCEEDED | FAILED | TIMED_OUT | ABORTED"
                                          error:
                                              Type: string
                                              Description: "Failure cause (present when status is FAILED, TIMED_OUT, or ABORTED)"
                                          workflow_id:
                                              Type: string
                                              Description: "Deterministic job identifier — the same value the submit returned, recovered from the execution name so a caller holding only a job_id can still name the run"
                                          voice:
                                              Type: object
                                              Description: "Present only for a completed register_voice job: the newly registered voice record, including preview_uri (an s3:// URI — pass to media-outputs___get_download_url for a listenable link), exactly as get_voice returns it"
                                          outputs:
                                              Type: array
                                              Description: "Present only for a completed synthesize_speech job: one entry per transcript, in request order"
                                              Items:
                                                  Type: object
                                                  Description: "One transcript's result"
                                                  Properties:
                                                      transcript_index:
                                                          Type: integer
                                                          Description: "Index into the original transcripts array"
                                                      uri:
                                                          Type: string
                                                          Description: "s3:// URI of the synthesized WAV (absent on error)"
                                                      duration_s:
                                                          Type: number
                                                          Description: "Actual synthesized duration in seconds"
                                                      stretched:
                                                          Type: boolean
                                                          Description: "Whether this clip was time-stretched to hit a target_durations_s entry"
                                                      qc_passed:
                                                          Type: boolean
                                                          Description: "ASR-roundtrip content check result — informational, never blocks the job (see batch_qc_summary)"
                                                      qc_similarity:
                                                          Type: number
                                                          Description: "ASR-roundtrip similarity score (0-1)"
                                                      error:
                                                          Type: string
                                                          Description: "Present if this specific transcript failed"
                                                      qc_error:
                                                          Type: string
                                                          Description: "Present when the ASR-roundtrip check could not RUN at all (missing or corrupt WAV, whisper crash) as opposed to running and failing. Distinguishes 'no QC verdict' from 'QC said no' — qc_passed is null in this case, not false."
                                          batch_qc_summary:
                                              Type: object
                                              Description: "Present only for a completed synthesize_speech job: rollup of outputs[].qc_passed — all_passed, passed, failed, total, failed_indices. QC failure is informational, not a job failure — status can be SUCCEEDED with all_passed false."
                                          output_s3_prefix:
                                              Type: string
                                              Description: "Present only for a completed synthesize_speech job: the s3:// prefix all clips were written under. Service-derived — you cannot choose it."
                                          pipeline_wall_sec:
                                              Type: number
                                              Description: "Total wall-clock time for the pipeline in seconds"
                                          total_estimated_cost:
                                              Type: number
                                              Description: "Estimated total cost in USD"
                                          usage_uri:
                                              Type: string
                                              Description: "s3:// URI of usage_tracking.json — the PER-STATE cost and duration breakdown behind total_estimated_cost. This target has no outputs[] label vocabulary (its outputs are one entry per transcript, not one per file kind), so the usage file is exposed as a URI field rather than an outputs[label=usage] entry as in the sibling targets."

                                - Name: list_voice_collection
                                  Description: "List registered voices in a catalog, optionally filtered by gender/language."
                                  InputSchema:
                                      Type: object
                                      Description: "Voice list request. Takes no idempotency_token — this tool starts no execution and must reflect current state, so there is nothing to deduplicate. Sent anyway it is ignored with a log line, never rejected."
                                      Properties:
                                          catalog:
                                              Type: string
                                              Description: "Catalog to list (default: \"default\")"
                                          gender:
                                              Type: string
                                              Description: "Filter to this gender (post-query filter)"
                                          language:
                                              Type: string
                                              Description: "Filter to this language (post-query filter)"
                                          limit:
                                              Type: integer
                                              Description: "Max voices to return (default 50, max 100)"
                                  OutputSchema:
                                      Type: object
                                      Description: "Voice list result"
                                      Properties:
                                          catalog:
                                              Type: string
                                              Description: "Catalog that was queried"
                                          count:
                                              Type: integer
                                              Description: "Number of voices returned"
                                          voices:
                                              Type: array
                                              Description: "Matching voice records"
                                              Items:
                                                  Type: object
                                                  Description: "One voice record (voice_id, name, gender, language, origin, license, catalog, comment, duration_sec, created_at, s3_preview_key)"

                                - Name: get_voice
                                  Description: "Fetch a single registered voice's metadata and preview URI by voice_id."
                                  InputSchema:
                                      Type: object
                                      Description: "Voice detail request. Takes no idempotency_token — this tool starts no execution and must reflect current state, so there is nothing to deduplicate. Sent anyway it is ignored with a log line, never rejected."
                                      Required:
                                          - voice_id
                                      Properties:
                                          voice_id:
                                              Type: string
                                              Description: "Registered voice to fetch"
                                  OutputSchema:
                                      Type: object
                                      Description: "Voice record"
                                      Properties:
                                          voice_id:
                                              Type: string
                                              Description: "Voice identifier"
                                          name:
                                              Type: string
                                              Description: "Human-readable display name"
                                          gender:
                                              Type: string
                                              Description: "Voice gender"
                                          language:
                                              Type: string
                                              Description: "Language of the reference audio"
                                          origin:
                                              Type: string
                                              Description: "Provenance: dataset name for baked-in voices, or \"user-upload\" for cloned voices"
                                          license:
                                              Type: string
                                              Description: "License term for the voice"
                                          catalog:
                                              Type: string
                                              Description: "Catalog this voice belongs to"
                                          comment:
                                              Type: string
                                              Description: "Free-form note about the voice"
                                          duration_sec:
                                              Type: number
                                              Description: "Reference clip length in seconds"
                                          created_at:
                                              Type: string
                                              Description: "Registration timestamp"
                                          preview_uri:
                                              Type: string
                                              Description: "s3:// URI of a short listenable preview clip; pass to media-outputs___get_download_url for an HTTP link"

                                - Name: describe_tool
                                  Description: "Return the deployed version of the text-to-speech tool and its backend info (state machine ARNs, short description, output contract)."
                                  InputSchema:
                                      Type: object
                                      Description: "No input required. Takes no idempotency_token — this is pure introspection with no execution and no state, so there is nothing to deduplicate. Sent anyway it is ignored with a log line, never rejected."
                                  OutputSchema:
                                      Type: object
                                      Description: "Tool version and backend info"
                                      Properties:
                                          version:
                                              Type: string
                                              Description: "Semantic version of the deployed tool (e.g. 1.0.0)"
                                          push_completion:
                                              Type: boolean
                                              Description: "true when this deployment supports callback_task_token push completion on synthesize_speech (present from alpha.20260831a); a workflow that will sleep on the token should probe this before submitting"
                                          state_machine_arns:
                                              Type: array
                                              Description: "Backing Step Functions state machines (for console/CLI debugging)"
                                              Items:
                                                  Type: object
                                                  Description: "One state machine"
                                                  Properties:
                                                      name:
                                                          Type: string
                                                          Description: "synthesis | register_voice"
                                                      arn:
                                                          Type: string
                                                          Description: "State machine ARN"
                                                  Required:
                                                      - name
                                                      - arn
                                          description:
                                              Type: string
                                              Description: "Short description of the backend pipeline"
                                          output_contract:
                                              Type: object
                                              Description: "Field-level contract for this target's INLINE result shapes (per-clip outputs[] entry, batch_qc_summary, voice record) plus the usage_tracking.json file reached via usage_uri. This target has no labeled file outputs. Static per tool version — cache it for the session. Anything not listed is internal and may change without notice."
                                          input_examples:
                                              Type: object
                                              Description: "Per tool (keyed by tool name under tools): required lists the fields the gateway refuses without — a prose entry like 'a OR b' states a one-of rule this schema cannot express — and example is a minimal valid request including recommended optionals; every other accepted parameter is declared, with type and description, in the tool's InputSchema. The shapes and field names are the contract; every s3 uri, ARN, and id value is an invented placeholder to substitute. Each submit example passes the gateway's own input validation (pinned by a unit test); where a one-of rule exists, alternatives holds one valid example of each other form. Static per tool version — cache it for the session."

    # -------------------------------------------------------------------------
    # Gateway Target — Bedrock Inference
    # InlinePayload is a native YAML list of ToolDefinition structs.
    # SchemaDefinition supports: Type, Description, Properties, Required, Items only.
    # -------------------------------------------------------------------------
    BedrockInferenceTarget:
        Type: AWS::BedrockAgentCore::GatewayTarget
        Condition: BedrockInferenceEnabled
        Properties:
            Name: bedrock-inference
            Description: "Bedrock LLM inference: N already-rendered prompt records in, N responses out — sync under a concurrency lease or a half-cost batch job, with per-record status, model fallback, and cost accounting"
            GatewayIdentifier: !Ref MediaWorkflowGateway
            CredentialProviderConfigurations:
                - CredentialProviderType: GATEWAY_IAM_ROLE
            TargetConfiguration:
                Mcp:
                    Lambda:
                        LambdaArn: !Ref BedrockInferenceToolLambdaArn
                        ToolSchema:
                            InlinePayload:
                                - Name: run_inference
                                  Description: "Run N already-rendered prompt records through a Bedrock model chain and get N responses. Prompts must be FULLY RENDERED before submitting — this workflow never resolves templates. Sync answers in seconds under a per-model concurrency lease; use_batch=true runs a Bedrock batch job at 50% token cost but minutes-to-hours latency; absent, a dollar guard decides and mode_reason says why. Async — call get_job_status with the returned job_id to poll. Use list_models first when unsure which model ids this deployment carries."
                                  InputSchema:
                                      Type: object
                                      Description: "Inference request. Exactly ONE of records / records_s3uri is required."
                                      Properties:
                                          records:
                                              Type: array
                                              Description: "The prompt records, inline. Mutually exclusive with records_s3uri. Rides the Lambda invoke payload (6 MB total — roughly 20 base64 images); stage larger sets via records_s3uri."
                                              Items:
                                                  Type: object
                                                  Description: "One record: a unique record_id, Converse-shaped messages (already rendered) and optional system (string or Converse system blocks). Image content blocks carry format (png|jpeg|gif|webp) and source.bytes as base64 (validated against the declared format's file magic at plan time) or source.s3Location.uri (Nova family)."
                                                  Properties:
                                                      record_id:
                                                          Type: string
                                                          Description: "Unique per request; response.jsonl lines carry it back in request order. The pad_ prefix is reserved and rejected."
                                                      messages:
                                                          Type: array
                                                          Description: "Converse message objects ({role, content:[...]}), fully rendered. The last message must not be assistant-role (prefill is rejected for every model)."
                                                          Items:
                                                              Type: object
                                                              Description: "One Converse message"
                                                      system:
                                                          Type: string
                                                          Description: "Optional system prompt — a string, or a list of Converse system blocks"
                                                  Required:
                                                      - record_id
                                                      - messages
                                          records_s3uri:
                                              Type: string
                                              Description: "Staged alternative to inline records, mutually exclusive with them: s3:// uri to a JSONL (or JSON-array) file under the proxy bucket's micro-workflow/ prefix. Transport only — identical records inline and staged produce the SAME workflow_id."
                                          model_chain:
                                              Type: array
                                              Description: "Bedrock model ids, primary first (a comma-separated string is also accepted). Registry ids are BARE (no us./eu./global. prefix — routing is registry data). Falls back to the deployment default; cross-family fallbacks are preferable (a same-family pair shares quota and capacity events). Max 4."
                                              Items:
                                                  Type: string
                                                  Description: "A model id from list_models"
                                          use_batch:
                                              Type: boolean
                                              Description: "Absent: a dollar guard decides (batch when the estimated input-cost saving clears the floor), reported in mode_reason. true: batch — downgraded to sync WITH the reason when the model cannot batch. false: always sync."
                                          max_concurrent:
                                              Type: integer
                                              Description: "Sync concurrency cap for this model. Default 3. The cap is per deployment prefix and per model."
                                          temperature:
                                              Type: number
                                              Description: "0.0-1.0, default 0.0. Best-effort by model capability: omitted for families that reject it and whenever thinking is active — never sent to be rejected."
                                          thinking:
                                              Type: string
                                              Description: "'disabled' (default) or 'adaptive'. Best-effort by capability; models that require the thinking field get their registry-declared quiet value (the current Claude 5 family — Fable 5.1, Opus 5, Sonnet 5.5, Haiku 5.5 — all run adaptive; some reject an explicit disabled, so the registry entry is authoritative). No numeric budget form exists."
                                          effort:
                                              Type: string
                                              Description: "'low' | 'medium' | 'high', on models that accept it — valid across every family (the wire it rides on is registry data). When omitted the entry's own default applies: 'low' for the Claude 5 family, 'none' (no reasoning) for GPT-6 Luna, 'low' for GPT-6 Sol/Astra"
                                          inference_region:
                                              Type: string
                                              Description: "Routing override: 'global', a geo (us|eu|apac), or a concrete region. Refused loudly when the model's registry entry does not allow that scope (the EU-residency rule) — never silently rerouted."
                                          batch_repair:
                                              Type: boolean
                                              Description: "Default true: failed records of a batch job are re-run through the sync chain (on-demand rate) and the repaired lines merged back. false trades that for cheap FAILED lines."
                                          idempotency_token:
                                              Type: string
                                              Description: "Optional idempotency token (1-80 chars of A-Z a-z 0-9 _ . -). Folded into the workflow_id hash and then DISCARDED — never forwarded, never echoed. Same token + same parameters returns the EXISTING run; any change starts a fresh run. Omitting it still dedups on the parameters alone (records are final rendered bytes, so identical parameters are identical work)."
                                  OutputSchema:
                                      Type: object
                                      Description: "Job submission result — a HANDLE, never results. Every field here is present on a fresh start AND on an absorbed resubmit of an already-finished run; only `status` differs. Read `status` and `message`, then call get_job_status for anything else."
                                      Properties:
                                          job_id:
                                              Type: string
                                              Description: "Step Functions execution ARN — pass to get_job_status to poll"
                                          status:
                                              Type: string
                                              Description: "RUNNING on a fresh start. An identical request already submitted is NOT started twice: this returns the EXISTING run's status instead, which may be RUNNING | SUCCEEDED | FAILED | TIMED_OUT | ABORTED. A non-RUNNING status here carries NO results — get_job_status is the only source of results."
                                          message:
                                              Type: string
                                              Description: "Present ONLY when this call did not resubmit because an identical request already exists. Its absence means a new execution was just started."
                                          current_state:
                                              Type: string
                                              Description: "Active pipeline stage. Present while the run is RUNNING; absent once it has stopped, because a stopped execution is in no state."
                                          workflow_id:
                                              Type: string
                                              Description: "Identifier of this run; also the final path segment of output_s3_prefix (micro-workflow/bedrock-inference/{workflow_id}/)"
                                          records_total:
                                              Type: integer
                                              Description: "Number of records accepted into this run"
                                          output_s3_prefix:
                                              Type: string
                                              Description: "Service-derived S3 prefix where all outputs are written"
                                          request_s3uri:
                                              Type: string
                                              Description: "S3 URI of the run's input_params.json (control parameters; the records live in the sibling request.jsonl)"
                                          error:
                                              Type: string
                                              Description: "Failure cause. Present only when this call was absorbed into a run that had already FAILED, TIMED_OUT, or been ABORTED. A terminal failure is STICKY: Step Functions reserves the execution name for 90 days, so an unchanged resubmit keeps answering with this error — change a parameter, or pass a different idempotency_token."

                                - Name: get_job_status
                                  Description: "Poll an inference job by its execution ARN. RUNNING sync jobs finish in seconds-to-minutes; batch jobs in minutes-to-hours. On SUCCEEDED, partial success IS success: read records_failed, not just the status — response bodies are never inlined (N model outputs are unbounded), fetch response.jsonl from outputs[]."
                                  InputSchema:
                                      Type: object
                                      Description: "Job poll request. Takes no idempotency_token — a poll starts no execution; a stray token is ignored with a log line and never rejected."
                                      Required:
                                          - job_id
                                      Properties:
                                          job_id:
                                              Type: string
                                              Description: "Step Functions execution ARN returned by run_inference"
                                  OutputSchema:
                                      Type: object
                                      Description: "Job status and results"
                                      Properties:
                                          job_id:
                                              Type: string
                                              Description: "The execution ARN, echoed on every branch so a status reply always names its own run"
                                          status:
                                              Type: string
                                              Description: "RUNNING | SUCCEEDED | FAILED | TIMED_OUT | ABORTED"
                                          current_state:
                                              Type: string
                                              Description: "Active pipeline stage name (present when RUNNING)"
                                          workflow_id:
                                              Type: string
                                              Description: "Identifier of this run; also the final path segment of output_s3_prefix (micro-workflow/bedrock-inference/{workflow_id}/)"
                                          inference_mode:
                                              Type: string
                                              Description: "Which mode actually RAN — 'sync' or 'batch' — decided at plan time; never assume the mode you asked for is the mode that ran"
                                          mode_reason:
                                              Type: string
                                              Description: "Why that mode ran (requested, dollar-guard auto decision, or a batch request downgraded because the model cannot batch)"
                                          records_total:
                                              Type: integer
                                              Description: "Records in the run"
                                          records_succeeded:
                                              Type: integer
                                              Description: "Records with a SUCCESS line in response.jsonl"
                                          records_failed:
                                              Type: integer
                                              Description: "Records with a FAILED line — surfaced on a SUCCEEDED run, because partial success is success and reading only the status would treat 1 failed of 40 as complete"
                                          records_resumed:
                                              Type: integer
                                              Description: "Records a checkpoint re-entry or batch repair pass skipped as already done"
                                          summary_s3uri:
                                              Type: string
                                              Description: "S3 URI of summary.json (run-level rollup: counts, models used, token/cost totals)"
                                          response_s3uri:
                                              Type: string
                                              Description: "S3 URI of response.jsonl — one line per record, in request order; this is where the model outputs live"
                                          usage_uri:
                                              Type: string
                                              Description: "S3 URI of usage_tracking.json (per-state Lambda + Bedrock cost accounting for the whole execution tree)"
                                          output_s3_prefix:
                                              Type: string
                                              Description: "Service-derived S3 prefix where all outputs are written"
                                          outputs:
                                              Type: array
                                              Description: "All job outputs as S3 objects: {uri, mime, label, desc}. Labels (response, summary, usage) and output basenames are stable API. To fetch a file over HTTP, pass its uri to media-outputs___get_download_url."
                                              Items:
                                                  Type: object
                                                  Description: "One output object"
                                                  Properties:
                                                      uri:
                                                          Type: string
                                                          Description: "s3:// URI of the output object"
                                                      mime:
                                                          Type: string
                                                          Description: "Registered MIME type"
                                                      label:
                                                          Type: string
                                                          Description: "Stable semantic label for selecting outputs"
                                                      desc:
                                                          Type: string
                                                          Description: "One-line role description (what the file is and what to use it for), joined from the tool's output contract; absent when the contract lacks the label"
                                                  Required:
                                                      - uri
                                                      - label
                                          error:
                                              Type: string
                                              Description: "Failure cause (present when status is FAILED, TIMED_OUT, or ABORTED)"

                                - Name: list_models
                                  Description: "List the model ids this deployment's registry carries, one summary line each — id, name, type, routing scope, and whether the model can run batch. Call this before run_inference when unsure which models exist here: the registry is per-deployment and per-geo (an EU deployment does not carry us-only models)."
                                  InputSchema:
                                      Type: object
                                      Description: "No input required. Takes no idempotency_token — pure introspection; a stray token is ignored with a log line, never rejected."
                                  OutputSchema:
                                      Type: object
                                      Description: "The deployment's model registry, summarized"
                                      Properties:
                                          registry_version:
                                              Type: string
                                              Description: "Version of the seeded registry artifact (the stack's tool version at seed time)"
                                          geo:
                                              Type: string
                                              Description: "The deployment's geo (us | eu | apac) — which models exist here follows from it"
                                          models:
                                              Type: array
                                              Description: "One summary per registered model"
                                              Items:
                                                  Type: object
                                                  Description: "One model summary"
                                                  Properties:
                                                      model_id:
                                                          Type: string
                                                          Description: "The BARE registry id to use in model_chain"
                                                      model_name:
                                                          Type: string
                                                          Description: "Human-readable name"
                                                      model_type:
                                                          Type: array
                                                          Description: "Capabilities by kind, e.g. [vision, text] or [embedding] (embedding models cannot run through this Converse-only workflow)"
                                                          Items:
                                                              Type: string
                                                              Description: "One kind"
                                                      inference_region:
                                                          Type: string
                                                          Description: "Default routing scope: global, a geo, or a concrete region"
                                                      supported_regions:
                                                          Type: array
                                                          Description: "Scopes inference_region may override to"
                                                          Items:
                                                              Type: string
                                                              Description: "One scope"
                                                      can_batch:
                                                          Type: boolean
                                                          Description: "Whether use_batch=true can actually run batch on this model (false downgrades to sync, reported in mode_reason)"
                                          models_total:
                                              Type: integer
                                              Description: "Number of models listed"

                                - Name: get_model
                                  Description: "One model's FULL registry entry — capabilities (temperature/thinking/effort support and defaults), image limits and downscale thresholds, pricing, batch support, and routing — 'what can this model take' as data."
                                  InputSchema:
                                      Type: object
                                      Description: "Model lookup. Takes no idempotency_token — pure introspection."
                                      Required:
                                          - model_id
                                      Properties:
                                          model_id:
                                              Type: string
                                              Description: "A model id from list_models (bare, or with a legacy routing prefix — both resolve to the same entry)"
                                  OutputSchema:
                                      Type: object
                                      Description: "The full registry entry"
                                      Properties:
                                          registry_version:
                                              Type: string
                                              Description: "Version of the seeded registry artifact"
                                          geo:
                                              Type: string
                                              Description: "The deployment's geo"
                                          model:
                                              Type: object
                                              Description: "The complete registry entry: model_id, model_type, inference_region, supported_regions, model_pricing (per-token USD), batch_job.can_support, and capabilities — temperature (bool), thinking (absent|optional|required), thinking_default, effort/effort_default/effort_wire (which request field carries the effort knob: output_config for the Claude families, reasoning for GPT-6 — informational; callers just pass effort), and image limits — max_images per request, max_image_mb per inline image, max_payload_mb as the record's inline-byte total, all refused at plan time where declared (a null limit means none declared, nothing pre-checked) — plus downscales_above (long_side_px/total_px) and recommendations"

                                - Name: describe_tool
                                  Description: "Return the deployed version of the bedrock-inference tool, its backend info, the deployment's default model chain, and the output contract (field-level shapes of response.jsonl, summary.json and usage_tracking.json). Static per version — fetch once per session and cache it."
                                  InputSchema:
                                      Type: object
                                      Description: "No input required. Takes no idempotency_token — pure introspection; a stray token is ignored with a log line, never rejected."
                                  OutputSchema:
                                      Type: object
                                      Description: "Tool version and backend info"
                                      Properties:
                                          version:
                                              Type: string
                                              Description: "Deployed tool version (the .version stamp; also the registry_version the deploy seeded)"
                                          state_machine_arn:
                                              Type: string
                                              Description: "ARN of the orchestrator state machine — the one consumers start; its two children (sync, batch) are internal"
                                          default_model_chain:
                                              Type: array
                                              Description: "The model chain substituted when run_inference names none"
                                              Items:
                                                  Type: string
                                                  Description: "A model id"
                                          description:
                                              Type: string
                                              Description: "One-line backend description"
                                          output_contract:
                                              Type: object
                                              Description: "Field-level contract for every outputs[] label: basename, kind (file/prefix), mime, the one-line description that doubles as the entries' desc, and a compact example of the file's field names/nesting. Static per tool version — cache it for the session. Anything not listed is internal and may change without notice."
                                          input_examples:
                                              Type: object
                                              Description: "Per tool (keyed by tool name under tools): required lists the fields the gateway refuses without — a prose entry like 'a OR b' states a one-of rule this schema cannot express — and example is a minimal valid request including recommended optionals; every other accepted parameter is declared, with type and description, in the tool's InputSchema. The shapes and field names are the contract; every s3 uri, ARN, and id value is an invented placeholder to substitute. Each submit example passes the gateway's own input validation (pinned by a unit test); where a one-of rule exists, alternatives holds one valid example of each other form. Static per tool version — cache it for the session."

    # -------------------------------------------------------------------------
    # Gateway Target — Prompt Registry
    # InlinePayload is a native YAML list of ToolDefinition structs.
    # SchemaDefinition supports: Type, Description, Properties, Required, Items only.
    # NOTE: every tool here is SYNCHRONOUS — this target has no state machine,
    # no job handles, no idempotency_token anywhere (a stray one is warned
    # about and ignored, never rejected).
    # -------------------------------------------------------------------------
    PromptRegistryTarget:
        Type: AWS::BedrockAgentCore::GatewayTarget
        Condition: PromptRegistryEnabled
        Properties:
            Name: prompt-registry
            Description: "Prompt registry: versioned, immutable prompt templates on S3 with a dev/test/prod lifecycle — authoring, listing, retrieval and promotion of the prompts caller workflows render for bedrock-inference"
            GatewayIdentifier: !Ref MediaWorkflowGateway
            CredentialProviderConfigurations:
                - CredentialProviderType: GATEWAY_IAM_ROLE
            TargetConfiguration:
                Mcp:
                    Lambda:
                        LambdaArn: !Ref PromptRegistryToolLambdaArn
                        ToolSchema:
                            InlinePayload:
                                - Name: put_prompt
                                  Description: "Save a new prompt version. The .md source needs a '<!-- Version: name -->' header plus '# System Prompt' and '# User Prompt' sections; {{variable}} tokens are parsed ONCE at save and returned as the declared list. Versions are IMMUTABLE — an edit is a new version name (VERSION_EXISTS otherwise; dev/test names can be freed with delete_prompt). Vocabulary lint rides the response as warnings and never blocks. Version 'default' is forced to prod."
                                  InputSchema:
                                      Type: object
                                      Description: "The prompt to save"
                                      Required:
                                          - category
                                          - text
                                      Properties:
                                          category:
                                              Type: string
                                              Description: "The prompt's name/purpose (e.g. conversation-analysis); 1-64 chars of A-Z a-z 0-9 _ . -"
                                          text:
                                              Type: string
                                              Description: "The authored .md source, complete — header comments, both sections, {{tokens}}. Byte-preserved as source.md. Sanity-bounded at ~1 MB (a larger 'prompt' is almost certainly a paste accident)."
                                          stage:
                                              Type: string
                                              Description: "'dev' (default) | 'test' | 'prod'. dev/test versions can be deleted to free the name during iteration; prod versions can only be deprecated. Promotion is one-way (promote_prompt)."
                                  OutputSchema:
                                      Type: object
                                      Description: "The saved identity plus the vocabulary lint — warnings are advisory and never block a save"
                                      Properties:
                                          category:
                                              Type: string
                                              Description: "Echo of the saved category"
                                          version:
                                              Type: string
                                              Description: "The version name parsed from the '<!-- Version: ... -->' header"
                                          stage:
                                              Type: string
                                              Description: "The stage the version landed at ('default' is always prod; a message says so when the requested stage was overridden)"
                                          origin:
                                              Type: string
                                              Description: "'user' for tool saves ('builtin' is reserved for the seeded prompts)"
                                          source_s3uri:
                                              Type: string
                                              Description: "Where the byte-preserved source landed"
                                          variables:
                                              Type: array
                                              Description: "The declared {{tokens}} the caller must supply values for at render time"
                                              Items:
                                                  Type: string
                                                  Description: "One declared token, braces included"
                                          warnings:
                                              Type: array
                                              Description: "Vocabulary lint: legacy spellings (with the canonical name) and novel names (with a did-you-mean when plausible). Advisory only."
                                              Items:
                                                  Type: string
                                                  Description: "One warning"
                                          message:
                                              Type: string
                                              Description: "Present only when something was adjusted (e.g. 'default' forced to prod)"
                                          created_at:
                                              Type: integer
                                              Description: "Save time, epoch ms"

                                - Name: get_prompt
                                  Description: "Fetch one prompt version's full artifact — system, user_template, and the pre-declared variables to substitute (consumers never parse the {{...}} grammar themselves). Version is OPTIONAL and resolves to 'default'; a NAMED missing version is PROMPT_NOT_FOUND, never a silent fallback. Check `stage` before binding a prompt into a production pipeline."
                                  InputSchema:
                                      Type: object
                                      Description: "The prompt to fetch"
                                      Required:
                                          - category
                                      Properties:
                                          category:
                                              Type: string
                                              Description: "The prompt's category"
                                          version:
                                              Type: string
                                              Description: "Optional; absent resolves to 'default'"
                                  OutputSchema:
                                      Type: object
                                      Description: "The full artifact: content fields are immutable for the life of the version; only stage/deprecated/promoted_at/deprecated_at ever change"
                                      Properties:
                                          category:
                                              Type: string
                                              Description: "The category"
                                          version:
                                              Type: string
                                              Description: "The version"
                                          stage:
                                              Type: string
                                              Description: "dev | test | prod"
                                          origin:
                                              Type: string
                                              Description: "builtin | user"
                                          deprecated:
                                              Type: boolean
                                              Description: "True when retired; the artifact remains readable forever"
                                          comment:
                                              Type: string
                                              Description: "The author's comment header"
                                          system:
                                              Type: string
                                              Description: "The system prompt text (may contain {{tokens}})"
                                          user_template:
                                              Type: string
                                              Description: "The user prompt template (contains {{tokens}})"
                                          variables:
                                              Type: array
                                              Description: "Pre-declared tokens, parsed at save time — substitute these exact strings via the copied prompt_render module"
                                              Items:
                                                  Type: object
                                                  Description: "One declared variable: {token, root, leafs}"
                                          source_md5:
                                              Type: string
                                              Description: "MD5 of the exact source.md bytes this artifact was parsed from"
                                          source_s3uri:
                                              Type: string
                                              Description: "The byte-preserved authored source"
                                          created_at:
                                              Type: integer
                                              Description: "Save time, epoch ms"
                                          promoted_at:
                                              Type: integer
                                              Description: "Last promotion time, epoch ms; null before any promotion"
                                          deprecated_at:
                                              Type: integer
                                              Description: "Deprecation time, epoch ms; null while active"

                                - Name: list_prompts
                                  Description: "List categories and their versions with lifecycle metadata (stage, origin, deprecated, comment) — no template bodies; get_prompt fetches those. Category is optional; absent lists everything."
                                  InputSchema:
                                      Type: object
                                      Description: "Optional filter"
                                      Properties:
                                          category:
                                              Type: string
                                              Description: "Optional; restricts the listing to one category"
                                  OutputSchema:
                                      Type: object
                                      Description: "Categories with per-version lifecycle metadata"
                                      Properties:
                                          categories:
                                              Type: array
                                              Description: "One entry per category"
                                              Items:
                                                  Type: object
                                                  Description: "A category and its versions ({version, stage, origin, deprecated, comment, created_at} each)"
                                          total_versions:
                                              Type: integer
                                              Description: "Total versions across the listed categories"

                                - Name: promote_prompt
                                  Description: "Move a version up the one-way stage ratchet (dev -> test -> prod). Idempotent: already at or beyond the target returns success with a message and changes nothing (covers 'default', which is born prod). There is NO demotion — a demotable prod would be a deletable prod."
                                  InputSchema:
                                      Type: object
                                      Description: "The version to promote"
                                      Required:
                                          - category
                                          - version
                                      Properties:
                                          category:
                                              Type: string
                                              Description: "The prompt's category"
                                          version:
                                              Type: string
                                              Description: "The version to promote"
                                          to_stage:
                                              Type: string
                                              Description: "'test' or 'prod' (default 'prod')"
                                  OutputSchema:
                                      Type: object
                                      Description: "The stage transition (or the no-op, with a message)"
                                      Properties:
                                          category:
                                              Type: string
                                              Description: "Echo"
                                          version:
                                              Type: string
                                              Description: "Echo"
                                          stage:
                                              Type: string
                                              Description: "The stage after this call"
                                          previous_stage:
                                              Type: string
                                              Description: "The stage before this call (equal to stage on a no-op)"
                                          promoted_at:
                                              Type: integer
                                              Description: "Epoch ms of the last real promotion"
                                          message:
                                              Type: string
                                              Description: "Present when the call changed nothing (already at or beyond the target)"

                                - Name: delete_prompt
                                  Description: "Delete a dev/test version COMPLETELY, freeing the version name for reuse during iteration. Refuses prod (PROD_UNDELETABLE — deprecate instead). Safe because run identity is the rendered bytes: every past run's own prefix keeps its exact request.jsonl forever; only the human-facing prompt.version pointer in history entries can dangle, and only for runs against versions never promoted."
                                  InputSchema:
                                      Type: object
                                      Description: "The version to delete"
                                      Required:
                                          - category
                                          - version
                                      Properties:
                                          category:
                                              Type: string
                                              Description: "The prompt's category"
                                          version:
                                              Type: string
                                              Description: "The dev/test version to delete"
                                  OutputSchema:
                                      Type: object
                                      Description: "The deletion receipt"
                                      Properties:
                                          category:
                                              Type: string
                                              Description: "Echo"
                                          version:
                                              Type: string
                                              Description: "Echo"
                                          deleted:
                                              Type: boolean
                                              Description: "True — errors come back as {error, errorCode, message} instead"
                                          stage_was:
                                              Type: string
                                              Description: "The stage the version held (dev or test)"
                                          message:
                                              Type: string
                                              Description: "Notes that the name is freed and what happens to history pointers"

                                - Name: deprecate_prompt
                                  Description: "Retire a version without deleting it — the prod retirement path (dev/test iterations usually delete instead). Idempotent. Version 'default' is protected (DEFAULT_PROTECTED): a version-less get_prompt resolves to it, so deprecating it would orphan every such read."
                                  InputSchema:
                                      Type: object
                                      Description: "The version to deprecate"
                                      Required:
                                          - category
                                          - version
                                      Properties:
                                          category:
                                              Type: string
                                              Description: "The prompt's category"
                                          version:
                                              Type: string
                                              Description: "The version to deprecate (never 'default')"
                                  OutputSchema:
                                      Type: object
                                      Description: "The deprecation state"
                                      Properties:
                                          category:
                                              Type: string
                                              Description: "Echo"
                                          version:
                                              Type: string
                                              Description: "Echo"
                                          stage:
                                              Type: string
                                              Description: "The version's stage (unchanged by deprecation)"
                                          deprecated:
                                              Type: boolean
                                              Description: "True"
                                          deprecated_at:
                                              Type: integer
                                              Description: "Epoch ms"
                                          message:
                                              Type: string
                                              Description: "Present when already deprecated (the call changed nothing)"

                                - Name: describe_tool
                                  Description: "Return the deployed version, backend description, the output contract (kind inline — this target emits no files), and the WHOLE reviewed variable vocabulary: canonical names, kinds, and legacy aliases. Fetch once per session before authoring prompts. There is deliberately no state_machine_arn — this target has no state machine."
                                  InputSchema:
                                      Type: object
                                      Description: "No input required. Takes no idempotency_token — nothing here reads it; a stray one is ignored with a log line, never rejected."
                                  OutputSchema:
                                      Type: object
                                      Description: "Tool version, backend info, contract, vocabulary"
                                      Properties:
                                          version:
                                              Type: string
                                              Description: "Deployed tool version (the .version stamp)"
                                          description:
                                              Type: string
                                              Description: "One-line backend description"
                                          output_contract:
                                              Type: object
                                              Description: "Field-level contract for the four inline result shapes (prompt-artifact, put-result, list-entry, lifecycle-result). Static per tool version — cache it for the session."
                                          input_examples:
                                              Type: object
                                              Description: "Per tool (keyed by tool name under tools): required lists the fields the gateway refuses without — a prose entry like 'a OR b' states a one-of rule this schema cannot express — and example is a minimal valid request including recommended optionals; every other accepted parameter is declared, with type and description, in the tool's InputSchema. The shapes and field names are the contract; every s3 uri, ARN, and id value is an invented placeholder to substitute. Each submit example passes the gateway's own input validation (pinned by a unit test); where a one-of rule exists, alternatives holds one valid example of each other form. Static per tool version — cache it for the session."
                                          vocabulary:
                                              Type: object
                                              Description: "The reviewed template-variable vocabulary: {variables: {name: {kind, description, aliases}}}. kind is text|number|json|blocks; use canonical names in new prompts — legacy aliases warn on save."

    # -------------------------------------------------------------------------
    # Gateway Target: prompt-registry-admin (SUPERUSER surface — internal
    # categories; same 7 tools as prompt-registry, different Lambda. A
    # bundle test pins the two InlinePayloads identical so the copies
    # cannot drift.)
    # -------------------------------------------------------------------------
    PromptRegistryAdminTarget:
        Type: AWS::BedrockAgentCore::GatewayTarget
        Condition: PromptRegistryAdminEnabled
        Properties:
            Name: prompt-registry-admin
            Description: "Prompt registry ADMIN surface: the same seven tools over ALL categories, including internal ones invisible on the normal target. Separate Lambda — attach only for trusted admin agents."
            GatewayIdentifier: !Ref MediaWorkflowGateway
            CredentialProviderConfigurations:
                - CredentialProviderType: GATEWAY_IAM_ROLE
            TargetConfiguration:
                Mcp:
                    Lambda:
                        LambdaArn: !Ref PromptRegistryAdminToolLambdaArn
                        ToolSchema:
                            InlinePayload:
                                - Name: put_prompt
                                  Description: "Save a new prompt version. The .md source needs a '<!-- Version: name -->' header plus '# System Prompt' and '# User Prompt' sections; {{variable}} tokens are parsed ONCE at save and returned as the declared list. Versions are IMMUTABLE — an edit is a new version name (VERSION_EXISTS otherwise; dev/test names can be freed with delete_prompt). Vocabulary lint rides the response as warnings and never blocks. Version 'default' is forced to prod."
                                  InputSchema:
                                      Type: object
                                      Description: "The prompt to save"
                                      Required:
                                          - category
                                          - text
                                      Properties:
                                          category:
                                              Type: string
                                              Description: "The prompt's name/purpose (e.g. conversation-analysis); 1-64 chars of A-Z a-z 0-9 _ . -"
                                          text:
                                              Type: string
                                              Description: "The authored .md source, complete — header comments, both sections, {{tokens}}. Byte-preserved as source.md. Sanity-bounded at ~1 MB (a larger 'prompt' is almost certainly a paste accident)."
                                          stage:
                                              Type: string
                                              Description: "'dev' (default) | 'test' | 'prod'. dev/test versions can be deleted to free the name during iteration; prod versions can only be deprecated. Promotion is one-way (promote_prompt)."
                                  OutputSchema:
                                      Type: object
                                      Description: "The saved identity plus the vocabulary lint — warnings are advisory and never block a save"
                                      Properties:
                                          category:
                                              Type: string
                                              Description: "Echo of the saved category"
                                          version:
                                              Type: string
                                              Description: "The version name parsed from the '<!-- Version: ... -->' header"
                                          stage:
                                              Type: string
                                              Description: "The stage the version landed at ('default' is always prod; a message says so when the requested stage was overridden)"
                                          origin:
                                              Type: string
                                              Description: "'user' for tool saves ('builtin' is reserved for the seeded prompts)"
                                          source_s3uri:
                                              Type: string
                                              Description: "Where the byte-preserved source landed"
                                          variables:
                                              Type: array
                                              Description: "The declared {{tokens}} the caller must supply values for at render time"
                                              Items:
                                                  Type: string
                                                  Description: "One declared token, braces included"
                                          warnings:
                                              Type: array
                                              Description: "Vocabulary lint: legacy spellings (with the canonical name) and novel names (with a did-you-mean when plausible). Advisory only."
                                              Items:
                                                  Type: string
                                                  Description: "One warning"
                                          message:
                                              Type: string
                                              Description: "Present only when something was adjusted (e.g. 'default' forced to prod)"
                                          created_at:
                                              Type: integer
                                              Description: "Save time, epoch ms"

                                - Name: get_prompt
                                  Description: "Fetch one prompt version's full artifact — system, user_template, and the pre-declared variables to substitute (consumers never parse the {{...}} grammar themselves). Version is OPTIONAL and resolves to 'default'; a NAMED missing version is PROMPT_NOT_FOUND, never a silent fallback. Check `stage` before binding a prompt into a production pipeline."
                                  InputSchema:
                                      Type: object
                                      Description: "The prompt to fetch"
                                      Required:
                                          - category
                                      Properties:
                                          category:
                                              Type: string
                                              Description: "The prompt's category"
                                          version:
                                              Type: string
                                              Description: "Optional; absent resolves to 'default'"
                                  OutputSchema:
                                      Type: object
                                      Description: "The full artifact: content fields are immutable for the life of the version; only stage/deprecated/promoted_at/deprecated_at ever change"
                                      Properties:
                                          category:
                                              Type: string
                                              Description: "The category"
                                          version:
                                              Type: string
                                              Description: "The version"
                                          stage:
                                              Type: string
                                              Description: "dev | test | prod"
                                          origin:
                                              Type: string
                                              Description: "builtin | user"
                                          deprecated:
                                              Type: boolean
                                              Description: "True when retired; the artifact remains readable forever"
                                          comment:
                                              Type: string
                                              Description: "The author's comment header"
                                          system:
                                              Type: string
                                              Description: "The system prompt text (may contain {{tokens}})"
                                          user_template:
                                              Type: string
                                              Description: "The user prompt template (contains {{tokens}})"
                                          variables:
                                              Type: array
                                              Description: "Pre-declared tokens, parsed at save time — substitute these exact strings via the copied prompt_render module"
                                              Items:
                                                  Type: object
                                                  Description: "One declared variable: {token, root, leafs}"
                                          source_md5:
                                              Type: string
                                              Description: "MD5 of the exact source.md bytes this artifact was parsed from"
                                          source_s3uri:
                                              Type: string
                                              Description: "The byte-preserved authored source"
                                          created_at:
                                              Type: integer
                                              Description: "Save time, epoch ms"
                                          promoted_at:
                                              Type: integer
                                              Description: "Last promotion time, epoch ms; null before any promotion"
                                          deprecated_at:
                                              Type: integer
                                              Description: "Deprecation time, epoch ms; null while active"

                                - Name: list_prompts
                                  Description: "List categories and their versions with lifecycle metadata (stage, origin, deprecated, comment) — no template bodies; get_prompt fetches those. Category is optional; absent lists everything."
                                  InputSchema:
                                      Type: object
                                      Description: "Optional filter"
                                      Properties:
                                          category:
                                              Type: string
                                              Description: "Optional; restricts the listing to one category"
                                  OutputSchema:
                                      Type: object
                                      Description: "Categories with per-version lifecycle metadata"
                                      Properties:
                                          categories:
                                              Type: array
                                              Description: "One entry per category"
                                              Items:
                                                  Type: object
                                                  Description: "A category and its versions ({version, stage, origin, deprecated, comment, created_at} each)"
                                          total_versions:
                                              Type: integer
                                              Description: "Total versions across the listed categories"

                                - Name: promote_prompt
                                  Description: "Move a version up the one-way stage ratchet (dev -> test -> prod). Idempotent: already at or beyond the target returns success with a message and changes nothing (covers 'default', which is born prod). There is NO demotion — a demotable prod would be a deletable prod."
                                  InputSchema:
                                      Type: object
                                      Description: "The version to promote"
                                      Required:
                                          - category
                                          - version
                                      Properties:
                                          category:
                                              Type: string
                                              Description: "The prompt's category"
                                          version:
                                              Type: string
                                              Description: "The version to promote"
                                          to_stage:
                                              Type: string
                                              Description: "'test' or 'prod' (default 'prod')"
                                  OutputSchema:
                                      Type: object
                                      Description: "The stage transition (or the no-op, with a message)"
                                      Properties:
                                          category:
                                              Type: string
                                              Description: "Echo"
                                          version:
                                              Type: string
                                              Description: "Echo"
                                          stage:
                                              Type: string
                                              Description: "The stage after this call"
                                          previous_stage:
                                              Type: string
                                              Description: "The stage before this call (equal to stage on a no-op)"
                                          promoted_at:
                                              Type: integer
                                              Description: "Epoch ms of the last real promotion"
                                          message:
                                              Type: string
                                              Description: "Present when the call changed nothing (already at or beyond the target)"

                                - Name: delete_prompt
                                  Description: "Delete a dev/test version COMPLETELY, freeing the version name for reuse during iteration. Refuses prod (PROD_UNDELETABLE — deprecate instead). Safe because run identity is the rendered bytes: every past run's own prefix keeps its exact request.jsonl forever; only the human-facing prompt.version pointer in history entries can dangle, and only for runs against versions never promoted."
                                  InputSchema:
                                      Type: object
                                      Description: "The version to delete"
                                      Required:
                                          - category
                                          - version
                                      Properties:
                                          category:
                                              Type: string
                                              Description: "The prompt's category"
                                          version:
                                              Type: string
                                              Description: "The dev/test version to delete"
                                  OutputSchema:
                                      Type: object
                                      Description: "The deletion receipt"
                                      Properties:
                                          category:
                                              Type: string
                                              Description: "Echo"
                                          version:
                                              Type: string
                                              Description: "Echo"
                                          deleted:
                                              Type: boolean
                                              Description: "True — errors come back as {error, errorCode, message} instead"
                                          stage_was:
                                              Type: string
                                              Description: "The stage the version held (dev or test)"
                                          message:
                                              Type: string
                                              Description: "Notes that the name is freed and what happens to history pointers"

                                - Name: deprecate_prompt
                                  Description: "Retire a version without deleting it — the prod retirement path (dev/test iterations usually delete instead). Idempotent. Version 'default' is protected (DEFAULT_PROTECTED): a version-less get_prompt resolves to it, so deprecating it would orphan every such read."
                                  InputSchema:
                                      Type: object
                                      Description: "The version to deprecate"
                                      Required:
                                          - category
                                          - version
                                      Properties:
                                          category:
                                              Type: string
                                              Description: "The prompt's category"
                                          version:
                                              Type: string
                                              Description: "The version to deprecate (never 'default')"
                                  OutputSchema:
                                      Type: object
                                      Description: "The deprecation state"
                                      Properties:
                                          category:
                                              Type: string
                                              Description: "Echo"
                                          version:
                                              Type: string
                                              Description: "Echo"
                                          stage:
                                              Type: string
                                              Description: "The version's stage (unchanged by deprecation)"
                                          deprecated:
                                              Type: boolean
                                              Description: "True"
                                          deprecated_at:
                                              Type: integer
                                              Description: "Epoch ms"
                                          message:
                                              Type: string
                                              Description: "Present when already deprecated (the call changed nothing)"

                                - Name: describe_tool
                                  Description: "Return the deployed version, backend description, the output contract (kind inline — this target emits no files), and the WHOLE reviewed variable vocabulary: canonical names, kinds, and legacy aliases. Fetch once per session before authoring prompts. There is deliberately no state_machine_arn — this target has no state machine."
                                  InputSchema:
                                      Type: object
                                      Description: "No input required. Takes no idempotency_token — nothing here reads it; a stray one is ignored with a log line, never rejected."
                                  OutputSchema:
                                      Type: object
                                      Description: "Tool version, backend info, contract, vocabulary"
                                      Properties:
                                          version:
                                              Type: string
                                              Description: "Deployed tool version (the .version stamp)"
                                          description:
                                              Type: string
                                              Description: "One-line backend description"
                                          output_contract:
                                              Type: object
                                              Description: "Field-level contract for the four inline result shapes (prompt-artifact, put-result, list-entry, lifecycle-result). Static per tool version — cache it for the session."
                                          input_examples:
                                              Type: object
                                              Description: "Per tool (keyed by tool name under tools): required lists the fields the gateway refuses without — a prose entry like 'a OR b' states a one-of rule this schema cannot express — and example is a minimal valid request including recommended optionals; every other accepted parameter is declared, with type and description, in the tool's InputSchema. The shapes and field names are the contract; every s3 uri, ARN, and id value is an invented placeholder to substitute. Each submit example passes the gateway's own input validation (pinned by a unit test); where a one-of rule exists, alternatives holds one valid example of each other form. Static per tool version — cache it for the session."
                                          vocabulary:
                                              Type: object
                                              Description: "The reviewed template-variable vocabulary: {variables: {name: {kind, description, aliases}}}. kind is text|number|json|blocks; use canonical names in new prompts — legacy aliases warn on save."

    # -------------------------------------------------------------------------
    # Gateway Target: media-outputs (shared download-URL tool)
    # -------------------------------------------------------------------------
    MediaOutputsTarget:
        Type: AWS::BedrockAgentCore::GatewayTarget
        Properties:
            Name: media-outputs
            Description: "Shared access to micro-workflow output files: presigned HTTP download URLs for the s3:// uris returned in every tool's get_job_status outputs list"
            GatewayIdentifier: !Ref MediaWorkflowGateway
            CredentialProviderConfigurations:
                - CredentialProviderType: GATEWAY_IAM_ROLE
            TargetConfiguration:
                Mcp:
                    Lambda:
                        LambdaArn: !GetAtt DownloadUrlFunction.Arn
                        ToolSchema:
                            InlinePayload:
                                # Two tools, one Lambda. get_download_url is the
                                # original single-uri contract and its flat {url}
                                # response is frozen — batching was added as the
                                # separate get_download_urls tool below rather
                                # than by nesting this one's response.
                                - Name: get_download_url
                                  Description: "Return a presigned HTTP GET URL for one micro-workflow output object. Pass an s3:// uri from a get_job_status outputs entry (or a bare key under micro-workflow/; tts voice-preview keys under _model_artefacts/voice_catalog/ are also allowed). Prefix entries (uri ending with /) cannot be presigned — pick an object inside them. For several objects at once use get_download_urls instead of calling this repeatedly. The URL may occasionally expire before expires_at; re-request on HTTP 403."
                                  InputSchema:
                                      Type: object
                                      Description: "Download URL request. Takes no idempotency_token — this tool starts no execution and must reflect current state, so there is nothing to deduplicate. Sent anyway it is ignored with a log line, never rejected."
                                      Required:
                                          - s3uri_or_key
                                      Properties:
                                          s3uri_or_key:
                                              Type: string
                                              Description: "s3://bucket/key URI (bucket must be the workflow output bucket) or bare key beginning with micro-workflow/"
                                          expiry_seconds:
                                              Type: integer
                                              Description: "URL validity in seconds, clamped to 60-3600 (default 3600)"
                                  OutputSchema:
                                      Type: object
                                      Description: "Presigned URL"
                                      Properties:
                                          url:
                                              Type: string
                                              Description: "Presigned HTTP GET URL"
                                          expires_at:
                                              Type: string
                                              Description: "Expiry timestamp, ISO-8601 UTC"
                                          error:
                                              Type: boolean
                                              Description: "Present and true when the request failed"
                                          message:
                                              Type: string
                                              Description: "Failure reason (present when error is true)"
                                - Name: get_download_urls
                                  Description: "Return presigned HTTP GET URLs for several micro-workflow output objects in one call. Pass uris — a list of s3:// uris from get_job_status outputs entries (or bare keys under micro-workflow/, plus tts voice-preview keys under _model_artefacts/voice_catalog/); up to 50 per call, so batch rather than calling repeatedly. Presign only the files you actually need: each URL is ~1.3 KB, so a large batch consumes a lot of context. Prefix entries (uri ending with /) cannot be presigned — pick an object inside them. Returns a urls list with one entry per requested uri in the same order; an invalid uri fails only its own entry (error/message) while the rest still return urls. For a single object, get_download_url returns a flat url instead. A URL may occasionally expire before expires_at; re-request on HTTP 403."
                                  InputSchema:
                                      Type: object
                                      Description: "Batch download URL request. Takes no idempotency_token — this tool starts no execution and must reflect current state, so there is nothing to deduplicate. Sent anyway it is ignored with a log line, never rejected."
                                      Required:
                                          - uris
                                      Properties:
                                          uris:
                                              Type: array
                                              Description: "Output objects to presign (1-50). Each entry: s3://bucket/key URI (bucket must be the workflow output bucket) or bare key beginning with micro-workflow/."
                                              Items:
                                                  Type: string
                                                  Description: "One s3:// uri or bare micro-workflow/ key"
                                          expiry_seconds:
                                              Type: integer
                                              Description: "URL validity in seconds, clamped to 60-3600 (default 3600). Applies to every URL in the batch."
                                  OutputSchema:
                                      Type: object
                                      Description: "Presigned URLs"
                                      Properties:
                                          urls:
                                              Type: array
                                              Description: "One entry per requested uri, in request order"
                                              Items:
                                                  Type: object
                                                  Description: "Presign result for one uri"
                                                  Properties:
                                                      uri:
                                                          Type: string
                                                          Description: "The requested uri, echoed back for correlation"
                                                      url:
                                                          Type: string
                                                          Description: "Presigned HTTP GET URL (absent when this entry failed)"
                                                      error:
                                                          Type: boolean
                                                          Description: "Present and true when this uri could not be presigned"
                                                      message:
                                                          Type: string
                                                          Description: "Why this uri failed (present when error is true)"
                                          count:
                                              Type: integer
                                              Description: "Number of uris successfully presigned; less than the length of urls when some entries failed"
                                          expires_at:
                                              Type: string
                                              Description: "Expiry timestamp shared by every URL, ISO-8601 UTC"
                                          error:
                                              Type: boolean
                                              Description: "Present and true when the whole request failed (no urls returned)"
                                          message:
                                              Type: string
                                              Description: "Failure reason (present when error is true)"

    # -------------------------------------------------------------------------
    # Gateway Target — Media Ingest (source-media listing)
    # The inverse of media-outputs: reads the INGEST bucket (inputs), not the
    # proxy bucket (outputs). Listing only — workflows read ingest objects
    # server-side by uri, so nothing here presigns.
    # -------------------------------------------------------------------------
    MediaIngestTarget:
        Type: AWS::BedrockAgentCore::GatewayTarget
        Condition: IngestListEnabled
        Properties:
            Name: media-ingest
            Description: "Source media listing: browse the ingest bucket by prefix and file extension to find assets to feed the workflow tools"
            GatewayIdentifier: !Ref MediaWorkflowGateway
            CredentialProviderConfigurations:
                - CredentialProviderType: GATEWAY_IAM_ROLE
            TargetConfiguration:
                Mcp:
                    Lambda:
                        LambdaArn: !GetAtt IngestListFunction.Arn
                        ToolSchema:
                            InlinePayload:
                                - Name: list_files
                                  Description: "List source media files in the ingest bucket. Filter server-side by key prefix and client-side by file extension; returns up to max_results (default 20, max 200) matching files with their full s3:// uris — pass a returned s3uri straight to a workflow submit tool. When next_token is present there are (or may be) more matches: repeat the call with it unchanged. Results are lexicographic by key, not by date."
                                  InputSchema:
                                      Type: object
                                      Description: "Listing request. Takes no idempotency_token — listing starts no execution and reflects current bucket state. Sent anyway it is ignored with a log line, never rejected."
                                      Properties:
                                          prefix:
                                              Type: string
                                              Description: "Key prefix to filter by, e.g. 'movies/' or 'series/seasons/01/'. A full s3:// uri on the ingest bucket is accepted and stripped. Default: the whole bucket."
                                          extension:
                                              Type: string
                                              Description: "File extension to filter by, e.g. 'mp4' or '.mov' (case-insensitive; a list of extensions is also accepted). Default: all files."
                                          max_results:
                                              Type: integer
                                              Description: "Files per page, clamped to 1-200 (default 20). Keep it small — every row lands in your context."
                                          next_token:
                                              Type: string
                                              Description: "Continuation token from the previous call's next_token. Omit on the first call."
                                  OutputSchema:
                                      Type: object
                                      Description: "Matching files, lexicographic by key"
                                      Properties:
                                          files:
                                              Type: array
                                              Description: "One entry per matching file"
                                              Items:
                                                  Type: object
                                                  Description: "One ingest object"
                                                  Properties:
                                                      s3uri:
                                                          Type: string
                                                          Description: "Full s3:// uri — pass this to workflow submit tools"
                                                      key:
                                                          Type: string
                                                          Description: "Object key within the ingest bucket"
                                                      size:
                                                          Type: integer
                                                          Description: "Object size in bytes"
                                                      last_modified:
                                                          Type: string
                                                          Description: "Last-modified timestamp, ISO-8601 UTC"
                                          count:
                                              Type: integer
                                              Description: "Number of files returned in this page"
                                          next_token:
                                              Type: string
                                              Description: "Present when more matches may exist — pass it back unchanged to continue; absent on the last page"
                                          error:
                                              Type: boolean
                                              Description: "Present and true when the request failed"
                                          message:
                                              Type: string
                                              Description: "Failure reason (present when error is true)"

    # -------------------------------------------------------------------------
    # Gateway Target — media-uploads: presigned uploads into the ingest bucket.
    # Control plane only — the CLIENT PUTs the bytes to S3 via the returned
    # URLs. Synchronous tools, no jobs, no workflow_id; the multipart
    # upload_id is the handle. 5 GiB cap (user decision 2026-10-14); the cap
    # bounds every multipart plan to <=50 parts, so start_upload always
    # returns the COMPLETE URL set and get_upload_part_urls is purely the
    # 403-refresh tool (a presigned URL dies with the Lambda's signing
    # credentials, possibly before its nominal expiry).
    # -------------------------------------------------------------------------
    MediaUploadsTarget:
        Type: AWS::BedrockAgentCore::GatewayTarget
        Condition: IngestListEnabled
        Properties:
            Name: media-uploads
            Description: "Upload local files into the ingest bucket via presigned URLs: single PUT for small files, parallel multipart for large (max 5 GiB)"
            GatewayIdentifier: !Ref MediaWorkflowGateway
            CredentialProviderConfigurations:
                - CredentialProviderType: GATEWAY_IAM_ROLE
            TargetConfiguration:
                Mcp:
                    Lambda:
                        LambdaArn: !GetAtt UploadFunction.Arn
                        ToolSchema:
                            InlinePayload:
                                - Name: start_upload
                                  Description: "Begin uploading ONE local file to the ingest bucket (max 5 GiB). Small files (<=64 MiB) return mode 'single' with one presigned PUT url — PUT the whole file with the returned content_type as the Content-Type header and you are done. Larger files return mode 'multipart' with an upload_id and EVERY part's presigned url: PUT the byte ranges in parallel (no Content-Type header on parts), record each response's ETag, then call complete_upload — the object does not exist until then. Content type is auto-derived from the key's extension unless given. Refuses an existing key unless overwrite is true."
                                  InputSchema:
                                      Type: object
                                      Description: "One file. Takes no idempotency_token — uploads are identified by upload_id, not a run hash; sent anyway it is ignored with a log line."
                                      Required:
                                          - key
                                          - size_bytes
                                      Properties:
                                          key:
                                              Type: string
                                              Description: "Destination key in the ingest bucket (include the filename, e.g. 'uploads/promo.mp4'); an s3:// uri on the ingest bucket is accepted and stripped"
                                          size_bytes:
                                              Type: integer
                                              Description: "Exact local file size in bytes (stat the file) — drives the single-vs-multipart decision and the part plan; max 5368709120 (5 GiB)"
                                          content_type:
                                              Type: string
                                              Description: "Override the auto-derived MIME type. Whatever is returned MUST be echoed as the Content-Type header on a mode-'single' PUT (it is folded into the signature)"
                                          part_size:
                                              Type: integer
                                              Description: "Multipart part size in bytes (default 134217728 = 128 MiB); clamped so the plan never exceeds 50 parts and never falls below 8 MiB"
                                          overwrite:
                                              Type: boolean
                                              Description: "Replace an existing object at key (default false: an existing key is refused by name)"
                                          expiry_seconds:
                                              Type: integer
                                              Description: "URL validity, clamped 60-3600 (default 3600). URLs may die earlier with the signing credentials — refresh on HTTP 403 via get_upload_part_urls"
                                  OutputSchema:
                                      Type: object
                                      Description: "mode 'single': {url, content_type, size_bytes, s3uri, expires_at}. mode 'multipart': {upload_id, content_type, size_bytes, part_size, part_count, parts: [{part_number, url}], s3uri, expires_at}. On failure: {error, errorCode, message}."
                                      Properties:
                                          mode:
                                              Type: string
                                              Description: "'single' (one PUT, done) or 'multipart' (PUT parts, then complete_upload)"
                                          s3uri:
                                              Type: string
                                              Description: "The destination uri — after a successful upload it feeds workflow submit tools directly"
                                          size_bytes:
                                              Type: integer
                                              Description: "Echo of the declared file size — the plan and every signed Content-Length were built from exactly this value"
                                          url:
                                              Type: string
                                              Description: "mode 'single' only: the presigned PUT url"
                                          upload_id:
                                              Type: string
                                              Description: "mode 'multipart' only: the handle for get_upload_part_urls / complete_upload / abort_upload"
                                          content_type:
                                              Type: string
                                              Description: "The resolved MIME type — echo it verbatim on a single PUT"
                                          part_size:
                                              Type: integer
                                              Description: "Bytes per part; part n covers bytes (n-1)*part_size .. min(n*part_size, size)-1"
                                          part_count:
                                              Type: integer
                                              Description: "Number of parts (always <= 50)"
                                          parts:
                                              Type: array
                                              Description: "Every part's presigned url"
                                              Items:
                                                  Type: object
                                                  Description: "One part"
                                                  Properties:
                                                      part_number:
                                                          Type: integer
                                                          Description: "1-based part number"
                                                      url:
                                                          Type: string
                                                          Description: "Presigned UploadPart url"
                                          expires_at:
                                              Type: string
                                              Description: "Nominal URL expiry, ISO-8601 UTC"
                                          note:
                                              Type: string
                                              Description: "One-line usage guidance for the returned mode"
                                          error:
                                              Type: boolean
                                              Description: "Present and true when the request failed"
                                          errorCode:
                                              Type: string
                                              Description: "Machine-readable failure code (present when error is true)"
                                          message:
                                              Type: string
                                              Description: "Failure reason naming the condition (present when error is true)"
                                - Name: get_upload_part_urls
                                  Description: "Re-presign named parts of an in-progress multipart upload — the refresh tool for part URLs that returned HTTP 403 (a presigned URL dies with the Lambda's signing credentials, possibly before its nominal expiry). Not pagination: start_upload already returned every part. size_bytes and part_size come from the start_upload response — they reconstruct the plan, and each fresh URL is signed for that part's exact Content-Length."
                                  InputSchema:
                                      Type: object
                                      Description: "Refresh request. Takes no idempotency_token (ignored with a log line if sent)."
                                      Required:
                                          - key
                                          - upload_id
                                          - size_bytes
                                          - part_size
                                          - part_numbers
                                      Properties:
                                          key:
                                              Type: string
                                              Description: "The destination key from start_upload"
                                          upload_id:
                                              Type: string
                                              Description: "The multipart handle from start_upload"
                                          size_bytes:
                                              Type: integer
                                              Description: "The file size from the start_upload request"
                                          part_size:
                                              Type: integer
                                              Description: "The part_size from the start_upload response"
                                          part_numbers:
                                              Type: array
                                              Description: "Part numbers to re-presign (max 50 per call; must lie within the plan size_bytes/part_size describes)"
                                              Items:
                                                  Type: integer
                                                  Description: "1-based part number"
                                          expiry_seconds:
                                              Type: integer
                                              Description: "URL validity, clamped 60-3600 (default 3600)"
                                  OutputSchema:
                                      Type: object
                                      Description: "Fresh URLs for the requested parts"
                                      Properties:
                                          parts:
                                              Type: array
                                              Description: "One entry per requested part"
                                              Items:
                                                  Type: object
                                                  Description: "One part"
                                                  Properties:
                                                      part_number:
                                                          Type: integer
                                                          Description: "1-based part number"
                                                      url:
                                                          Type: string
                                                          Description: "Fresh presigned UploadPart url"
                                          expires_at:
                                              Type: string
                                              Description: "Nominal URL expiry, ISO-8601 UTC"
                                          error:
                                              Type: boolean
                                              Description: "Present and true when the request failed"
                                          errorCode:
                                              Type: string
                                              Description: "Machine-readable failure code (present when error is true)"
                                          message:
                                              Type: string
                                              Description: "Failure reason naming the condition (present when error is true)"
                                - Name: complete_upload
                                  Description: "Finish a multipart upload: pass every part's number with the ETag its PUT response returned. The object exists only after this succeeds; the returned s3uri feeds workflow submit tools directly. A part smaller than S3's 5 MiB minimum (except the last) or a wrong ETag fails here by name."
                                  InputSchema:
                                      Type: object
                                      Description: "Completion request. Takes no idempotency_token (ignored with a log line if sent)."
                                      Required:
                                          - key
                                          - upload_id
                                          - parts
                                      Properties:
                                          key:
                                              Type: string
                                              Description: "The destination key from start_upload"
                                          upload_id:
                                              Type: string
                                              Description: "The multipart handle from start_upload"
                                          parts:
                                              Type: array
                                              Description: "Every uploaded part with its ETag (quotes optional); order does not matter"
                                              Items:
                                                  Type: object
                                                  Description: "One uploaded part"
                                                  Properties:
                                                      part_number:
                                                          Type: integer
                                                          Description: "1-based part number"
                                                      etag:
                                                          Type: string
                                                          Description: "The ETag header from that part's PUT response"
                                  OutputSchema:
                                      Type: object
                                      Description: "The assembled object"
                                      Properties:
                                          s3uri:
                                              Type: string
                                              Description: "Destination uri — feeds workflow submit tools directly"
                                          etag:
                                              Type: string
                                              Description: "The assembled object's ETag"
                                          size_bytes:
                                              Type: integer
                                              Description: "Verified object size (ListBucket round trip)"
                                          note:
                                              Type: string
                                              Description: "One-line next-step guidance"
                                          error:
                                              Type: boolean
                                              Description: "Present and true when the request failed"
                                          errorCode:
                                              Type: string
                                              Description: "Machine-readable failure code (present when error is true)"
                                          message:
                                              Type: string
                                              Description: "Failure reason naming the condition (present when error is true)"
                                - Name: abort_upload
                                  Description: "Abandon an in-progress multipart upload and free its stored parts. The ingest bucket's AbortIncompleteMultipartUpload lifecycle rule is the backstop for sessions never aborted — incomplete parts bill until removed."
                                  InputSchema:
                                      Type: object
                                      Description: "Abort request. Takes no idempotency_token (ignored with a log line if sent)."
                                      Required:
                                          - key
                                          - upload_id
                                      Properties:
                                          key:
                                              Type: string
                                              Description: "The destination key from start_upload"
                                          upload_id:
                                              Type: string
                                              Description: "The multipart handle from start_upload"
                                  OutputSchema:
                                      Type: object
                                      Description: "Abort result"
                                      Properties:
                                          aborted:
                                              Type: boolean
                                              Description: "True when the session was removed"
                                          key:
                                              Type: string
                                              Description: "The aborted session's key (echo)"
                                          upload_id:
                                              Type: string
                                              Description: "The aborted session's upload_id (echo)"
                                          error:
                                              Type: boolean
                                              Description: "Present and true when the request failed"
                                          errorCode:
                                              Type: string
                                              Description: "Machine-readable failure code (present when error is true)"
                                          message:
                                              Type: string
                                              Description: "Failure reason naming the condition (present when error is true)"

# ---------------------------------------------------------------------------
# Outputs
# ---------------------------------------------------------------------------
    # -------------------------------------------------------------------------
    # Gateway Target — Conversation Analysis
    # InlinePayload is a native YAML list of ToolDefinition structs.
    # SchemaDefinition supports: Type, Description, Properties, Required, Items only.
    # The first llm-prompt-driven workflow: it consumes prompt-registry and
    # bedrock-inference INTERNALLY — an agent never renders or submits prompts
    # to analyze a conversation, it hands over a transcript uri.
    # -------------------------------------------------------------------------
    ConversationAnalysisTarget:
        Type: AWS::BedrockAgentCore::GatewayTarget
        Condition: ConversationAnalysisEnabled
        Properties:
            Name: conversation-analysis
            Description: "Conversation analysis: a speech-diarization transcript in, merged coverage-validated topic segments out — chunks long programs on natural boundaries and renders the registry prompt internally"
            GatewayIdentifier: !Ref MediaWorkflowGateway
            CredentialProviderConfigurations:
                - CredentialProviderType: GATEWAY_IAM_ROLE
            TargetConfiguration:
                Mcp:
                    Lambda:
                        LambdaArn: !Ref ConversationAnalysisToolLambdaArn
                        ToolSchema:
                            InlinePayload:
                                - Name: analyze_conversation
                                  Description: "Analyze a program transcript into topic-based segments: overall content type, top genres, and per-segment topic/reasoning/entities/events/sentiment/tone with timestamps resolved from the transcript itself (never model-invented). Long programs are chunked on natural boundaries and merged automatically. Async — poll get_job_status with the returned job_id. Feed it a speech-diarization run's `transcript` output (preferred) or a WebVTT file on the proxy bucket."
                                  InputSchema:
                                      Type: object
                                      Description: "Analysis request. Only transcript_s3uri is required; every option has a sensible default."
                                      Properties:
                                          transcript_s3uri:
                                              Type: string
                                              Description: "s3:// uri on the proxy bucket: a speech-diarization run's final_transcript.json (PREFERRED — lossless cue ids, true sentence boundaries, speakers) or a WebVTT file (accepted; caption-split cues and missing voice tags reduce segmentation quality)."
                                          transcript_format:
                                              Type: string
                                              Description: "Optional override of content sniffing: 'diarization-json' or 'webvtt'."
                                          model_chain:
                                              Type: array
                                              Description: "Bedrock model ids, primary first (comma-separated string also accepted). Absent -> this workflow's default, amazon.nova-2-lite-v1:0 (fast, ~1/10th sonnet cost, coarser segments); pass anthropic.claude-sonnet-4-6 for editorial-grade granularity. Every id is validated against bedrock-inference's registry before any spend."
                                              Items:
                                                  Type: string
                                                  Description: "A model id from bedrock-inference list_models"
                                          use_batch:
                                              Type: boolean
                                              Description: "Absent -> false: never batches unless asked (predictable latency). true runs the inference as a half-cost Bedrock batch job (minutes-to-hours); bedrock-inference may downgrade to sync with the reason when the model cannot batch."
                                          history_scope:
                                              Type: string
                                              Description: "YOUR asset identity for the inference-history prefix (1-64 chars of A-Za-z0-9_.-), e.g. asset.{yourAssetId}. Absent -> derived from the transcript (transcript.{diarization-workflow-id}). Every analysis of the same scope lists under one histories/ prefix."
                                          prompt_version:
                                              Type: string
                                              Description: "A NAMED version of the registry's conversation-analysis prompt, e.g. 'default_news' for news programming (rundown-style segments: news_form, interaction, sig_out, correspondent, generated slug). Absent -> the category default. In the request hash: a different version is different work. A version that does not exist refuses before any spend."
                                          idempotency_token:
                                              Type: string
                                              Description: "Optional (1-80 chars of A-Z a-z 0-9 _ . -). Same token + same parameters returns the EXISTING run. Also the RERUN mechanism: prompt content is not in the request hash, so re-analyzing after the registry's default prompt changed needs a fresh token — a rerun re-renders identical records under a NEW inference identity, never absorbing into the old run."
                                      Required:
                                          - transcript_s3uri
                                  OutputSchema:
                                      Type: object
                                      Description: "A HANDLE, never results (results come from get_job_status): job_id + workflow_id + status + output_s3_prefix. An identical resubmit is ABSORBED into the existing run — no second execution — and carries a `message` saying so (plus `error` when that run already failed; failure verdicts persist ~90 days)."
                                      Properties:
                                          job_id:
                                              Type: string
                                              Description: "Step Functions execution ARN — pass to get_job_status"
                                          workflow_id:
                                              Type: string
                                              Description: "The service's name for the run; outputs land under micro-workflow/conversation-analysis/{workflow_id}/"
                                          status:
                                              Type: string
                                              Description: "RUNNING on a fresh start; the existing run's status on an absorbed resubmit"
                                          output_s3_prefix:
                                              Type: string
                                              Description: "s3:// prefix where the three labeled outputs land"
                                          message:
                                              Type: string
                                              Description: "Present ONLY on an absorbed resubmit — the signal this call did not start a second run"
                                          current_state:
                                              Type: string
                                              Description: "Present only on a RUNNING absorb: the state the existing run is in"
                                          error:
                                              Type: string
                                              Description: "Present only when an absorbed run already failed: the cause"
                                - Name: get_job_status
                                  Description: "Poll a conversation-analysis job by its execution ARN. Single-chunk programs finish in ~20 s sync; multi-chunk in a few minutes; use_batch runs in minutes-to-hours. On SUCCEEDED, lifts the analysis header (content type, genres, segment count, segments_gap) and lists the three labeled outputs — presign uris via media-outputs to download."
                                  InputSchema:
                                      Type: object
                                      Description: "Poll request"
                                      Properties:
                                          job_id:
                                              Type: string
                                              Description: "Step Functions execution ARN returned by analyze_conversation"
                                      Required:
                                          - job_id
                                  OutputSchema:
                                      Type: object
                                      Description: "RUNNING -> status + current_state. SUCCEEDED -> the analysis header plus outputs[] of {uri, mime, label, desc} for labels analysis / chunk-manifest / usage. FAILED -> error with the cause. segments_gap lists cue-id ranges left uncovered — HONEST partial coverage on a SUCCEEDED run; do not auto-retry, rerun with a fresh idempotency_token only if the gaps matter."
                                      Properties:
                                          job_id:
                                              Type: string
                                              Description: "The execution ARN polled"
                                          workflow_id:
                                              Type: string
                                              Description: "The run's name"
                                          status:
                                              Type: string
                                              Description: "RUNNING | SUCCEEDED | FAILED | TIMED_OUT | ABORTED"
                                          current_state:
                                              Type: string
                                              Description: "RUNNING only: the machine state in progress (e.g. 'Submit and wait')"
                                          output_s3_prefix:
                                              Type: string
                                              Description: "s3:// prefix holding the outputs"
                                          overall_content_type:
                                              Type: string
                                              Description: "SUCCEEDED only: Episodic | Movies/Feature Films | News Program | Sports Event | Documentary | Reality Show | Game Show"
                                          content_type_candidates:
                                              Type: array
                                              Description: "Present ONLY when chunks disagreed with no strict majority: the deduped candidates, coverage-weight-ordered (overall_content_type is still the top-weighted value)"
                                              Items:
                                                  Type: string
                                                  Description: "A candidate content type"
                                          top_3_genres:
                                              Type: array
                                              Description: "SUCCEEDED only"
                                              Items:
                                                  Type: string
                                                  Description: "A genre"
                                          segments:
                                              Type: integer
                                              Description: "SUCCEEDED only: merged segment count"
                                          segments_gap:
                                              Type: array
                                              Description: "SUCCEEDED only: cue-id ranges left uncovered ([start, end] pairs); empty means 100% coverage"
                                              Items:
                                                  Type: array
                                                  Description: "[first_uncovered_id, last_uncovered_id]"
                                          outputs:
                                              Type: array
                                              Description: "SUCCEEDED only: the three labeled files"
                                              Items:
                                                  Type: object
                                                  Description: "{uri, mime, label, desc} — labels analysis | chunk-manifest | usage"
                                          error:
                                              Type: string
                                              Description: "Terminal failure cause"
                                - Name: describe_tool
                                  Description: "Return the tool version, state machine ARN, backend description, and the output_contract (field-level shapes of the three labeled outputs). Static per tool version — call once per session and cache."
                                  InputSchema:
                                      Type: object
                                      Description: "No parameters required"
                                      Properties:
                                          verbose:
                                              Type: boolean
                                              Description: "Unused; reserved"
                                  OutputSchema:
                                      Type: object
                                      Description: "Tool metadata"
                                      Properties:
                                          version:
                                              Type: string
                                              Description: "Deployed tool version"
                                          state_machine_arn:
                                              Type: string
                                              Description: "The conversation-analysis state machine ARN"
                                          description:
                                              Type: string
                                              Description: "One-paragraph backend description"
                                          output_contract:
                                              Type: object
                                              Description: "Field-level contract for the three outputs[] labels: basename, mime, description, and a compact example of each file's field names/nesting. Anything not listed is internal and may change without notice."
                                          input_examples:
                                              Type: object
                                              Description: "Per tool (keyed by tool name under tools): required lists the fields the gateway refuses without — a prose entry like 'a OR b' states a one-of rule this schema cannot express — and example is a minimal valid request including recommended optionals; every other accepted parameter is declared, with type and description, in the tool's InputSchema. The shapes and field names are the contract; every s3 uri, ARN, and id value is an invented placeholder to substitute. Each submit example passes the gateway's own input validation (pinned by a unit test); where a one-of rule exists, alternatives holds one valid example of each other form. Static per tool version — cache it for the session."


    ShotMetadataEnrichmentTarget:
        Type: AWS::BedrockAgentCore::GatewayTarget
        Condition: ShotMetadataEnrichmentEnabled
        Properties:
            Name: shot-metadata-enrichment
            Description: "Shot metadata enrichment: a shot-segmentation run in, one metadata document per shot plus assembled scenes out — optional face and transcript joins; batch inference by default"
            GatewayIdentifier: !Ref MediaWorkflowGateway
            CredentialProviderConfigurations:
                - CredentialProviderType: GATEWAY_IAM_ROLE
            TargetConfiguration:
                Mcp:
                    Lambda:
                        LambdaArn: !Ref ShotMetadataEnrichmentToolLambdaArn
                        ToolSchema:
                            InlinePayload:
                                - Name: enrich_shot_metadata
                                  Description: "Catalogue every shot of a program: per-shot description, scene-boundary flag, shot kind, camera framing, setting/time/weather/lighting, people (face-recognition names when supplied), on-screen text, named entities, brands, objects, sentiment — plus scenes assembled deterministically from the boundary flags. Feed it a completed shot-segmentation run; optionally join a face-recognition run (names + a reference-face gallery bind WHO is WHO) and a speech-diarization transcript (spoken evidence). Async and BATCH BY DEFAULT (half cost, minutes-to-hours) — poll get_job_status with the returned job_id; pass use_batch=false for sync latency."
                                  InputSchema:
                                      Type: object
                                      Description: "Enrichment request. Only shot_segmentation_s3uri is required; every option has a sensible default."
                                      Properties:
                                          shot_segmentation_s3uri:
                                              Type: string
                                              Description: "s3:// uri of a COMPLETED shot-segmentation run on the proxy bucket — the run prefix (micro-workflow/shot-segmentation/{workflow_id}) or its embeddings/shots.json directly."
                                          face_recognition_s3uri:
                                              Type: string
                                              Description: "Optional: a face-recognition run (prefix or its facemetadata.json). Named people join per shot as text and each window carries a labeled reference-face gallery built from the run's rep_face_key crops — without it, people are described generically and people[] stays empty. The run must be recent enough to carry rep_face_key (refused by name otherwise)."
                                          transcript_s3uri:
                                              Type: string
                                              Description: "Optional: a speech-diarization run's final_transcript.json, sliced per window as SPOKEN evidence. MUST be the SAME ASSET as the shot run — the join is by time and nothing can catch a plausible-but-wrong transcript."
                                          program_names:
                                              Type: string
                                              Description: "Optional program title(s) for the prompt's context, e.g. 'Meridian'."
                                          overall_content_type:
                                              Type: string
                                              Description: "Optional content type for the prompt's context, e.g. 'Movies/Feature Films', 'News/Current Affairs'."
                                          model_chain:
                                              Type: array
                                              Description: "Bedrock model ids, primary first (comma-separated string also accepted); every id must be VISION-capable (the records carry labeled frame images). Absent -> anthropic.claude-sonnet-4-6, the model the prompt was validated on. Every id is validated against bedrock-inference's registry before any spend."
                                              Items:
                                                  Type: string
                                                  Description: "A model id from bedrock-inference list_models"
                                          use_batch:
                                              Type: boolean
                                              Description: "Absent -> TRUE: runs as a half-cost Bedrock batch job (minutes-to-hours; an hour of content is ~100 image-heavy windows and nothing downstream is interactive). Pass false for sync latency; bedrock-inference may downgrade batch to sync with the reason when the model cannot batch."
                                          history_scope:
                                              Type: string
                                              Description: "YOUR asset identity for the inference-history prefix (1-64 chars of A-Za-z0-9_.-), e.g. asset.{yourAssetId}. Absent -> shots.{shot-segmentation-workflow-id}."
                                          prompt_version:
                                              Type: string
                                              Description: "A NAMED version of the registry's shot-metadata-enrichment prompt, e.g. 'default_news' for news programming (classified supers, news_setting, live_bug_present). Absent -> the category default. In the request hash: a different version is different work. A version that does not exist refuses before any spend."
                                          idempotency_token:
                                              Type: string
                                              Description: "Optional (1-80 chars of A-Z a-z 0-9 _ . -). Same token + same parameters returns the EXISTING run. Also the RERUN mechanism: prompt content is not in the request hash, so re-enriching after the registry's default prompt changed needs a fresh token."
                                      Required:
                                          - shot_segmentation_s3uri
                                  OutputSchema:
                                      Type: object
                                      Description: "A HANDLE, never results (results come from get_job_status): job_id + workflow_id + status + output_s3_prefix. An identical resubmit is ABSORBED into the existing run — no second execution — and carries a `message` saying so (plus `error` when that run already failed)."
                                      Properties:
                                          job_id:
                                              Type: string
                                              Description: "Step Functions execution ARN — pass to get_job_status"
                                          workflow_id:
                                              Type: string
                                              Description: "The service's name for the run; outputs land under micro-workflow/shot-metadata-enrichment/{workflow_id}/"
                                          status:
                                              Type: string
                                              Description: "RUNNING on a fresh start; the existing run's status on an absorbed resubmit"
                                          output_s3_prefix:
                                              Type: string
                                              Description: "s3:// prefix where the four labeled outputs land"
                                          message:
                                              Type: string
                                              Description: "Present ONLY on an absorbed resubmit — the signal this call did not start a second run"
                                          current_state:
                                              Type: string
                                              Description: "Present only on a RUNNING absorb: the state the existing run is in"
                                          error:
                                              Type: string
                                              Description: "Present only when an absorbed run already failed: the cause"
                                - Name: get_job_status
                                  Description: "Poll a shot-metadata-enrichment job by its execution ARN. Sync runs finish in minutes; the default batch mode in minutes-to-hours. On SUCCEEDED, lifts the scenes header (scene count, shots_total, shots_gap, pairing_repair_rate) and lists the four labeled outputs — presign uris via media-outputs to download."
                                  InputSchema:
                                      Type: object
                                      Description: "Poll request"
                                      Properties:
                                          job_id:
                                              Type: string
                                              Description: "Step Functions execution ARN returned by enrich_shot_metadata"
