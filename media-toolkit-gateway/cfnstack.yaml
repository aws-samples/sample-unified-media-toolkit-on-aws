    SpeechDiarizationTarget:
        Type: AWS::BedrockAgentCore::GatewayTarget
        Properties:
            Name: speech-diarization
            Description: "Speaker diarization and transcription: Whisper ASR + speaker clustering, full hyperparameter control"
            GatewayIdentifier: !Ref MediaWorkflowGateway
            CredentialProviderConfigurations:
                - CredentialProviderType: GATEWAY_IAM_ROLE
            TargetConfiguration:
                Mcp:
                    Lambda:
                        LambdaArn: !Ref SpeechDiarizationToolLambdaArn
                        ToolSchema:
                            InlinePayload:
                                - Name: diarize_speech
                                  Description: "Run speaker diarization and transcription on a media asset using Whisper ASR and speaker clustering. Produces a timestamped transcript with per-speaker segments, a WebVTT file, and optional per-speaker audio channels. Async — call get_job_status with the returned job_id to poll."
                                  InputSchema:
                                      Type: object
                                      Description: "Parameters for speech diarization"
                                      Required:
                                          - asset_s3uri
                                      Properties:
                                          asset_s3uri:
                                              Type: string
                                              Description: "S3 URI of the source media file (e.g. s3://bucket/key.mp4)"
                                          idempotency_token:
                                              Type: string
                                              Description: "Optional idempotency token (1-80 chars of A-Z a-z 0-9 _ . -). Folded into the workflow_id hash and then DISCARDED — never forwarded, never stored, and no response echoes it. Same token + same parameters returns the EXISTING run; any parameter or token change starts a fresh run. Omitting it still dedups on the parameters alone, so a token is only needed to distinguish two otherwise-identical requests."
                                          language:
                                              Type: string
                                              Description: "BCP-47 language code e.g. en, ar, cy, zh. Omit to auto-detect."
                                          mark_in_out:
                                              Type: array
                                              Description: "Clip window [start_sec, end_sec]. Window must exceed 10 s. Automatically enables partial-file processing."
                                              Items:
                                                  Type: number
