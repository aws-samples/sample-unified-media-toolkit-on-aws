                    PROXY_BUCKET: !Ref ProxyBucket
            TracingConfig:
                Mode: Active

    ################################################################################
    # DynamoDB Stream → StreamHandlerLambda event source mapping
    ################################################################################
    StreamHandlerEventSourceMapping:
        Type: AWS::Lambda::EventSourceMapping
        Properties:
            EventSourceArn: !GetAtt LanceDBIndexStateTable.StreamArn
            FunctionName: !GetAtt StreamHandlerLambda.Arn
            StartingPosition: TRIM_HORIZON
            BatchSize: 10
            BisectBatchOnFunctionError: true
            MaximumRetryAttempts: 3
            FilterCriteria:
                Filters:
                    -
                        # Only trigger on REMOVE of the lock item (pk="lock").
                        # Dedup records live in LanceDBDedupTable — no stream there.
                        Pattern: '{"eventName": ["REMOVE"], "dynamodb": {"Keys": {"pk": {"S": ["lock"]}}}}'

    ################################################################################
    # Step Functions Log Groups
    ################################################################################
    IndexSFNLogGroup:
        Type: AWS::Logs::LogGroup
        Metadata:
            cfn_nag:
                rules_to_suppress:
                    -
                        id: W84
                        reason: CloudWatch Logs encrypts data at rest by default using an AWS-managed key
        Properties:
            LogGroupName: !Sub
                - /aws/states/${ResourcePrefix}-${name}
                - name: !FindInMap [Workflow, HybridSearchIndexer, Name]
            RetentionInDays: 7

    RebuildSFNLogGroup:
        Type: AWS::Logs::LogGroup
        Metadata:
            cfn_nag:
                rules_to_suppress:
                    -
                        id: W84
                        reason: CloudWatch Logs encrypts data at rest by default using an AWS-managed key
        Properties:
            LogGroupName: !Sub
                - /aws/states/${ResourcePrefix}-${name}
                - name: !FindInMap [Workflow, HybridSearchRebuild, Name]
            RetentionInDays: 7

    SearchSFNLogGroup:
        Type: AWS::Logs::LogGroup
        Metadata:
            cfn_nag:
                rules_to_suppress:
                    -
                        id: W84
                        reason: CloudWatch Logs encrypts data at rest by default using an AWS-managed key
        Properties:
            LogGroupName: !Sub
                - /aws/states/${ResourcePrefix}-${name}
                - name: !FindInMap [Workflow, HybridSearchSearch, Name]
            RetentionInDays: 7

    ################################################################################
    # Step Functions Execution Role
    ################################################################################
    HybridSearchSFNRole:
        Type: AWS::IAM::Role
        Metadata:
            cfn_nag:
                rules_to_suppress:
                    -
                        id: W11
                        reason: X-ray tracing and CloudWatch Logs delivery require wildcard resource
        Properties:
            Path: !Sub /${ResourcePrefix}/
            AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                    -
                        Effect: Allow
                        Action: sts:AssumeRole
                        Principal:
                            Service: !Sub states.${AWS::Region}.amazonaws.com
            Policies:
                -
                    PolicyName: !Sub ${ResourcePrefix}HybridSearchSFNPolicy
                    PolicyDocument:
                        Version: "2012-10-17"
                        Statement:
                            -
                                Effect: Allow
                                Action: lambda:InvokeFunction
                                Resource:
                                    - !GetAtt IndexerLambda.Arn
                                    - !GetAtt RebuildLambda.Arn
                                    - !GetAtt SearchLambda.Arn
                            -
                                Effect: Allow
                                Action:
                                    - logs:CreateLogDelivery
                                    - logs:GetLogDelivery
                                    - logs:UpdateLogDelivery
                                    - logs:DeleteLogDelivery
                                    - logs:ListLogDeliveries
                                    - logs:PutLogEvents
                                    - logs:PutResourcePolicy
                                    - logs:DescribeResourcePolicies
                                    - logs:DescribeLogGroups
                                Resource: "*"
                            -
                                Effect: Allow
                                Action:
                                    - xray:PutTraceSegments
                                    - xray:PutTelemetryRecords
                                    - xray:GetSamplingRules
                                    - xray:GetSamplingTargets
                                Resource: "*"

    ################################################################################
    # Step Functions State Machines
    ################################################################################
    HybridSearchIndexSFN:
        Type: AWS::StepFunctions::StateMachine
        Properties:
            StateMachineName: !Sub
                - ${ResourcePrefix}-${name}
                - name: !FindInMap [Workflow, HybridSearchIndexer, Name]
            RoleArn: !GetAtt HybridSearchSFNRole.Arn
            LoggingConfiguration:
                Destinations:
                    -
                        CloudWatchLogsLogGroup:
                            LogGroupArn: !GetAtt IndexSFNLogGroup.Arn
                IncludeExecutionData: true
                Level: ALL
            TracingConfiguration:
                Enabled: true
            DefinitionSubstitutions:
                IndexerLambdaArn: !GetAtt IndexerLambda.Arn
            DefinitionString: |-
                {
                    "Comment": "Hybrid search index workflow (README.md Design record). Prepare documents (contracts -> row groups, lock-free), then per-physical-table Map: acquire THAT table's lock (waitForTaskToken) -> index -> release. Writers to different tables never contend.",
                    "StartAt": "Set input defaults",
                    "States": {
                        "Set input defaults": {
                            "Type": "Pass",
                            "Comment": "Merge optional fields with defaults so downstream JSONPath never references absent keys. Exactly one of documents | documents_s3uri must be non-empty (validated in StatePrepareDocuments).",
                            "Parameters": {
                                "merged.$": "States.JsonMerge(States.StringToJson('{\"collection_id\":\"\",\"documents\":[],\"documents_s3uri\":\"\",\"asset_metadata\":{},\"workflow_config_uri\":\"\"}'), $$.Execution.Input, false)"
                            },
                            "ResultPath": "$.input",
                            "Next": "Prepare documents"
                        },
                        "Prepare documents": {
                            "Type": "Task",
                            "Resource": "arn:aws:states:::lambda:invoke",
                            "OutputPath": "$.Payload",
                            "Parameters": {
                                "FunctionName": "${IndexerLambdaArn}",
                                "Payload": {
                                    "operation": "StatePrepareDocuments",
                                    "request_id.$": "$$.Execution.Name",
                                    "collection_id.$": "$.input.merged.collection_id",
                                    "documents.$": "$.input.merged.documents",
                                    "documents_s3uri.$": "$.input.merged.documents_s3uri",
                                    "asset_metadata.$": "$.input.merged.asset_metadata",
                                    "workflow_config_uri.$": "$.input.merged.workflow_config_uri"
                                }
                            },
                            "Retry": [
                                {
                                    "ErrorEquals": [
                                        "LambdaResourceTimeoutException"
                                    ],
                                    "IntervalSeconds": 2,
                                    "MaxAttempts": 6,
                                    "BackoffRate": 1.0
                                },
                                {
                                    "ErrorEquals": [
                                        "ThrottlingException",
                                        "ServiceUnavailableException",
                                        "InternalServerException",
                                        "ModelTimeoutException",
                                        "ModelNotReadyException",
                                        "ServiceQuotaExceededException"
                                    ],
                                    "IntervalSeconds": 5,
                                    "MaxAttempts": 4,
                                    "BackoffRate": 2
                                },
                                {
                                    "ErrorEquals": [
                                        "Lambda.ServiceException",
                                        "Lambda.AWSLambdaException",
                                        "Lambda.SdkClientException",
                                        "Lambda.TooManyRequestsException"
                                    ],
                                    "IntervalSeconds": 2,
                                    "MaxAttempts": 3,
                                    "BackoffRate": 1.5
                                },
                                {
                                    "ErrorEquals": [
                                        "Sandbox.Timedout",
                                        "Lambda.Unknown"
                                    ],
                                    "IntervalSeconds": 2,
                                    "MaxAttempts": 2,
                                    "BackoffRate": 2
                                }
                            ],
                            "Next": "(Map) Index tables"
                        },
                        "(Map) Index tables": {
                            "Type": "Map",
                            "MaxConcurrency": 8,
                            "ItemsPath": "$.map_items",
                            "ItemSelector": {
                                "item.$": "$$.Map.Item.Value",
                                "execution_arn.$": "$$.Execution.Id"
                            },
                            "ItemProcessor": {
                                "ProcessorConfig": {
                                    "Mode": "INLINE"
                                },
                                "StartAt": "Acquire table lock",
                                "States": {
                                    "Acquire table lock": {
                                        "Type": "Task",
                                        "Resource": "arn:aws:states:::lambda:invoke.waitForTaskToken",
                                        "ResultPath": "$.lock_result",
                                        "Parameters": {
                                            "FunctionName": "${IndexerLambdaArn}",
                                            "Payload": {
                                                "operation": "StateAcquireLock",
                                                "index_key.$": "$.item.index_key",
                                                "execution_arn.$": "$.execution_arn",
                                                "task_token.$": "$$.Task.Token",
                                                "uuid.$": "$.item.index_key"
                                            }
                                        },
                                        "HeartbeatSeconds": 21600,
                                        "Retry": [
                                            {
                                                "ErrorEquals": [
                                                    "Lambda.ServiceException",
                                                    "Lambda.AWSLambdaException",
                                                    "Lambda.SdkClientException",
                                                    "Lambda.TooManyRequestsException"
                                                ],
                                                "IntervalSeconds": 2,
                                                "MaxAttempts": 3,
                                                "BackoffRate": 1.5
                                            }
                                        ],
                                        "Next": "Index table"
                                    },
                                    "Index table": {
                                        "Type": "Task",
                                        "Resource": "arn:aws:states:::lambda:invoke",
                                        "ResultPath": "$.index_result",
                                        "ResultSelector": {
                                            "indexed.$": "$.Payload.indexed"
                                        },
                                        "Parameters": {
                                            "FunctionName": "${IndexerLambdaArn}",
                                            "Payload": {
                                                "operation": "StateIndexDocuments",
                                                "index_key.$": "$.item.index_key",
                                                "rows_s3_key.$": "$.item.rows_s3_key",
                                                "collection_id.$": "$.item.collection_id"
                                            }
                                        },
                                        "Retry": [
                                            {
                                                "ErrorEquals": [
                                                    "Lambda.ServiceException",
                                                    "Lambda.AWSLambdaException",
                                                    "Lambda.SdkClientException",
                                                    "Lambda.TooManyRequestsException"
                                                ],
                                                "IntervalSeconds": 2,
                                                "MaxAttempts": 3,
                                                "BackoffRate": 1.5
                                            },
                                            {
                                                "ErrorEquals": [
                                                    "States.TaskFailed",
                                                    "States.Timeout"
                                                ],
                                                "IntervalSeconds": 15,
                                                "MaxAttempts": 2,
                                                "BackoffRate": 2.0
                                            }
                                        ],
                                        "Catch": [
                                            {
                                                "ErrorEquals": [
                                                    "States.ALL"
                                                ],
                                                "ResultPath": "$.index_error",
                                                "Next": "Release table lock (on error)"
                                            }
                                        ],
                                        "Next": "Release table lock"
                                    },
                                    "Release table lock": {
                                        "Type": "Task",
                                        "Resource": "arn:aws:states:::lambda:invoke",
                                        "ResultPath": null,
                                        "Parameters": {
                                            "FunctionName": "${IndexerLambdaArn}",
                                            "Payload": {
                                                "operation": "StateReleaseLock",
                                                "index_key.$": "$.item.index_key",
                                                "execution_arn.$": "$.execution_arn"
                                            }
                                        },
                                        "Retry": [
                                            {
                                                "ErrorEquals": [
                                                    "Lambda.ServiceException",
                                                    "Lambda.AWSLambdaException",
                                                    "Lambda.SdkClientException",
                                                    "Lambda.TooManyRequestsException"
                                                ],
                                                "IntervalSeconds": 2,
                                                "MaxAttempts": 3,
                                                "BackoffRate": 1.5
                                            }
                                        ],
                                        "End": true
                                    },
                                    "Release table lock (on error)": {
                                        "Type": "Task",
                                        "Resource": "arn:aws:states:::lambda:invoke",
                                        "ResultPath": null,
                                        "Parameters": {
                                            "FunctionName": "${IndexerLambdaArn}",
                                            "Payload": {
                                                "operation": "StateReleaseLock",
                                                "index_key.$": "$.item.index_key",
                                                "execution_arn.$": "$.execution_arn"
                                            }
                                        },
                                        "Retry": [
                                            {
                                                "ErrorEquals": [
                                                    "Lambda.ServiceException",
                                                    "Lambda.AWSLambdaException",
                                                    "Lambda.SdkClientException",
                                                    "Lambda.TooManyRequestsException"
                                                ],
                                                "IntervalSeconds": 2,
                                                "MaxAttempts": 3,
                                                "BackoffRate": 1.5
                                            }
                                        ],
                                        "Next": "Fail table"
                                    },
                                    "Fail table": {
                                        "Type": "Fail",
                                        "Error": "IndexTableFailed",
                                        "Cause": "StateIndexDocuments failed after releasing the table lock"
                                    }
                                }
                            },
                            "ResultPath": "$.index_results",
                            "End": true
                        }
                    }
                }

    HybridSearchRebuildSFN:
        Type: AWS::StepFunctions::StateMachine
        Properties:
            StateMachineName: !Sub
                - ${ResourcePrefix}-${name}
                - name: !FindInMap [Workflow, HybridSearchRebuild, Name]
            RoleArn: !GetAtt HybridSearchSFNRole.Arn
            LoggingConfiguration:
                Destinations:
                    -
                        CloudWatchLogsLogGroup:
                            LogGroupArn: !GetAtt RebuildSFNLogGroup.Arn
                IncludeExecutionData: true
                Level: ALL
            TracingConfiguration:
                Enabled: true
            DefinitionSubstitutions:
                RebuildLambdaArn: !GetAtt RebuildLambda.Arn
            DefinitionString: |-
                {
                    "Comment": "Hybrid search ANN rebuild (README.md Design record). Per-physical-table Map: acquire THAT table's lock (LockHeldError retry, never queues) -> optimize + IVF_PQ rebuild -> release. Rebuilds across collections/tables run concurrently.",
                    "StartAt": "Get indices to rebuild",
                    "States": {
                        "Get indices to rebuild": {
                            "Type": "Task",
                            "Resource": "arn:aws:states:::lambda:invoke",
                            "ResultSelector": {
                                "index_keys.$": "$.Payload"
                            },
                            "ResultPath": "$",
                            "Parameters": {
                                "FunctionName": "${RebuildLambdaArn}",
                                "Payload": {
                                    "operation": "StateGetIndicesToRebuild",
                                    "force.$": "$.force"
                                }
                            },
                            "Retry": [
                                {
                                    "ErrorEquals": [
                                        "Lambda.ServiceException",
                                        "Lambda.AWSLambdaException",
                                        "Lambda.SdkClientException",
                                        "Lambda.TooManyRequestsException"
                                    ],
                                    "IntervalSeconds": 2,
                                    "MaxAttempts": 3,
                                    "BackoffRate": 1.5
                                }
                            ],
                            "Next": "(Map) Rebuild tables"
                        },
                        "(Map) Rebuild tables": {
                            "Type": "Map",
                            "MaxConcurrency": 8,
                            "ItemsPath": "$.index_keys",
                            "ItemSelector": {
                                "index_key.$": "$$.Map.Item.Value",
                                "force.$": "$$.Execution.Input.force",
                                "execution_arn.$": "$$.Execution.Id"
                            },
                            "ItemProcessor": {
                                "ProcessorConfig": {
                                    "Mode": "INLINE"
                                },
                                "StartAt": "Acquire table lock",
                                "States": {
                                    "Acquire table lock": {
                                        "Type": "Task",
                                        "Resource": "arn:aws:states:::lambda:invoke",
                                        "ResultPath": null,
                                        "Parameters": {
                                            "FunctionName": "${RebuildLambdaArn}",
                                            "Payload": {
                                                "operation": "StateAcquireLock",
                                                "index_key.$": "$.index_key",
                                                "execution_arn.$": "$.execution_arn"
                                            }
                                        },
                                        "Retry": [
                                            {
                                                "ErrorEquals": [
                                                    "LockHeldError",
                                                    "RuntimeError"
                                                ],
                                                "IntervalSeconds": 60,
                                                "MaxAttempts": 10,
                                                "BackoffRate": 1
                                            },
                                            {
                                                "ErrorEquals": [
                                                    "Lambda.ServiceException",
                                                    "Lambda.AWSLambdaException",
                                                    "Lambda.SdkClientException",
                                                    "Lambda.TooManyRequestsException"
                                                ],
                                                "IntervalSeconds": 5,
                                                "MaxAttempts": 3,
                                                "BackoffRate": 1.5
                                            }
                                        ],
                                        "Next": "Rebuild table"
                                    },
                                    "Rebuild table": {
                                        "Type": "Task",
                                        "Resource": "arn:aws:states:::lambda:invoke",
                                        "ResultPath": "$.rebuild_result",
                                        "ResultSelector": {
                                            "skipped.$": "$.Payload.skipped"
                                        },
                                        "Parameters": {
                                            "FunctionName": "${RebuildLambdaArn}",
                                            "Payload": {
                                                "operation": "StateRebuildIndex",
                                                "index_key.$": "$.index_key",
                                                "force.$": "$.force"
                                            }
                                        },
                                        "Retry": [
                                            {
                                                "ErrorEquals": [
                                                    "Lambda.ServiceException",
                                                    "Lambda.AWSLambdaException",
                                                    "Lambda.SdkClientException",
                                                    "Lambda.TooManyRequestsException"
                                                ],
                                                "IntervalSeconds": 5,
                                                "MaxAttempts": 3,
                                                "BackoffRate": 1.5
                                            }
                                        ],
                                        "Catch": [
                                            {
                                                "ErrorEquals": [
                                                    "States.ALL"
                                                ],
                                                "ResultPath": "$.rebuild_error",
                                                "Next": "Release table lock (on error)"
                                            }
                                        ],
                                        "Next": "Release table lock"
                                    },
                                    "Release table lock": {
                                        "Type": "Task",
                                        "Resource": "arn:aws:states:::lambda:invoke",
                                        "ResultPath": null,
                                        "Parameters": {
                                            "FunctionName": "${RebuildLambdaArn}",
                                            "Payload": {
                                                "operation": "StateReleaseLock",
                                                "index_key.$": "$.index_key",
                                                "execution_arn.$": "$.execution_arn"
                                            }
                                        },
                                        "Retry": [
                                            {
                                                "ErrorEquals": [
                                                    "Lambda.ServiceException",
                                                    "Lambda.AWSLambdaException",
                                                    "Lambda.SdkClientException",
                                                    "Lambda.TooManyRequestsException"
                                                ],
                                                "IntervalSeconds": 2,
                                                "MaxAttempts": 3,
                                                "BackoffRate": 1.5
                                            }
                                        ],
                                        "End": true
                                    },
                                    "Release table lock (on error)": {
                                        "Type": "Task",
                                        "Resource": "arn:aws:states:::lambda:invoke",
                                        "ResultPath": null,
                                        "Parameters": {
                                            "FunctionName": "${RebuildLambdaArn}",
                                            "Payload": {
                                                "operation": "StateReleaseLock",
                                                "index_key.$": "$.index_key",
                                                "execution_arn.$": "$.execution_arn"
                                            }
                                        },
                                        "Retry": [
                                            {
                                                "ErrorEquals": [
                                                    "Lambda.ServiceException",
                                                    "Lambda.AWSLambdaException",
                                                    "Lambda.SdkClientException",
                                                    "Lambda.TooManyRequestsException"
                                                ],
                                                "IntervalSeconds": 2,
                                                "MaxAttempts": 3,
                                                "BackoffRate": 1.5
                                            }
                                        ],
                                        "Next": "Fail table"
                                    },
                                    "Fail table": {
                                        "Type": "Fail",
                                        "Error": "RebuildTableFailed",
                                        "Cause": "StateRebuildIndex failed after releasing the table lock"
                                    }
                                }
                            },
                            "ResultPath": "$.rebuild_results",
                            "End": true
                        }
                    }
                }


    ################################################################################
    # Step Functions — Search SFN
    ################################################################################
    HybridSearchSearchSFN:
        Type: AWS::StepFunctions::StateMachine
        Properties:
            StateMachineName: !Sub
                - ${ResourcePrefix}-${name}
                - name: !FindInMap [Workflow, HybridSearchSearch, Name]
            RoleArn: !GetAtt HybridSearchSFNRole.Arn
            LoggingConfiguration:
                Destinations:
                    -
                        CloudWatchLogsLogGroup:
                            LogGroupArn: !GetAtt SearchSFNLogGroup.Arn
                IncludeExecutionData: true
                Level: ALL
            TracingConfiguration:
                Enabled: true
            DefinitionSubstitutions:
                SearchLambdaArn: !GetAtt SearchLambda.Arn
            DefinitionString: |-
                {
                    "Comment": "Hybrid search workflow. Decomposes query (operator parsing + SLM entity extraction + embedding), fans out per-index searches in parallel, reranks with weights from decomposition.",
                    "StartAt": "Set input defaults",
                    "States": {
                        "Set input defaults": {
                            "Type": "Pass",
                            "Comment": "Merge optional fields (search_term, search_image_s3uri) with empty-string defaults so downstream states never reference absent keys.",
                            "Parameters": {
                                "merged.$": "States.JsonMerge(States.StringToJson('{\"collection_id\":\"\",\"workflow_config_uri\":\"\",\"search_term\":\"\",\"search_image_s3uri\":\"\",\"k\":10}'), $$.Execution.Input, false)"
                            },
                            "ResultPath": "$.input",
                            "Next": "Decompose search request"
                        },
                        "Decompose search request": {
                            "Type": "Task",
                            "Resource": "arn:aws:states:::lambda:invoke",
                            "ResultSelector": {
                                "decomposition.$": "$.Payload"
                            },
                            "ResultPath": "$.decompose_result",
                            "Parameters": {
                                "FunctionName": "${SearchLambdaArn}",
                                "Payload": {
                                    "operation": "StateDecomposeSearchRequest",
                                    "request_id.$": "$$.Execution.Name",
                                    "workflow_config_uri.$": "$.input.merged.workflow_config_uri",
                                    "search_term.$": "$.input.merged.search_term",
                                    "search_image_s3uri.$": "$.input.merged.search_image_s3uri",
                                    "k.$": "$.input.merged.k",
                                    "collection_id.$": "$.input.merged.collection_id"
                                }
                            },
                            "Retry": [
                                {
                                    "ErrorEquals": [
                                        "Lambda.ServiceException",
                                        "Lambda.AWSLambdaException",
                                        "Lambda.SdkClientException",
                                        "Lambda.TooManyRequestsException"
                                    ],
                                    "IntervalSeconds": 2,
                                    "MaxAttempts": 3,
                                    "BackoffRate": 1.5
                                }
                            ],
                            "Next": "(Map) Search indices"
                        },
                        "(Map) Search indices": {
                            "Type": "Map",
                            "MaxConcurrency": 0,
                            "ItemsPath": "$.decompose_result.decomposition.queries",
                            "ItemSelector": {
                                "operation": "StateSearchIndex",
                                "query.$": "$$.Map.Item.Value"
                            },
                            "ItemProcessor": {
                                "ProcessorConfig": {
                                    "Mode": "INLINE"
                                },
                                "StartAt": "Search index",
                                "States": {
                                    "Search index": {
                                        "Type": "Task",
                                        "Resource": "arn:aws:states:::lambda:invoke",
                                        "OutputPath": "$.Payload",
                                        "Parameters": {
                                            "FunctionName": "${SearchLambdaArn}",
                                            "Payload.$": "$"
                                        },
                                        "Retry": [
                                            {
                                                "ErrorEquals": [
                                                    "Lambda.ServiceException",
                                                    "Lambda.AWSLambdaException",
                                                    "Lambda.SdkClientException",
                                                    "Lambda.TooManyRequestsException"
                                                ],
                                                "IntervalSeconds": 1,
                                                "MaxAttempts": 2,
                                                "BackoffRate": 1
                                            }
                                        ],
                                        "End": true
                                    }
                                }
                            },
                            "ResultPath": "$.search_results",
                            "Next": "Rerank results"
                        },
                        "Rerank results": {
                            "Type": "Task",
                            "Resource": "arn:aws:states:::lambda:invoke",
                            "OutputPath": "$.Payload",
                            "Parameters": {
                                "FunctionName": "${SearchLambdaArn}",
                                "Payload": {
                                    "operation": "StateRerankResults",
                                    "search_term.$": "$.decompose_result.decomposition.original_query",
                                    "k.$": "$.input.merged.k",
                                    "decomposition.$": "$.decompose_result.decomposition",
                                    "search_results.$": "$.search_results"
                                }
                            },
                            "Retry": [
                                {
                                    "ErrorEquals": [
                                        "Lambda.ServiceException",
                                        "Lambda.AWSLambdaException",
                                        "Lambda.SdkClientException",
                                        "Lambda.TooManyRequestsException"
                                    ],
                                    "IntervalSeconds": 2,
                                    "MaxAttempts": 3,
                                    "BackoffRate": 1.5
                                }
                            ],
                            "End": true
                        }
                    }
                }


    ################################################################################
    # EventBridge — daily ANN rebuild at 02:00 UTC
    ################################################################################
    RebuildScheduleRole:
        Type: AWS::IAM::Role
        Properties:
            Path: !Sub /${ResourcePrefix}/
            AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                    -
                        Effect: Allow
                        Principal:
                            Service: events.amazonaws.com
                        Action: sts:AssumeRole
            Policies:
                -
                    PolicyName: !Sub ${ResourcePrefix}HybridSearchRebuildSchedulePolicy
                    PolicyDocument:
                        Version: "2012-10-17"
                        Statement:
                            -
                                Effect: Allow
                                Action: states:StartExecution
                                Resource: !GetAtt HybridSearchRebuildSFN.Arn

    DailyRebuildRule:
        Type: AWS::Events::Rule
        Properties:
            Name: !Sub ${ResourcePrefix}-hybrid-search-daily-rebuild
            Description: Trigger hybrid search ANN index rebuild daily at 02:00 UTC
            ScheduleExpression: "cron(0 2 * * ? *)"
            State: ENABLED
            Targets:
                -
                    Id: HybridSearchRebuildSFN
                    Arn: !GetAtt HybridSearchRebuildSFN.Arn
                    RoleArn: !GetAtt RebuildScheduleRole.Arn
                    Input: '{"force": false}'

    ################################################################################
    # EventBridge — SFN execution failure handler
    # Triggers HandleExecutionFailureLambda on FAILED, ABORTED, or TIMED_OUT for
    # either HybridSearchIndexSFN or HybridSearchRebuildSFN.
    # The Lambda releases the distributed lock if the failed execution owns it.
    ################################################################################
    SFNFailureRule:
        Type: AWS::Events::Rule
        Properties:
            Name: !Sub ${ResourcePrefix}-hybrid-search-sfn-failure
            Description: Release LanceDB lock when IndexSFN or RebuildSFN fails, aborts, or times out
            EventPattern:
                source:
                    - aws.states
                detail-type:
                    - Step Functions Execution Status Change
                detail:
                    status:
                        - FAILED
                        - ABORTED
                        - TIMED_OUT
                    stateMachineArn:
                        - !GetAtt HybridSearchIndexSFN.Arn
                        - !GetAtt HybridSearchRebuildSFN.Arn
                        - !GetAtt HybridSearchSearchSFN.Arn
            State: ENABLED
            Targets:
                -
                    Id: HandleExecutionFailureLambda
                    Arn: !GetAtt HandleExecutionFailureLambda.Arn

    SFNFailureRuleLambdaPermission:
        Type: AWS::Lambda::Permission
        Properties:
            FunctionName: !GetAtt HandleExecutionFailureLambda.Arn
            Action: lambda:InvokeFunction
            Principal: events.amazonaws.com
            SourceArn: !GetAtt SFNFailureRule.Arn

    ################################################################################
    # Gateway tool Lambdas (Phase 2) — NORMAL and ADMIN targets.
    # The admin/normal split is an IAM boundary: two Lambdas, two roles, two
    # AgentCore Gateway targets. Normal agents' gateway cannot invoke admin.
    ################################################################################
    GatewayToolLambdaRole:
        Type: AWS::IAM::Role
        Properties:
            Path: !Sub /${ResourcePrefix}/
            AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                    -
                        Effect: Allow
                        Principal:
                            Service: lambda.amazonaws.com
                        Action: sts:AssumeRole
            Policies:
                -
                    PolicyName: GatewayToolPolicy
                    PolicyDocument:
                        Version: "2012-10-17"
                        Statement:
                            # Scoped to the declared group; no logs:CreateLogGroup.
                            -
                                Effect: Allow
                                Action:
                                    - logs:CreateLogStream
                                    - logs:PutLogEvents
                                Resource: !GetAtt GatewayToolLambdaLogGroup.Arn
                            # Start + poll the Index and Search SFNs
                            -
                                Effect: Allow
                                Action:
                                    - states:StartExecution
                                Resource:
                                    - !GetAtt HybridSearchIndexSFN.Arn
                                    - !GetAtt HybridSearchSearchSFN.Arn
                            -
                                Effect: Allow
                                Action:
                                    - states:DescribeExecution
                                Resource:
                                    - !Sub
                                        - arn:aws:states:${AWS::Region}:${AWS::AccountId}:execution:${name}:*
                                        - name: !Select [6, !Split [":", !GetAtt HybridSearchIndexSFN.Arn]]
                                    - !Sub
                                        - arn:aws:states:${AWS::Region}:${AWS::AccountId}:execution:${name}:*
                                        - name: !Select [6, !Split [":", !GetAtt HybridSearchSearchSFN.Arn]]
                            # create_collection (conditional put) + list_collections
                            -
                                Effect: Allow
                                Action:
                                    - dynamodb:GetItem
                                    - dynamodb:PutItem
                                    - dynamodb:Scan
                                Resource: !GetAtt LanceDBCollectionTable.Arn
                            # list_collections index summary (state records)
                            -
                                Effect: Allow
                                Action: dynamodb:Query
                                Resource: !GetAtt LanceDBIndexStateTable.Arn

    GatewayToolLambda:
        Type: AWS::Lambda::Function
        DependsOn: GatewayToolLambdaLogGroup
        Metadata:
            cfn_nag:
                rules_to_suppress:
                    - { id: W89, reason: Not using VPC }
                    - { id: W92, reason: No reserved concurrency required }
        Properties:
            FunctionName: !Sub ${ResourcePrefix}-hybrid-search-gateway-tool
            Description: AgentCore Gateway dispatcher for hybrid-search (normal callers)
            Runtime: python3.13
            Architectures: [arm64]
            Handler: lambda_function.lambda_handler
            MemorySize: 256
            Timeout: 90
            Role: !GetAtt GatewayToolLambdaRole.Arn
            LoggingConfig:
                LogGroup: !Ref GatewayToolLambdaLogGroup
            Code:
                S3Bucket: !FindInMap [GatewayTool, Lambda, Bucket]
                S3Key: !Sub
                    - ${keyPrefix}/${package}
                    - keyPrefix: !FindInMap [GatewayTool, Lambda, KeyPrefix]
                      package: !FindInMap [GatewayTool, Lambda, Package]
            Environment:
                Variables:
                    INDEX_STATE_MACHINE_ARN: !GetAtt HybridSearchIndexSFN.Arn
                    SEARCH_STATE_MACHINE_ARN: !GetAtt HybridSearchSearchSFN.Arn
                    COLLECTION_TABLE: !Ref LanceDBCollectionTable
                    INDEX_STATE_TABLE: !Ref LanceDBIndexStateTable
                    PROXY_BUCKET: !Ref ProxyBucket
                    TOOL_VERSION: "%%VERSION%%"

    GatewayToolLambdaPermission:
        Type: AWS::Lambda::Permission
        Properties:
            FunctionName: !GetAtt GatewayToolLambda.Arn
            Action: lambda:InvokeFunction
            Principal: bedrock-agentcore.amazonaws.com
            # Confused-deputy guard: without this, ANY account's AgentCore
            # gateway may invoke the function (CSR scan 2026-10-08).
            SourceAccount: !Ref AWS::AccountId

    AdminToolLambdaRole:
        Type: AWS::IAM::Role
        Properties:
            Path: !Sub /${ResourcePrefix}/
            AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                    -
                        Effect: Allow
                        Principal:
                            Service: lambda.amazonaws.com
                        Action: sts:AssumeRole
            Policies:
                -
                    PolicyName: AdminToolPolicy
                    PolicyDocument:
                        Version: "2012-10-17"
                        Statement:
                            # Scoped to the declared group; no logs:CreateLogGroup.
                            -
                                Effect: Allow
                                Action:
                                    - logs:CreateLogStream
                                    - logs:PutLogEvents
                                Resource: !GetAtt AdminToolLambdaLogGroup.Arn
                            # configure_search_backend + delete_collection registry ops
                            -
                                Effect: Allow
                                Action:
                                    - dynamodb:GetItem
                                    - dynamodb:UpdateItem
                                    - dynamodb:DeleteItem
                                Resource: !GetAtt LanceDBCollectionTable.Arn
                            # delete_collection sweep: state/lock/pending/asset records
                            -
                                Effect: Allow
                                Action:
                                    - dynamodb:Query
                                    - dynamodb:DeleteItem
                                Resource: !GetAtt LanceDBIndexStateTable.Arn
                            # delete_collection sweep: dedup records
                            -
                                Effect: Allow
                                Action:
                                    - dynamodb:Scan
                                    - dynamodb:BatchWriteItem
                                Resource: !GetAtt LanceDBDedupTable.Arn
                            # delete_collection sweep: LanceDB tables + staged rows
                            -
                                Effect: Allow
                                Action: s3:ListBucket
                                Resource: !Sub arn:aws:s3:::${ProxyBucket}
                            -
                                Effect: Allow
                                Action:
                                    - s3:GetObject
                                    - s3:DeleteObject
                                Resource:
                                    - !Sub arn:aws:s3:::${ProxyBucket}/_lancedb_index/*
                                    - !Sub arn:aws:s3:::${ProxyBucket}/_indexing/*
                            # delete_collection sweep: S3 Vectors indexes
                            -
                                Effect: Allow
                                Action:
                                    - s3vectors:ListIndexes
                                    - s3vectors:DeleteIndex
                                Resource:
                                    - !GetAtt HybridSearchVectorBucket.VectorBucketArn
                                    - !Sub ${HybridSearchVectorBucket.VectorBucketArn}/index/*

    AdminToolLambda:
        Type: AWS::Lambda::Function
        DependsOn: AdminToolLambdaLogGroup
        Metadata:
            cfn_nag:
                rules_to_suppress:
                    - { id: W89, reason: Not using VPC }
                    - { id: W92, reason: No reserved concurrency required }
        Properties:
            FunctionName: !Sub ${ResourcePrefix}-hybrid-search-admin-tool
            Description: AgentCore Gateway dispatcher for hybrid-search ADMIN tools
            Runtime: python3.13
            Architectures: [arm64]
            Handler: admin_function.lambda_handler
            MemorySize: 256
            Timeout: 300
            Role: !GetAtt AdminToolLambdaRole.Arn
            LoggingConfig:
                LogGroup: !Ref AdminToolLambdaLogGroup
            Code:
                S3Bucket: !FindInMap [GatewayTool, Lambda, Bucket]
                S3Key: !Sub
                    - ${keyPrefix}/${package}
                    - keyPrefix: !FindInMap [GatewayTool, Lambda, KeyPrefix]
                      package: !FindInMap [GatewayTool, Lambda, Package]
            Environment:
                Variables:
                    COLLECTION_TABLE: !Ref LanceDBCollectionTable
                    INDEX_STATE_TABLE: !Ref LanceDBIndexStateTable
                    DEDUP_TABLE: !Ref LanceDBDedupTable
                    PROXY_BUCKET: !Ref ProxyBucket
                    VECTOR_BUCKET: !Select [1, !Split ["bucket/", !GetAtt HybridSearchVectorBucket.VectorBucketArn]]
                    TOOL_VERSION: "%%VERSION%%"

    AdminToolLambdaPermission:
        Type: AWS::Lambda::Permission
        Properties:
            FunctionName: !GetAtt AdminToolLambda.Arn
            Action: lambda:InvokeFunction
            Principal: bedrock-agentcore.amazonaws.com
            # Confused-deputy guard: without this, ANY account's AgentCore
            # gateway may invoke the function (CSR scan 2026-10-08).
            SourceAccount: !Ref AWS::AccountId


Outputs:
    ImageUri:
        Description: ECR URI of the container image
        Value: !Sub
            - ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${repositoryName}:${imageTag}
            - repositoryName: !FindInMap [ECR, Repository, Name]
              imageTag: !FindInMap [ECR, Repository, ImageTag]
    ECRRepositoryArn:
        Description: ARN of the ECR repository
        Value: !Sub
            - arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${repoName}
            - repoName: !FindInMap [ECR, Repository, Name]
    IndexSFNArn:
        Description: ARN of the hybrid search index state machine
        Value: !GetAtt HybridSearchIndexSFN.Arn
    RebuildSFNArn:
        Description: ARN of the hybrid search rebuild state machine
        Value: !GetAtt HybridSearchRebuildSFN.Arn
    SearchSFNArn:
        Description: ARN of the hybrid search search state machine
        Value: !GetAtt HybridSearchSearchSFN.Arn
    SearchHistoryDDBTableName:
        Description: Name of the LanceDBSearchHistory DynamoDB table
        Value: !Ref LanceDBSearchHistoryTable
    SearchLambdaArn:
        Description: ARN of the search Lambda function (invoked synchronously by API)
        Value: !GetAtt SearchLambda.Arn
    IndexStateDDBTableName:
        Description: Name of the LanceDBIndexState DynamoDB table
        Value: !Ref LanceDBIndexStateTable
    DedupDDBTableName:
        Description: Name of the LanceDBDedupState DynamoDB table
        Value: !Ref LanceDBDedupTable
    HandleExecutionFailureLambdaArn:
        Description: ARN of the EventBridge failure handler Lambda
        Value: !GetAtt HandleExecutionFailureLambda.Arn
    CollectionDDBTableName:
        Description: Name of the LanceDBCollections DynamoDB table
        Value: !Ref LanceDBCollectionTable
    GatewayToolLambdaArn:
        Description: Pass as HybridSearchToolLambdaArn when deploying media-toolkit-gateway
        Value: !GetAtt GatewayToolLambda.Arn
    AdminToolLambdaArn:
        Description: Pass as HybridSearchAdminToolLambdaArn when deploying media-toolkit-gateway (admin target)
        Value: !GetAtt AdminToolLambda.Arn
    VectorBucketName:
        Description: S3 Vectors bucket (one per deployment; indexes created at runtime)
        # Sliced from the ARN, not re-composed with !Sub: VectorBucketName is not
        # a readOnlyProperty on AWS::S3Vectors::VectorBucket, so it is not
        # GetAtt-able, and !Ref returns the ARN. This keeps ONE definition of the
        # name in the template (the resource's own Properties).
        Value: !Select [1, !Split ["bucket/", !GetAtt HybridSearchVectorBucket.VectorBucketArn]]
    VectorBucketArn:
        Description: ARN of the S3 Vectors bucket
        Value: !GetAtt HybridSearchVectorBucket.VectorBucketArn
