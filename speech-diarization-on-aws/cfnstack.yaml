Outputs:

    IngestBucketReadRoleArns:
        Description: >
            Runtime role ARNs that read the Ingest bucket (comma-separated) —
            input for the ingest bucket owner's bucket policy. Read-only.
        Value: !GetAtt SpeechDiarizationRole.Arn
    ImageUri:
        Description: ECR URI of the container image
        Value: !Sub
            - ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${repositoryName}:${imageTag}
            - repositoryName: !FindInMap [ECR, Repository, Name]
              imageTag: !FindInMap [ECR, Repository, ImageTag]
    ECRRepositoryArn:
        Description: ARN of the ECR repository
        Value: !Sub
            - arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${repoName}
            - repoName: !FindInMap [ECR, Repository, Name]
    StateMachineArn:
        Description: ARN of the speech diarization state machine
        Value: !GetAtt SpeechDiarizationStateMachine.Arn
    StateMachineName:
        Description: Name of the speech diarization state machine
        Value: !GetAtt SpeechDiarizationStateMachine.Name
    GatewayToolLambdaArn:
        Description: >
            ARN of the AgentCore Gateway tool Lambda.
            Pass this as SpeechDiarizationToolLambdaArn when deploying m2c-workflow-agent-tools/cfnstack.yaml.
        Value: !GetAtt SpeechDiarizationGatewayToolLambda.Arn
