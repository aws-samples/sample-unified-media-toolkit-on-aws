                - name: !FindInMap [Lambda, Function, Name]
                  core: !FindInMap [Lambda, ThreeCores, Name]
            RetentionInDays: 7

    SpeechDiarization4CoresLogGroup:
        Type: AWS::Logs::LogGroup
        Metadata:
            cfn_nag:
                rules_to_suppress:
                    -
                        id: W84
                        reason: CloudWatch Logs encrypts data at rest by default using an AWS-managed key
        Properties:
            LogGroupName: !Sub
                - /aws/lambda/${ResourcePrefix}-${name}-${core}
                - name: !FindInMap [Lambda, Function, Name]
                  core: !FindInMap [Lambda, FourCores, Name]
            RetentionInDays: 7

    SpeechDiarization5CoresLogGroup:
        Type: AWS::Logs::LogGroup
        Metadata:
            cfn_nag:
                rules_to_suppress:
                    -
                        id: W84
                        reason: CloudWatch Logs encrypts data at rest by default using an AWS-managed key
        Properties:
            LogGroupName: !Sub
                - /aws/lambda/${ResourcePrefix}-${name}-${core}
                - name: !FindInMap [Lambda, Function, Name]
                  core: !FindInMap [Lambda, FiveCores, Name]
            RetentionInDays: 7

    SpeechDiarization6CoresLogGroup:
        Type: AWS::Logs::LogGroup
        Metadata:
            cfn_nag:
                rules_to_suppress:
                    -
                        id: W84
                        reason: CloudWatch Logs encrypts data at rest by default using an AWS-managed key
        Properties:
            LogGroupName: !Sub
