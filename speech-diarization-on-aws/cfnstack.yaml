    ################################################################################
    # Step Functions CloudWatch Log Group
    ################################################################################
    SpeechDiarizationStateMachineLogGroup:
        Type: AWS::Logs::LogGroup
        Metadata:
            cfn_nag:
                rules_to_suppress:
                    -
                        id: W84
                        reason: CloudWatch Logs encrypts data at rest by default using an AWS-managed key
        Properties:
            LogGroupName: !Sub
                - /aws/states/${ResourcePrefix}-${name}
                - name: !FindInMap [Lambda, Function, Name]
            RetentionInDays: 7

    ################################################################################
    # Step Functions Execution Role
    ################################################################################
    SpeechDiarizationStateMachineRole:
        Type: AWS::IAM::Role
        Metadata:
            cfn_nag:
                rules_to_suppress:
                    -
                        id: W11
                        reason: X-ray tracing and CloudWatch log delivery require wildcard resource
                    -
                        id: W76
                        reason: Fine-grained permissions for speech diarization workflow including child media-processing state machine
        Properties:
            Path: !Sub /${ResourcePrefix}/
            AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                    -
                        Effect: Allow
                        Action: sts:AssumeRole
                        Principal:
                            Service: !Sub states.${AWS::Region}.amazonaws.com
            Policies:
                -
                    PolicyName: !Sub ${ResourcePrefix}SpeechDiarizationSFNPolicy
                    PolicyDocument:
                        Version: "2012-10-17"
                        Statement:
                            # Invoke any of the 7 Lambda variants
                            -
                                Effect: Allow
                                Action: lambda:InvokeFunction
                                Resource:
                                    - !GetAtt SpeechDiarizationLambdaHalfCore.Arn
                                    - !GetAtt SpeechDiarizationLambda1Core.Arn
                                    - !GetAtt SpeechDiarizationLambda2Cores.Arn
                                    - !GetAtt SpeechDiarizationLambda3Cores.Arn
                                    - !GetAtt SpeechDiarizationLambda4Cores.Arn
                                    - !GetAtt SpeechDiarizationLambda5Cores.Arn
                                    - !GetAtt SpeechDiarizationLambda6Cores.Arn
                            # Run media processing (2026-09-18): the held state
                            # invokes OUR OWN HalfCore Lambda (covered above),
                            # which submits through MP's gateway — no direct
                            # Start/Stop/Describe on MP's machine and no
                            # EventBridge managed-rule grants anymore
                            # CloudWatch Logs — required for LoggingConfiguration
                            -
                                Effect: Allow
                                Action:
                                    - logs:CreateLogDelivery
                                    - logs:GetLogDelivery
                                    - logs:UpdateLogDelivery
                                    - logs:DeleteLogDelivery
                                    - logs:ListLogDeliveries
                                    - logs:PutLogEvents
                                    - logs:PutResourcePolicy
                                    - logs:DescribeResourcePolicies
                                    - logs:DescribeLogGroups
                                Resource: "*"
                            # X-Ray tracing
                            -
                                Effect: Allow
                                Action:
                                    - xray:PutTraceSegments
                                    - xray:PutTelemetryRecords
                                    - xray:GetSamplingRules
                                    - xray:GetSamplingTargets
                                Resource: "*"

    ################################################################################
    # Step Functions State Machine
    #
    # Definition sourced from definitions.json.
    # ${...} references are resolved by CloudFormation !Sub.
    # $$.Execution.Id is a Step Functions context object — $$ becomes $ after !Sub.
    ################################################################################
    SpeechDiarizationStateMachine:
        Type: AWS::StepFunctions::StateMachine
        Properties:
            StateMachineName: !Sub
                - ${ResourcePrefix}-${name}
                - name: !FindInMap [Lambda, Function, Name]
            RoleArn: !GetAtt SpeechDiarizationStateMachineRole.Arn
            LoggingConfiguration:
                Destinations:
                    -
                        CloudWatchLogsLogGroup:
                            LogGroupArn: !GetAtt SpeechDiarizationStateMachineLogGroup.Arn
                IncludeExecutionData: true
                Level: ALL
            TracingConfiguration:
                Enabled: true
            DefinitionString:
                !Sub |-
                    {
                        "Comment": "Speech to text workflow — sequential pipeline with speech groups, sentence-level speaker embeddings.",
                        "StartAt": "Check and preprocess",
                        "States": {
                            "Check and preprocess": {
                                "Type": "Task",
                                "Resource": "arn:aws:states:::lambda:invoke",
                                "OutputPath": "$.Payload",
                                "Parameters": {
                                    "FunctionName": "${SpeechDiarizationLambda2Cores.Arn}",
                                    "Payload": {
                                        "operation": "StateCheckAndPreprocess",
                                        "uuid.$": "$.uuid",
                                        "input.$": "$.input",
                                        "output.$": "$.output",
                                        "data.$": "$.data"
                                    }
                                },
                                "Retry": [
                                    {
                                        "ErrorEquals": [
                                            "Lambda.ServiceException",
                                            "Lambda.AWSLambdaException",
                                            "Lambda.SdkClientException",
                                            "Lambda.TooManyRequestsException"
                                        ],
                                        "IntervalSeconds": 1,
                                        "MaxAttempts": 2,
                                        "BackoffRate": 1.2
                                    }
                                ],
                                "Next": "Needs conversion?"
                            },
                            "Needs conversion?": {
                                "Type": "Choice",
                                "Choices": [
                                    {
                                        "Variable": "$.data.needs_conversion",
                                        "BooleanEquals": true,
                                        "Next": "Run media processing"
                                    }
                                ],
                                "Default": "Fix chunking for voice activity detection"
                            },
                            "Run media processing": {
                                "Type": "Task",
                                "Comment": "HELD (2026-09-18, the family sibling pattern): submits the conversion request to the media-processing GATEWAY with this state's task token; MP's waker completes it with the submit handle + terminal status AS DATA (never a detonation) \u2014 Extract processed audio enforces SUCCEEDED and derives the wav key from MP's output contract. Idempotent: the token derives from this run's uuid, so a redrive absorbs into the same MP run instead of re-transcoding. Replaces the direct states:startExecution.sync:2 of MP's machine (its internal execution output was our API, no idempotency, extra IAM).",
                                "Resource": "arn:aws:states:::lambda:invoke.waitForTaskToken",
                                "Parameters": {
                                    "FunctionName": "${SpeechDiarizationLambdaHalfCore.Arn}",
                                    "Payload": {
                                        "operation": "StateSubmitMediaProcessing",
                                        "uuid.$": "$.uuid",
                                        "data.$": "$.data",
                                        "mp_gateway_arn": "${MediaProcessingGatewayLambdaArn}",
                                        "task_token.$": "$$.Task.Token"
                                    }
                                },
                                "ResultPath": "$.data.media_processing_output",
                                "TimeoutSeconds": 14400,
                                "Retry": [
                                    {
                                        "ErrorEquals": [
                                            "Lambda.ServiceException",
                                            "Lambda.AWSLambdaException",
                                            "Lambda.SdkClientException",
                                            "Lambda.TooManyRequestsException"
                                        ],
                                        "IntervalSeconds": 5,
                                        "MaxAttempts": 4,
                                        "BackoffRate": 2.0
                                    }
                                ],
                                "Next": "Extract processed audio"
                            },
                            "Extract processed audio": {
                                "Type": "Task",
                                "Resource": "arn:aws:states:::lambda:invoke",
                                "OutputPath": "$.Payload",
                                "Parameters": {
                                    "FunctionName": "${SpeechDiarizationLambdaHalfCore.Arn}",
                                    "Payload": {
                                        "operation": "StateExtractProcessedAudio",
                                        "uuid.$": "$.uuid",
                                        "input.$": "$.input",
                                        "output.$": "$.output",
                                        "data.$": "$.data"
                                    }
                                },
                                "Retry": [
                                    {
                                        "ErrorEquals": [
                                            "Lambda.ServiceException",
                                            "Lambda.AWSLambdaException",
                                            "Lambda.SdkClientException",
                                            "Lambda.TooManyRequestsException"
                                        ],
                                        "IntervalSeconds": 1,
                                        "MaxAttempts": 2,
                                        "BackoffRate": 1.2
                                    }
                                ],
                                "Next": "Fix chunking for voice activity detection"
                            },
                            "Fix chunking for voice activity detection": {
                                "Type": "Task",
                                "Resource": "arn:aws:states:::lambda:invoke",
                                "OutputPath": "$.Payload",
                                "Parameters": {
                                    "FunctionName": "${SpeechDiarizationLambdaHalfCore.Arn}",
                                    "Payload": {
                                        "operation": "StateFixedChunkingForVAD",
                                        "uuid.$": "$.uuid",
                                        "input.$": "$.input",
                                        "output.$": "$.output",
                                        "data.$": "$.data"
                                    }
                                },
                                "Retry": [
                                    {
                                        "ErrorEquals": [
                                            "Lambda.ServiceException",
                                            "Lambda.AWSLambdaException",
                                            "Lambda.SdkClientException",
                                            "Lambda.TooManyRequestsException"
                                        ],
                                        "IntervalSeconds": 1,
                                        "MaxAttempts": 2,
                                        "BackoffRate": 1.2
                                    }
                                ],
                                "Next": "Map VAD processing"
                            },
                            "Map VAD processing": {
                                "Type": "Map",
