    SpeechDiarizationGatewayToolLogGroup:
        Type: AWS::Logs::LogGroup
        Metadata:
            cfn_nag:
                rules_to_suppress:
                    -
                        id: W84
                        reason: CloudWatch Logs encrypts data at rest by default using an AWS-managed key
        Properties:
            LogGroupName: !Sub
                - /aws/lambda/${ResourcePrefix}-${name}-${tool}
                - name: !FindInMap [Lambda, Function, Name]
                  tool: !FindInMap [Lambda, GatewayTool, Name]
            RetentionInDays: 7

    ################################################################################
    # Gateway Tool Lambda IAM Role
    # Separate role: needs only StartExecution + DescribeExecution on this workflow.
    # Does NOT need S3, model downloads, or GetExecutionHistory — those are for the
    # workflow Lambdas, not this thin dispatcher.
    ################################################################################
    SpeechDiarizationGatewayToolRole:
        Type: AWS::IAM::Role
        Properties:
            Path: !Sub /${ResourcePrefix}/
            AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                    -
                        Effect: Allow
                        Principal:
                            Service: lambda.amazonaws.com
                        Action: sts:AssumeRole
            Policies:
                -
                    PolicyName: !Sub ${ResourcePrefix}SpeechDiarizationGatewayToolPolicy
                    PolicyDocument:
                        Version: "2012-10-17"
                        Statement:
                            -
                                Effect: Allow
                                Action:
                                    - logs:CreateLogGroup
                                    - logs:CreateLogStream
                                    - logs:PutLogEvents
                                Resource: !GetAtt SpeechDiarizationGatewayToolLogGroup.Arn
                            # Start a new diarization execution
                            -
                                Effect: Allow
                                Action: states:StartExecution
                                Resource: !GetAtt SpeechDiarizationStateMachine.Arn
                            # Poll and inspect any execution of this state machine.
                            # Both DescribeExecution and GetExecutionHistory operate on
                            # execution ARNs, not the state machine ARN.
                            -
                                Effect: Allow
                                Action:
                                    - states:DescribeExecution
                                    - states:GetExecutionHistory
                                Resource: !Sub
                                    - arn:aws:states:${AWS::Region}:${AWS::AccountId}:execution:${smName}:*
                                    - smName: !GetAtt SpeechDiarizationStateMachine.Name

    ################################################################################
    # Gateway Tool Lambda
    # Pure Python zip — no Docker image needed.  Packaged inline from gateway_tool/.
    ################################################################################
    SpeechDiarizationGatewayToolLambda:
        Type: AWS::Lambda::Function
        DependsOn: ProxyBucketValidator
        Metadata:
            cfn_nag:
                rules_to_suppress:
                    -
                        id: W89
                        reason: Not using VPC
                    -
                        id: W92
                        reason: Single-purpose dispatcher; reserved concurrency unnecessary
        Properties:
            FunctionName: !Sub
                - ${ResourcePrefix}-${name}-${tool}
                - name: !FindInMap [Lambda, Function, Name]
                  tool: !FindInMap [Lambda, GatewayTool, Name]
            Description: !Sub
                - (${ResourcePrefix}) ${desc}
                - desc: !FindInMap [Lambda, GatewayTool, Description]
            Runtime: python3.13
            Architectures:
                - arm64
            Handler: lambda_function.lambda_handler
            Role: !GetAtt SpeechDiarizationGatewayToolRole.Arn
            MemorySize: !FindInMap [Lambda, GatewayTool, Memory]
            Timeout: !FindInMap [Lambda, GatewayTool, Timeout]
            Environment:
                Variables:
                    DIARIZATION_STATE_MACHINE_ARN: !GetAtt SpeechDiarizationStateMachine.Arn
                    # PROXY_BUCKET is available to the dispatcher but not needed today;
                    # kept here so output_s3_prefix validation can check bucket ownership
                    # in a future revision without a CFN update.
                    PROXY_BUCKET: !Ref ProxyBucket
                    TOOL_VERSION: "%%VERSION%%"
                    # Must equal the GatewayTarget Name in media-toolkit-gateway/cfnstack.yaml
                    TARGET_NAME: "speech-diarization"
            Code:
                S3Bucket: !FindInMap [CodeBuild, Source, Bucket]
                S3Key: !Sub
                    - ${keyPrefix}/${pkg}
                    - keyPrefix: !FindInMap [CodeBuild, Source, KeyPrefix]
                      pkg: !FindInMap [CodeBuild, Source, GatewayToolPackage]
            TracingConfig:
                Mode: Active

    ################################################################################
    # Lambda Resource-Based Policy
    # Allows the AgentCore service principal to invoke the gateway tool Lambda.
    # bedrock-agentcore.amazonaws.com is the service principal for AgentCore Gateway.
    ################################################################################
    SpeechDiarizationGatewayToolPermission:
        Type: AWS::Lambda::Permission
        Properties:
            FunctionName: !GetAtt SpeechDiarizationGatewayToolLambda.Arn
            Action: lambda:InvokeFunction
            Principal: bedrock-agentcore.amazonaws.com
            SourceAccount: !Ref AWS::AccountId

    ################################################################################
    # Lambda Execution Role (shared across all 7 workflow functions)
    ################################################################################
    SpeechDiarizationRole:
        Type: AWS::IAM::Role
        Metadata:
            cfn_nag:
                rules_to_suppress:
                    -
                        id: W76
                        reason: Fine-grained permissions for speech diarization workflow
        Properties:
            Path: !Sub /${ResourcePrefix}/
            AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                    -
                        Effect: Allow
                        Principal:
                            Service: lambda.amazonaws.com
                        Action: sts:AssumeRole
            ManagedPolicyArns:
                - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
            Policies:
                -
                    PolicyName: SpeechDiarizationPolicy
                    PolicyDocument:
                        Version: "2012-10-17"
                        Statement:
                            # CloudWatch Logs
                            -
                                Effect: Allow
                                Action:
                                    - logs:CreateLogGroup
                                    - logs:CreateLogStream
                                    - logs:PutLogEvents
                                Resource:
                                    - !GetAtt SpeechDiarizationHalfCoreLogGroup.Arn
                                    - !GetAtt SpeechDiarization1CoreLogGroup.Arn
                                    - !GetAtt SpeechDiarization2CoresLogGroup.Arn
                                    - !GetAtt SpeechDiarization3CoresLogGroup.Arn
                                    - !GetAtt SpeechDiarization4CoresLogGroup.Arn
                                    - !GetAtt SpeechDiarization5CoresLogGroup.Arn
                                    - !GetAtt SpeechDiarization6CoresLogGroup.Arn
                            # S3 — read source audio from ingest bucket (fast-path WAV)
                            -
                                Effect: Allow
                                Action: s3:ListBucket
                                Resource: !Sub arn:aws:s3:::${IngestBucket}
                            -
                                Effect: Allow
                                Action: s3:GetObject
                                Resource: !Sub arn:aws:s3:::${IngestBucket}/*
                            # S3 — read audio files and model artefacts; write results on the proxy bucket
                            -
                                Effect: Allow
                                Action:
                                    - s3:ListBucket
                                    - s3:ListBucketMultipartUploads
                                Resource: !Sub arn:aws:s3:::${ProxyBucket}
                            -
                                Effect: Allow
                                Action:
                                    - s3:GetObject
                                    - s3:PutObject
                                    - s3:ListMultipartUploadParts
                                    - s3:AbortMultipartUpload
                                Resource: !Sub arn:aws:s3:::${ProxyBucket}/*
                            # Step Functions — usage tracking reads execution history
                            -
                                Effect: Allow
                                Action: states:GetExecutionHistory
                                # own executions only — MP's cost is read from
                                # its published usage_tracking.json, not its history
                                Resource:
                                    - !Sub
                                        - arn:aws:states:${AWS::Region}:${AWS::AccountId}:execution:${ResourcePrefix}-${name}:*
                                        - name: !FindInMap [Lambda, Function, Name]
                            # Lambda — usage tracking reads function configuration for memory/timeout
                            -
                                Effect: Allow
                                Action: lambda:GetFunctionConfiguration
                                Resource:
                                    - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${ResourcePrefix}-*
                            # StateSubmitMediaProcessing invokes the
                            # media-processing GATEWAY (the family
                            # sibling-invoke pattern, never its machine)
                            -
                                Effect: Allow
                                Action: lambda:InvokeFunction
                                Resource: !Ref MediaProcessingGatewayLambdaArn

